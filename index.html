    body:"薩摩藩の下級武士の家に生まれた西郷隆盛は、体格に恵まれた大柄な人物で、二度にわたり奄美大島や沖永良部島への流罪も経験しながら、藩主・島津斉彬に見出されて頭角を現し、幕末の動乱の中で倒幕運動の中心的存在となった。勝海舟との会談によって江戸城の無血開城を実現させ、江戸の町を戦火から救った功績は特に大きい。明治維新後は新政府の要職に就いたが、征韓論をめぐる対立から政府を去り、故郷の鹿児島に戻った。その後、士族たちに担がれる形で1877年の西南戦争を起こすが、政府軍に敗れ、城山にて49歳で自害してその生涯を閉じた。「敬天愛人」の言葉を残し、東京・上野公園の犬を連れた銅像でも親しまれる、今も多くの人に愛される幕末最大の英雄の一人である。西南戦争の終結をもって、武力による士族の反乱は事実上終わりを迎え、明治政府の中央集権体制が確立したとされる。",
    bodyHtml:"薩摩藩の下級武士の家に生まれた西郷隆盛は、体格に恵まれた大柄な人物で、二度にわたり奄美大島や沖永良部島への流罪も経験しながら、藩主・島津斉彬に見出されて頭角を現し、幕末の動乱の中で倒幕運動の中心的存在となった。勝海舟との会談によって江戸城の無血開城を実現させ、江戸の町を戦火から救った功績は特に大きい。明治維新後は新政府の要職に就いたが、征韓論をめぐる対立から政府を去り、故郷の鹿児島に戻った。その後、士族たちに担がれる形で1877年の西南戦争を起こすが、政府軍に敗れ、城山にて49歳で自害してその生涯を閉じた。「敬天愛人」の言葉を残し、東京・上野公園の犬を連れた銅像でも親しまれる、今も多くの人に愛される幕末最大の英雄の一人である。西南戦争の終結をもって、武力による士族の反乱は事実上終わりを迎え、明治政府の中央集権体制が確立したとされる。", source:"legacy", sourceId:"027" },
  { id:"028-02", personId:"028", title:"もうひとつのエピソード", tags:["政治"],
    body:"幕臣であった勝海舟は、若い頃から蘭学を学び、長崎海軍伝習所でオランダ人教官のもとに航海術を修め、日本人として初めて太平洋を横断する軍艦・咸臨丸の艦長を務めるなど、早くから世界に目を向けていた人物である。幕末の動乱の中、江戸を戦火から守るため、新政府軍を率いる西郷隆盛と直接会談し、江戸城を戦わずして明け渡す「無血開城」を実現させた。この決断により、数多くの命と江戸の町並みが救われたとされ、後世高く評価されている。維新後も新政府に仕え、旧幕臣たちの生活再建にも尽力し続け、晩年には自らの体験を語った回顧録「氷川清話」を残している。剣術に優れながらも「行いは己のもの、批判は他人のもの」と語り、周囲の評価に動じない胆力を持った人物として知られている。咸臨丸での渡米には、後に慶應義塾を創設する福澤諭吉も同行しており、二人はともに幕末から明治の激動を生きた。",
    bodyHtml:"幕臣であった勝海舟は、若い頃から蘭学を学び、長崎海軍伝習所でオランダ人教官のもとに航海術を修め、日本人として初めて太平洋を横断する軍艦・咸臨丸の艦長を務めるなど、早くから世界に目を向けていた人物である。幕末の動乱の中、江戸を戦火から守るため、新政府軍を率いる西郷隆盛と直接会談し、江戸城を戦わずして明け渡す「無血開城」を実現させた。この決断により、数多くの命と江戸の町並みが救われたとされ、後世高く評価されている。維新後も新政府に仕え、旧幕臣たちの生活再建にも尽力し続け、晩年には自らの体験を語った回顧録「氷川清話」を残している。剣術に優れながらも「行いは己のもの、批判は他人のもの」と語り、周囲の評価に動じない胆力を持った人物として知られている。咸臨丸での渡米には、後に慶應義塾を創設する福澤諭吉も同行しており、二人はともに幕末から明治の激動を生きた。", source:"legacy", sourceId:"028" },
  { id:"032-02", personId:"032", title:"もうひとつのエピソード", tags:["冒険"],
    body:"商人として財を成した伊能忠敬は、49歳で家業を退いた後、江戸に出て、自分よりも19歳も年下の天文学者・高橋至時に弟子入りし、熱心に天文学と測量術を学び始めた。「死ぬ日まで、あと少しでも遠くを測りたい」という思いのもと、71歳で亡くなるまでの17年間、自らの足で日本全国を歩き続けて測量を行い、その総距離は4万キロメートル、地球一周に相当するともいわれる。彼の死の3年後、弟子たちの手によって、当時としては驚くほど正確な日本地図「大日本沿海輿地全図」が完成した。この地図はのちにシーボルトが国外へ持ち出そうとして発覚し、大きな事件にもなっている。晩年から始めた学びが、日本の地理学の歴史を大きく塗り替える偉業につながったという生き方は、多くの人に勇気を与えている。測量の際には歩幅を一定に保つ訓練を重ね、驚くほど正確な距離を歩測だけで割り出したという逸話も残る。",
    bodyHtml:"商人として財を成した伊能忠敬は、49歳で家業を退いた後、江戸に出て、自分よりも19歳も年下の天文学者・高橋至時に弟子入りし、熱心に天文学と測量術を学び始めた。「死ぬ日まで、あと少しでも遠くを測りたい」という思いのもと、71歳で亡くなるまでの17年間、自らの足で日本全国を歩き続けて測量を行い、その総距離は4万キロメートル、地球一周に相当するともいわれる。彼の死の3年後、弟子たちの手によって、当時としては驚くほど正確な日本地図「大日本沿海輿地全図」が完成した。この地図はのちにシーボルトが国外へ持ち出そうとして発覚し、大きな事件にもなっている。晩年から始めた学びが、日本の地理学の歴史を大きく塗り替える偉業につながったという生き方は、多くの人に勇気を与えている。測量の際には歩幅を一定に保つ訓練を重ね、驚くほど正確な距離を歩測だけで割り出したという逸話も残る。", source:"legacy", sourceId:"032" },
  { id:"033-02", personId:"033", title:"もうひとつのエピソード", tags:["教育"],
    body:"長州藩の吉田松陰は、幼い頃から兵学の才を発揮し、日本の将来を憂えるあまり、1854年、下田に停泊していた黒船に乗り込んでアメリカへ密航しようとするなど、命を顧みない行動力で知られていた。この密航は失敗に終わり投獄されるが、そこでも学びをやめず、萩に開いた私塾「松下村塾」では、わずか2年余りの間、身分の上下に関係なく若者たちを熱心に指導した。高杉晋作、伊藤博文、山県有朋など、後に明治維新を成し遂げる多くの人材がこの短い期間にこの塾から巣立っている。しかし幕府の政策を批判したことが原因で、大老井伊直弼による安政の大獄によって捕らえられ、1859年、29歳という若さで処刑された。その志は弟子たちに受け継がれ、時代を動かす原動力となった。「至誠にして動かざる者は未だこれ有らざるなり」という言葉を残し、誠実さこそが人を動かす力になると説き続けた。",
    bodyHtml:"長州藩の吉田松陰は、幼い頃から兵学の才を発揮し、日本の将来を憂えるあまり、1854年、下田に停泊していた黒船に乗り込んでアメリカへ密航しようとするなど、命を顧みない行動力で知られていた。この密航は失敗に終わり投獄されるが、そこでも学びをやめず、萩に開いた私塾「松下村塾」では、わずか2年余りの間、身分の上下に関係なく若者たちを熱心に指導した。高杉晋作、伊藤博文、山県有朋など、後に明治維新を成し遂げる多くの人材がこの短い期間にこの塾から巣立っている。しかし幕府の政策を批判したことが原因で、大老井伊直弼による安政の大獄によって捕らえられ、1859年、29歳という若さで処刑された。その志は弟子たちに受け継がれ、時代を動かす原動力となった。「至誠にして動かざる者は未だこれ有らざるなり」という言葉を残し、誠実さこそが人を動かす力になると説き続けた。", source:"legacy", sourceId:"033" },
  { id:"034-02", personId:"034", title:"もうひとつのエピソード", tags:["教育"],
    body:"盛岡藩の武士の家に生まれた新渡戸稲造は、若くしてアメリカやドイツに留学し、農学や経済学を学んだ国際的な知識人である。留学中、ある学者から「日本には宗教教育がないというが、それでどうやって道徳を教えるのか」と問われ、答えに窮した経験から、日本人の精神性の核にある「武士道」を英語でまとめ、世界に向けて発表した。この著書は各国で翻訳されて広く読まれ、日本文化を海外に紹介する重要な役割を果たした。「太平洋の架け橋になりたい」という言葉のとおり、1920年から国際連盟の事務次長を約6年間務めて国際協調の推進に尽力し、帰国後は東京女子大学の初代学長も務めるなど、教育者・思想家として世界的に活躍した人物であり、旧五千円札の肖像としても親しまれた。農学者としては札幌農学校で学び、台湾総督府の技師として製糖業の発展にも関わるなど、実務家としての顔も持っていた。",
    bodyHtml:"盛岡藩の武士の家に生まれた新渡戸稲造は、若くしてアメリカやドイツに留学し、農学や経済学を学んだ国際的な知識人である。留学中、ある学者から「日本には宗教教育がないというが、それでどうやって道徳を教えるのか」と問われ、答えに窮した経験から、日本人の精神性の核にある「武士道」を英語でまとめ、世界に向けて発表した。この著書は各国で翻訳されて広く読まれ、日本文化を海外に紹介する重要な役割を果たした。「太平洋の架け橋になりたい」という言葉のとおり、1920年から国際連盟の事務次長を約6年間務めて国際協調の推進に尽力し、帰国後は東京女子大学の初代学長も務めるなど、教育者・思想家として世界的に活躍した人物であり、旧五千円札の肖像としても親しまれた。農学者としては札幌農学校で学び、台湾総督府の技師として製糖業の発展にも関わるなど、実務家としての顔も持っていた。", source:"legacy", sourceId:"034" },
  { id:"035-02", personId:"035", title:"もうひとつのエピソード", tags:["政治"],
    body:"アメリカ・ケンタッキー州の丸太小屋に生まれたリンカーンは、正規の教育をほとんど受けられず、若い頃は店員や薪割りなど様々な仕事を経験しながら独学で法律を学んで弁護士となり、「正直者エイブ」と呼ばれる誠実な人柄で信頼を集め、後に第16代大統領に選ばれた。南北戦争の最中、奴隷制度に反対する立場から「奴隷解放宣言」を発表し、南部で奴隷とされていた多くの人々に自由をもたらした。激戦地ゲティスバーグでの演説では「人民の、人民による、人民のための政治」という言葉を残し、民主主義の理念を世界に示した。しかし南北戦争終結からわずか数日後の1865年4月、フォード劇場で観劇中にジョン・ウィルクス・ブースに暗殺され、その生涯を終えた。分断された国を一つにまとめようとした指導者として、今も高く評価されている。南北戦争中はゲティスバーグの戦いなど激戦が続き、双方合わせて60万人以上ともいわれる犠牲者を出した。",
    bodyHtml:"アメリカ・ケンタッキー州の丸太小屋に生まれたリンカーンは、正規の教育をほとんど受けられず、若い頃は店員や薪割りなど様々な仕事を経験しながら独学で法律を学んで弁護士となり、「正直者エイブ」と呼ばれる誠実な人柄で信頼を集め、後に第16代大統領に選ばれた。南北戦争の最中、奴隷制度に反対する立場から「奴隷解放宣言」を発表し、南部で奴隷とされていた多くの人々に自由をもたらした。激戦地ゲティスバーグでの演説では「人民の、人民による、人民のための政治」という言葉を残し、民主主義の理念を世界に示した。しかし南北戦争終結からわずか数日後の1865年4月、フォード劇場で観劇中にジョン・ウィルクス・ブースに暗殺され、その生涯を終えた。分断された国を一つにまとめようとした指導者として、今も高く評価されている。南北戦争中はゲティスバーグの戦いなど激戦が続き、双方合わせて60万人以上ともいわれる犠牲者を出した。", source:"legacy", sourceId:"035" },
  { id:"036-02", personId:"036", title:"もうひとつのエピソード", tags:["政治"],
    body:"アメリカ独立戦争において総司令官を務めたワシントンは、資金も物資も乏しい植民地軍を率い、厳しい冬を耐え抜きながらイギリス軍と戦い続けた。戦後、給与の遅れに不満を募らせた将校たちの反乱の動きに対し、老眼鏡をかけながら「諸君のために髪も白くなり、目もほとんど見えなくなった」と静かに語りかけて反乱を鎮めた逸話も伝わっている。独立を勝ち取った後、初代大統領に選ばれ2期8年を務めたが、「終身大統領になってほしい」という周囲の声を退け、自ら大統領の座を退いて後進に道を譲った。この行動は、権力に固執しないリーダーの模範として高く評価され、後のアメリカ大統領の任期のあり方にも大きな影響を与えている。「建国の父」として讃えられ、首都ワシントンD.C.や1ドル紙幣の肖像として、今もその功績が語り継がれている。軍を離れる際にも自ら身を引き、後任に道を譲る姿勢を貫いた、生涯にわたって謙虚な指導者であった。",
    bodyHtml:"アメリカ独立戦争において総司令官を務めたワシントンは、資金も物資も乏しい植民地軍を率い、厳しい冬を耐え抜きながらイギリス軍と戦い続けた。戦後、給与の遅れに不満を募らせた将校たちの反乱の動きに対し、老眼鏡をかけながら「諸君のために髪も白くなり、目もほとんど見えなくなった」と静かに語りかけて反乱を鎮めた逸話も伝わっている。独立を勝ち取った後、初代大統領に選ばれ2期8年を務めたが、「終身大統領になってほしい」という周囲の声を退け、自ら大統領の座を退いて後進に道を譲った。この行動は、権力に固執しないリーダーの模範として高く評価され、後のアメリカ大統領の任期のあり方にも大きな影響を与えている。「建国の父」として讃えられ、首都ワシントンD.C.や1ドル紙幣の肖像として、今もその功績が語り継がれている。軍を離れる際にも自ら身を引き、後任に道を譲る姿勢を貫いた、生涯にわたって謙虚な指導者であった。", source:"legacy", sourceId:"036" },
  { id:"037-02", personId:"037", title:"もうひとつのエピソード", tags:["政治"],
    body:"インドに生まれたガンディーは、イギリスで法律を学んだ後、南アフリカで人種差別を体験したことをきっかけに、社会運動に身を投じるようになった。インドに戻ってからは、暴力に頼らず不服従を貫く「非暴力・不服従（サティヤーグラハ）」という独自の方法で、イギリスからの独立運動を導いていく。糸車で綿を紡いで自ら布を織る「カディ」を提唱し、イギリス製品への依存を断とうと自給自足の精神を説いた。イギリスが専売していた塩を、自ら海まで歩いて作り出す「塩の行進」には数万人が参加し、世界中の注目を集めた。1947年、ついにインドはイギリスから独立を果たすが、その翌年1948年1月、宗教対立の中で凶弾に倒れた。非暴力による社会変革という彼の思想は、後の公民権運動など、世界中の平和運動に大きな影響を与えている。非暴力の思想は「マハトマ（偉大な魂）」という尊称でも呼ばれ、多くの人々から敬愛された。",
    bodyHtml:"インドに生まれたガンディーは、イギリスで法律を学んだ後、南アフリカで人種差別を体験したことをきっかけに、社会運動に身を投じるようになった。インドに戻ってからは、暴力に頼らず不服従を貫く「非暴力・不服従（サティヤーグラハ）」という独自の方法で、イギリスからの独立運動を導いていく。糸車で綿を紡いで自ら布を織る「カディ」を提唱し、イギリス製品への依存を断とうと自給自足の精神を説いた。イギリスが専売していた塩を、自ら海まで歩いて作り出す「塩の行進」には数万人が参加し、世界中の注目を集めた。1947年、ついにインドはイギリスから独立を果たすが、その翌年1948年1月、宗教対立の中で凶弾に倒れた。非暴力による社会変革という彼の思想は、後の公民権運動など、世界中の平和運動に大きな影響を与えている。非暴力の思想は「マハトマ（偉大な魂）」という尊称でも呼ばれ、多くの人々から敬愛された。", source:"legacy", sourceId:"037" },
  { id:"038-02", personId:"038", title:"もうひとつのエピソード", tags:["平等"],
    body:"アメリカの牧師キング牧師は、当時のアメリカ社会に根強く残っていた人種差別に対し、非暴力の手段で立ち向かうことを訴え続けた公民権運動の指導者である。1955年、ローザ・パークスの逮捕をきっかけに始まったバスの座席をめぐる黒人差別への抗議運動を率いたことで、全米で公民権運動の中心人物となる。1963年、ワシントン大行進において「I Have a Dream（私には夢がある）」から始まる演説を行い、肌の色に関係なくすべての人が平等に扱われる社会を訴えた。1964年には史上最年少の35歳でノーベル平和賞を受賞し、同年公民権法も成立するが、1968年、演説の場で凶弾に倒れ、39歳の若さでその生涯を終えた。非暴力の精神は、今も世界中の人権運動に受け継がれている。牧師としての活動の傍ら、各地で逮捕・投獄されること29回にも及んだが、暴力に訴えることは決してなかった。",
    bodyHtml:"アメリカの牧師キング牧師は、当時のアメリカ社会に根強く残っていた人種差別に対し、非暴力の手段で立ち向かうことを訴え続けた公民権運動の指導者である。1955年、ローザ・パークスの逮捕をきっかけに始まったバスの座席をめぐる黒人差別への抗議運動を率いたことで、全米で公民権運動の中心人物となる。1963年、ワシントン大行進において「I Have a Dream（私には夢がある）」から始まる演説を行い、肌の色に関係なくすべての人が平等に扱われる社会を訴えた。1964年には史上最年少の35歳でノーベル平和賞を受賞し、同年公民権法も成立するが、1968年、演説の場で凶弾に倒れ、39歳の若さでその生涯を終えた。非暴力の精神は、今も世界中の人権運動に受け継がれている。牧師としての活動の傍ら、各地で逮捕・投獄されること29回にも及んだが、暴力に訴えることは決してなかった。", source:"legacy", sourceId:"038" },
  { id:"039-02", personId:"039", title:"もうひとつのエピソード", tags:["政治"],
    body:"南アフリカで弁護士として活動していたマンデラは、白人による人種隔離政策「アパルトヘイト」に反対する運動に加わり、国家反逆罪に問われて27年間もの長い獄中生活を強いられ、その多くをロベン島の刑務所で過ごした。厳しい獄中生活の中でも信念を曲げることなく過ごし、1990年に釈放されると、当時の大統領デクラークとの交渉によりアパルトヘイト撤廃を進め、1993年には共にノーベル平和賞を受賞した。1994年には南アフリカ初の全人種参加による選挙で大統領に選ばれ、かつて自分を苦しめた人々を憎むのではなく、「真実和解委員会」を設けて国民全体の融和を訴えて新しい国づくりを進めた。「どんなことも、やってしまうまでは不可能に思えるものだ」という言葉のとおり、その生き方は世界中の人々に希望を与え続けている。獄中では石切り場での重労働も課されたが、規律正しい生活と読書を続け、精神の強さを保ち続けた。",
    bodyHtml:"南アフリカで弁護士として活動していたマンデラは、白人による人種隔離政策「アパルトヘイト」に反対する運動に加わり、国家反逆罪に問われて27年間もの長い獄中生活を強いられ、その多くをロベン島の刑務所で過ごした。厳しい獄中生活の中でも信念を曲げることなく過ごし、1990年に釈放されると、当時の大統領デクラークとの交渉によりアパルトヘイト撤廃を進め、1993年には共にノーベル平和賞を受賞した。1994年には南アフリカ初の全人種参加による選挙で大統領に選ばれ、かつて自分を苦しめた人々を憎むのではなく、「真実和解委員会」を設けて国民全体の融和を訴えて新しい国づくりを進めた。「どんなことも、やってしまうまでは不可能に思えるものだ」という言葉のとおり、その生き方は世界中の人々に希望を与え続けている。獄中では石切り場での重労働も課されたが、規律正しい生活と読書を続け、精神の強さを保ち続けた。", source:"legacy", sourceId:"039" },
  { id:"040-02", personId:"040", title:"もうひとつのエピソード", tags:["政治"],
    body:"古代エジプト最後の女王クレオパトラは、ギリシャ系のプトレマイオス朝の血を引きながら、9つの言語を操ったとも伝えられる優れた語学力と知性、そして政治的な駆け引きの巧みさで知られる人物である。エジプトの独立を守るため、当時のローマの権力者カエサルやアントニウスと結びつき、巧みな外交でエジプトの立場を保とうとした。しかしローマの後継者争いに巻き込まれ、紀元前31年のアクティウムの海戦を経て、最終的にオクタウィアヌス（後の初代皇帝アウグストゥス）との戦いに敗れる。伝説では毒蛇に自らを噛ませて命を絶ったとも伝えられ、悲劇的な最期を迎えた。その生涯は多くの戯曲や映画の題材となり、古代世界を代表する女性の指導者として、今も人々の関心を集め続けている。アレクサンドリア図書館があった知の都で育った彼女は、幾何学や哲学にも通じた教養人でもあったと伝えられている。",
    bodyHtml:"古代エジプト最後の女王クレオパトラは、ギリシャ系のプトレマイオス朝の血を引きながら、9つの言語を操ったとも伝えられる優れた語学力と知性、そして政治的な駆け引きの巧みさで知られる人物である。エジプトの独立を守るため、当時のローマの権力者カエサルやアントニウスと結びつき、巧みな外交でエジプトの立場を保とうとした。しかしローマの後継者争いに巻き込まれ、紀元前31年のアクティウムの海戦を経て、最終的にオクタウィアヌス（後の初代皇帝アウグストゥス）との戦いに敗れる。伝説では毒蛇に自らを噛ませて命を絶ったとも伝えられ、悲劇的な最期を迎えた。その生涯は多くの戯曲や映画の題材となり、古代世界を代表する女性の指導者として、今も人々の関心を集め続けている。アレクサンドリア図書館があった知の都で育った彼女は、幾何学や哲学にも通じた教養人でもあったと伝えられている。", source:"legacy", sourceId:"040" },
  { id:"041-02", personId:"041", title:"もうひとつのエピソード", tags:["政治"],
    body:"フランスの農村に生まれたジャンヌ・ダルクは、13歳の頃から「フランスを救え」という神の声を聞いたと信じるようになった。当時、フランスはイギリスとの百年戦争で苦しい状況にあったが、彼女はわずか17歳で王太子シャルルに謁見し、その熱意を認められて白い甲冑をまとい軍を率いる立場に就く。オルレアンの包囲戦では自らも負傷しながら勝利を収めるなど、士気の下がっていたフランス軍を奮い立たせ、戦況を大きく好転させた。しかし後にイギリス側に捕らえられ、1431年、ルーアンで異端者として裁判にかけられて、わずか19歳で火あぶりの刑に処せられた。1456年になって無実であったことが認められ、1920年には正式に列聖され、現在はフランスの守護聖人としても敬われている。彼女が身にまとった軍旗には「イエスとマリア」の文字が記されており、深い信仰心のあらわれとして伝えられている。",
    bodyHtml:"フランスの農村に生まれたジャンヌ・ダルクは、13歳の頃から「フランスを救え」という神の声を聞いたと信じるようになった。当時、フランスはイギリスとの百年戦争で苦しい状況にあったが、彼女はわずか17歳で王太子シャルルに謁見し、その熱意を認められて白い甲冑をまとい軍を率いる立場に就く。オルレアンの包囲戦では自らも負傷しながら勝利を収めるなど、士気の下がっていたフランス軍を奮い立たせ、戦況を大きく好転させた。しかし後にイギリス側に捕らえられ、1431年、ルーアンで異端者として裁判にかけられて、わずか19歳で火あぶりの刑に処せられた。1456年になって無実であったことが認められ、1920年には正式に列聖され、現在はフランスの守護聖人としても敬われている。彼女が身にまとった軍旗には「イエスとマリア」の文字が記されており、深い信仰心のあらわれとして伝えられている。", source:"legacy", sourceId:"041" },
  { id:"042-02", personId:"042", title:"もうひとつのエピソード", tags:["政治"],
    body:"春秋戦国時代の混乱を経て、秦の王・政（後の始皇帝）は、争いを繰り返していた中国の国々を初めて統一し、「皇帝」という新しい称号を自ら名乗った。文字・貨幣・度量衡・車の幅までも統一する大改革を断行し、北方の異民族の侵入を防ぐため、万里の長城の建設にも着手した。不老不死を求めて各地に使者を送る一方、自らの死後を守るための巨大な陵墓と、その周りを守る等身大の兵士の像「兵馬俑」を作らせたことでも知られ、この兵馬俑は1974年に農民によって偶然発見され世界を驚かせた。厳しい法律による統治は民衆に大きな負担を強いており、始皇帝の死後まもなく秦は急速に滅んでしまうが、統一された制度や文字は、その後2000年以上にわたる中国の歴史の基礎となった。彼が築いた咸陽の宮殿や度量衡の統一基準は、後の漢王朝の統治制度にも受け継がれ、中国という国の原型を形づくったとされている。",
    bodyHtml:"春秋戦国時代の混乱を経て、秦の王・政（後の始皇帝）は、争いを繰り返していた中国の国々を初めて統一し、「皇帝」という新しい称号を自ら名乗った。文字・貨幣・度量衡・車の幅までも統一する大改革を断行し、北方の異民族の侵入を防ぐため、万里の長城の建設にも着手した。不老不死を求めて各地に使者を送る一方、自らの死後を守るための巨大な陵墓と、その周りを守る等身大の兵士の像「兵馬俑」を作らせたことでも知られ、この兵馬俑は1974年に農民によって偶然発見され世界を驚かせた。厳しい法律による統治は民衆に大きな負担を強いており、始皇帝の死後まもなく秦は急速に滅んでしまうが、統一された制度や文字は、その後2000年以上にわたる中国の歴史の基礎となった。彼が築いた咸陽の宮殿や度量衡の統一基準は、後の漢王朝の統治制度にも受け継がれ、中国という国の原型を形づくったとされている。", source:"legacy", sourceId:"042" },
  { id:"043-02", personId:"043", title:"もうひとつのエピソード", tags:["芸術"],
    body:"「モナ・リザ」や「最後の晩餐」を描いたレオナルド・ダ・ヴィンチは、絵画だけにとどまらず、解剖学・機械工学・天文学・建築など、あらゆる分野に強い探究心を抱いた「万能の天才」だった。教会の許可を得て人体を実際に解剖し、筋肉や骨格、内臓のしくみを詳細に記録したノートは、当時の医学水準をはるかに超えていたとされる。空を飛ぶ機械や、戦車、潜水艦のスケッチなど、時代をはるかに先取りしたアイデアも数多く残しており、左右反転の鏡文字で書かれた約7000ページにも及ぶ膨大な手稿として今に伝えられている。晩年はフランス王フランソワ1世に招かれ、その庇護のもとで生涯を終えた。「絵画をやめてしまった日、その日から絵は死んでしまう」という言葉のとおり、生涯にわたって探求と創造を続けた人物である。軍事技術者としても各地の君主に仕え、橋や運河、要塞の設計にも携わった多才な人物であった。",
    bodyHtml:"「モナ・リザ」や「最後の晩餐」を描いたレオナルド・ダ・ヴィンチは、絵画だけにとどまらず、解剖学・機械工学・天文学・建築など、あらゆる分野に強い探究心を抱いた「万能の天才」だった。教会の許可を得て人体を実際に解剖し、筋肉や骨格、内臓のしくみを詳細に記録したノートは、当時の医学水準をはるかに超えていたとされる。空を飛ぶ機械や、戦車、潜水艦のスケッチなど、時代をはるかに先取りしたアイデアも数多く残しており、左右反転の鏡文字で書かれた約7000ページにも及ぶ膨大な手稿として今に伝えられている。晩年はフランス王フランソワ1世に招かれ、その庇護のもとで生涯を終えた。「絵画をやめてしまった日、その日から絵は死んでしまう」という言葉のとおり、生涯にわたって探求と創造を続けた人物である。軍事技術者としても各地の君主に仕え、橋や運河、要塞の設計にも携わった多才な人物であった。", source:"legacy", sourceId:"043" },
  { id:"044-02", personId:"044", title:"もうひとつのエピソード", tags:["芸術"],
    body:"イタリアの彫刻家・画家ミケランジェロは、他の彫刻家が欠陥ありとして見放した一つの大理石の塊から、4年近くをかけて彫り上げた「ダビデ像」で知られる。「わたしは大理石の中に天使を見た。そして、その天使が自由になるまで彫り続けた」という言葉のとおり、石の中に眠る姿を掘り出すように制作したと伝えられている。ローマ教皇の依頼を受け、1508年から4年もの歳月をかけて、システィーナ礼拝堂の天井に、たった一人で仰向けになりながら旧約聖書の場面を描いた壮大な壁画を完成させた。狭い足場の上で首を痛めながらも作業を続けたという逸話も残っている。晩年にはサン・ピエトロ大聖堂のドーム設計にも携わるなど建築家としても活躍し、88歳まで生きたその執念と芸術性は、今もルネサンス美術の最高峰として世界中の人々を魅了し続けている。彫刻・絵画・建築のすべてで頂点を極めた芸術家として、後世「三大巨匠」の一人に数えられている。",
    bodyHtml:"イタリアの彫刻家・画家ミケランジェロは、他の彫刻家が欠陥ありとして見放した一つの大理石の塊から、4年近くをかけて彫り上げた「ダビデ像」で知られる。「わたしは大理石の中に天使を見た。そして、その天使が自由になるまで彫り続けた」という言葉のとおり、石の中に眠る姿を掘り出すように制作したと伝えられている。ローマ教皇の依頼を受け、1508年から4年もの歳月をかけて、システィーナ礼拝堂の天井に、たった一人で仰向けになりながら旧約聖書の場面を描いた壮大な壁画を完成させた。狭い足場の上で首を痛めながらも作業を続けたという逸話も残っている。晩年にはサン・ピエトロ大聖堂のドーム設計にも携わるなど建築家としても活躍し、88歳まで生きたその執念と芸術性は、今もルネサンス美術の最高峰として世界中の人々を魅了し続けている。彫刻・絵画・建築のすべてで頂点を極めた芸術家として、後世「三大巨匠」の一人に数えられている。", source:"legacy", sourceId:"044" },
  { id:"045-02", personId:"045", title:"もうひとつのエピソード", tags:["芸術"],
    body:"オランダの画家ゴッホは、牧師を目指して挫折した後、27歳という遅い年齢から本格的に絵を描き始めた。独学で絵の技術を磨き、燃えるような色使いと力強い筆致で、「ひまわり」や「星月夜」など、今では世界中で愛される数々の名画を、わずか10年ほどの画家人生の中で2000点以上も生み出した。しかし生前に売れた絵は「赤い葡萄畑」ただ一枚のみとされるほど、経済的にも精神的にも苦しい生活を送っており、精神的な不調から自らの耳を切り落とすという事件も起こしている。それでも絵を描くことをやめず、弟テオへ宛てた手紙には、絵画への情熱と苦悩がつづられている。1890年、37歳という若さで銃による傷がもとでこの世を去ったが、死後になってその芸術的価値が世界的に認められるようになった。生前唯一評価されていた絵画の才能を、弟テオは経済的にも精神的にも支え続けたことで知られる。",
    bodyHtml:"オランダの画家ゴッホは、牧師を目指して挫折した後、27歳という遅い年齢から本格的に絵を描き始めた。独学で絵の技術を磨き、燃えるような色使いと力強い筆致で、「ひまわり」や「星月夜」など、今では世界中で愛される数々の名画を、わずか10年ほどの画家人生の中で2000点以上も生み出した。しかし生前に売れた絵は「赤い葡萄畑」ただ一枚のみとされるほど、経済的にも精神的にも苦しい生活を送っており、精神的な不調から自らの耳を切り落とすという事件も起こしている。それでも絵を描くことをやめず、弟テオへ宛てた手紙には、絵画への情熱と苦悩がつづられている。1890年、37歳という若さで銃による傷がもとでこの世を去ったが、死後になってその芸術的価値が世界的に認められるようになった。生前唯一評価されていた絵画の才能を、弟テオは経済的にも精神的にも支え続けたことで知られる。", source:"legacy", sourceId:"045" },
  { id:"046-02", personId:"046", title:"もうひとつのエピソード", tags:["芸術"],
    body:"スペインのマラガに生まれたピカソは、幼い頃から絵の才能を発揮し、父親も驚くほどの画力を持っていたと伝えられる。しかし大人になってからは、写実的な絵にとどまらず、あえて子どものような自由な視点を追い求め、対象を様々な角度から同時に描く「キュビスム」という革新的な表現を生み出した。親友の死をきっかけとする「青の時代」に続き「バラ色の時代」を迎えるなど、生涯を通じて画風を大きく変え続け、絵画だけでなく彫刻や陶芸など幅広い分野で創作を続けた。スペイン内戦の悲劇を描いた「ゲルニカ」は、戦争の残酷さを訴える作品として世界的に知られている。生涯の大半をフランスで過ごし、91歳で世を去るまでに残した作品数は15万点にも及ぶといわれる、20世紀最大の芸術家の一人である。アフリカの仮面や彫刻からも強い影響を受け、西洋美術の枠組みを大きく揺るがした革新者でもあった。",
    bodyHtml:"スペインのマラガに生まれたピカソは、幼い頃から絵の才能を発揮し、父親も驚くほどの画力を持っていたと伝えられる。しかし大人になってからは、写実的な絵にとどまらず、あえて子どものような自由な視点を追い求め、対象を様々な角度から同時に描く「キュビスム」という革新的な表現を生み出した。親友の死をきっかけとする「青の時代」に続き「バラ色の時代」を迎えるなど、生涯を通じて画風を大きく変え続け、絵画だけでなく彫刻や陶芸など幅広い分野で創作を続けた。スペイン内戦の悲劇を描いた「ゲルニカ」は、戦争の残酷さを訴える作品として世界的に知られている。生涯の大半をフランスで過ごし、91歳で世を去るまでに残した作品数は15万点にも及ぶといわれる、20世紀最大の芸術家の一人である。アフリカの仮面や彫刻からも強い影響を受け、西洋美術の枠組みを大きく揺るがした革新者でもあった。", source:"legacy", sourceId:"046" },
  { id:"047-02", personId:"047", title:"もうひとつのエピソード", tags:["芸術"],
    body:"ドイツの作曲家ベートーヴェンは、酒におぼれる父親から厳しい英才教育を受けて育ったが、20代後半から次第に耳が聞こえにくくなるという、音楽家にとって最も過酷な運命に見舞われた。一時は絶望のあまり遺書を書いたとも伝えられるが、それでも「運命の喉笛をつかんでやる」という強い意志で作曲を続けた。生涯に交響曲を9曲残し、耳がほとんど聞こえなくなった晩年に完成させた交響曲第九番「合唱」は、「歓喜の歌」として今も世界中で愛され続けている名曲である。指揮台に立ち、聴衆の拍手が見えるまで演奏の終わりに気づかなかったという逸話も残っている。晩年は筆談用の「会話帳」で人々とやり取りしたと伝えられ、苦悩を乗り越えて生み出された数々の名曲は、困難に立ち向かう人間の力強さを象徴する作品として、今も多くの人の心を動かしている。「歓喜の歌」は現在、欧州連合の歌としても採用されるなど、平和と団結の象徴となっている。",
    bodyHtml:"ドイツの作曲家ベートーヴェンは、酒におぼれる父親から厳しい英才教育を受けて育ったが、20代後半から次第に耳が聞こえにくくなるという、音楽家にとって最も過酷な運命に見舞われた。一時は絶望のあまり遺書を書いたとも伝えられるが、それでも「運命の喉笛をつかんでやる」という強い意志で作曲を続けた。生涯に交響曲を9曲残し、耳がほとんど聞こえなくなった晩年に完成させた交響曲第九番「合唱」は、「歓喜の歌」として今も世界中で愛され続けている名曲である。指揮台に立ち、聴衆の拍手が見えるまで演奏の終わりに気づかなかったという逸話も残っている。晩年は筆談用の「会話帳」で人々とやり取りしたと伝えられ、苦悩を乗り越えて生み出された数々の名曲は、困難に立ち向かう人間の力強さを象徴する作品として、今も多くの人の心を動かしている。「歓喜の歌」は現在、欧州連合の歌としても採用されるなど、平和と団結の象徴となっている。", source:"legacy", sourceId:"047" },
  { id:"048-02", personId:"048", title:"もうひとつのエピソード", tags:["芸術"],
    body:"オーストリアのモーツァルトは、幼い頃から驚異的な音楽の才能を見せ、5歳で作曲を始め、6歳のときには父に連れられてウィーンの宮廷をはじめヨーロッパ各地で演奏旅行を行うほどの神童だった。大人になってからも、オペラ「フィガロの結婚」「魔笛」など数々の傑作を生み出し続け、生涯に600曲以上ともいわれる作品を残している。しかし派手な生活や借金に悩まされることも多く、経済的には恵まれない晩年を送った。死の直前まで筆をとっていた「レクイエム」は未完のまま残され、1791年、35歳という若さで亡くなり、当時の慣習で共同墓地に葬られたその死因は今も謎に包まれている。短い生涯にもかかわらず、交響曲・協奏曲・オペラなど、あらゆるジャンルで音楽の可能性を広げた天才作曲家として、今も世界中で愛されている。映画音楽にもたびたび用いられる「アイネ・クライネ・ナハトムジーク」などの軽快な作品も広く親しまれている。",
    bodyHtml:"オーストリアのモーツァルトは、幼い頃から驚異的な音楽の才能を見せ、5歳で作曲を始め、6歳のときには父に連れられてウィーンの宮廷をはじめヨーロッパ各地で演奏旅行を行うほどの神童だった。大人になってからも、オペラ「フィガロの結婚」「魔笛」など数々の傑作を生み出し続け、生涯に600曲以上ともいわれる作品を残している。しかし派手な生活や借金に悩まされることも多く、経済的には恵まれない晩年を送った。死の直前まで筆をとっていた「レクイエム」は未完のまま残され、1791年、35歳という若さで亡くなり、当時の慣習で共同墓地に葬られたその死因は今も謎に包まれている。短い生涯にもかかわらず、交響曲・協奏曲・オペラなど、あらゆるジャンルで音楽の可能性を広げた天才作曲家として、今も世界中で愛されている。映画音楽にもたびたび用いられる「アイネ・クライネ・ナハトムジーク」などの軽快な作品も広く親しまれている。", source:"legacy", sourceId:"048" },
  { id:"049-02", personId:"049", title:"もうひとつのエピソード", tags:["芸術"],
    body:"「音楽の父」と呼ばれるバッハは、ドイツの教会でオルガン奏者や合唱指揮者として働きながら、生涯に膨大な数の宗教曲や器楽曲を作曲し続けた。二度の結婚で20人もの子をもうけ、そのうち何人かは後に自身も作曲家として活躍している。「音楽の唯一の目的は、神の栄光と人の心の安らぎのためにある」という信念のもと、日々の礼拝のために書き続けた作品は、後に「マタイ受難曲」や「ブランデンブルク協奏曲」など、音楽史に残る傑作として結実している。しかし生前はあくまで一地方の教会音楽家としての評価にとどまり、死後しばらくは忘れられた存在だった。1829年、作曲家メンデルスゾーンが「マタイ受難曲」を復活上演したことをきっかけに再評価が進み、後の作曲家たちに計り知れない影響を与える存在となった。生涯ほとんど故郷ドイツを離れることなく作曲活動を続け、幾何学的とも評される精緻な対位法を極めた。",
    bodyHtml:"「音楽の父」と呼ばれるバッハは、ドイツの教会でオルガン奏者や合唱指揮者として働きながら、生涯に膨大な数の宗教曲や器楽曲を作曲し続けた。二度の結婚で20人もの子をもうけ、そのうち何人かは後に自身も作曲家として活躍している。「音楽の唯一の目的は、神の栄光と人の心の安らぎのためにある」という信念のもと、日々の礼拝のために書き続けた作品は、後に「マタイ受難曲」や「ブランデンブルク協奏曲」など、音楽史に残る傑作として結実している。しかし生前はあくまで一地方の教会音楽家としての評価にとどまり、死後しばらくは忘れられた存在だった。1829年、作曲家メンデルスゾーンが「マタイ受難曲」を復活上演したことをきっかけに再評価が進み、後の作曲家たちに計り知れない影響を与える存在となった。生涯ほとんど故郷ドイツを離れることなく作曲活動を続け、幾何学的とも評される精緻な対位法を極めた。", source:"legacy", sourceId:"049" },
  { id:"050-02", personId:"050", title:"もうひとつのエピソード", tags:["芸術"],
    body:"江戸に生まれた葛飾北斎は、生涯に何度も名前と住まいを変え、雅号だけでも30ほど、引っ越しは93回も行ったと伝えられるほど、絵の探求に没頭し続けた浮世絵師である。富士山を様々な場所・季節・天候から描いた「富嶽三十六景」は、大胆な構図と鮮やかな青色（ベロ藍）が世界的に評価され、代表作「神奈川沖浪裏」は後にヨーロッパの印象派の画家たちや作曲家ドビュッシーにまで影響を与えた。「北斎漫画」と呼ばれる膨大なスケッチ集を残すなど画業への探究心は衰えず、70歳を過ぎてもなお絵の腕は衰えず、「あと十年、いや五年生きられれば本当の絵描きになれたのに」という言葉を残しながら、88歳で世を去るまで描き続けたという、生涯にわたって芸術に情熱を注いだ姿勢は、多くの人に感銘を与えている。浮世絵は輸出品の包み紙として海を渡ったことがきっかけで、思いがけずヨーロッパの画家たちの目に触れたと伝えられる。",
    bodyHtml:"江戸に生まれた葛飾北斎は、生涯に何度も名前と住まいを変え、雅号だけでも30ほど、引っ越しは93回も行ったと伝えられるほど、絵の探求に没頭し続けた浮世絵師である。富士山を様々な場所・季節・天候から描いた「富嶽三十六景」は、大胆な構図と鮮やかな青色（ベロ藍）が世界的に評価され、代表作「神奈川沖浪裏」は後にヨーロッパの印象派の画家たちや作曲家ドビュッシーにまで影響を与えた。「北斎漫画」と呼ばれる膨大なスケッチ集を残すなど画業への探究心は衰えず、70歳を過ぎてもなお絵の腕は衰えず、「あと十年、いや五年生きられれば本当の絵描きになれたのに」という言葉を残しながら、88歳で世を去るまで描き続けたという、生涯にわたって芸術に情熱を注いだ姿勢は、多くの人に感銘を与えている。浮世絵は輸出品の包み紙として海を渡ったことがきっかけで、思いがけずヨーロッパの画家たちの目に触れたと伝えられる。", source:"legacy", sourceId:"050" },
  { id:"051-02", personId:"051", title:"もうひとつのエピソード", tags:["芸術"],
    body:"江戸に生まれた歌川広重は、江戸から京都まで東海道を旅した経験をもとに、53の宿場とその風景を描いた「東海道五十三次」で一躍人気浮世絵師となった。雨や雪、夕暮れといった移りゆく天候や時間帯の情景を、旅人の視点からしみじみと描く表現力に優れ、その繊細な色使いは見る人の心を惹きつけた。晩年に手がけた「名所江戸百景」もまた高く評価されている。この作品群はヨーロッパにも伝わり、ゴッホが「大橋あたけの夕立」や「亀戸梅屋敷」を油絵でそのまま模写するなど、印象派の画家たちが広重の構図を熱心に学んだことでも知られている。日常の中にある自然の美しさや旅情を丁寧にすくい取ったその作品群は、日本の風景画の代表として、今も国内外で高く評価され続けている。生涯に描いた浮世絵の作品数は数千点にのぼるとされ、旅そのものを主題とした「名所絵」というジャンルを確立した。",
    bodyHtml:"江戸に生まれた歌川広重は、江戸から京都まで東海道を旅した経験をもとに、53の宿場とその風景を描いた「東海道五十三次」で一躍人気浮世絵師となった。雨や雪、夕暮れといった移りゆく天候や時間帯の情景を、旅人の視点からしみじみと描く表現力に優れ、その繊細な色使いは見る人の心を惹きつけた。晩年に手がけた「名所江戸百景」もまた高く評価されている。この作品群はヨーロッパにも伝わり、ゴッホが「大橋あたけの夕立」や「亀戸梅屋敷」を油絵でそのまま模写するなど、印象派の画家たちが広重の構図を熱心に学んだことでも知られている。日常の中にある自然の美しさや旅情を丁寧にすくい取ったその作品群は、日本の風景画の代表として、今も国内外で高く評価され続けている。生涯に描いた浮世絵の作品数は数千点にのぼるとされ、旅そのものを主題とした「名所絵」というジャンルを確立した。", source:"legacy", sourceId:"051" },
  { id:"052-02", personId:"052", title:"もうひとつのエピソード", tags:["芸術"],
    body:"「芸術は爆発だ」という言葉で知られる岡本太郎は、漫画家の父・岡本一平と小説家の母・岡本かの子のもとに生まれ、既存の常識や枠組みにとらわれない、独創的で力強い作品を生み出し続けた芸術家である。フランス留学時代には社会学者マルセル・モースのもとで民族学を学びつつ前衛芸術にも触れ、帰国後は日本の伝統的な美意識とは一線を画す、原色を大胆に使った作品で注目を集めた。1970年の大阪万博では、周囲の近未来的なパビリオン群とは対照的に、縄文文化を思わせる力強く不思議な造形の「太陽の塔」を制作し、大きな話題を呼んだ。万博終了後に取り壊される予定だった塔は保存を望む声で残され、今も大阪のシンボルとして立ち続けている。「うまくやろうとするな。ただ、思いきりやれ」という言葉のとおり、常に全力で自己表現を貫いた生き方は、多くの人に自由な発想の大切さを伝えている。",
    bodyHtml:"「芸術は爆発だ」という言葉で知られる岡本太郎は、漫画家の父・岡本一平と小説家の母・岡本かの子のもとに生まれ、既存の常識や枠組みにとらわれない、独創的で力強い作品を生み出し続けた芸術家である。フランス留学時代には社会学者マルセル・モースのもとで民族学を学びつつ前衛芸術にも触れ、帰国後は日本の伝統的な美意識とは一線を画す、原色を大胆に使った作品で注目を集めた。1970年の大阪万博では、周囲の近未来的なパビリオン群とは対照的に、縄文文化を思わせる力強く不思議な造形の「太陽の塔」を制作し、大きな話題を呼んだ。万博終了後に取り壊される予定だった塔は保存を望む声で残され、今も大阪のシンボルとして立ち続けている。「うまくやろうとするな。ただ、思いきりやれ」という言葉のとおり、常に全力で自己表現を貫いた生き方は、多くの人に自由な発想の大切さを伝えている。", source:"legacy", sourceId:"052" },
  { id:"053-02", personId:"053", title:"もうひとつのエピソード", tags:["文学"],
    body:"平安時代の宮廷に仕えた紫式部は、幼い頃から漢籍に親しみ、当時女性にはあまり求められなかった高い教養を身につけていた。夫を亡くした後、藤原道長の娘である中宮彰子に女房として仕えながら、貴族社会の恋愛や人間関係を舞台にした世界最古の長編小説ともいわれる「源氏物語」を書き上げていく。全54帖にも及ぶこの物語は、主人公・光源氏をめぐる複雑な人間模様を、登場人物の細やかな心の動きとともに描き出し、単なる恋愛物語を超えた深い人生観を映し出している。なお「紫式部」は本名ではなく、作中の人物「紫の上」にちなんだ女房名であり、本当の名前は今も分かっていない。書かれてから1000年以上が経った今も、世界中の言語に翻訳されて読み継がれており、日本文学史上最高の傑作の一つとして高く評価されている。作中に登場する和歌は795首にものぼり、貴族社会の教養や美意識を映し出す資料としても貴重である。",
    bodyHtml:"平安時代の宮廷に仕えた紫式部は、幼い頃から漢籍に親しみ、当時女性にはあまり求められなかった高い教養を身につけていた。夫を亡くした後、藤原道長の娘である中宮彰子に女房として仕えながら、貴族社会の恋愛や人間関係を舞台にした世界最古の長編小説ともいわれる「源氏物語」を書き上げていく。全54帖にも及ぶこの物語は、主人公・光源氏をめぐる複雑な人間模様を、登場人物の細やかな心の動きとともに描き出し、単なる恋愛物語を超えた深い人生観を映し出している。なお「紫式部」は本名ではなく、作中の人物「紫の上」にちなんだ女房名であり、本当の名前は今も分かっていない。書かれてから1000年以上が経った今も、世界中の言語に翻訳されて読み継がれており、日本文学史上最高の傑作の一つとして高く評価されている。作中に登場する和歌は795首にものぼり、貴族社会の教養や美意識を映し出す資料としても貴重である。", source:"legacy", sourceId:"053" },
  { id:"054-02", personId:"054", title:"もうひとつのエピソード", tags:["文学"],
    body:"紫式部とほぼ同じ時代に宮中に仕えた清少納言は、歌人・清原元輔を父に持ち、鋭い観察眼と機知に富んだ文章で知られる女房であり、随筆「枕草子」の作者である。仕えた中宮定子のサロンでの体験をもとに、「春はあけぼの」という有名な書き出しから始まるこの作品は、四季折々の自然の美しさや、宮廷での日常の出来事、人々の心の機微を、生き生きとした筆致で描き出している。恋のライバルであった紫式部とは対照的な、明るく機知に富んだ文体が特徴で、当時の貴族社会の空気を今に伝える貴重な資料としても価値が高い。「ものは尽くさで、余りあるようにするのがよい」という言葉には、彼女ならではの美意識がにじみ出ており、後世「随筆文学」と呼ばれるジャンルの先駆けとして高く評価されている。宮中を退いた後の晩年については資料が乏しく、その最期の様子は今もはっきりとは分かっていない。",
    bodyHtml:"紫式部とほぼ同じ時代に宮中に仕えた清少納言は、歌人・清原元輔を父に持ち、鋭い観察眼と機知に富んだ文章で知られる女房であり、随筆「枕草子」の作者である。仕えた中宮定子のサロンでの体験をもとに、「春はあけぼの」という有名な書き出しから始まるこの作品は、四季折々の自然の美しさや、宮廷での日常の出来事、人々の心の機微を、生き生きとした筆致で描き出している。恋のライバルであった紫式部とは対照的な、明るく機知に富んだ文体が特徴で、当時の貴族社会の空気を今に伝える貴重な資料としても価値が高い。「ものは尽くさで、余りあるようにするのがよい」という言葉には、彼女ならではの美意識がにじみ出ており、後世「随筆文学」と呼ばれるジャンルの先駆けとして高く評価されている。宮中を退いた後の晩年については資料が乏しく、その最期の様子は今もはっきりとは分かっていない。", source:"legacy", sourceId:"054" },
  { id:"055-02", personId:"055", title:"もうひとつのエピソード", tags:["文学"],
    body:"俳諧をたんなる言葉遊びから芸術の域にまで高めた松尾芭蕉は、江戸に暮らしながらも各地を旅する生活を送り、旅先での感動を俳句に詠み続けた。特に「奥の細道」は、江戸から東北・北陸を経て大垣まで、約150日間、2400キロメートルにも及ぶ旅の記録であり、各地の風景や人々との出会いが美しい文章と俳句で綴られている。「古池や 蛙飛びこむ 水の音」に代表されるように、わずか十七音の中に、自然の情景と作者の心の動きを凝縮させる作風は「蕉風」と呼ばれ、各地に多くの門人を抱え、後世の俳諧に大きな影響を与えた。旅を栖(すみか)とする生き方を貫き、大坂への旅の途上で病に倒れ、「旅に病んで 夢は枯野を かけ廻る」という句を最後に、その生涯を閉じている。旅を通じて各地の弟子や俳人と交流を重ね、日本各地に多くの句碑が残されるほど、後世の俳諧文化に大きな足跡を残した人物である。",
    bodyHtml:"俳諧をたんなる言葉遊びから芸術の域にまで高めた松尾芭蕉は、江戸に暮らしながらも各地を旅する生活を送り、旅先での感動を俳句に詠み続けた。特に「奥の細道」は、江戸から東北・北陸を経て大垣まで、約150日間、2400キロメートルにも及ぶ旅の記録であり、各地の風景や人々との出会いが美しい文章と俳句で綴られている。「古池や 蛙飛びこむ 水の音」に代表されるように、わずか十七音の中に、自然の情景と作者の心の動きを凝縮させる作風は「蕉風」と呼ばれ、各地に多くの門人を抱え、後世の俳諧に大きな影響を与えた。旅を栖(すみか)とする生き方を貫き、大坂への旅の途上で病に倒れ、「旅に病んで 夢は枯野を かけ廻る」という句を最後に、その生涯を閉じている。旅を通じて各地の弟子や俳人と交流を重ね、日本各地に多くの句碑が残されるほど、後世の俳諧文化に大きな足跡を残した人物である。", source:"legacy", sourceId:"055" },
  { id:"056-02", personId:"056", title:"もうひとつのエピソード", tags:["文学"],
    body:"松山で英語教師として働いていた夏目漱石は、本名を金之助といい、文部省の命令でイギリスに留学するが、慣れない異国での生活と孤独な研究生活の中で神経をすり減らし、精神的に追い詰められる経験をする。帰国後、東京帝国大学で小泉八雲(ラフカディオ・ハーン)の後任として教壇に立つかたわら、その苦しい経験も糧としながら小説家としての道を歩み始め、猫の視点から人間社会を風刺的に描いた「吾輩は猫である」で作家デビューを果たした。続く「坊っちゃん」「三四郎」「こころ」などの作品では、近代化していく日本社会の中で揺れ動く人間の内面を、鋭い筆致で描き出している。持病の胃潰瘍により49歳で世を去ったが、千円紙幣の肖像としても長く親しまれ、日本の近代文学を代表する国民的作家として、今も多くの読者に読み継がれている。友人正岡子規との交流を通じて文学への関心を深めたことも、作家としての出発点の一つとされている。",
    bodyHtml:"松山で英語教師として働いていた夏目漱石は、本名を金之助といい、文部省の命令でイギリスに留学するが、慣れない異国での生活と孤独な研究生活の中で神経をすり減らし、精神的に追い詰められる経験をする。帰国後、東京帝国大学で小泉八雲(ラフカディオ・ハーン)の後任として教壇に立つかたわら、その苦しい経験も糧としながら小説家としての道を歩み始め、猫の視点から人間社会を風刺的に描いた「吾輩は猫である」で作家デビューを果たした。続く「坊っちゃん」「三四郎」「こころ」などの作品では、近代化していく日本社会の中で揺れ動く人間の内面を、鋭い筆致で描き出している。持病の胃潰瘍により49歳で世を去ったが、千円紙幣の肖像としても長く親しまれ、日本の近代文学を代表する国民的作家として、今も多くの読者に読み継がれている。友人正岡子規との交流を通じて文学への関心を深めたことも、作家としての出発点の一つとされている。", source:"legacy", sourceId:"056" },
  { id:"057-02", personId:"057", title:"もうひとつのエピソード", tags:["文学"],
    body:"本名を奈津という樋口一葉は若くして父を亡くし、女性が一人で生計を立てることが極めて難しかった時代に、母や妹とともに貧しい暮らしを支えながら小説を書き続けた。生活のために雑貨や駄菓子を売る店を営んだこともあり、その経験は作品の題材にも生かされている。少年少女の淡い恋心と別れを描いた「たけくらべ」や、貧しい女性の悲哀を描いた「にごりえ」などの代表作は、死の前年からの約14か月という短い期間に集中して生み出されたもので、「奇跡の14か月」とも呼ばれている。明治の文壇に彗星のように現れた才能として注目されたが、肺結核により、わずか24歳という若さでこの世を去った。その短い生涯とは対照的に、現在の五千円紙幣の肖像に選ばれるなど、今も多くの人にその文才が称えられている。作品の舞台となった東京・下町の風情は、今も文学散歩のコースとして多くのファンに親しまれている。",
    bodyHtml:"本名を奈津という樋口一葉は若くして父を亡くし、女性が一人で生計を立てることが極めて難しかった時代に、母や妹とともに貧しい暮らしを支えながら小説を書き続けた。生活のために雑貨や駄菓子を売る店を営んだこともあり、その経験は作品の題材にも生かされている。少年少女の淡い恋心と別れを描いた「たけくらべ」や、貧しい女性の悲哀を描いた「にごりえ」などの代表作は、死の前年からの約14か月という短い期間に集中して生み出されたもので、「奇跡の14か月」とも呼ばれている。明治の文壇に彗星のように現れた才能として注目されたが、肺結核により、わずか24歳という若さでこの世を去った。その短い生涯とは対照的に、現在の五千円紙幣の肖像に選ばれるなど、今も多くの人にその文才が称えられている。作品の舞台となった東京・下町の風情は、今も文学散歩のコースとして多くのファンに親しまれている。", source:"legacy", sourceId:"057" },
  { id:"058-02", personId:"058", title:"もうひとつのエピソード", tags:["文学"],
    body:"岩手県花巻に生まれた宮沢賢治は、農業学校の教師を務めながら、農民の暮らしを豊かにするための肥料設計や農業指導にも力を注いでいた、理科教育にも通じた作家である。自身の信仰であった法華経の教えや、宇宙・自然への深い関心を背景に、独自の世界観にあふれる童話や詩を数多く生み出した。生前に刊行された本は童話集「注文の多い料理店」など数点のみで、ほとんど無名のまま評価されなかったが、死の直前に書かれたとされる「雨ニモマケズ」の手帳が見つかったことなどをきっかけに、死後になってその作品の価値が広く知られるようになる。最愛の妹トシの死を悼んで書かれた詩「永訣の朝」や、「銀河鉄道の夜」をはじめとする作品群は、今では教科書にも取り上げられる国民的な文学として、多くの世代に愛され続けている。地元では農学校時代の教え子たちが「羅須地人協会」の活動を支え、その理想の一端を今に伝えている。",
    bodyHtml:"岩手県花巻に生まれた宮沢賢治は、農業学校の教師を務めながら、農民の暮らしを豊かにするための肥料設計や農業指導にも力を注いでいた、理科教育にも通じた作家である。自身の信仰であった法華経の教えや、宇宙・自然への深い関心を背景に、独自の世界観にあふれる童話や詩を数多く生み出した。生前に刊行された本は童話集「注文の多い料理店」など数点のみで、ほとんど無名のまま評価されなかったが、死の直前に書かれたとされる「雨ニモマケズ」の手帳が見つかったことなどをきっかけに、死後になってその作品の価値が広く知られるようになる。最愛の妹トシの死を悼んで書かれた詩「永訣の朝」や、「銀河鉄道の夜」をはじめとする作品群は、今では教科書にも取り上げられる国民的な文学として、多くの世代に愛され続けている。地元では農学校時代の教え子たちが「羅須地人協会」の活動を支え、その理想の一端を今に伝えている。", source:"legacy", sourceId:"058" },
  { id:"059-02", personId:"059", title:"もうひとつのエピソード", tags:["文学"],
    body:"イギリスの劇作家シェイクスピアは、ロンドンのグローブ座を拠点に俳優として活動しながら、生涯に37もの戯曲と154編のソネットを書き上げたとされる、演劇史上最も偉大な作家の一人である。「ロミオとジュリエット」の悲劇的な恋、「ハムレット」の苦悩する王子、「マクベス」の野心と破滅など、人間の心の奥深くにある喜びや苦しみ、欲望を鮮やかに描き出した。彼が生み出した独自の言い回しや造語は数多く、現在の英語の中にも「壊れた心（broken-hearted）」など、彼の作品を由来とする表現が数多く残っている。故郷ストラトフォード・アポン・エイヴォンで生まれた日と同じ4月23日に亡くなったと伝えられ、作品は今も世界中の舞台で上演され続け、翻訳や映画化も繰り返されるなど、時代や国境を越えて人々に影響を与え続けている。実際の人物像には不明な点が多く、その正体をめぐる議論は今も研究者の間で続いている。",
    bodyHtml:"イギリスの劇作家シェイクスピアは、ロンドンのグローブ座を拠点に俳優として活動しながら、生涯に37もの戯曲と154編のソネットを書き上げたとされる、演劇史上最も偉大な作家の一人である。「ロミオとジュリエット」の悲劇的な恋、「ハムレット」の苦悩する王子、「マクベス」の野心と破滅など、人間の心の奥深くにある喜びや苦しみ、欲望を鮮やかに描き出した。彼が生み出した独自の言い回しや造語は数多く、現在の英語の中にも「壊れた心（broken-hearted）」など、彼の作品を由来とする表現が数多く残っている。故郷ストラトフォード・アポン・エイヴォンで生まれた日と同じ4月23日に亡くなったと伝えられ、作品は今も世界中の舞台で上演され続け、翻訳や映画化も繰り返されるなど、時代や国境を越えて人々に影響を与え続けている。実際の人物像には不明な点が多く、その正体をめぐる議論は今も研究者の間で続いている。", source:"legacy", sourceId:"059" },
  { id:"060-02", personId:"060", title:"もうひとつのエピソード", tags:["文学"],
    body:"デンマークの貧しい靴職人の家に生まれたアンデルセンは、幼くして父を亡くし、若くして故郷を離れ、俳優や作家を目指して苦しい下積み時代を過ごした。自身が容姿にコンプレックスを抱き、周囲になじめなかった経験は、後の童話「みにくいアヒルの子」に色濃く反映されているとされる。「人魚姫」「裸の王様」「マッチ売りの少女」など、生涯に150編以上ともいわれる童話を生み出し、美しさと切なさが同居する物語は、単なる子ども向けのおとぎ話にとどまらない、人生の悲喜こもごもを描いた作品として世界中で愛されている。「人魚姫」の像は今もコペンハーゲンの港に立ち、街の象徴となっている。「生きることそのものが、おとぎ話なのだ」という言葉のとおり、波乱に満ちた自らの人生を作品に昇華させた作家である。生涯独身を貫いたが、旅を愛し、ヨーロッパ各地を巡った経験も多くの作品の題材となっている。",
    bodyHtml:"デンマークの貧しい靴職人の家に生まれたアンデルセンは、幼くして父を亡くし、若くして故郷を離れ、俳優や作家を目指して苦しい下積み時代を過ごした。自身が容姿にコンプレックスを抱き、周囲になじめなかった経験は、後の童話「みにくいアヒルの子」に色濃く反映されているとされる。「人魚姫」「裸の王様」「マッチ売りの少女」など、生涯に150編以上ともいわれる童話を生み出し、美しさと切なさが同居する物語は、単なる子ども向けのおとぎ話にとどまらない、人生の悲喜こもごもを描いた作品として世界中で愛されている。「人魚姫」の像は今もコペンハーゲンの港に立ち、街の象徴となっている。「生きることそのものが、おとぎ話なのだ」という言葉のとおり、波乱に満ちた自らの人生を作品に昇華させた作家である。生涯独身を貫いたが、旅を愛し、ヨーロッパ各地を巡った経験も多くの作品の題材となっている。", source:"legacy", sourceId:"060" },
  { id:"101-01", personId:"101", title:"この人の歩み", tags:["科学"],
    body:"アメリカの海洋生物学者レイチェル・カーソンは、代表作「われらをめぐる海」ですでに海洋生物学者として高い評価を得ていたが、農薬DDTが人間だけでなく、鳥や魚など自然界の生き物に深刻な影響を及ぼしていることに気づき、長い年月をかけて科学的な調査を積み重ねた。その成果を1962年に「沈黙の春」という著書にまとめて発表し、春になっても鳥のさえずりが聞こえなくなる、農薬による自然破壊の恐ろしさを人々に訴えかけた。この本は化学メーカーなどから激しい反発を受けたが、多くの市民や科学者の共感を呼んだ。1964年にがんでこの世を去った後も、その訴えは1970年のアメリカ環境保護庁の設立や1972年のDDT使用禁止といった大きな政策転換へとつながっていった。「自然は征服するものではなく、共に生きるものである」という考えは、後の環境保護運動の原点として、今も世界中で受け継がれている。",
    bodyHtml:"アメリカの海洋生物学者レイチェル・カーソンは、代表作「われらをめぐる海」ですでに海洋生物学者として高い評価を得ていたが、農薬DDTが人間だけでなく、鳥や魚など自然界の生き物に深刻な影響を及ぼしていることに気づき、長い年月をかけて科学的な調査を積み重ねた。その成果を1962年に「沈黙の春」という著書にまとめて発表し、春になっても鳥のさえずりが聞こえなくなる、農薬による自然破壊の恐ろしさを人々に訴えかけた。この本は化学メーカーなどから激しい反発を受けたが、多くの市民や科学者の共感を呼んだ。1964年にがんでこの世を去った後も、その訴えは1970年のアメリカ環境保護庁の設立や1972年のDDT使用禁止といった大きな政策転換へとつながっていった。「自然は征服するものではなく、共に生きるものである」という考えは、後の環境保護運動の原点として、今も世界中で受け継がれている。", source:"legacy", sourceId:"062" },
  { id:"N01-01", personId:"N01", title:"この人の歩み", tags:["科学"],
    body:"朝永振一郎は東京に生まれ、少年時代を京都で過ごし、京都帝国大学では後にノーベル賞を受賞する湯川秀樹と机を並べて学んだ。ドイツに留学してハイゼンベルクのもとで学んだのち、量子電磁力学の計算をすると答えが無限大になってしまうという長年の難問に挑み、戦争で世界との交流が絶たれた孤立した状況の中で「くりこみ理論」を作り上げてこれを解決した。戦後、アメリカのシュウィンガーやファインマンが別の方法で同じ結論に達していたことが分かり、三人は1965年に共同でノーベル物理学賞を受賞した。晩年は「ふしぎだと思うことこそ科学の芽である」と子どもたちに語りかけ、科学する心を育てる大切さを伝え続けた。また、随筆家としても知られ、飄々とした語り口の文章「パイプのけむり」は今も多くの読者に親しまれている。東京教育大学の学長や日本学術会議の会長も務め、核兵器の脅威を訴えるなど、科学者の社会的責任についても発言し続けた。",
    bodyHtml:"朝永振一郎は東京に生まれ、少年時代を京都で過ごし、京都帝国大学では後にノーベル賞を受賞する湯川秀樹と机を並べて学んだ。ドイツに留学してハイゼンベルクのもとで学んだのち、量子電磁力学の計算をすると答えが無限大になってしまうという長年の難問に挑み、戦争で世界との交流が絶たれた孤立した状況の中で「くりこみ理論」を作り上げてこれを解決した。戦後、アメリカのシュウィンガーやファインマンが別の方法で同じ結論に達していたことが分かり、三人は1965年に共同でノーベル物理学賞を受賞した。晩年は「ふしぎだと思うことこそ科学の芽である」と子どもたちに語りかけ、科学する心を育てる大切さを伝え続けた。また、随筆家としても知られ、飄々とした語り口の文章「パイプのけむり」は今も多くの読者に親しまれている。東京教育大学の学長や日本学術会議の会長も務め、核兵器の脅威を訴えるなど、科学者の社会的責任についても発言し続けた。", source:"legacy", sourceId:"N01" },
  { id:"N02-01", personId:"N02", title:"この人の歩み", tags:["科学"],
    body:"大阪に生まれた江崎玲於奈は、東京大学卒業後、後にソニーとなる東京通信工業に入社した。上司から自由に研究させてもらえる恵まれた環境のなかで、ゲルマニウムの半導体に強い不純物を加えた接合を調べるうち、電子が本来越えられないはずの壁をすり抜けてしまう「トンネル効果」を発見し、1957年にエサキダイオードを開発した。この成果により、超伝導のトンネル効果を発見したジアイエバー、理論を築いたジョセフソンとともに、1973年にノーベル物理学賞を受賞した。のちにはアメリカのIBMに渡って半導体超格子の研究を進め、筑波大学の学長も務めるなど、日本と世界の科学の発展に貢献し続けた。ソニーの創業者・井深大からは「人のやらないことをやれ」と励まされ、失敗を恐れず自由な発想で挑戦する社風の中で数々の独創的な研究に取り組んだといい、後年は多くの若手研究者の育成にも力を注いだ。",
    bodyHtml:"大阪に生まれた江崎玲於奈は、東京大学卒業後、後にソニーとなる東京通信工業に入社した。上司から自由に研究させてもらえる恵まれた環境のなかで、ゲルマニウムの半導体に強い不純物を加えた接合を調べるうち、電子が本来越えられないはずの壁をすり抜けてしまう「トンネル効果」を発見し、1957年にエサキダイオードを開発した。この成果により、超伝導のトンネル効果を発見したジアイエバー、理論を築いたジョセフソンとともに、1973年にノーベル物理学賞を受賞した。のちにはアメリカのIBMに渡って半導体超格子の研究を進め、筑波大学の学長も務めるなど、日本と世界の科学の発展に貢献し続けた。ソニーの創業者・井深大からは「人のやらないことをやれ」と励まされ、失敗を恐れず自由な発想で挑戦する社風の中で数々の独創的な研究に取り組んだといい、後年は多くの若手研究者の育成にも力を注いだ。", source:"legacy", sourceId:"N02" },
  { id:"N03-01", personId:"N03", title:"この人の歩み", tags:["科学"],
    body:"白川英樹は東京工業大学の研究室で、ポリアセチレンという物質を作る実験を指導していたとき、留学生が触媒の濃度を単位を間違えて通常の1000倍にしてしまうという「失敗」に出会った。そこにできたのは黒い粉ではなく、銀色に輝く不思議なフィルムだった。この現象を見逃さずに研究を続け、のちにアメリカのマクダイアミッドやヒーガーと共同でヨウ素を加える工夫をしたところ、電気を通さないはずのプラスチックが金属のように電気を通すことを発見した。薄膜状のポリアセチレンにヨウ素の蒸気を加えると、電気の通しやすさが一気に1000万倍以上にも跳ね上がるという驚くべき変化が起きた。「プラスチックなのに金属のように電気を通す」というこの常識破りの発見は、有機ELディスプレイなど現代の電子機器にも応用される新しい研究分野の出発点となり、2000年にノーベル化学賞を受賞した。",
    bodyHtml:"白川英樹は東京工業大学の研究室で、ポリアセチレンという物質を作る実験を指導していたとき、留学生が触媒の濃度を単位を間違えて通常の1000倍にしてしまうという「失敗」に出会った。そこにできたのは黒い粉ではなく、銀色に輝く不思議なフィルムだった。この現象を見逃さずに研究を続け、のちにアメリカのマクダイアミッドやヒーガーと共同でヨウ素を加える工夫をしたところ、電気を通さないはずのプラスチックが金属のように電気を通すことを発見した。薄膜状のポリアセチレンにヨウ素の蒸気を加えると、電気の通しやすさが一気に1000万倍以上にも跳ね上がるという驚くべき変化が起きた。「プラスチックなのに金属のように電気を通す」というこの常識破りの発見は、有機ELディスプレイなど現代の電子機器にも応用される新しい研究分野の出発点となり、2000年にノーベル化学賞を受賞した。", source:"legacy", sourceId:"N03" },
  { id:"N04-01", personId:"N04", title:"この人の歩み", tags:["科学"],
    body:"野依良治は、右手と左手のように鏡に映した形をしていながら性質が異なる「鏡像異性体」という分子の性質に着目した研究者である。医薬品の中には片方の形だけが薬として効き、もう片方が役に立たない、時には害になることさえあるため、望む形の分子だけを選んで作り出す技術が求められていた。野依は「BINAP」と呼ばれる触媒を開発し、狙った形の分子だけを効率よく合成する「不斉合成」の道を切り開いた。この技術はメントールやパーキンソン病の治療薬などの製造にも応用され、医薬品づくりに大きな変革をもたらした。野依は化学を志す若者たちに「教科書に書かれていないことこそ本当の研究の対象である」と説き、独創性を重んじる姿勢を貫いたことでも知られ、この功績により2001年にノーベル化学賞を受賞したのち、理化学研究所の理事長として日本の科学研究の発展にも力を注いだ。",
    bodyHtml:"野依良治は、右手と左手のように鏡に映した形をしていながら性質が異なる「鏡像異性体」という分子の性質に着目した研究者である。医薬品の中には片方の形だけが薬として効き、もう片方が役に立たない、時には害になることさえあるため、望む形の分子だけを選んで作り出す技術が求められていた。野依は「BINAP」と呼ばれる触媒を開発し、狙った形の分子だけを効率よく合成する「不斉合成」の道を切り開いた。この技術はメントールやパーキンソン病の治療薬などの製造にも応用され、医薬品づくりに大きな変革をもたらした。野依は化学を志す若者たちに「教科書に書かれていないことこそ本当の研究の対象である」と説き、独創性を重んじる姿勢を貫いたことでも知られ、この功績により2001年にノーベル化学賞を受賞したのち、理化学研究所の理事長として日本の科学研究の発展にも力を注いだ。", source:"legacy", sourceId:"N04" },
  { id:"N05-01", personId:"N05", title:"この人の歩み", tags:["科学"],
    body:"小柴昌俊は、岐阜県の神岡鉱山の地下深くに建設した観測装置「カミオカンデ」を率い、宇宙から届くニュートリノという素粒子を観測する研究に取り組んだ。1987年2月、地球から約16万光年離れた大マゼラン雲で起きた超新星爆発から放たれたニュートリノを、世界で初めてとらえることに成功した。装置がとらえた信号はわずか11個ほどだったが、この観測によって「ニュートリノ天文学」という新しい研究分野が切り開かれた。カミオカンデはもともと陽子の崩壊という別の現象を観測するために作られた装置だったが、そこに偶然にも超新星からの信号がとらえられたのだった。小柴は「勉強はできる方ではなかった」と語りながらも大きな仮説を掲げて粘り強く装置を作り上げる構想力にすぐれ、定年退官の直前という土壇場での大発見という劇的な経緯もあり、2002年にノーベル物理学賞を受賞した。教え子の梶田隆章もまた同じ観測装置の研究を受け継いで後にノーベル賞を受賞している。",
    bodyHtml:"小柴昌俊は、岐阜県の神岡鉱山の地下深くに建設した観測装置「カミオカンデ」を率い、宇宙から届くニュートリノという素粒子を観測する研究に取り組んだ。1987年2月、地球から約16万光年離れた大マゼラン雲で起きた超新星爆発から放たれたニュートリノを、世界で初めてとらえることに成功した。装置がとらえた信号はわずか11個ほどだったが、この観測によって「ニュートリノ天文学」という新しい研究分野が切り開かれた。カミオカンデはもともと陽子の崩壊という別の現象を観測するために作られた装置だったが、そこに偶然にも超新星からの信号がとらえられたのだった。小柴は「勉強はできる方ではなかった」と語りながらも大きな仮説を掲げて粘り強く装置を作り上げる構想力にすぐれ、定年退官の直前という土壇場での大発見という劇的な経緯もあり、2002年にノーベル物理学賞を受賞した。教え子の梶田隆章もまた同じ観測装置の研究を受け継いで後にノーベル賞を受賞している。", source:"legacy", sourceId:"N05" },
  { id:"N06-01", personId:"N06", title:"この人の歩み", tags:["科学"],
    body:"島津製作所の会社員だった田中耕一は、タンパク質のような壊れやすい巨大分子をレーザーで壊さずにイオン化し分析する方法を研究していた。ある実験で、本来使うはずだった薬品を誤ってグリセリンと混ぜてしまうという「失敗」を、もったいないからと捨てずに使ってみたところ、思いがけずタンパク質をきれいにイオン化できることを発見した。学会で発表しても当初はほとんど注目されなかったが、この技術はやがて創薬や医療診断に欠かせない手法として世界的に評価されるようになった。2002年、修士号しか持たない無名の会社員だった田中のもとに、ノーベル化学賞受賞という知らせが突然届き、日本中を驚かせた。受賞会見でも終始謙虚な姿勢を崩さず、飾らない人柄が国内外で話題になり、その後も島津製作所の技術者として現場に立ち続け、認知症の早期診断法の研究など、人々の役に立つ技術の開発に取り組み続けている。",
    bodyHtml:"島津製作所の会社員だった田中耕一は、タンパク質のような壊れやすい巨大分子をレーザーで壊さずにイオン化し分析する方法を研究していた。ある実験で、本来使うはずだった薬品を誤ってグリセリンと混ぜてしまうという「失敗」を、もったいないからと捨てずに使ってみたところ、思いがけずタンパク質をきれいにイオン化できることを発見した。学会で発表しても当初はほとんど注目されなかったが、この技術はやがて創薬や医療診断に欠かせない手法として世界的に評価されるようになった。2002年、修士号しか持たない無名の会社員だった田中のもとに、ノーベル化学賞受賞という知らせが突然届き、日本中を驚かせた。受賞会見でも終始謙虚な姿勢を崩さず、飾らない人柄が国内外で話題になり、その後も島津製作所の技術者として現場に立ち続け、認知症の早期診断法の研究など、人々の役に立つ技術の開発に取り組み続けている。", source:"legacy", sourceId:"N06" },
  { id:"N07-01", personId:"N07", title:"この人の歩み", tags:["医学"],
    body:"山中伸弥は整形外科医から研究者に転じ、皮膚などのふつうの細胞に、たった4つの遺伝子──のちに「山中因子」と呼ばれる──を導入するだけで、体のあらゆる細胞に変化できる能力を持つ「人工多能性幹細胞(iPS細胞)」を作り出すことに2006年に成功した。何百通りもの組み合わせを気の遠くなるほど試し続けた末にたどり着いた発見であり、患者自身の細胞から目的の細胞を作れるこの技術は、倫理的な問題を避けながら再生医療や病気の研究を大きく前進させた。もともとは臨床医を目指していたが、手術の腕前で苦労した経験から基礎研究の道に進んだという意外な経歴を持つ。iPS細胞を用いた再生医療の研究は現在、目の病気や脊髄損傷など様々な病気の治療を目指して世界中で進められており、「若い人に夢を与えたい」と語り続ける山中は、この功績により、同じく細胞の初期化を示したジョン・ガードンとともに2012年にノーベル生理学・医学賞を受賞した。",
    bodyHtml:"山中伸弥は整形外科医から研究者に転じ、皮膚などのふつうの細胞に、たった4つの遺伝子──のちに「山中因子」と呼ばれる──を導入するだけで、体のあらゆる細胞に変化できる能力を持つ「人工多能性幹細胞(iPS細胞)」を作り出すことに2006年に成功した。何百通りもの組み合わせを気の遠くなるほど試し続けた末にたどり着いた発見であり、患者自身の細胞から目的の細胞を作れるこの技術は、倫理的な問題を避けながら再生医療や病気の研究を大きく前進させた。もともとは臨床医を目指していたが、手術の腕前で苦労した経験から基礎研究の道に進んだという意外な経歴を持つ。iPS細胞を用いた再生医療の研究は現在、目の病気や脊髄損傷など様々な病気の治療を目指して世界中で進められており、「若い人に夢を与えたい」と語り続ける山中は、この功績により、同じく細胞の初期化を示したジョン・ガードンとともに2012年にノーベル生理学・医学賞を受賞した。", source:"legacy", sourceId:"N07" },
  { id:"N08-01", personId:"N08", title:"この人の歩み", tags:["科学"],
    body:"北海道大学の鈴木章は、同僚の宮浦憲夫とともに、パラジウムを触媒として炭素同士を狙った場所でつなぎ合わせる画期的な化学反応「鈴木・宮浦カップリング」を1979年に発表した。それまで難しかった複雑な有機化合物の合成が、この反応によって驚くほど簡単かつ安全に行えるようになり、医薬品や農薬、さらには薄型テレビなどに使われる液晶材料の製造にも幅広く応用されるようになった。この反応が広く使われるようになった理由の一つは、有毒性の高い試薬を使わずに済み、比較的安全で環境にもやさしいという実用性の高さにあった。研究を始めた当初はそれほど大きな反響を呼ばなかったが、世界中の研究者や企業がこの反応を使いこなすようになり、有機合成化学の基本技術の一つとなった。鈴木はすでに大学を退職していたノーベル賞受賞の知らせに「まさか自分が」と驚いたと伝えられ、同じくパラジウム触媒の研究をしていた根岸英一とともに2010年にノーベル化学賞を受賞した。",
    bodyHtml:"北海道大学の鈴木章は、同僚の宮浦憲夫とともに、パラジウムを触媒として炭素同士を狙った場所でつなぎ合わせる画期的な化学反応「鈴木・宮浦カップリング」を1979年に発表した。それまで難しかった複雑な有機化合物の合成が、この反応によって驚くほど簡単かつ安全に行えるようになり、医薬品や農薬、さらには薄型テレビなどに使われる液晶材料の製造にも幅広く応用されるようになった。この反応が広く使われるようになった理由の一つは、有毒性の高い試薬を使わずに済み、比較的安全で環境にもやさしいという実用性の高さにあった。研究を始めた当初はそれほど大きな反響を呼ばなかったが、世界中の研究者や企業がこの反応を使いこなすようになり、有機合成化学の基本技術の一つとなった。鈴木はすでに大学を退職していたノーベル賞受賞の知らせに「まさか自分が」と驚いたと伝えられ、同じくパラジウム触媒の研究をしていた根岸英一とともに2010年にノーベル化学賞を受賞した。", source:"legacy", sourceId:"N08" },
  { id:"N09-01", personId:"N09", title:"この人の歩み", tags:["科学"],
    body:"根岸英一は、パラジウムなどの遷移金属を触媒として使い、有機亜鉛化合物と有機ハロゲン化合物を結びつけて複雑な炭素骨格を組み立てる「根岸カップリング」を確立した研究者である。留学先のアメリカで基礎を学んだのち、パデュー大学で研究を続け、この反応は医薬品や香料、さらには高性能な有機材料の合成など、幅広い分野で欠かせない技術となった。根岸は日本が統治していた満州(現在の中国東北部)で生まれ、戦後の混乱の中で苦学して東京大学を卒業したのち、アメリカに渡ってペンシルベニア大学やパデュー大学で有機ホウ素化学の権威ハーバート・ブラウンのもとに学んだ。「七転び八起き」を座右の銘とし、思うようにいかない実験にも粘り強く向き合い続けた姿勢は多くの若手研究者に勇気を与え、この功績により、同じくパラジウム触媒の分野を切り開いた鈴木章とともに、2010年にノーベル化学賞を受賞した。",
    bodyHtml:"根岸英一は、パラジウムなどの遷移金属を触媒として使い、有機亜鉛化合物と有機ハロゲン化合物を結びつけて複雑な炭素骨格を組み立てる「根岸カップリング」を確立した研究者である。留学先のアメリカで基礎を学んだのち、パデュー大学で研究を続け、この反応は医薬品や香料、さらには高性能な有機材料の合成など、幅広い分野で欠かせない技術となった。根岸は日本が統治していた満州(現在の中国東北部)で生まれ、戦後の混乱の中で苦学して東京大学を卒業したのち、アメリカに渡ってペンシルベニア大学やパデュー大学で有機ホウ素化学の権威ハーバート・ブラウンのもとに学んだ。「七転び八起き」を座右の銘とし、思うようにいかない実験にも粘り強く向き合い続けた姿勢は多くの若手研究者に勇気を与え、この功績により、同じくパラジウム触媒の分野を切り開いた鈴木章とともに、2010年にノーベル化学賞を受賞した。", source:"legacy", sourceId:"N09" },
  { id:"N10-01", personId:"N10", title:"この人の歩み", tags:["科学"],
    body:"赤崎勇は、名古屋大学で教え子の天野浩とともに、20年以上にわたって世界中の研究者が「不可能」とあきらめかけていた青色発光ダイオード(青色LED)の開発に挑み続けた。窒化ガリウムという材料の質の良い結晶を作ることが難しく、周囲からは無理だと言われることも多かったが、あきらめずに実験を重ね、1980年代半ばに低温で薄い緩衝層を作るという工夫によって、高品質な結晶を育てることについに成功した。それまで赤色と緑色しかなかった発光ダイオードに青色が加わったことで光の三原色がそろい、白色LED照明の実現につながった。赤崎は「石の上にも三十年」を地で行くように若い頃からの信念を曲げずに研究を貫き通したことから「青色LEDの父」とも呼ばれ、受賞後も名城大学で研究を続けた。この功績により、天野浩・中村修二とともに2014年にノーベル物理学賞を受賞した。",
    bodyHtml:"赤崎勇は、名古屋大学で教え子の天野浩とともに、20年以上にわたって世界中の研究者が「不可能」とあきらめかけていた青色発光ダイオード(青色LED)の開発に挑み続けた。窒化ガリウムという材料の質の良い結晶を作ることが難しく、周囲からは無理だと言われることも多かったが、あきらめずに実験を重ね、1980年代半ばに低温で薄い緩衝層を作るという工夫によって、高品質な結晶を育てることについに成功した。それまで赤色と緑色しかなかった発光ダイオードに青色が加わったことで光の三原色がそろい、白色LED照明の実現につながった。赤崎は「石の上にも三十年」を地で行くように若い頃からの信念を曲げずに研究を貫き通したことから「青色LEDの父」とも呼ばれ、受賞後も名城大学で研究を続けた。この功績により、天野浩・中村修二とともに2014年にノーベル物理学賞を受賞した。", source:"legacy", sourceId:"N10" },
  { id:"N11-01", personId:"N11", title:"この人の歩み", tags:["科学"],
    body:"天野浩は、名古屋大学の赤崎勇のもとで大学院生として青色発光ダイオードの研究に取り組んだ。窒化ガリウムの結晶を装置の中でうまく成長させることができず、実験装置を1500回近くも分解して掃除し、条件を変えては挑戦するという地道な作業を繰り返した。1980年代半ばのある日、装置の調子が悪く低い温度で薄い膜(バッファ層)を作ったところ、思いがけず美しく透明な結晶ができあがっていることに気づいた。この発見が高品質な窒化ガリウム結晶を作る決定的な技術となり、実用的な青色LEDの実現に道を開いた。地道な失敗の積み重ねから生まれたこの成果により、赤崎勇・中村修二とともに2014年にノーベル物理学賞を受賞した。天野は指導教員であった赤崎の娘と結婚しており、公私にわたって深い師弟関係で結ばれていたことでも知られ、受賞後は名古屋大学の教授として、省エネルギーにつながる次世代の窒化物半導体の研究を続けている。",
    bodyHtml:"天野浩は、名古屋大学の赤崎勇のもとで大学院生として青色発光ダイオードの研究に取り組んだ。窒化ガリウムの結晶を装置の中でうまく成長させることができず、実験装置を1500回近くも分解して掃除し、条件を変えては挑戦するという地道な作業を繰り返した。1980年代半ばのある日、装置の調子が悪く低い温度で薄い膜(バッファ層)を作ったところ、思いがけず美しく透明な結晶ができあがっていることに気づいた。この発見が高品質な窒化ガリウム結晶を作る決定的な技術となり、実用的な青色LEDの実現に道を開いた。地道な失敗の積み重ねから生まれたこの成果により、赤崎勇・中村修二とともに2014年にノーベル物理学賞を受賞した。天野は指導教員であった赤崎の娘と結婚しており、公私にわたって深い師弟関係で結ばれていたことでも知られ、受賞後は名古屋大学の教授として、省エネルギーにつながる次世代の窒化物半導体の研究を続けている。", source:"legacy", sourceId:"N11" },
  { id:"N12-01", personId:"N12", title:"この人の歩み", tags:["科学"],
    body:"中村修二は、大企業ではなく徳島県の中小企業・日亜化学工業の一研究員として、周囲から「青色LEDの実用化など無理だ」と言われながらも、たった一人で研究を続けた。会社の反対を押し切るようにして装置を自作し、独自に改良を重ねた結果、1993年に高輝度の青色LEDの実用化についに成功し、会社に大きな利益をもたらした。しかし発明の対価をめぐって会社との間で裁判となり、2004年には東京地方裁判所が200億円もの支払いを命じる判決を出して社会に衝撃を与えたが、2005年に東京高等裁判所で和解が成立し、遅延損害金を含め約8億4000万円が支払われることになった。この裁判は、企業に勤める研究者の発明に対する正当な対価のあり方を社会に問いかける大きなきっかけとなった。その後アメリカに渡ってカリフォルニア大学サンタバーバラ校の教授となり、この功績により赤崎勇・天野浩とともに2014年にノーベル物理学賞を受賞した。",
    bodyHtml:"中村修二は、大企業ではなく徳島県の中小企業・日亜化学工業の一研究員として、周囲から「青色LEDの実用化など無理だ」と言われながらも、たった一人で研究を続けた。会社の反対を押し切るようにして装置を自作し、独自に改良を重ねた結果、1993年に高輝度の青色LEDの実用化についに成功し、会社に大きな利益をもたらした。しかし発明の対価をめぐって会社との間で裁判となり、2004年には東京地方裁判所が200億円もの支払いを命じる判決を出して社会に衝撃を与えたが、2005年に東京高等裁判所で和解が成立し、遅延損害金を含め約8億4000万円が支払われることになった。この裁判は、企業に勤める研究者の発明に対する正当な対価のあり方を社会に問いかける大きなきっかけとなった。その後アメリカに渡ってカリフォルニア大学サンタバーバラ校の教授となり、この功績により赤崎勇・天野浩とともに2014年にノーベル物理学賞を受賞した。", source:"legacy", sourceId:"N12" },
  { id:"N13-01", personId:"N13", title:"この人の歩み", tags:["医学"],
    body:"大村智は、日本各地の土を採取して集めた微生物の中から、有用な化合物を作り出す放線菌を探し出す研究を続けた。静岡県のゴルフ場近くの土から見つけた菌がつくる物質をもとに、アメリカの製薬会社メルクと共同で開発したのが「エバーメクチン」であり、これを改良した「イベルメクチン」は、アフリカなどで失明の原因ともなる感染症「オンコセルカ症(河川盲目症)」の特効薬となった。この薬は無償で提供され、アジアやアフリカで何億人もの人々を病気の苦しみから救ってきた。この特効薬の特許使用料の一部は、大村の出身地である山梨県韮崎市に美術館を建てるためにも使われた。大村は「微生物の力を借りて薬を作らせてもらっている」という謙虚な姿勢を持ち続け、この功績により、共同開発者のキャンベルや、マラリアの薬を発見した屠呦呦とともに、2015年にノーベル生理学・医学賞を受賞した。",
    bodyHtml:"大村智は、日本各地の土を採取して集めた微生物の中から、有用な化合物を作り出す放線菌を探し出す研究を続けた。静岡県のゴルフ場近くの土から見つけた菌がつくる物質をもとに、アメリカの製薬会社メルクと共同で開発したのが「エバーメクチン」であり、これを改良した「イベルメクチン」は、アフリカなどで失明の原因ともなる感染症「オンコセルカ症(河川盲目症)」の特効薬となった。この薬は無償で提供され、アジアやアフリカで何億人もの人々を病気の苦しみから救ってきた。この特効薬の特許使用料の一部は、大村の出身地である山梨県韮崎市に美術館を建てるためにも使われた。大村は「微生物の力を借りて薬を作らせてもらっている」という謙虚な姿勢を持ち続け、この功績により、共同開発者のキャンベルや、マラリアの薬を発見した屠呦呦とともに、2015年にノーベル生理学・医学賞を受賞した。", source:"legacy", sourceId:"N13" },
  { id:"N14-01", personId:"N14", title:"この人の歩み", tags:["科学"],
    body:"梶田隆章は、小柴昌俊の後を継ぐようにして、岐阜県神岡町の地下1000メートルに建設された観測装置「スーパーカミオカンデ」を用い、宇宙から降り注ぐ素粒子ニュートリノを観測する研究を続けた。ニュートリノには電子・ミュー・タウという3つの種類があるが、大気中で発生したニュートリノを観測するうち、地球の裏側から届くはずの数が予想より少ないことに気づき、飛んでいる間に別の種類へと姿を変える「ニュートリノ振動」という現象を1998年に発見した。この現象は、それまで質量がないと考えられていたニュートリノにわずかながら質量があることを示す決定的な証拠となり、素粒子物理学の教科書を書き換える発見として世界に衝撃を与えた。梶田は学生時代、指導教員に誘われるまま何気なく研究室に入ったことがこの分野に進むきっかけになったと語っており、地道な観測データの積み重ねが大発見につながった好例として、カナダのマクドナルドとともに2015年にノーベル物理学賞を受賞した。",
    bodyHtml:"梶田隆章は、小柴昌俊の後を継ぐようにして、岐阜県神岡町の地下1000メートルに建設された観測装置「スーパーカミオカンデ」を用い、宇宙から降り注ぐ素粒子ニュートリノを観測する研究を続けた。ニュートリノには電子・ミュー・タウという3つの種類があるが、大気中で発生したニュートリノを観測するうち、地球の裏側から届くはずの数が予想より少ないことに気づき、飛んでいる間に別の種類へと姿を変える「ニュートリノ振動」という現象を1998年に発見した。この現象は、それまで質量がないと考えられていたニュートリノにわずかながら質量があることを示す決定的な証拠となり、素粒子物理学の教科書を書き換える発見として世界に衝撃を与えた。梶田は学生時代、指導教員に誘われるまま何気なく研究室に入ったことがこの分野に進むきっかけになったと語っており、地道な観測データの積み重ねが大発見につながった好例として、カナダのマクドナルドとともに2015年にノーベル物理学賞を受賞した。", source:"legacy", sourceId:"N14" },
  { id:"N15-01", personId:"N15", title:"この人の歩み", tags:["医学"],
    body:"本庶佑は、免疫の働きを担うT細胞の表面にある「PD-1」というタンパク質を1992年に発見した。当初はその役割がよく分からなかったが、研究を続けるうちに、PD-1が免疫にブレーキをかける仕組みを持つことを突き止めた。がん細胞はこのブレーキの仕組みを悪用して免疫の攻撃から逃れていることが分かり、本庶はこのブレーキを外す薬を開発すれば、体本来の免疫力でがんを攻撃できるはずだと考えた。本庶はPD-1の発見以前にも、抗体の多様性を生み出す仕組みの解明で世界的な業績を残した免疫学の第一人者だった。この発想をもとに開発された薬「オプジーボ」は2014年に日本でまず承認され、これまで治療が難しかったがんの患者を数多く救い、がん治療の考え方に大きな転換をもたらした。本庶は「基礎研究の中にこそ大きな価値がある」と繰り返し語り、この功績により、同様のしくみを研究したアメリカのアリソンとともに、2018年にノーベル生理学・医学賞を受賞した。",
    bodyHtml:"本庶佑は、免疫の働きを担うT細胞の表面にある「PD-1」というタンパク質を1992年に発見した。当初はその役割がよく分からなかったが、研究を続けるうちに、PD-1が免疫にブレーキをかける仕組みを持つことを突き止めた。がん細胞はこのブレーキの仕組みを悪用して免疫の攻撃から逃れていることが分かり、本庶はこのブレーキを外す薬を開発すれば、体本来の免疫力でがんを攻撃できるはずだと考えた。本庶はPD-1の発見以前にも、抗体の多様性を生み出す仕組みの解明で世界的な業績を残した免疫学の第一人者だった。この発想をもとに開発された薬「オプジーボ」は2014年に日本でまず承認され、これまで治療が難しかったがんの患者を数多く救い、がん治療の考え方に大きな転換をもたらした。本庶は「基礎研究の中にこそ大きな価値がある」と繰り返し語り、この功績により、同様のしくみを研究したアメリカのアリソンとともに、2018年にノーベル生理学・医学賞を受賞した。", source:"legacy", sourceId:"N15" },
  { id:"N16-01", personId:"N16", title:"この人の歩み", tags:["科学"],
    body:"旭化成の研究者だった吉野彰は、繰り返し充電しても劣化しにくく、軽くて大きなエネルギーを蓄えられる電池の開発を目指した。グッドイナフが見つけていた正極の材料と、炭素材料を使った新しい負極を組み合わせるという発想により、1985年に「リチウムイオン電池」の基本構造を完成させた。金属のリチウムをそのまま使うと発火の危険があったため、安全性を高めるために炭素材料を負極に使うという工夫を重ね、実用に耐える電池を作り上げた。この電池は1991年に実用化されると、スマートフォンやノートパソコンをはじめ、現在では電気自動車まで、私たちの暮らしを支える電源として世界中で使われるようになった。吉野は子どもの頃に読んだファラデーの伝記に触発されて化学の道を志したといい、長らく注目されにくい地道な研究であったが社会を大きく変えるほどの発明となり、この功績により、グッドイナフ、ウィッティンガムとともに2019年にノーベル化学賞を受賞した。",
    bodyHtml:"旭化成の研究者だった吉野彰は、繰り返し充電しても劣化しにくく、軽くて大きなエネルギーを蓄えられる電池の開発を目指した。グッドイナフが見つけていた正極の材料と、炭素材料を使った新しい負極を組み合わせるという発想により、1985年に「リチウムイオン電池」の基本構造を完成させた。金属のリチウムをそのまま使うと発火の危険があったため、安全性を高めるために炭素材料を負極に使うという工夫を重ね、実用に耐える電池を作り上げた。この電池は1991年に実用化されると、スマートフォンやノートパソコンをはじめ、現在では電気自動車まで、私たちの暮らしを支える電源として世界中で使われるようになった。吉野は子どもの頃に読んだファラデーの伝記に触発されて化学の道を志したといい、長らく注目されにくい地道な研究であったが社会を大きく変えるほどの発明となり、この功績により、グッドイナフ、ウィッティンガムとともに2019年にノーベル化学賞を受賞した。", source:"legacy", sourceId:"N16" },
  { id:"N17-01", personId:"N17", title:"この人の歩み", tags:["科学"],
    body:"真鍋淑郎は、地球の大気を数式で表しコンピューターの中に再現する「気候モデル」の開発に、その黎明期から取り組んだ先駆者である。1967年、共同研究者のウェザラルドとともに、大気中の二酸化炭素の量が2倍に増えると地表の気温がおよそ2度上昇するという計算結果を、世界で初めて数値モデルによって示した論文を発表した。当時のコンピューターの性能は今とは比べ物にならないほど限られていたが、大気と地面の熱のやり取りを丁寧に単純化することで、この画期的な予測を可能にした。真鍋はノーベル賞受賞後の記者会見で「日本では人の気持ちを察しながら生きていかなければならないが、それが苦手だった」とユーモラスに語り、渡米して自由に研究に打ち込めたことが大きな成果につながったと振り返った。この研究は、その後の地球温暖化研究の土台となり、この功績により、気候モデルの発展に貢献したハッセルマン、複雑系の研究をしたパリージとともに2021年にノーベル物理学賞を受賞した。",
    bodyHtml:"真鍋淑郎は、地球の大気を数式で表しコンピューターの中に再現する「気候モデル」の開発に、その黎明期から取り組んだ先駆者である。1967年、共同研究者のウェザラルドとともに、大気中の二酸化炭素の量が2倍に増えると地表の気温がおよそ2度上昇するという計算結果を、世界で初めて数値モデルによって示した論文を発表した。当時のコンピューターの性能は今とは比べ物にならないほど限られていたが、大気と地面の熱のやり取りを丁寧に単純化することで、この画期的な予測を可能にした。真鍋はノーベル賞受賞後の記者会見で「日本では人の気持ちを察しながら生きていかなければならないが、それが苦手だった」とユーモラスに語り、渡米して自由に研究に打ち込めたことが大きな成果につながったと振り返った。この研究は、その後の地球温暖化研究の土台となり、この功績により、気候モデルの発展に貢献したハッセルマン、複雑系の研究をしたパリージとともに2021年にノーベル物理学賞を受賞した。", source:"legacy", sourceId:"N17" },
  { id:"N18-01", personId:"N18", title:"この人の歩み", tags:["科学"],
    body:"下村脩は、発光するオワンクラゲの仕組みを解明するため、アメリカのワシントン州フライデーハーバーで、来る日も来る日もクラゲを採り続けた。研究生活の中で集めたクラゲの数は、生涯であわせて85万匹にも及んだと言われている。その地道な作業の末、クラゲの発光にかかわる「イクオリン」というタンパク質とともに、紫外線を当てると緑色に光る「緑色蛍光タンパク質(GFP)」を発見した。当初は単なる発光の仕組みの解明にすぎなかったが、後にこのGFPを目印として細胞や遺伝子の働きを光らせて観察する技術が確立され、生命科学の研究のあり方を一変させた。下村は10代の頃、長崎で軍需工場に動員されていた際に原爆を経験し、爆風で目にけがを負いながらも奇跡的に助かったという壮絶な体験を持つ。GFPは現在、がん細胞の研究など世界中の生命科学研究になくてはならない道具として使われ続けており、この功績により、チャルフィー、チェンとともに2008年にノーベル化学賞を受賞した。",
    bodyHtml:"下村脩は、発光するオワンクラゲの仕組みを解明するため、アメリカのワシントン州フライデーハーバーで、来る日も来る日もクラゲを採り続けた。研究生活の中で集めたクラゲの数は、生涯であわせて85万匹にも及んだと言われている。その地道な作業の末、クラゲの発光にかかわる「イクオリン」というタンパク質とともに、紫外線を当てると緑色に光る「緑色蛍光タンパク質(GFP)」を発見した。当初は単なる発光の仕組みの解明にすぎなかったが、後にこのGFPを目印として細胞や遺伝子の働きを光らせて観察する技術が確立され、生命科学の研究のあり方を一変させた。下村は10代の頃、長崎で軍需工場に動員されていた際に原爆を経験し、爆風で目にけがを負いながらも奇跡的に助かったという壮絶な体験を持つ。GFPは現在、がん細胞の研究など世界中の生命科学研究になくてはならない道具として使われ続けており、この功績により、チャルフィー、チェンとともに2008年にノーベル化学賞を受賞した。", source:"legacy", sourceId:"N18" },
  { id:"N19-01", personId:"N19", title:"この人の歩み", tags:["科学"],
    body:"栃木県出身の田中正造は、衆議院議員として、足尾銅山から流れ出た鉱毒によって渡良瀬川流域の農地や住民が深刻な被害を受けている問題に取り組んだ。政府や企業になかなか動きが見られないことにいらだち、1901年、すでに60歳を超えていた田中は議員を辞職し、明治天皇の馬車に直接訴え出るという命がけの行動(直訴)に出た。この行動は直接には受理されなかったものの、鉱毒問題を広く世間に知らしめることとなった。晩年は被害民が暮らしていた谷中村(現在の渡良瀬遊水地)にとどまり、強制的な廃村措置に最後まで抵抗しながら、生涯を公害問題の解決と被害者の救済にささげ続けた。田中は私財をなげうって被害者の救済にあたったため、1913年に亡くなったときの持ち物は聖書や日記帳、鉱毒問題の資料など、風呂敷一つに包める程度のわずかなものしかなかったと伝えられている。その私利私欲のない生き方は、日本における公害問題や環境運動の原点として今なお語り継がれている。",
    bodyHtml:"栃木県出身の田中正造は、衆議院議員として、足尾銅山から流れ出た鉱毒によって渡良瀬川流域の農地や住民が深刻な被害を受けている問題に取り組んだ。政府や企業になかなか動きが見られないことにいらだち、1901年、すでに60歳を超えていた田中は議員を辞職し、明治天皇の馬車に直接訴え出るという命がけの行動(直訴)に出た。この行動は直接には受理されなかったものの、鉱毒問題を広く世間に知らしめることとなった。晩年は被害民が暮らしていた谷中村(現在の渡良瀬遊水地)にとどまり、強制的な廃村措置に最後まで抵抗しながら、生涯を公害問題の解決と被害者の救済にささげ続けた。田中は私財をなげうって被害者の救済にあたったため、1913年に亡くなったときの持ち物は聖書や日記帳、鉱毒問題の資料など、風呂敷一つに包める程度のわずかなものしかなかったと伝えられている。その私利私欲のない生き方は、日本における公害問題や環境運動の原点として今なお語り継がれている。", source:"legacy", sourceId:"N19" },
  { id:"N20-01", personId:"N20", title:"この人の歩み", tags:["医学"],
    body:"杉田玄白は、江戸小塚原の刑場で行われた腑分け(人体解剖)に立ち会い、持参していたオランダの解剖学書「ターヘル・アナトミア」の図の正確さに衝撃を受けた。そこで前野良沢らわずかな仲間とともに、オランダ語の辞書もほとんどない状態から、一日に一語も進まないような苦労を重ねながら翻訳作業に取り組み、3年半かけて1774年に「解体新書」を完成させた。特に、鼻筋の盛り上がりを意味するオランダ語をどう訳すか一晩中議論を重ね、ようやく「うずたかし」という訳語にたどり着いたという逸話も残っている。この本の刊行は、日本人が本格的に西洋の学問を学ぶ「蘭学」が花開くきっかけとなり、その後の日本の医学や科学の発展に大きな影響を与えた。杉田玄白は本の完成後もおごることなく学問に励み、多くの後進を育てる医師としても活躍した。晩年に書いた回想録「蘭学事始」には、辞書もない中で翻訳に苦闘した若き日々の様子が生き生きと記されており、後世の蘭学者たちに勇気を与える書物となった。",
    bodyHtml:"杉田玄白は、江戸小塚原の刑場で行われた腑分け(人体解剖)に立ち会い、持参していたオランダの解剖学書「ターヘル・アナトミア」の図の正確さに衝撃を受けた。そこで前野良沢らわずかな仲間とともに、オランダ語の辞書もほとんどない状態から、一日に一語も進まないような苦労を重ねながら翻訳作業に取り組み、3年半かけて1774年に「解体新書」を完成させた。特に、鼻筋の盛り上がりを意味するオランダ語をどう訳すか一晩中議論を重ね、ようやく「うずたかし」という訳語にたどり着いたという逸話も残っている。この本の刊行は、日本人が本格的に西洋の学問を学ぶ「蘭学」が花開くきっかけとなり、その後の日本の医学や科学の発展に大きな影響を与えた。杉田玄白は本の完成後もおごることなく学問に励み、多くの後進を育てる医師としても活躍した。晩年に書いた回想録「蘭学事始」には、辞書もない中で翻訳に苦闘した若き日々の様子が生き生きと記されており、後世の蘭学者たちに勇気を与える書物となった。", source:"legacy", sourceId:"N20" },
  { id:"N21-01", personId:"N21", title:"この人の歩み", tags:["ビジネス"],
    body:"本多利明は、江戸時代に活躍した経済学者であり、海に囲まれた日本の地理的条件を最大限に生かすべきだと説いた先駆的な思想家だった。当時の幕府は鎖国政策をとり、限られた国とだけ交易を行っていたが、本多は「経世秘策」などの著作の中で、船を用いた海外との積極的な交易や、蝦夷地(現在の北海道)をはじめとする国内資源の開発を進めることで、国を豊かにするべきだと主張した。本多はまた、数学や暦学、蘭学(オランダ経由の西洋の学問)にも通じており、諸国を旅してまわりながら実地に経済や地理の知識を蓄えた実践的な学者でもあった。著書「西域物語」では、当時ロシアが勢力を広げつつあった北方の情勢にも触れながら、日本が国際社会の中で生き残るために取るべき方策を論じ、日本もいずれ広く世界と交わっていく必要があると説いた。鎖国が当然とされていた時代に、国の未来を見据えて経済のあり方を説いたその先見性は、後の時代になって高く評価されるようになった。",
    bodyHtml:"本多利明は、江戸時代に活躍した経済学者であり、海に囲まれた日本の地理的条件を最大限に生かすべきだと説いた先駆的な思想家だった。当時の幕府は鎖国政策をとり、限られた国とだけ交易を行っていたが、本多は「経世秘策」などの著作の中で、船を用いた海外との積極的な交易や、蝦夷地(現在の北海道)をはじめとする国内資源の開発を進めることで、国を豊かにするべきだと主張した。本多はまた、数学や暦学、蘭学(オランダ経由の西洋の学問)にも通じており、諸国を旅してまわりながら実地に経済や地理の知識を蓄えた実践的な学者でもあった。著書「西域物語」では、当時ロシアが勢力を広げつつあった北方の情勢にも触れながら、日本が国際社会の中で生き残るために取るべき方策を論じ、日本もいずれ広く世界と交わっていく必要があると説いた。鎖国が当然とされていた時代に、国の未来を見据えて経済のあり方を説いたその先見性は、後の時代になって高く評価されるようになった。", source:"legacy", sourceId:"N21" },
  { id:"N22-01", personId:"N22", title:"この人の歩み", tags:["政治"],
    body:"熊本藩(肥後熊本藩)出身の横井小楠は、儒学を学びながらも、身分の上下にとらわれず民の暮らしを第一に考える現実的な政治のあり方を説いた思想家だった。その才覚を見込まれて福井藩に招かれ、藩主・松平春嶽の補佐役として藩政改革を指導し、殖産興業や人材登用など、藩を立て直すための具体的な施策を次々と打ち出した。また、東洋の道徳と西洋の優れた技術や制度を組み合わせるべきだという考えのもと、開国と近代化の必要性をいち早く主張し、幕末の志士たちにも大きな影響を与えた。横井の「東洋の道徳、西洋の芸術(技術)」という考え方は、坂本龍馬をはじめとする多くの志士たちに影響を与えたとされる。福井藩では、藩の財政再建だけでなく、身分を問わず能力のある人材を積極的に登用する制度づくりにも取り組んだ。しかし、その急進的な考えは保守派から反発を招き、明治維新後の1869年、京都で反対派によって暗殺されるという悲劇的な最期を遂げた。",
    bodyHtml:"熊本藩(肥後熊本藩)出身の横井小楠は、儒学を学びながらも、身分の上下にとらわれず民の暮らしを第一に考える現実的な政治のあり方を説いた思想家だった。その才覚を見込まれて福井藩に招かれ、藩主・松平春嶽の補佐役として藩政改革を指導し、殖産興業や人材登用など、藩を立て直すための具体的な施策を次々と打ち出した。また、東洋の道徳と西洋の優れた技術や制度を組み合わせるべきだという考えのもと、開国と近代化の必要性をいち早く主張し、幕末の志士たちにも大きな影響を与えた。横井の「東洋の道徳、西洋の芸術(技術)」という考え方は、坂本龍馬をはじめとする多くの志士たちに影響を与えたとされる。福井藩では、藩の財政再建だけでなく、身分を問わず能力のある人材を積極的に登用する制度づくりにも取り組んだ。しかし、その急進的な考えは保守派から反発を招き、明治維新後の1869年、京都で反対派によって暗殺されるという悲劇的な最期を遂げた。", source:"legacy", sourceId:"N22" },
  { id:"N23-01", personId:"N23", title:"この人の歩み", tags:["政治"],
    body:"薩摩藩出身の森有礼は、若くしてイギリスやアメリカに留学し、西洋の進んだ教育制度や社会のあり方を学んだ。帰国後は岩倉使節団にも加わって欧米諸国を視察し、日本に近代的な教育制度を根付かせることに情熱を注いだ。初代文部大臣に就任すると、小学校から師範学校、帝国大学に至るまでの学校制度を整備し、日本の近代教育の骨組みを築き上げた。森はまた実業教育の重要性も説き、彼が設立に関わった商業講習所は、後に一橋大学へと発展していった。体育や規律を重んじる新しい教育方針を各地の学校に取り入れさせるなど、その改革は教育のあらゆる分野に及んだが、伝統的な価値観を重んじる人々との間に摩擦を生むこともあった。あまりに急進的だとして反発を招くこともあり、1889年2月11日、大日本帝国憲法が発布されたまさにその日、伊勢神宮への態度をめぐる誤解から国粋主義者に襲われ、42歳という若さでこの世を去った。",
    bodyHtml:"薩摩藩出身の森有礼は、若くしてイギリスやアメリカに留学し、西洋の進んだ教育制度や社会のあり方を学んだ。帰国後は岩倉使節団にも加わって欧米諸国を視察し、日本に近代的な教育制度を根付かせることに情熱を注いだ。初代文部大臣に就任すると、小学校から師範学校、帝国大学に至るまでの学校制度を整備し、日本の近代教育の骨組みを築き上げた。森はまた実業教育の重要性も説き、彼が設立に関わった商業講習所は、後に一橋大学へと発展していった。体育や規律を重んじる新しい教育方針を各地の学校に取り入れさせるなど、その改革は教育のあらゆる分野に及んだが、伝統的な価値観を重んじる人々との間に摩擦を生むこともあった。あまりに急進的だとして反発を招くこともあり、1889年2月11日、大日本帝国憲法が発布されたまさにその日、伊勢神宮への態度をめぐる誤解から国粋主義者に襲われ、42歳という若さでこの世を去った。", source:"legacy", sourceId:"N23" },
  { id:"N24-01", personId:"N24", title:"この人の歩み", tags:["政治"],
    body:"大坂町奉行所の元与力だった大塩平八郎は、陽明学を学び「知行合一」の教えを実践することを重んじた学者でもあった。天保の大飢饉で多くの庶民が飢えに苦しむ中、奉行所の役人たちが有効な対策をとらず、大坂の米を江戸へ回送しようとする様子に強い怒りを覚えた。私財を投げうって蔵書を売り払い、そのお金で困窮する人々に米や金を配ったが、それでも状況が改善しないと見るや、1837年、門弟や近隣の農民らとともに武装蜂起を決意した(大塩平八郎の乱)。この反乱は半日ほどで鎮圧されてしまったが、元役人が幕府に対して公然と反旗を翻したという事実は幕府に大きな衝撃を与えた。その影響は大坂だけにとどまらず、遠く離れた越後国(現在の新潟県)でも大塩の思想に共鳴した生田万が同じように蜂起を起こすなど、全国各地の民衆に大きな影響を与えた。大塩自身は約40日後に潜伏先で追い詰められ、自ら命を絶った。",
    bodyHtml:"大坂町奉行所の元与力だった大塩平八郎は、陽明学を学び「知行合一」の教えを実践することを重んじた学者でもあった。天保の大飢饉で多くの庶民が飢えに苦しむ中、奉行所の役人たちが有効な対策をとらず、大坂の米を江戸へ回送しようとする様子に強い怒りを覚えた。私財を投げうって蔵書を売り払い、そのお金で困窮する人々に米や金を配ったが、それでも状況が改善しないと見るや、1837年、門弟や近隣の農民らとともに武装蜂起を決意した(大塩平八郎の乱)。この反乱は半日ほどで鎮圧されてしまったが、元役人が幕府に対して公然と反旗を翻したという事実は幕府に大きな衝撃を与えた。その影響は大坂だけにとどまらず、遠く離れた越後国(現在の新潟県)でも大塩の思想に共鳴した生田万が同じように蜂起を起こすなど、全国各地の民衆に大きな影響を与えた。大塩自身は約40日後に潜伏先で追い詰められ、自ら命を絶った。", source:"legacy", sourceId:"N24" },
  { id:"N25-01", personId:"N25", title:"この人の歩み", tags:["文学"],
    body:"大坂の商人の家に生まれた井原西鶴は、若い頃から俳諧師として活動し、一昼夜にひたすら句を詠み続ける「矢数俳諧」という一種の記録挑戦で驚異的な数の句を詠んだことでも知られる。40歳を過ぎてから小説の執筆に転じ、1682年に発表した「好色一代男」で、庶民の恋愛模様を生き生きと描き出す「浮世草子」という新しい文学ジャンルを確立した。その後も「日本永代蔵」や「世間胸算用」などの作品で、お金をめぐる町人たちの知恵や欲望をありのままに描き出し、それまでの武士や貴族を中心とした文学とは異なる、庶民の視点に立った物語を数多く生み出した。生涯に20作品ほどの浮世草子を次々と発表し、恋愛を描く「好色物」だけでなく「町人物」「武家物」など幅広いジャンルを手がけ、52歳でこの世を去るまで精力的に筆を執り続けた西鶴の作品群は、江戸時代の町人文化が花開くきっかけの一つとなった。",
    bodyHtml:"大坂の商人の家に生まれた井原西鶴は、若い頃から俳諧師として活動し、一昼夜にひたすら句を詠み続ける「矢数俳諧」という一種の記録挑戦で驚異的な数の句を詠んだことでも知られる。40歳を過ぎてから小説の執筆に転じ、1682年に発表した「好色一代男」で、庶民の恋愛模様を生き生きと描き出す「浮世草子」という新しい文学ジャンルを確立した。その後も「日本永代蔵」や「世間胸算用」などの作品で、お金をめぐる町人たちの知恵や欲望をありのままに描き出し、それまでの武士や貴族を中心とした文学とは異なる、庶民の視点に立った物語を数多く生み出した。生涯に20作品ほどの浮世草子を次々と発表し、恋愛を描く「好色物」だけでなく「町人物」「武家物」など幅広いジャンルを手がけ、52歳でこの世を去るまで精力的に筆を執り続けた西鶴の作品群は、江戸時代の町人文化が花開くきっかけの一つとなった。", source:"legacy", sourceId:"N25" },
  { id:"N26-01", personId:"N26", title:"この人の歩み", tags:["文学"],
    body:"近松門左衛門は、人形浄瑠璃や歌舞伎のために生涯で百数十もの脚本を書き上げた江戸時代を代表する劇作家である。1703年、大坂で実際に起きた男女の心中事件をもとに書き上げた「曽根崎心中」は大評判となり、当時の庶民の暮らしをそのまま描く「世話物」という新しいジャンルを確立するきっかけとなった。義理と人情の板挟みになりながら悲劇的な結末へと向かう登場人物たちの心の動きを繊細に描き出し、観客の心を強くとらえた。芸術とは事実そのものでもなく、まったくの作り話でもなく、その微妙な境目にこそ真実の感動があるという「虚実皮膜」の考え方を残したことでも知られる。中国明朝の再興を目指す英雄を描いた時代物「国性爺合戦」も手がけ、大坂の竹本座でおよそ17か月にもわたる異例のロングラン上演を記録するなど庶民から絶大な人気を得て、日本の演劇史に大きな足跡を刻んだ。",
    bodyHtml:"近松門左衛門は、人形浄瑠璃や歌舞伎のために生涯で百数十もの脚本を書き上げた江戸時代を代表する劇作家である。1703年、大坂で実際に起きた男女の心中事件をもとに書き上げた「曽根崎心中」は大評判となり、当時の庶民の暮らしをそのまま描く「世話物」という新しいジャンルを確立するきっかけとなった。義理と人情の板挟みになりながら悲劇的な結末へと向かう登場人物たちの心の動きを繊細に描き出し、観客の心を強くとらえた。芸術とは事実そのものでもなく、まったくの作り話でもなく、その微妙な境目にこそ真実の感動があるという「虚実皮膜」の考え方を残したことでも知られる。中国明朝の再興を目指す英雄を描いた時代物「国性爺合戦」も手がけ、大坂の竹本座でおよそ17か月にもわたる異例のロングラン上演を記録するなど庶民から絶大な人気を得て、日本の演劇史に大きな足跡を刻んだ。", source:"legacy", sourceId:"N26" },
  { id:"N27-01", personId:"N27", title:"この人の歩み", tags:["文学"],
    body:"江戸中期に活躍した与謝蕪村は、俳人であると同時に「南画」と呼ばれる文人画の分野でも高く評価される画家でもあった。絵を描く目で情景を切り取るように、色彩豊かで絵画的な句を数多く残し、俳句と絵を一枚の紙にともに描く「俳画」という表現方法を大成させたことでも知られる。「菜の花や 月は東に 日は西に」という句は、なたね畑の向こうに広がる夕暮れの空を鮮やかに思い浮かべさせる代表作である。若い頃は関東や東北地方を放浪しながら絵と俳諧の修行を重ね、後に京都に定住して「夜半亭」という俳諧の一門を率いた。画業では中国の南画にならった独自の画風を確立し、俳句と絵を組み合わせた俳画の傑作を数多く残している。当時衰えかけていた松尾芭蕉の俳諧の精神を復興させようと努めたことから「中興の祖」とも呼ばれ、芭蕉と並び称される江戸時代を代表する俳人として、後の世に大きな影響を残した。",
    bodyHtml:"江戸中期に活躍した与謝蕪村は、俳人であると同時に「南画」と呼ばれる文人画の分野でも高く評価される画家でもあった。絵を描く目で情景を切り取るように、色彩豊かで絵画的な句を数多く残し、俳句と絵を一枚の紙にともに描く「俳画」という表現方法を大成させたことでも知られる。「菜の花や 月は東に 日は西に」という句は、なたね畑の向こうに広がる夕暮れの空を鮮やかに思い浮かべさせる代表作である。若い頃は関東や東北地方を放浪しながら絵と俳諧の修行を重ね、後に京都に定住して「夜半亭」という俳諧の一門を率いた。画業では中国の南画にならった独自の画風を確立し、俳句と絵を組み合わせた俳画の傑作を数多く残している。当時衰えかけていた松尾芭蕉の俳諧の精神を復興させようと努めたことから「中興の祖」とも呼ばれ、芭蕉と並び称される江戸時代を代表する俳人として、後の世に大きな影響を残した。", source:"legacy", sourceId:"N27" },
  { id:"N28-01", personId:"N28", title:"この人の歩み", tags:["文学"],
    body:"信濃国(現在の長野県)の農家に生まれた小林一茶は、3歳で母を亡くし、その後迎えた継母とはうまくいかず、つらい少年時代を過ごした。江戸に出て俳諧を学んだのちも、長い間各地を放浪する不安定な生活を送り、家庭にも恵まれず、幼い我が子を次々と病気で亡くすなど、生涯を通じて苦労の絶えない人生だった。父の死後は継母や異母弟との間で遺産をめぐる長い争いが続き、故郷に戻れたのは50歳を過ぎてからのことだった。ようやく結婚して落ち着いた生活を築こうとした矢先に大火事で家を失うなど最後まで苦難が続いたが、それでも、か弱く小さな生き物たちへのあたたかいまなざしを失わず、「やせ蛙 まけるな一茶 これにあり」「雀の子 そこのけそこのけ お馬が通る」など、素朴でユーモアと哀愁の漂う句を生涯に2万を超えるほど詠み続けた。晩年の随筆「おらが春」には、亡くした娘への深い愛情もつづられている。",
    bodyHtml:"信濃国(現在の長野県)の農家に生まれた小林一茶は、3歳で母を亡くし、その後迎えた継母とはうまくいかず、つらい少年時代を過ごした。江戸に出て俳諧を学んだのちも、長い間各地を放浪する不安定な生活を送り、家庭にも恵まれず、幼い我が子を次々と病気で亡くすなど、生涯を通じて苦労の絶えない人生だった。父の死後は継母や異母弟との間で遺産をめぐる長い争いが続き、故郷に戻れたのは50歳を過ぎてからのことだった。ようやく結婚して落ち着いた生活を築こうとした矢先に大火事で家を失うなど最後まで苦難が続いたが、それでも、か弱く小さな生き物たちへのあたたかいまなざしを失わず、「やせ蛙 まけるな一茶 これにあり」「雀の子 そこのけそこのけ お馬が通る」など、素朴でユーモアと哀愁の漂う句を生涯に2万を超えるほど詠み続けた。晩年の随筆「おらが春」には、亡くした娘への深い愛情もつづられている。", source:"legacy", sourceId:"N28" },
  { id:"N29-01", personId:"N29", title:"この人の歩み", tags:["芸術"],
    body:"葛飾応為は、江戸時代後期の浮世絵師・葛飾北斎の娘として生まれ、本名を「お栄」といった。幼い頃から絵師である父の工房を手伝いながら絵の腕を磨き、北斎自身が「美人画にかけては応為には及ばない」と語ったと伝えられるほどの実力を持っていたとされる。特に得意としたのは光と影の対比を巧みに使った表現で、代表作「吉原格子先之図」では、夜の遊郭にともるあかりの明暗が印象的に描かれている。北斎が晩年に描いたとされる作品の中には、実は応為が手を貸したのではないかと考えられているものも少なくなく、二人は晩年まで同じ家で暮らしながら共に絵筆を握り続けたと伝えられる。当時は女性が画家として表舞台に立つことが難しい時代であり、応為に関する記録はあまり多く残されていないが、近年になって漫画などを通じてその名が広く知られるようになり、卓越した画力が見直されて国内外の美術展でも取り上げられるなど再評価が進んでいる。",
    bodyHtml:"葛飾応為は、江戸時代後期の浮世絵師・葛飾北斎の娘として生まれ、本名を「お栄」といった。幼い頃から絵師である父の工房を手伝いながら絵の腕を磨き、北斎自身が「美人画にかけては応為には及ばない」と語ったと伝えられるほどの実力を持っていたとされる。特に得意としたのは光と影の対比を巧みに使った表現で、代表作「吉原格子先之図」では、夜の遊郭にともるあかりの明暗が印象的に描かれている。北斎が晩年に描いたとされる作品の中には、実は応為が手を貸したのではないかと考えられているものも少なくなく、二人は晩年まで同じ家で暮らしながら共に絵筆を握り続けたと伝えられる。当時は女性が画家として表舞台に立つことが難しい時代であり、応為に関する記録はあまり多く残されていないが、近年になって漫画などを通じてその名が広く知られるようになり、卓越した画力が見直されて国内外の美術展でも取り上げられるなど再評価が進んでいる。", source:"legacy", sourceId:"N29" },
  { id:"N30-01", personId:"N30", title:"この人の歩み", tags:["冒険"],
    body:"常陸国(現在の茨城県)の農家に生まれた間宮林蔵は、幕府に登用されて蝦夷地(北海道)の測量に携わったのち、樺太(サハリン)が島なのか、それとも大陸とひと続きの土地なのかを確かめる探検を命じられた。1808年から翌年にかけて、厳しい寒さと自然の中を進み、樺太を一周する形で調査を行った結果、樺太が島であり、大陸との間に狭い海峡が存在することを確認した。探検にあたっては、日本地図の作成で知られる伊能忠敬から測量の技術を学んでおり、極寒の地での探検により幾度も凍傷に苦しめられながらも調査をやり遂げた、その正確な観測記録は高く評価された。この功績を称え、後にこの海峡は彼の名にちなんで「間宮海峡」と名付けられ、来日したドイツ人医師シーボルトを通じて当時のヨーロッパの地図にもその名が記されるようになった。晩年は幕府の隠密として活動したことでも知られ、探検家でありながら謎の多い人物としても語り継がれている。",
    bodyHtml:"常陸国(現在の茨城県)の農家に生まれた間宮林蔵は、幕府に登用されて蝦夷地(北海道)の測量に携わったのち、樺太(サハリン)が島なのか、それとも大陸とひと続きの土地なのかを確かめる探検を命じられた。1808年から翌年にかけて、厳しい寒さと自然の中を進み、樺太を一周する形で調査を行った結果、樺太が島であり、大陸との間に狭い海峡が存在することを確認した。探検にあたっては、日本地図の作成で知られる伊能忠敬から測量の技術を学んでおり、極寒の地での探検により幾度も凍傷に苦しめられながらも調査をやり遂げた、その正確な観測記録は高く評価された。この功績を称え、後にこの海峡は彼の名にちなんで「間宮海峡」と名付けられ、来日したドイツ人医師シーボルトを通じて当時のヨーロッパの地図にもその名が記されるようになった。晩年は幕府の隠密として活動したことでも知られ、探検家でありながら謎の多い人物としても語り継がれている。", source:"legacy", sourceId:"N30" },
  { id:"N31-01", personId:"N31", title:"この人の歩み", tags:["政治"],
    body:"長州藩士だった高杉晋作は、藩の危機に際し、武士だけでなく農民や町人からも志願者を集めて共に戦う「奇兵隊」を1863年に結成した。身分の上下にこだわらないこの部隊は、旧来の武士だけの軍とは異なる強さを発揮し、幕府による長州征討(四境戦争)などで大きな戦果をあげ、倒幕への流れを大きく動かす原動力となった。高杉は吉田松陰の松下村塾で学んだ門下生の一人であり、1862年には幕府の使節に随行して上海を訪れ、清国が欧米列強に半ば植民地化されている惨状を目の当たりにして強い危機感を抱いたという。奇抜な発想と大胆な行動力で知られ、時には藩論を覆すような決断を単独で下すこともあったという。しかし志半ばで結核を患い、「おもしろき こともなき世を おもしろく」という辞世の句を残して、明治維新をわずか一年後に控えた1867年、27歳という若さでこの世を去った。",
    bodyHtml:"長州藩士だった高杉晋作は、藩の危機に際し、武士だけでなく農民や町人からも志願者を集めて共に戦う「奇兵隊」を1863年に結成した。身分の上下にこだわらないこの部隊は、旧来の武士だけの軍とは異なる強さを発揮し、幕府による長州征討(四境戦争)などで大きな戦果をあげ、倒幕への流れを大きく動かす原動力となった。高杉は吉田松陰の松下村塾で学んだ門下生の一人であり、1862年には幕府の使節に随行して上海を訪れ、清国が欧米列強に半ば植民地化されている惨状を目の当たりにして強い危機感を抱いたという。奇抜な発想と大胆な行動力で知られ、時には藩論を覆すような決断を単独で下すこともあったという。しかし志半ばで結核を患い、「おもしろき こともなき世を おもしろく」という辞世の句を残して、明治維新をわずか一年後に控えた1867年、27歳という若さでこの世を去った。", source:"legacy", sourceId:"N31" },
  { id:"N32-01", personId:"N32", title:"この人の歩み", tags:["政治"],
    body:"長州藩出身の木戸孝允は、若い頃は桂小五郎と名乗り、幕末の動乱の中で新選組などに追われながらも巧みに身を隠し続けたことから「逃げの小五郎」と呼ばれた。しかし単に逃げ隠れていたわけではなく、坂本龍馬の仲立ちによって、それまで対立していた薩摩藩との間に薩長同盟を結ぶという歴史的な決断を下し、倒幕への道を切り開いた中心人物の一人となった。明治維新後は、諸藩が治めていた土地と人民を天皇に返す版籍奉還や、藩を廃止して県を置く廃藩置県を推し進めるなど、近代国家としての日本の基礎づくりに尽力し、西郷隆盛、大久保利通と並んで「維新の三傑」の一人に数えられている。維新後には岩倉使節団の一員として欧米諸国を視察し、近代的な憲法や議会制度の必要性を痛感して、日本にも段階的に立憲政治を導入すべきだと主張した。1877年、西南戦争のさなかに病のため世を去った。",
    bodyHtml:"長州藩出身の木戸孝允は、若い頃は桂小五郎と名乗り、幕末の動乱の中で新選組などに追われながらも巧みに身を隠し続けたことから「逃げの小五郎」と呼ばれた。しかし単に逃げ隠れていたわけではなく、坂本龍馬の仲立ちによって、それまで対立していた薩摩藩との間に薩長同盟を結ぶという歴史的な決断を下し、倒幕への道を切り開いた中心人物の一人となった。明治維新後は、諸藩が治めていた土地と人民を天皇に返す版籍奉還や、藩を廃止して県を置く廃藩置県を推し進めるなど、近代国家としての日本の基礎づくりに尽力し、西郷隆盛、大久保利通と並んで「維新の三傑」の一人に数えられている。維新後には岩倉使節団の一員として欧米諸国を視察し、近代的な憲法や議会制度の必要性を痛感して、日本にも段階的に立憲政治を導入すべきだと主張した。1877年、西南戦争のさなかに病のため世を去った。", source:"legacy", sourceId:"N32" },
  { id:"N33-01", personId:"N33", title:"この人の歩み", tags:["ビジネス"],
    body:"静岡県浜松市の鍛冶屋の家に生まれた本田宗一郎は、正規の高等教育を受けることなく、独学と実地の経験だけで自動車整備や機械の技術を身につけた。戦後の混乱期、ガソリンが乏しく人々が移動に苦労していた時代に、旧陸軍の払い下げの小型エンジンを自転車に取り付けるという発想から本田技研工業の歴史が始まった。「人がやらないことをやる」という信念のもと、オートバイのレースにも次々と挑戦して技術を磨き、世界最高峰のレース「マン島TTレース」への出場と優勝という目標も実現させた。「だめだ、だめだと言う人には、だめな理由しか見えない」という言葉どおり失敗を恐れず挑戦を続けた。経営面では盟友の藤沢武夫と役割を分担し、自らは技術者としてものづくりに専念できる体制を築いたことも成功の大きな要因となり、1973年には自らの子を後継者にすることなく社長の座を後進に譲って、一代でホンダを世界的な二輪・四輪メーカーへと育て上げた。",
    bodyHtml:"静岡県浜松市の鍛冶屋の家に生まれた本田宗一郎は、正規の高等教育を受けることなく、独学と実地の経験だけで自動車整備や機械の技術を身につけた。戦後の混乱期、ガソリンが乏しく人々が移動に苦労していた時代に、旧陸軍の払い下げの小型エンジンを自転車に取り付けるという発想から本田技研工業の歴史が始まった。「人がやらないことをやる」という信念のもと、オートバイのレースにも次々と挑戦して技術を磨き、世界最高峰のレース「マン島TTレース」への出場と優勝という目標も実現させた。「だめだ、だめだと言う人には、だめな理由しか見えない」という言葉どおり失敗を恐れず挑戦を続けた。経営面では盟友の藤沢武夫と役割を分担し、自らは技術者としてものづくりに専念できる体制を築いたことも成功の大きな要因となり、1973年には自らの子を後継者にすることなく社長の座を後進に譲って、一代でホンダを世界的な二輪・四輪メーカーへと育て上げた。", source:"legacy", sourceId:"N33" },
  { id:"N34-01", personId:"N34", title:"この人の歩み", tags:["ビジネス"],
    body:"和歌山県の貧しい家に生まれた松下幸之助は、9歳で親元を離れて大阪の火鉢店などに丁稚奉公に出され、満足に学校に通うこともできないまま少年時代を過ごした。大阪電灯会社に就職して電気の知識を身につけたのち、独立して改良した電球用ソケットの製造販売を始めたことが、後の松下電器(現在のパナソニック)創業のきっかけとなった。良い品物を、まるで水道の水のように安く豊富に供給して人々の暮らしを豊かにするという「水道哲学」を掲げ、社員一人ひとりの幸せを大切にする経営理念のもとで会社を大きく成長させた。数々の経営の知恵を残したことから「経営の神様」と呼ばれた。実業家としての活動だけでなく、1946年には人々の平和と幸福を追求する「PHP研究所」を設立し、晩年の1979年には政治家や経営者を育てる「松下政経塾」を私財を投じて創設し、実業家の枠を超えて社会に貢献し続けた。",
    bodyHtml:"和歌山県の貧しい家に生まれた松下幸之助は、9歳で親元を離れて大阪の火鉢店などに丁稚奉公に出され、満足に学校に通うこともできないまま少年時代を過ごした。大阪電灯会社に就職して電気の知識を身につけたのち、独立して改良した電球用ソケットの製造販売を始めたことが、後の松下電器(現在のパナソニック)創業のきっかけとなった。良い品物を、まるで水道の水のように安く豊富に供給して人々の暮らしを豊かにするという「水道哲学」を掲げ、社員一人ひとりの幸せを大切にする経営理念のもとで会社を大きく成長させた。数々の経営の知恵を残したことから「経営の神様」と呼ばれた。実業家としての活動だけでなく、1946年には人々の平和と幸福を追求する「PHP研究所」を設立し、晩年の1979年には政治家や経営者を育てる「松下政経塾」を私財を投じて創設し、実業家の枠を超えて社会に貢献し続けた。", source:"legacy", sourceId:"N34" },
  { id:"N35-01", personId:"N35", title:"この人の歩み", tags:["医学"],
    body:"大阪に生まれた手塚治虫は、大阪大学附属医学専門部を卒業して医師免許を取得し、医学博士の学位まで持ちながら、医師としての道ではなく漫画家としての道を選んだ異色の存在だった。1952年に連載を開始した「鉄腕アトム」は、心を持つロボットが人間と共に生きる未来を描き、1963年には日本初となる30分の連続テレビアニメとしても放送されて国民的な人気を集めた。「ジャングル大帝」や「リボンの騎士」、大人向けの「ブラック・ジャック」など、生命の尊さや命の重みをテーマにした作品を数多く生み出し、漫画にストーリー性と映画的な表現を持ち込んだ「ストーリー漫画」の手法を確立した。生涯に描いた作品数は700以上、原稿の総ページ数は15万枚にものぼるといわれるほどの創作量を誇り、最期の病床でも「頼むから仕事をさせてくれ」と語ったと伝えられるほど、その圧倒的な功績から「漫画の神様」と呼ばれ、日本の漫画・アニメ文化の礎を築いた。",
    bodyHtml:"大阪に生まれた手塚治虫は、大阪大学附属医学専門部を卒業して医師免許を取得し、医学博士の学位まで持ちながら、医師としての道ではなく漫画家としての道を選んだ異色の存在だった。1952年に連載を開始した「鉄腕アトム」は、心を持つロボットが人間と共に生きる未来を描き、1963年には日本初となる30分の連続テレビアニメとしても放送されて国民的な人気を集めた。「ジャングル大帝」や「リボンの騎士」、大人向けの「ブラック・ジャック」など、生命の尊さや命の重みをテーマにした作品を数多く生み出し、漫画にストーリー性と映画的な表現を持ち込んだ「ストーリー漫画」の手法を確立した。生涯に描いた作品数は700以上、原稿の総ページ数は15万枚にものぼるといわれるほどの創作量を誇り、最期の病床でも「頼むから仕事をさせてくれ」と語ったと伝えられるほど、その圧倒的な功績から「漫画の神様」と呼ばれ、日本の漫画・アニメ文化の礎を築いた。", source:"legacy", sourceId:"N35" },
  { id:"J25-01", personId:"J25", title:"この人の歩み", tags:["政治"],
    body:"美濃(現在の岐阜県)の出身ともいわれる明智光秀は、和歌や連歌にも通じた教養人として知られ、織田信長のもとで丹波国(現在の京都府北部)の平定などの功績を重ね、近江坂本城を任される重臣の一人に上り詰めた。ところが1582年6月、中国地方へ出陣する途中、少数の供回りしか連れていなかった信長が滞在する京都の本能寺を急襲し、信長を自害に追い込む。光秀が謀反に踏み切った理由については、信長への深い恨みや天下取りの野心、朝廷や足利将軍家との関わりなど諸説あり、今もなお歴史最大の謎の一つとして研究者の間で議論が続いている。だが天下を手にしたのもつかの間、備中(現在の岡山県)から急いで引き返してきた羽柴(豊臣)秀吉に山崎の戦いで敗れ、逃走の途中で落ち武者狩りに遭い、本能寺の変からわずか十一日後に命を落とした。この短さから彼の政権は「三日天下」と呼ばれ、下剋上の世の非情さと、栄華の儚さを今に伝えている。娘・細川ガラシャの数奇な生涯も、後世によく語られる話である。",
    bodyHtml:"美濃(現在の岐阜県)の出身ともいわれる明智光秀は、和歌や連歌にも通じた教養人として知られ、織田信長のもとで丹波国(現在の京都府北部)の平定などの功績を重ね、近江坂本城を任される重臣の一人に上り詰めた。ところが1582年6月、中国地方へ出陣する途中、少数の供回りしか連れていなかった信長が滞在する京都の本能寺を急襲し、信長を自害に追い込む。光秀が謀反に踏み切った理由については、信長への深い恨みや天下取りの野心、朝廷や足利将軍家との関わりなど諸説あり、今もなお歴史最大の謎の一つとして研究者の間で議論が続いている。だが天下を手にしたのもつかの間、備中(現在の岡山県)から急いで引き返してきた羽柴(豊臣)秀吉に山崎の戦いで敗れ、逃走の途中で落ち武者狩りに遭い、本能寺の変からわずか十一日後に命を落とした。この短さから彼の政権は「三日天下」と呼ばれ、下剋上の世の非情さと、栄華の儚さを今に伝えている。娘・細川ガラシャの数奇な生涯も、後世によく語られる話である。", source:"legacy", sourceId:"J25" },
  { id:"J26-01", personId:"J26", title:"この人の歩み", tags:["政治"],
    body:"豊臣秀吉が晩年になってようやく授かった実子として生まれた秀頼は、父の死後わずか6歳で豊臣家の当主となり、大坂城の主として大切に育てられた。関ヶ原の戦いで実権を握った徳川家康は、その後も西日本を中心に慕われ続ける豊臣家を警戒し、京都・方広寺の梵鐘に刻まれた「国家安康」の文字が家康の名を分断し呪うものだと難癖をつけ、両者の対立は急速に深まっていく。1614年の大坂冬の陣では和睦が結ばれたものの、条件として大坂城の外堀・内堀を埋め立てられ、裸同然となった城は翌1615年の夏の陣で徳川方の大軍に攻め落とされ、秀頼は母・淀殿とともに自害した。享年23。これにより天下人として栄華を誇った豊臣家は滅亡し、以後260年以上におよぶ徳川による支配体制が確立することとなった。母子が城の奥深くで最期を迎えたこの落城の様子は、後世の物語や絵画にも数多く描かれ、生存説など多くの伝説も残された。",
    bodyHtml:"豊臣秀吉が晩年になってようやく授かった実子として生まれた秀頼は、父の死後わずか6歳で豊臣家の当主となり、大坂城の主として大切に育てられた。関ヶ原の戦いで実権を握った徳川家康は、その後も西日本を中心に慕われ続ける豊臣家を警戒し、京都・方広寺の梵鐘に刻まれた「国家安康」の文字が家康の名を分断し呪うものだと難癖をつけ、両者の対立は急速に深まっていく。1614年の大坂冬の陣では和睦が結ばれたものの、条件として大坂城の外堀・内堀を埋め立てられ、裸同然となった城は翌1615年の夏の陣で徳川方の大軍に攻め落とされ、秀頼は母・淀殿とともに自害した。享年23。これにより天下人として栄華を誇った豊臣家は滅亡し、以後260年以上におよぶ徳川による支配体制が確立することとなった。母子が城の奥深くで最期を迎えたこの落城の様子は、後世の物語や絵画にも数多く描かれ、生存説など多くの伝説も残された。", source:"legacy", sourceId:"J26" },
  { id:"J27-01", personId:"J27", title:"この人の歩み", tags:["政治"],
    body:"信濃(現在の長野県)の名将・真田昌幸の次男として生まれた真田幸村(信繁)は、関ヶ原の戦いで父とともに西軍につき敗れたため、以後14年ものあいだ九度山(現在の和歌山県)に配流の身となり、不遇の雌伏の時を過ごした。しかし1614年、大坂冬の陣に際して大坂城に入城すると、城の弱点とされた南側にみずから出城「真田丸」を築き、攻め寄せる徳川方の大軍を巧みな戦術によって撃退してみせた。翌1615年の夏の陣では、寡兵ながら家康の本陣にあと一歩まで迫る決死の突撃を三度にわたって敢行し、その凄まじい勇猛さは敵将さえも「日本一の兵(ひのもといちのつわもの)」と称えたと伝えられる。奮戦の末に安居神社付近で討ち死にしたが、この壮絶な最期は江戸時代から現代に至るまで数多くの物語や講談の題材となり、多くの人々の心をとらえて離さない。父・昌幸ゆずりの知略と粘り強さも、彼の戦いぶりの土台となっていた。",
    bodyHtml:"信濃(現在の長野県)の名将・真田昌幸の次男として生まれた真田幸村(信繁)は、関ヶ原の戦いで父とともに西軍につき敗れたため、以後14年ものあいだ九度山(現在の和歌山県)に配流の身となり、不遇の雌伏の時を過ごした。しかし1614年、大坂冬の陣に際して大坂城に入城すると、城の弱点とされた南側にみずから出城「真田丸」を築き、攻め寄せる徳川方の大軍を巧みな戦術によって撃退してみせた。翌1615年の夏の陣では、寡兵ながら家康の本陣にあと一歩まで迫る決死の突撃を三度にわたって敢行し、その凄まじい勇猛さは敵将さえも「日本一の兵(ひのもといちのつわもの)」と称えたと伝えられる。奮戦の末に安居神社付近で討ち死にしたが、この壮絶な最期は江戸時代から現代に至るまで数多くの物語や講談の題材となり、多くの人々の心をとらえて離さない。父・昌幸ゆずりの知略と粘り強さも、彼の戦いぶりの土台となっていた。", source:"legacy", sourceId:"J27" },
  { id:"J28-01", personId:"J28", title:"この人の歩み", tags:["政治"],
    body:"安芸国(現在の広島県)の小さな国人領主の家に生まれた毛利元就は、幼くして両親を亡くし、一時は所領も奪われかけるという苦しい少年期を過ごしたが、持ち前の知略で周辺の有力大名の内紛につけこみ、次々と勢力を吸収していった。特に1555年の厳島の戦いでは、自軍より数倍の兵を擁する陶晴賢を、狭い厳島に誘い込んだうえで奇襲によって打ち破り、一躍中国地方随一の大名へとのし上がった。晩年、3人の息子・毛利隆元、吉川元春、小早川隆景を呼び集め、1本の矢は容易に折れても3本束ねると折れないことを実際に示して見せ、兄弟が固く力を合わせることの大切さを説いたという「三本の矢」の逸話は、後世の創作とも言われながらも、毛利家の結束を象徴する家訓として今も広く語り継がれている。孫の代には安芸・周防・長門など中国地方十か国を治める大大名にまで発展し、後の長州藩へとつながっていった。",
    bodyHtml:"安芸国(現在の広島県)の小さな国人領主の家に生まれた毛利元就は、幼くして両親を亡くし、一時は所領も奪われかけるという苦しい少年期を過ごしたが、持ち前の知略で周辺の有力大名の内紛につけこみ、次々と勢力を吸収していった。特に1555年の厳島の戦いでは、自軍より数倍の兵を擁する陶晴賢を、狭い厳島に誘い込んだうえで奇襲によって打ち破り、一躍中国地方随一の大名へとのし上がった。晩年、3人の息子・毛利隆元、吉川元春、小早川隆景を呼び集め、1本の矢は容易に折れても3本束ねると折れないことを実際に示して見せ、兄弟が固く力を合わせることの大切さを説いたという「三本の矢」の逸話は、後世の創作とも言われながらも、毛利家の結束を象徴する家訓として今も広く語り継がれている。孫の代には安芸・周防・長門など中国地方十か国を治める大大名にまで発展し、後の長州藩へとつながっていった。", source:"legacy", sourceId:"J28" },
  { id:"J29-01", personId:"J29", title:"この人の歩み", tags:["政治"],
    body:"出雲国(現在の島根県)の月山富田城を拠点とした尼子経久は、若くして家督を継いだものの、一度は家臣の裏切りに遭って城を追われるという苦難を味わった。しかし諦めることなく、わずかな家臣とともに正月の油断を突いて夜討ちをかけ、見事に城を奪還すると、そこから知略と忍耐によって勢力を着実に広げ、山陰・山陽地方を中心に十一か国におよぶ一大勢力を築き上げ、「山陰の王」とも呼ばれるまでになったと伝えられる。表向きは強大な相手に服従の姿勢を見せながら、機を見て寝返るなど駆け引きに長けた策略家としても知られ、80歳を超えるまで実権を握り続けたという。実力さえあれば身分の低い者でも大名にのし上がれた下剋上の時代を象徴する人物として、その波乱に満ちた生涯は今も語り継がれている。孫・晴久の代に尼子氏は最盛期を迎えるが、後に毛利元就との争いで衰退していくこととなった。",
    bodyHtml:"出雲国(現在の島根県)の月山富田城を拠点とした尼子経久は、若くして家督を継いだものの、一度は家臣の裏切りに遭って城を追われるという苦難を味わった。しかし諦めることなく、わずかな家臣とともに正月の油断を突いて夜討ちをかけ、見事に城を奪還すると、そこから知略と忍耐によって勢力を着実に広げ、山陰・山陽地方を中心に十一か国におよぶ一大勢力を築き上げ、「山陰の王」とも呼ばれるまでになったと伝えられる。表向きは強大な相手に服従の姿勢を見せながら、機を見て寝返るなど駆け引きに長けた策略家としても知られ、80歳を超えるまで実権を握り続けたという。実力さえあれば身分の低い者でも大名にのし上がれた下剋上の時代を象徴する人物として、その波乱に満ちた生涯は今も語り継がれている。孫・晴久の代に尼子氏は最盛期を迎えるが、後に毛利元就との争いで衰退していくこととなった。", source:"legacy", sourceId:"J29" },
  { id:"J30-01", personId:"J30", title:"この人の歩み", tags:["政治"],
    body:"周防国(現在の山口県)を本拠とした大内義隆は、朝鮮や明との貿易で得た富をもとに山口の町を整え、応仁の乱で荒れ果てた京都を逃れてきた公家や文化人を数多く手厚く保護し、「西の京」と称されるほど西日本随一の文化都市へと発展させた。宣教師フランシスコ・ザビエルの日本での布教も許可し、貴重な文物や技術の受け入れにも積極的だった、当時としては開明的な一面も見せている。しかし1543年、出雲の尼子氏への遠征に大敗して多くの重臣を失って以降、次第に政務への意欲を失い、軍事より歌や蹴鞠などの文化を重んじるようになったことから家臣の不満が高まっていった。ついに1551年、武断派の重臣・陶晴賢の謀反に遭って追い詰められ、長門の大寧寺で自害に追い込まれた。彼が育てた山口の文化は、その後も西の京として長く名を残し、後年、宣教師たちの記録にもその繁栄ぶりが書き残されている。",
    bodyHtml:"周防国(現在の山口県)を本拠とした大内義隆は、朝鮮や明との貿易で得た富をもとに山口の町を整え、応仁の乱で荒れ果てた京都を逃れてきた公家や文化人を数多く手厚く保護し、「西の京」と称されるほど西日本随一の文化都市へと発展させた。宣教師フランシスコ・ザビエルの日本での布教も許可し、貴重な文物や技術の受け入れにも積極的だった、当時としては開明的な一面も見せている。しかし1543年、出雲の尼子氏への遠征に大敗して多くの重臣を失って以降、次第に政務への意欲を失い、軍事より歌や蹴鞠などの文化を重んじるようになったことから家臣の不満が高まっていった。ついに1551年、武断派の重臣・陶晴賢の謀反に遭って追い詰められ、長門の大寧寺で自害に追い込まれた。彼が育てた山口の文化は、その後も西の京として長く名を残し、後年、宣教師たちの記録にもその繁栄ぶりが書き残されている。", source:"legacy", sourceId:"J30" },
  { id:"J31-01", personId:"J31", title:"この人の歩み", tags:["政治"],
    body:"薩摩国(現在の鹿児島県)の名門・島津氏の当主となった島津義久は、弟の義弘・歳久・家久らとともに勢力を拡大し、1578年の耳川の戦いなどで周辺の有力大名を次々と破って、九州統一を目前にするほどの版図を築き上げた。しかし1587年、九州平定に乗り出した豊臣秀吉率いる圧倒的な大軍を前にはついに抗しきれず、みずから剃髪して法体となり降伏の意を示すことで、本領である薩摩・大隅を安堵される形で服従した。屈辱を受け入れつつも家名と領地を守り抜いたこの冷静な判断により、島津家は関ヶ原の戦いで西軍に与しながらも改易を免れ、江戸時代を通じて薩摩藩として存続する確かな基盤を築いたのである。義久のこの粘り強い外交手腕は、後の島津氏の存続を支える重要な礎となり、幕末に西郷隆盛や大久保利通ら多くの志士を輩出する薩摩藩の土台としても、大きな役割を果たしていくこととなった。",
    bodyHtml:"薩摩国(現在の鹿児島県)の名門・島津氏の当主となった島津義久は、弟の義弘・歳久・家久らとともに勢力を拡大し、1578年の耳川の戦いなどで周辺の有力大名を次々と破って、九州統一を目前にするほどの版図を築き上げた。しかし1587年、九州平定に乗り出した豊臣秀吉率いる圧倒的な大軍を前にはついに抗しきれず、みずから剃髪して法体となり降伏の意を示すことで、本領である薩摩・大隅を安堵される形で服従した。屈辱を受け入れつつも家名と領地を守り抜いたこの冷静な判断により、島津家は関ヶ原の戦いで西軍に与しながらも改易を免れ、江戸時代を通じて薩摩藩として存続する確かな基盤を築いたのである。義久のこの粘り強い外交手腕は、後の島津氏の存続を支える重要な礎となり、幕末に西郷隆盛や大久保利通ら多くの志士を輩出する薩摩藩の土台としても、大きな役割を果たしていくこととなった。", source:"legacy", sourceId:"J31" },
  { id:"J32-01", personId:"J32", title:"この人の歩み", tags:["政治"],
    body:"島津義弘の子として生まれた島津忠恒(後の家久)は、若くして朝鮮出兵に従軍して武功を挙げ、豊臣秀吉からも高く評価された武将である。関ヶ原の戦いでは父とともに西軍として参加し、敗色濃厚となる中を正面から徳川方の陣を突き破って戦場を離脱する「島津の退き口」と呼ばれる決死の敵中突破を経て、命からがら薩摩へ帰還した。戦後は自ら徳川家康のもとへ赴いて巧みに交渉し、所領の安堵を勝ち取って薩摩藩の初代藩主となった。さらに1609年には軍勢を琉球王国へ派遣してこれを征服し、以後琉球王国は薩摩藩の支配下に置かれることとなり、島津氏の勢力はより一層拡大していった。この征服により薩摩藩は琉球を通じた中継貿易でも大きな利益を得ることとなり、幕末に至るまで雄藩としての地位を保つ確かな経済的基盤が、この時代を通じて着実に築き上げられていった。",
    bodyHtml:"島津義弘の子として生まれた島津忠恒(後の家久)は、若くして朝鮮出兵に従軍して武功を挙げ、豊臣秀吉からも高く評価された武将である。関ヶ原の戦いでは父とともに西軍として参加し、敗色濃厚となる中を正面から徳川方の陣を突き破って戦場を離脱する「島津の退き口」と呼ばれる決死の敵中突破を経て、命からがら薩摩へ帰還した。戦後は自ら徳川家康のもとへ赴いて巧みに交渉し、所領の安堵を勝ち取って薩摩藩の初代藩主となった。さらに1609年には軍勢を琉球王国へ派遣してこれを征服し、以後琉球王国は薩摩藩の支配下に置かれることとなり、島津氏の勢力はより一層拡大していった。この征服により薩摩藩は琉球を通じた中継貿易でも大きな利益を得ることとなり、幕末に至るまで雄藩としての地位を保つ確かな経済的基盤が、この時代を通じて着実に築き上げられていった。", source:"legacy", sourceId:"J32" },
  { id:"J33-01", personId:"J33", title:"この人の歩み", tags:["政治"],
    body:"出自には諸説あるものの、油売りの行商人から身を起こしたとも伝えられる斎藤道三は、持ち前の知略と大胆さで美濃国(現在の岐阜県)の守護大名・土岐氏に取り入り、やがて主君やその一族を追放して自らが国主の座に就いたとされる、実力だけでのし上がったその生き様から「美濃の蝮(まむし)」と恐れられた。娘・帰蝶(濃姫)を尾張の織田信長に嫁がせた道三は、聖徳寺での会見において「うつけ者」と噂されていた若き信長の立ち居振る舞いや器量を目の当たりにし、「わが子らはいずれ信長の門前に馬をつなぐことになろう」と、その将来性をひそかに高く評価したと伝えられている。この見立ては後に現実のものとなり、道三は美濃一国を信長に譲る旨の書状を残したという。晩年には息子・義龍との対立から命を落とすことになったが、若き信長の器量をいち早く見抜いていたその先見の明は、時代を先読みする戦国武将の逸話として今も語り草となっている。",
    bodyHtml:"出自には諸説あるものの、油売りの行商人から身を起こしたとも伝えられる斎藤道三は、持ち前の知略と大胆さで美濃国(現在の岐阜県)の守護大名・土岐氏に取り入り、やがて主君やその一族を追放して自らが国主の座に就いたとされる、実力だけでのし上がったその生き様から「美濃の蝮(まむし)」と恐れられた。娘・帰蝶(濃姫)を尾張の織田信長に嫁がせた道三は、聖徳寺での会見において「うつけ者」と噂されていた若き信長の立ち居振る舞いや器量を目の当たりにし、「わが子らはいずれ信長の門前に馬をつなぐことになろう」と、その将来性をひそかに高く評価したと伝えられている。この見立ては後に現実のものとなり、道三は美濃一国を信長に譲る旨の書状を残したという。晩年には息子・義龍との対立から命を落とすことになったが、若き信長の器量をいち早く見抜いていたその先見の明は、時代を先読みする戦国武将の逸話として今も語り草となっている。", source:"legacy", sourceId:"J33" },
  { id:"J34-01", personId:"J34", title:"この人の歩み", tags:["政治"],
    body:"美濃国主・斎藤道三の長男として生まれた斎藤義龍は、自分の出生をめぐる噂などから実父との間に深い不和を抱えていたとされ、やがて弟たちを殺害するとともに軍勢を挙げて父・道三と真っ向から敵対する道を選んだ。1556年の長良川の戦いにおいて両軍は激突し、圧倒的な兵力差にもかかわらず義龍は父を討ち取ることに成功し、美濃国主の座を奪い取った。下剋上によって国主となった義龍であったが、その治世は長くは続かず、跡を継いだわずか5年後の1561年に病でこの世を去っている。実の親子が家督を巡って争い、最後には殺し合うに至ったこの出来事は、下剋上の世の非情さと厳しさを今に伝える悲劇として語り継がれている。義龍の死後、まだ若い跡継ぎ・龍興の代になると家中の結束は乱れ、美濃はほどなく織田信長の攻勢を受けて、ついに斎藤氏は滅ぼされることとなってしまった。",
    bodyHtml:"美濃国主・斎藤道三の長男として生まれた斎藤義龍は、自分の出生をめぐる噂などから実父との間に深い不和を抱えていたとされ、やがて弟たちを殺害するとともに軍勢を挙げて父・道三と真っ向から敵対する道を選んだ。1556年の長良川の戦いにおいて両軍は激突し、圧倒的な兵力差にもかかわらず義龍は父を討ち取ることに成功し、美濃国主の座を奪い取った。下剋上によって国主となった義龍であったが、その治世は長くは続かず、跡を継いだわずか5年後の1561年に病でこの世を去っている。実の親子が家督を巡って争い、最後には殺し合うに至ったこの出来事は、下剋上の世の非情さと厳しさを今に伝える悲劇として語り継がれている。義龍の死後、まだ若い跡継ぎ・龍興の代になると家中の結束は乱れ、美濃はほどなく織田信長の攻勢を受けて、ついに斎藤氏は滅ぼされることとなってしまった。", source:"legacy", sourceId:"J34" },
  { id:"J35-01", personId:"J35", title:"この人の歩み", tags:["政治"],
    body:"尾張国(現在の愛知県)の武士の家に生まれた前田利家は、若い頃から槍の名手として鳴らし、「槍の又左(またざ)」の異名で恐れられるほどの武勇を誇った。織田信長、豊臣秀吉に仕えて数々の戦で武功を重ね、次第に有力大名へと成長していく。豊臣政権下では五大老の一人にも数えられるまでになり、秀吉の死後は徳川家康と並ぶ実力者として、幼い豊臣秀頼の後見役を任され、豊臣家の存続に尽力した。だが利家自身も秀吉の死からわずか1年半後の1599年に病でこの世を去っている。彼の死後、豊臣家と徳川家の間の均衡は一気に崩れたともいわれる。その後を継いだ子孫たちは加賀・能登・越中の三国を治め、江戸時代を通じて「加賀百万石」と呼ばれる屈指の大大名として前田家を存続させ、その繁栄は江戸幕府が終わりを迎える明治維新まで長く続くこととなった。",
    bodyHtml:"尾張国(現在の愛知県)の武士の家に生まれた前田利家は、若い頃から槍の名手として鳴らし、「槍の又左(またざ)」の異名で恐れられるほどの武勇を誇った。織田信長、豊臣秀吉に仕えて数々の戦で武功を重ね、次第に有力大名へと成長していく。豊臣政権下では五大老の一人にも数えられるまでになり、秀吉の死後は徳川家康と並ぶ実力者として、幼い豊臣秀頼の後見役を任され、豊臣家の存続に尽力した。だが利家自身も秀吉の死からわずか1年半後の1599年に病でこの世を去っている。彼の死後、豊臣家と徳川家の間の均衡は一気に崩れたともいわれる。その後を継いだ子孫たちは加賀・能登・越中の三国を治め、江戸時代を通じて「加賀百万石」と呼ばれる屈指の大大名として前田家を存続させ、その繁栄は江戸幕府が終わりを迎える明治維新まで長く続くこととなった。", source:"legacy", sourceId:"J35" },
  { id:"J36-01", personId:"J36", title:"この人の歩み", tags:["政治"],
    body:"前田利家の一族に生まれながら養子となった前田慶次(慶次郎)は、常識にとらわれない自由奔放な生き方を貫いた「傾奇者(かぶきもの)」として名を馳せた人物である。奇抜な衣装をまとって京の街を練り歩いたという逸話や、義父・前田利家と衝突して前田家を飄々と去り、上杉家に仕えたという伝承など、豪快で洒脱な振る舞いにまつわる話が数多く伝えられている。上杉景勝のもとでは家臣・直江兼続と深い親交を結び、1600年の会津征伐や関ヶ原の戦いの後も上杉領の米沢で悠々自適な晩年を過ごしたという。実像には不明な点も多く、その多くが後世の創作を含むと考えられているが、権威や身分に縛られないその痛快な生きざまは、後世、小説や漫画の題材として繰り返し取り上げられ、幅広い世代から今も高い人気を誇っており、山形県の米沢市には慶次にまつわる史跡も残されている。",
    bodyHtml:"前田利家の一族に生まれながら養子となった前田慶次(慶次郎)は、常識にとらわれない自由奔放な生き方を貫いた「傾奇者(かぶきもの)」として名を馳せた人物である。奇抜な衣装をまとって京の街を練り歩いたという逸話や、義父・前田利家と衝突して前田家を飄々と去り、上杉家に仕えたという伝承など、豪快で洒脱な振る舞いにまつわる話が数多く伝えられている。上杉景勝のもとでは家臣・直江兼続と深い親交を結び、1600年の会津征伐や関ヶ原の戦いの後も上杉領の米沢で悠々自適な晩年を過ごしたという。実像には不明な点も多く、その多くが後世の創作を含むと考えられているが、権威や身分に縛られないその痛快な生きざまは、後世、小説や漫画の題材として繰り返し取り上げられ、幅広い世代から今も高い人気を誇っており、山形県の米沢市には慶次にまつわる史跡も残されている。", source:"legacy", sourceId:"J36" },
  { id:"J37-01", personId:"J37", title:"この人の歩み", tags:["政治"],
    body:"越後国(現在の新潟県)の大名・上杉謙信は、みずから「軍神」毘沙門天の化身と信じるほど戦を得意とし、宿敵・武田信玄とは1553年から1564年にかけて信濃国(現在の長野県)の川中島でおよそ五度にわたり激突した。私利私欲のためでなく「義」のために戦うことを何よりの信条とし、生涯にわたり正妻を娶らなかったとも伝えられる清廉な人物である。とりわけ有名なのが、隣国の今川氏や北条氏の圧力で塩の供給を断たれ困窮した武田領に対し、敵でありながらあえて自ら塩を送って民を苦しみから救ったという「敵に塩を送る」の逸話で、敵味方の枠を超えた武士の誠実さを象徴する話として今も広く語り継がれている。関東管領の職を継ぎ、関東の秩序を守るためとして幾度も関東への出兵を繰り返した生涯でもあり、一方で越後国内の内政や商業の振興にも力を注いだ名将であった。",
    bodyHtml:"越後国(現在の新潟県)の大名・上杉謙信は、みずから「軍神」毘沙門天の化身と信じるほど戦を得意とし、宿敵・武田信玄とは1553年から1564年にかけて信濃国(現在の長野県)の川中島でおよそ五度にわたり激突した。私利私欲のためでなく「義」のために戦うことを何よりの信条とし、生涯にわたり正妻を娶らなかったとも伝えられる清廉な人物である。とりわけ有名なのが、隣国の今川氏や北条氏の圧力で塩の供給を断たれ困窮した武田領に対し、敵でありながらあえて自ら塩を送って民を苦しみから救ったという「敵に塩を送る」の逸話で、敵味方の枠を超えた武士の誠実さを象徴する話として今も広く語り継がれている。関東管領の職を継ぎ、関東の秩序を守るためとして幾度も関東への出兵を繰り返した生涯でもあり、一方で越後国内の内政や商業の振興にも力を注いだ名将であった。", source:"legacy", sourceId:"J37" },
  { id:"J38-01", personId:"J38", title:"この人の歩み", tags:["政治"],
    body:"陸奥国(現在の宮城県周辺)の大名・伊達政宗は、幼少期に天然痘を患って右目の視力を失い、「独眼竜」の異名で恐れられた奥州の戦国大名である。奥州の統一をほぼ成し遂げたところで豊臣秀吉による天下統一の流れに遭遇し、小田原征伐への参陣が遅れて処罰を覚悟しながらも、間一髪で服従を選んで所領を保った。関ヶ原の戦い後は徳川家康のもとで奥州の押さえ役を務め、居城を仙台に定めて城下町の整備や新田開発を進めるとともに、遠くローマへ家臣・支倉常長を派遣する慶長遣欧使節を実現させるなど、先進的な政策を次々と打ち出した。晩年まで天下取りの野心を捨てなかったとも噂されるが、彼が心血を注いで築いた仙台の町並みは、その後の東北地方発展の確かな礎となり、豪華絢爛な文化「桃山文化」の気風を色濃く受け継ぐ武将としても、後世に高く評価されている。",
    bodyHtml:"陸奥国(現在の宮城県周辺)の大名・伊達政宗は、幼少期に天然痘を患って右目の視力を失い、「独眼竜」の異名で恐れられた奥州の戦国大名である。奥州の統一をほぼ成し遂げたところで豊臣秀吉による天下統一の流れに遭遇し、小田原征伐への参陣が遅れて処罰を覚悟しながらも、間一髪で服従を選んで所領を保った。関ヶ原の戦い後は徳川家康のもとで奥州の押さえ役を務め、居城を仙台に定めて城下町の整備や新田開発を進めるとともに、遠くローマへ家臣・支倉常長を派遣する慶長遣欧使節を実現させるなど、先進的な政策を次々と打ち出した。晩年まで天下取りの野心を捨てなかったとも噂されるが、彼が心血を注いで築いた仙台の町並みは、その後の東北地方発展の確かな礎となり、豪華絢爛な文化「桃山文化」の気風を色濃く受け継ぐ武将としても、後世に高く評価されている。", source:"legacy", sourceId:"J38" },
  { id:"J39-01", personId:"J39", title:"この人の歩み", tags:["政治"],
    body:"出自については素浪人から身を起こしたとも、室町幕府に仕えた官人だったともいわれる北条早雲(伊勢宗瑞)は、駿河国(現在の静岡県)を足がかりに伊豆国へ進出し、当時の伊豆を治めていた堀越公方を滅ぼしてこれを平定、さらに相模国(現在の神奈川県)の小田原城を策略によって奪い取り本拠とした、下剋上の先駆けとされる人物である。年貢の取り立てを四公六民に軽くするなど領民の暮らしを重んじる統治を徹底し、家臣の心得を記した家訓「早雲寺殿廿一箇条」を残したことでも知られる。彼が築いた小田原の後北条氏は、氏綱、氏康、氏政、氏直と五代・約百年にわたって関東一円に大きな勢力を保つこととなり、その領国経営は後の江戸幕府の統治にも影響を与えたとされ、質実剛健な家風は代々受け継がれていった。小田原城下は当時の日本有数の繁栄を誇る城下町となり、その先進的な統治は多くの戦国大名の手本ともなった。",
    bodyHtml:"出自については素浪人から身を起こしたとも、室町幕府に仕えた官人だったともいわれる北条早雲(伊勢宗瑞)は、駿河国(現在の静岡県)を足がかりに伊豆国へ進出し、当時の伊豆を治めていた堀越公方を滅ぼしてこれを平定、さらに相模国(現在の神奈川県)の小田原城を策略によって奪い取り本拠とした、下剋上の先駆けとされる人物である。年貢の取り立てを四公六民に軽くするなど領民の暮らしを重んじる統治を徹底し、家臣の心得を記した家訓「早雲寺殿廿一箇条」を残したことでも知られる。彼が築いた小田原の後北条氏は、氏綱、氏康、氏政、氏直と五代・約百年にわたって関東一円に大きな勢力を保つこととなり、その領国経営は後の江戸幕府の統治にも影響を与えたとされ、質実剛健な家風は代々受け継がれていった。小田原城下は当時の日本有数の繁栄を誇る城下町となり、その先進的な統治は多くの戦国大名の手本ともなった。", source:"legacy", sourceId:"J39" },
  { id:"J40-01", personId:"J40", title:"この人の歩み", tags:["政治"],
    body:"北条早雲の孫にあたる北条氏康は、1546年の河越夜戦において、自軍のわずか数分の一ともいわれる大軍を夜襲によって打ち破り、関東の覇権をめぐる形勢を一変させた戦上手として知られる。内政にも優れ、検地を行って年貢を整理するとともに、「民のかまどの煙が立たぬほど困窮しているなら年貢を取ってはならない」という姿勢で領民を思いやる政治を行ったと伝えられている。武田信玄・上杉謙信という当代随一の強敵とも渡り合いながら巧みに領国を守り抜き、関東随一の大名へと後北条氏を発展させたその手腕は、優れた武将であると同時に名君でもあった人物として今も高く評価されている。武田・今川両家との甲相駿三国同盟を結ぶなど、外交においても巧みな駆け引きを見せた戦国大名であった。子・氏政の代に豊臣秀吉との対立が深まるまで、後北条氏は関東で最も安定した統治を行った大名の一つとして数えられている。",
    bodyHtml:"北条早雲の孫にあたる北条氏康は、1546年の河越夜戦において、自軍のわずか数分の一ともいわれる大軍を夜襲によって打ち破り、関東の覇権をめぐる形勢を一変させた戦上手として知られる。内政にも優れ、検地を行って年貢を整理するとともに、「民のかまどの煙が立たぬほど困窮しているなら年貢を取ってはならない」という姿勢で領民を思いやる政治を行ったと伝えられている。武田信玄・上杉謙信という当代随一の強敵とも渡り合いながら巧みに領国を守り抜き、関東随一の大名へと後北条氏を発展させたその手腕は、優れた武将であると同時に名君でもあった人物として今も高く評価されている。武田・今川両家との甲相駿三国同盟を結ぶなど、外交においても巧みな駆け引きを見せた戦国大名であった。子・氏政の代に豊臣秀吉との対立が深まるまで、後北条氏は関東で最も安定した統治を行った大名の一つとして数えられている。", source:"legacy", sourceId:"J40" },
  { id:"J41-01", personId:"J41", title:"この人の歩み", tags:["政治"],
    body:"北条氏康の子として関東の大大名・後北条氏を継いだ北条氏政は、父の代に築かれた広大な領国をさらに発展させたが、天下統一を進める豊臣秀吉への臣従を渋り、独自の勢力を守ろうとした判断が家の命取りとなってしまう。1590年、秀吉は20万を超える大軍を率いて小田原城を包囲し(小田原征伐)、氏政はなおも籠城を続けて交渉を長引かせ抵抗を試みたものの、周辺の支城が次々と落とされる中でついに戦意を失い開城を余儀なくされた。この結果、五代・約百年にわたり関東に威を振るった後北条氏はあっけなく滅亡し、氏政は当主であった弟・氏直に代わって、兄・氏照とともに切腹を命じられ、その生涯を閉じた。この結末は、なかなか結論の出ない話し合いを指す「小田原評定」という言葉の由来ともなり、決断の遅さを戒める故事として今の世にまで語り継がれている。",
    bodyHtml:"北条氏康の子として関東の大大名・後北条氏を継いだ北条氏政は、父の代に築かれた広大な領国をさらに発展させたが、天下統一を進める豊臣秀吉への臣従を渋り、独自の勢力を守ろうとした判断が家の命取りとなってしまう。1590年、秀吉は20万を超える大軍を率いて小田原城を包囲し(小田原征伐)、氏政はなおも籠城を続けて交渉を長引かせ抵抗を試みたものの、周辺の支城が次々と落とされる中でついに戦意を失い開城を余儀なくされた。この結果、五代・約百年にわたり関東に威を振るった後北条氏はあっけなく滅亡し、氏政は当主であった弟・氏直に代わって、兄・氏照とともに切腹を命じられ、その生涯を閉じた。この結末は、なかなか結論の出ない話し合いを指す「小田原評定」という言葉の由来ともなり、決断の遅さを戒める故事として今の世にまで語り継がれている。", source:"legacy", sourceId:"J41" },
  { id:"J42-01", personId:"J42", title:"この人の歩み", tags:["政治"],
    body:"甲斐国(現在の山梨県)の守護大名の家に生まれた武田信玄は、父・信虎を国外へ追放して家督を継ぐと、「風林火山」の旗を掲げて信濃国(現在の長野県)へ勢力を広げた戦国屈指の名将である。「人は城、人は石垣、人は堀、情けは味方、仇は敵なり」という言葉に表れているように、堅固な城を築くよりも人材と民心を大切にする統治を重んじ、大規模な堤防「信玄堤」を築いて釜無川の氾濫を防ぐなど治水事業にも力を注いだ。宿敵・上杉謙信との間で1553年から五度にわたり繰り広げられた川中島の戦いは特に有名で、両雄が一騎討ちに及んだとの伝説とともに、今も多くの人々に語り継がれている。上洛の途上で病に倒れ、天下統一を目前にしてその志半ばで没したとも伝えられ、死は3年間秘されたという逸話も残る。信玄が育てた家臣団や統治の仕組みは、後に天下を治めた徳川家康の政治にも影響を与えたといわれている。",
    bodyHtml:"甲斐国(現在の山梨県)の守護大名の家に生まれた武田信玄は、父・信虎を国外へ追放して家督を継ぐと、「風林火山」の旗を掲げて信濃国(現在の長野県)へ勢力を広げた戦国屈指の名将である。「人は城、人は石垣、人は堀、情けは味方、仇は敵なり」という言葉に表れているように、堅固な城を築くよりも人材と民心を大切にする統治を重んじ、大規模な堤防「信玄堤」を築いて釜無川の氾濫を防ぐなど治水事業にも力を注いだ。宿敵・上杉謙信との間で1553年から五度にわたり繰り広げられた川中島の戦いは特に有名で、両雄が一騎討ちに及んだとの伝説とともに、今も多くの人々に語り継がれている。上洛の途上で病に倒れ、天下統一を目前にしてその志半ばで没したとも伝えられ、死は3年間秘されたという逸話も残る。信玄が育てた家臣団や統治の仕組みは、後に天下を治めた徳川家康の政治にも影響を与えたといわれている。", source:"legacy", sourceId:"J42" },
  { id:"J43-01", personId:"J43", title:"この人の歩み", tags:["政治"],
    body:"越後国(現在の新潟県)の大名・上杉謙信の甥にあたる上杉景勝は、謙信の急死後に起きた家督争い「御館の乱」を制して家を継ぎ、豊臣政権下では五大老の一人にも数えられるほどの実力者となった。関ヶ原の戦いでは石田三成に呼応して兵を挙げ、徳川家康と真っ向から敵対したため、戦後は会津120万石から出羽米沢30万石へと4分の1程度への大幅な減封を受けることとなる。それでも家臣・直江兼続とともに質素倹約に努め、新田開発や殖産興業に取り組んで苦しい藩財政の立て直しに努力を重ね、上杉家を存続させることに成功した。寡黙で表情を変えないことで知られ、生涯にわたり主君・謙信への忠義を貫いたその姿勢は、後の米沢藩の藩政改革の礎となり、後年の名君・上杉鷹山にもその精神は受け継がれていった。米沢の地で家臣とともに耐え忍んだこの苦難の時代は、上杉家が幕末まで存続していく確かな礎となったのである。",
    bodyHtml:"越後国(現在の新潟県)の大名・上杉謙信の甥にあたる上杉景勝は、謙信の急死後に起きた家督争い「御館の乱」を制して家を継ぎ、豊臣政権下では五大老の一人にも数えられるほどの実力者となった。関ヶ原の戦いでは石田三成に呼応して兵を挙げ、徳川家康と真っ向から敵対したため、戦後は会津120万石から出羽米沢30万石へと4分の1程度への大幅な減封を受けることとなる。それでも家臣・直江兼続とともに質素倹約に努め、新田開発や殖産興業に取り組んで苦しい藩財政の立て直しに努力を重ね、上杉家を存続させることに成功した。寡黙で表情を変えないことで知られ、生涯にわたり主君・謙信への忠義を貫いたその姿勢は、後の米沢藩の藩政改革の礎となり、後年の名君・上杉鷹山にもその精神は受け継がれていった。米沢の地で家臣とともに耐え忍んだこの苦難の時代は、上杉家が幕末まで存続していく確かな礎となったのである。", source:"legacy", sourceId:"J43" },
  { id:"J44-01", personId:"J44", title:"この人の歩み", tags:["政治"],
    body:"土佐国(現在の高知県)の一豪族にすぎなかった長宗我部元親は、22歳での初陣で気弱さを心配されながらも見事な戦いぶりを見せて「鬼若子」と呼ばれるようになり、そこから四国統一を目指して急速に勢力を拡大していった。ふだんは農作業に従事し、戦の際には武具をまとって出陣する「一領具足」と呼ばれる兵農一致の軍制を整え、機動力に優れた軍で周辺勢力を次々と打ち破り、一時は四国のほぼ全土を手中に収めるまでに至った。しかし豊臣秀吉による20万を超える大軍を用いた四国攻めを受けて敗れ、土佐一国のみを安堵される形で服従することとなる。その勇猛な戦いぶりと統治は、土佐武士の気風を体現するものとして、後の幕末の土佐藩士たちの気質にも受け継がれたと言われ、みずからの家臣団のために独自の分国法「長宗我部元親百箇条」を定めた名君でもあった。",
    bodyHtml:"土佐国(現在の高知県)の一豪族にすぎなかった長宗我部元親は、22歳での初陣で気弱さを心配されながらも見事な戦いぶりを見せて「鬼若子」と呼ばれるようになり、そこから四国統一を目指して急速に勢力を拡大していった。ふだんは農作業に従事し、戦の際には武具をまとって出陣する「一領具足」と呼ばれる兵農一致の軍制を整え、機動力に優れた軍で周辺勢力を次々と打ち破り、一時は四国のほぼ全土を手中に収めるまでに至った。しかし豊臣秀吉による20万を超える大軍を用いた四国攻めを受けて敗れ、土佐一国のみを安堵される形で服従することとなる。その勇猛な戦いぶりと統治は、土佐武士の気風を体現するものとして、後の幕末の土佐藩士たちの気質にも受け継がれたと言われ、みずからの家臣団のために独自の分国法「長宗我部元親百箇条」を定めた名君でもあった。", source:"legacy", sourceId:"J44" },
  { id:"J45-01", personId:"J45", title:"この人の歩み", tags:["政治"],
    body:"肥前国(現在の佐賀県)の龍造寺氏を継いだ竜造寺隆信は、大友氏や少弐氏といった周辺の有力大名を次々と退けて勢力を広げ、九州北西部の広い範囲を支配下に収め、「五州二島の太守」とまで称されるほどの威勢を誇った。その体格の大きさから「肥前の熊」とも呼ばれたという。しかし1584年、島津氏と有馬氏の連合軍との沖田畷の戦いにおいて、油断からわずかな兵で自ら出陣した末に湿地帯で不意を突かれ、敗死してしまう。隆信の死後、龍造寺家の実権はしだいに重臣であった鍋島直茂へと移っていき、龍造寺一族が名目上主家として残る形をとりながらも、後の江戸時代を通じて有田焼などの産業とともに栄える佐賀藩・鍋島氏の礎が築かれることとなった。九州北部にまで版図を広げながら一夜にして崩れ去ったその急速な栄枯盛衰は、戦国九州の激しさをよく物語っている。",
    bodyHtml:"肥前国(現在の佐賀県)の龍造寺氏を継いだ竜造寺隆信は、大友氏や少弐氏といった周辺の有力大名を次々と退けて勢力を広げ、九州北西部の広い範囲を支配下に収め、「五州二島の太守」とまで称されるほどの威勢を誇った。その体格の大きさから「肥前の熊」とも呼ばれたという。しかし1584年、島津氏と有馬氏の連合軍との沖田畷の戦いにおいて、油断からわずかな兵で自ら出陣した末に湿地帯で不意を突かれ、敗死してしまう。隆信の死後、龍造寺家の実権はしだいに重臣であった鍋島直茂へと移っていき、龍造寺一族が名目上主家として残る形をとりながらも、後の江戸時代を通じて有田焼などの産業とともに栄える佐賀藩・鍋島氏の礎が築かれることとなった。九州北部にまで版図を広げながら一夜にして崩れ去ったその急速な栄枯盛衰は、戦国九州の激しさをよく物語っている。", source:"legacy", sourceId:"J45" },
  { id:"J46-01", personId:"J46", title:"この人の歩み", tags:["政治"],
    body:"豊後国(現在の大分県)の大名・大友宗麟は、九州の有力大名でありながら、宣教師フランシスコ・ザビエルらの日本での布教をいち早く許可し、南蛮貿易にも積極的に取り組んだ開明的な人物として知られる。晩年には自らも洗礼を受けてキリシタン大名となり、有馬晴信・大村純忠とともに1582年、伊東マンショら4人の少年をローマ教皇のもとへ派遣する「天正遣欧少年使節」を実現させた。この使節はヨーロッパの人々を大いに驚かせ、帰国後の日本にも西洋の活版印刷術や絵画技法などをもたらした。晩年は1578年の耳川の戦いで島津氏に大敗して勢力を大きく失ったが、いち早く西洋文化を積極的に取り入れた先駆者として、日本の対外交流史の中で今も高く評価されており、本拠地の府内(現在の大分市)には当時の南蛮貿易のにぎわいを伝える史跡が今も残されている。",
