    bodyHtml:"ドイツの医師ロベルト・コッホは、田舎町の開業医をしながら独自に研究を続け、1876年、炭疽という家畜の病気が特定の細菌によって引き起こされることを世界で初めて実験で証明した。続いて1882年に結核菌、1883年にはコレラ菌を発見し、目に見えない微生物が病気の原因であることを次々と明らかにしたことから「近代細菌学の父」と呼ばれる。寒天を用いた培地で細菌だけを純粋に培養する技術を確立し、ある微生物が特定の病気の原因であると証明するための厳密な手順「コッホの原則」をまとめ上げた。この考え方はその後の感染症研究の土台となり、1905年には結核に関する一連の発見によりノーベル生理学・医学賞を受賞した。細菌を染色して顕微鏡で見やすくする染色法の改良にも取り組み、晩年はアフリカにも渡って眠り病などの感染症研究にも力を注いだ。彼の名を冠したロベルト・コッホ研究所は、現在もドイツの感染症対策の中心機関として活動を続けている。", source:"legacy", sourceId:"W29" },
  { id:"W33-01", personId:"W33", title:"この人の歩み", tags:["文学"],
    body:"デンマークの貴族出身の天文学者ティコ・ブラーエは、1572年に夜空に突然現れた新しい星（超新星）を観測し、天は不変であるという当時の常識に疑問を投げかけた。国王からヴェン島を与えられると、望遠鏡がまだない時代に肉眼による観測所ウラニボリを築き上げ、20年以上にわたって星々の位置を驚くほど精密に記録し続けた。決闘で鼻の一部を失い、生涯金属製の付け鼻をつけていたという逸話でも知られる、個性的な人物であった。晩年、助手として若きヨハネス・ケプラーを招き入れ、自らの莫大な観測データを託して1601年にプラハで亡くなった。この遺産となるデータをケプラーが受け継いで分析したことで、後の惑星運動の法則の発見という大きな成果へとつながっていった。地球は動かないとする従来の説と、太陽が中心にあるとする新しい説を折衷させた独自の宇宙モデルを提唱するなど、時代の転換点に立って天文学の発展に尽くした人物でもある。",
    bodyHtml:"デンマークの貴族出身の天文学者ティコ・ブラーエは、1572年に夜空に突然現れた新しい星（超新星）を観測し、天は不変であるという当時の常識に疑問を投げかけた。国王からヴェン島を与えられると、望遠鏡がまだない時代に肉眼による観測所ウラニボリを築き上げ、20年以上にわたって星々の位置を驚くほど精密に記録し続けた。決闘で鼻の一部を失い、生涯金属製の付け鼻をつけていたという逸話でも知られる、個性的な人物であった。晩年、助手として若きヨハネス・ケプラーを招き入れ、自らの莫大な観測データを託して1601年にプラハで亡くなった。この遺産となるデータをケプラーが受け継いで分析したことで、後の惑星運動の法則の発見という大きな成果へとつながっていった。地球は動かないとする従来の説と、太陽が中心にあるとする新しい説を折衷させた独自の宇宙モデルを提唱するなど、時代の転換点に立って天文学の発展に尽くした人物でもある。", source:"legacy", sourceId:"W33" },
  { id:"W34-01", personId:"W34", title:"この人の歩み", tags:["文学"],
    body:"ドイツの天文学者ヨハネス・ケプラーは、師ティコ・ブラーエが遺した膨大な観測記録、特に火星の動きのデータと格闘し続けた末、惑星は円ではなくわずかにゆがんだ楕円軌道を描いて太陽の周りを回っていることを1609年に発見した。この発見と、その後1619年に導いた法則を合わせて「ケプラーの三法則」と呼び、天文学に数学的な正確さをもたらした。母親が魔女として告発された裁判では弁護のために奔走するなど波乱に満ちた人生を送りながらも研究を続け、望遠鏡のしくみを説明する光学の著作も残している。半世紀以上のちに、ニュートンはこの三法則をもとに万有引力の法則を導き出しており、ケプラーの緻密な観測データの分析は、近代天文学の扉を開く決定的な一歩となった。若い頃には正多面体を宇宙の構造にあてはめようとする独自の宇宙モデルを発表しており、また月への空想旅行を描いた物語「夢」を著すなど、豊かな想像力と厳密な数学の両方を併せ持つ天文学者であった。",
    bodyHtml:"ドイツの天文学者ヨハネス・ケプラーは、師ティコ・ブラーエが遺した膨大な観測記録、特に火星の動きのデータと格闘し続けた末、惑星は円ではなくわずかにゆがんだ楕円軌道を描いて太陽の周りを回っていることを1609年に発見した。この発見と、その後1619年に導いた法則を合わせて「ケプラーの三法則」と呼び、天文学に数学的な正確さをもたらした。母親が魔女として告発された裁判では弁護のために奔走するなど波乱に満ちた人生を送りながらも研究を続け、望遠鏡のしくみを説明する光学の著作も残している。半世紀以上のちに、ニュートンはこの三法則をもとに万有引力の法則を導き出しており、ケプラーの緻密な観測データの分析は、近代天文学の扉を開く決定的な一歩となった。若い頃には正多面体を宇宙の構造にあてはめようとする独自の宇宙モデルを発表しており、また月への空想旅行を描いた物語「夢」を著すなど、豊かな想像力と厳密な数学の両方を併せ持つ天文学者であった。", source:"legacy", sourceId:"W34" },
  { id:"W35-01", personId:"W35", title:"この人の歩み", tags:["文学"],
    body:"ドイツのハノーファーに生まれ、後にイギリスへ渡ったウィリアム・ハーシェルは、もともと軍楽隊のオーボエ奏者であったが、天文学への情熱から独学で望遠鏡の製作技術を磨き、当時世界最大級の反射望遠鏡を自ら作り上げた。1781年、裏庭での観測中に見慣れない天体を発見し、当初は彗星かと考えたが、詳しく調べた結果、太陽系に新たに加わる惑星「天王星」であることが判明した。この功績によりイギリス国王付きの天文学者に任命され、妹のカロラインも助手として観測を支え、後に自身も優れた天文学者となった。1800年には、太陽光をプリズムで分けた際に赤色の外側にも熱を伝える見えない光があることに気づき、赤外線の存在を初めて発見したことでも知られている。その後も観測を重ねて数千個もの星団や星雲を分類し、太陽系のはるか外側に広がる新たに見つかった小天体を指す「アステロイド（小惑星）」という言葉を提案するなど、宇宙の広大さそのものに対する人類の理解を大きく前進させた。",
    bodyHtml:"ドイツのハノーファーに生まれ、後にイギリスへ渡ったウィリアム・ハーシェルは、もともと軍楽隊のオーボエ奏者であったが、天文学への情熱から独学で望遠鏡の製作技術を磨き、当時世界最大級の反射望遠鏡を自ら作り上げた。1781年、裏庭での観測中に見慣れない天体を発見し、当初は彗星かと考えたが、詳しく調べた結果、太陽系に新たに加わる惑星「天王星」であることが判明した。この功績によりイギリス国王付きの天文学者に任命され、妹のカロラインも助手として観測を支え、後に自身も優れた天文学者となった。1800年には、太陽光をプリズムで分けた際に赤色の外側にも熱を伝える見えない光があることに気づき、赤外線の存在を初めて発見したことでも知られている。その後も観測を重ねて数千個もの星団や星雲を分類し、太陽系のはるか外側に広がる新たに見つかった小天体を指す「アステロイド（小惑星）」という言葉を提案するなど、宇宙の広大さそのものに対する人類の理解を大きく前進させた。", source:"legacy", sourceId:"W35" },
  { id:"W37-01", personId:"W37", title:"この人の歩み", tags:["科学"],
    body:"ドイツの数学者ダヴィド・ヒルベルトは、1900年にパリで開かれた国際数学者会議で、幾何学の基礎から数論まで今後の数学が取り組むべき23個の重要な未解決問題を提示し、その後100年以上にわたる数学研究の方向性を決定づけた。幾何学の公理を整理し直した著作や、無限次元の空間を扱う「ヒルベルト空間」など、数学のさまざまな分野に大きな足跡を残している。一般相対性理論の基礎方程式をアインシュタインとほぼ同時期に導いたことでも知られる。彼が学部長を務めたゲッティンゲン大学は当時世界の数学の中心地として栄えたが、後にナチスの迫害により多くの優秀な研究者が去ることとなった。「我々は知らねばならない、我々は知るであろう」という言葉は、彼の墓碑にも刻まれている。女性数学者エミー・ネーターの採用に大学内で反対の声が上がった際には、「大学は公衆浴場ではない」と述べて強く擁護したという逸話も残っており、真理の前での平等を重んじる姿勢がうかがえる。",
    bodyHtml:"ドイツの数学者ダヴィド・ヒルベルトは、1900年にパリで開かれた国際数学者会議で、幾何学の基礎から数論まで今後の数学が取り組むべき23個の重要な未解決問題を提示し、その後100年以上にわたる数学研究の方向性を決定づけた。幾何学の公理を整理し直した著作や、無限次元の空間を扱う「ヒルベルト空間」など、数学のさまざまな分野に大きな足跡を残している。一般相対性理論の基礎方程式をアインシュタインとほぼ同時期に導いたことでも知られる。彼が学部長を務めたゲッティンゲン大学は当時世界の数学の中心地として栄えたが、後にナチスの迫害により多くの優秀な研究者が去ることとなった。「我々は知らねばならない、我々は知るであろう」という言葉は、彼の墓碑にも刻まれている。女性数学者エミー・ネーターの採用に大学内で反対の声が上がった際には、「大学は公衆浴場ではない」と述べて強く擁護したという逸話も残っており、真理の前での平等を重んじる姿勢がうかがえる。", source:"legacy", sourceId:"W37" },
  { id:"W38-01", personId:"W38", title:"この人の歩み", tags:["科学"],
    body:"ハンガリーのブダペストに生まれたジョン・フォン・ノイマンは、幼い頃から驚異的な記憶力と計算力を示した神童であり、数学・物理学・経済学・コンピュータ科学など、あらゆる分野で並外れた業績を残した。第二次世界大戦中はアメリカに渡り、原子爆弾を開発するマンハッタン計画にも参加する一方、経済学者モルゲンシュテルンとともに「ゲーム理論」という新しい数学の分野を切り開いた。1945年に発表した報告書では、プログラムをデータと同じようにメモリに記憶させて実行するという、現在もほとんどのコンピュータが採用している「ノイマン型」の設計思想を示した。亡くなる直前には、幼い頃に離れていたカトリックの信仰に立ち返ったと伝えられており、あらゆる物事を論理と数式で捉えようとした天才の、人間らしい一面を垣間見せるエピソードとして語り継がれている。初期のコンピュータを使った天気予報の研究にも力を入れ、計算科学という新しい分野を切り開いたことでも知られる。",
    bodyHtml:"ハンガリーのブダペストに生まれたジョン・フォン・ノイマンは、幼い頃から驚異的な記憶力と計算力を示した神童であり、数学・物理学・経済学・コンピュータ科学など、あらゆる分野で並外れた業績を残した。第二次世界大戦中はアメリカに渡り、原子爆弾を開発するマンハッタン計画にも参加する一方、経済学者モルゲンシュテルンとともに「ゲーム理論」という新しい数学の分野を切り開いた。1945年に発表した報告書では、プログラムをデータと同じようにメモリに記憶させて実行するという、現在もほとんどのコンピュータが採用している「ノイマン型」の設計思想を示した。亡くなる直前には、幼い頃に離れていたカトリックの信仰に立ち返ったと伝えられており、あらゆる物事を論理と数式で捉えようとした天才の、人間らしい一面を垣間見せるエピソードとして語り継がれている。初期のコンピュータを使った天気予報の研究にも力を入れ、計算科学という新しい分野を切り開いたことでも知られる。", source:"legacy", sourceId:"W38" },
  { id:"W39-01", personId:"W39", title:"この人の歩み", tags:["科学"],
    body:"イギリスの哲学者・数学者バートランド・ラッセルは、数学の理論全体を論理学だけから組み立てようとする野心的な試みを行い、共著者ホワイトヘッドとともに「プリンキピア・マテマティカ」という大著をまとめ上げた。その一方で、第一次世界大戦では反戦活動を理由に投獄されるなど、生涯を通じて社会問題にも力強く発言し続けた人物である。1955年には晩年のアインシュタインとともに核兵器の危険性を訴える声明を発表し、核兵器廃絶を求める運動の出発点をつくった。学問だけでなく、人道的な理想を訴える幅広い著作活動が評価され、1950年にはノーベル文学賞を受賞している。97歳で亡くなるまで、学問と社会運動の両方で世界に強い影響を与え続けた。1945年に出版した「西洋哲学史」は難解な哲学を一般の読者にも読みやすくまとめた入門書として世界中で親しまれ、多方面にわたる旺盛な著述活動でも広く知られている。",
    bodyHtml:"イギリスの哲学者・数学者バートランド・ラッセルは、数学の理論全体を論理学だけから組み立てようとする野心的な試みを行い、共著者ホワイトヘッドとともに「プリンキピア・マテマティカ」という大著をまとめ上げた。その一方で、第一次世界大戦では反戦活動を理由に投獄されるなど、生涯を通じて社会問題にも力強く発言し続けた人物である。1955年には晩年のアインシュタインとともに核兵器の危険性を訴える声明を発表し、核兵器廃絶を求める運動の出発点をつくった。学問だけでなく、人道的な理想を訴える幅広い著作活動が評価され、1950年にはノーベル文学賞を受賞している。97歳で亡くなるまで、学問と社会運動の両方で世界に強い影響を与え続けた。1945年に出版した「西洋哲学史」は難解な哲学を一般の読者にも読みやすくまとめた入門書として世界中で親しまれ、多方面にわたる旺盛な著述活動でも広く知られている。", source:"legacy", sourceId:"W39" },
  { id:"W40-01", personId:"W40", title:"この人の歩み", tags:["科学"],
    body:"イギリスの数学者アラン・チューリングは、1936年に発表した論文の中で「チューリングマシン」という考え方を示し、計算とは何かを数学的に定義してコンピュータ科学の基礎を築いた。第二次世界大戦中はブレッチリー・パークで暗号解読チームに加わり、解読が不可能とされたドイツ軍の暗号機「エニグマ」を解く機械を開発して、戦争の終結を早めたと評価されている。1950年には、機械が人間のように考えているかどうかを判定する「チューリングテスト」を提案し、人工知能という分野の先駆けともなった。しかし当時の法律のもとで同性愛者であることを理由に不当な扱いを受け、41歳の若さで世を去った。2013年、イギリス政府は彼の名誉を正式に回復し、「コンピュータ科学の父」としての功績はいま世界中で称えられている。実は長距離走の名手でもあり、フルマラソンをオリンピック選手に近いタイムで走り切ったこともあるという、研究者としての顔だけにとどまらない一面も持ち合わせていた。",
    bodyHtml:"イギリスの数学者アラン・チューリングは、1936年に発表した論文の中で「チューリングマシン」という考え方を示し、計算とは何かを数学的に定義してコンピュータ科学の基礎を築いた。第二次世界大戦中はブレッチリー・パークで暗号解読チームに加わり、解読が不可能とされたドイツ軍の暗号機「エニグマ」を解く機械を開発して、戦争の終結を早めたと評価されている。1950年には、機械が人間のように考えているかどうかを判定する「チューリングテスト」を提案し、人工知能という分野の先駆けともなった。しかし当時の法律のもとで同性愛者であることを理由に不当な扱いを受け、41歳の若さで世を去った。2013年、イギリス政府は彼の名誉を正式に回復し、「コンピュータ科学の父」としての功績はいま世界中で称えられている。実は長距離走の名手でもあり、フルマラソンをオリンピック選手に近いタイムで走り切ったこともあるという、研究者としての顔だけにとどまらない一面も持ち合わせていた。", source:"legacy", sourceId:"W40" },
  { id:"W41-01", personId:"W41", title:"この人の歩み", tags:["科学"],
    body:"スイスの数学者レオンハルト・オイラーは、生涯におよそ800編以上ともいわれる膨大な論文や著作を残し、数学のほとんどすべての分野にその名がついた定理や記号が存在するほどの功績を残した人物である。関数を表す記号「f(x)」や円周率を表す「π」、自然対数の底「e」など、今も使われる多くの数学記号を広めたことでも知られる。ケーニヒスベルクの七つの橋を一筆書きで渡れるかという問題を考察し、後のグラフ理論という新しい分野の出発点を作った。30代で右目の視力を失い、晩年にはほぼ完全に失明してしまったが、それでも研究意欲は少しも衰えず、頭の中だけで複雑な計算をこなし、弟子に口述筆記させて論文を書き続けたと伝えられている。ロシアのサンクトペテルブルクとプロイセンのベルリンで長年にわたり研究生活を送り、13人もの子どもに恵まれた家庭人としての一面も持ち合わせていた。",
    bodyHtml:"スイスの数学者レオンハルト・オイラーは、生涯におよそ800編以上ともいわれる膨大な論文や著作を残し、数学のほとんどすべての分野にその名がついた定理や記号が存在するほどの功績を残した人物である。関数を表す記号「f(x)」や円周率を表す「π」、自然対数の底「e」など、今も使われる多くの数学記号を広めたことでも知られる。ケーニヒスベルクの七つの橋を一筆書きで渡れるかという問題を考察し、後のグラフ理論という新しい分野の出発点を作った。30代で右目の視力を失い、晩年にはほぼ完全に失明してしまったが、それでも研究意欲は少しも衰えず、頭の中だけで複雑な計算をこなし、弟子に口述筆記させて論文を書き続けたと伝えられている。ロシアのサンクトペテルブルクとプロイセンのベルリンで長年にわたり研究生活を送り、13人もの子どもに恵まれた家庭人としての一面も持ち合わせていた。", source:"legacy", sourceId:"W41" },
  { id:"W43-01", personId:"W43", title:"この人の歩み", tags:["発明"],
    body:"イギリスの数学者チャールズ・バベッジは、当時手計算で作られていた数表に多くの誤りが含まれていることに心を痛め、多項式の値を自動的に計算する機械式計算機「階差機関」の設計に取り組んだ。さらに、パンチカードで命令を与え、記憶装置と演算装置を備えた汎用的な計算機「解析機関」を構想し、これは現代のコンピュータの原型ともいえるものであった。数学者エイダ・ラブレスは、この解析機関のためにベルヌーイ数を計算する手順を書き記しており、これは世界最初のコンピュータプログラムとされている。当時の工作技術では精密な部品を作ることができず、いずれの機械も彼の存命中に完成することはなかったが、1991年にロンドンの科学博物館が設計図をもとに階差機関を復元し、実際に正しく動くことが証明された。詩人バイロンの娘であったエイダは、その才知から「数の魔術師」と呼ばれ、バベッジのよき理解者として彼のアイデアの重要性をいち早く見抜いた人物であった。",
    bodyHtml:"イギリスの数学者チャールズ・バベッジは、当時手計算で作られていた数表に多くの誤りが含まれていることに心を痛め、多項式の値を自動的に計算する機械式計算機「階差機関」の設計に取り組んだ。さらに、パンチカードで命令を与え、記憶装置と演算装置を備えた汎用的な計算機「解析機関」を構想し、これは現代のコンピュータの原型ともいえるものであった。数学者エイダ・ラブレスは、この解析機関のためにベルヌーイ数を計算する手順を書き記しており、これは世界最初のコンピュータプログラムとされている。当時の工作技術では精密な部品を作ることができず、いずれの機械も彼の存命中に完成することはなかったが、1991年にロンドンの科学博物館が設計図をもとに階差機関を復元し、実際に正しく動くことが証明された。詩人バイロンの娘であったエイダは、その才知から「数の魔術師」と呼ばれ、バベッジのよき理解者として彼のアイデアの重要性をいち早く見抜いた人物であった。", source:"legacy", sourceId:"W43" },
  { id:"W44-01", personId:"W44", title:"この人の歩み", tags:["科学"],
    body:"ドイツの哲学者・数学者ゴットフリード・ライプニッツは、イギリスのニュートンとほぼ同じ時期に、互いに影響を受けることなく独立して微分積分学を作り上げた。今日使われている「dx」や積分記号「∫」といった数学記号の多くは、実は分かりやすさを重視した彼の考案によるものである。哲学者としては、この世界は神が創り得た数ある世界の中で最善のものであるという考えを唱え、後にヴォルテールの小説「カンディード」で皮肉られるほど広く知られる説となった。また、0と1だけで数を表す二進法の考え方を研究し、四則演算をこなせる機械式計算機も設計するなど、法律家や外交官としての顔も持ちながら、生涯にわたり驚くほど幅広い分野で業績を残した。長年ハノーファー選帝侯の図書館長を務めながら各地の宮廷で外交にも携わり、微積分の先取権をめぐるニュートンとの論争は、彼の晩年を悩ませる大きな出来事となった。",
    bodyHtml:"ドイツの哲学者・数学者ゴットフリード・ライプニッツは、イギリスのニュートンとほぼ同じ時期に、互いに影響を受けることなく独立して微分積分学を作り上げた。今日使われている「dx」や積分記号「∫」といった数学記号の多くは、実は分かりやすさを重視した彼の考案によるものである。哲学者としては、この世界は神が創り得た数ある世界の中で最善のものであるという考えを唱え、後にヴォルテールの小説「カンディード」で皮肉られるほど広く知られる説となった。また、0と1だけで数を表す二進法の考え方を研究し、四則演算をこなせる機械式計算機も設計するなど、法律家や外交官としての顔も持ちながら、生涯にわたり驚くほど幅広い分野で業績を残した。長年ハノーファー選帝侯の図書館長を務めながら各地の宮廷で外交にも携わり、微積分の先取権をめぐるニュートンとの論争は、彼の晩年を悩ませる大きな出来事となった。", source:"legacy", sourceId:"W44" },
  { id:"W45-01", personId:"W45", title:"この人の歩み", tags:["医学"],
    body:"ベルギー（フランドル地方）出身のアンドレアス・ヴェサリウスは、パドヴァ大学でわずか23歳という若さで解剖学の教授となり、当時絶対的な権威とされていた古代ローマの医学者ガレノスの解剖学書に、動物の解剖に基づく誤りが数多く含まれていることに気づいた。そこで自ら人体の解剖を重ね、精密な観察に基づく成果を1543年、「ファブリカ」という書物にまとめ上げた。精巧な図版とともに人体の構造を正確に示したこの本は近代解剖学の出発点となる歴史的名著と評価されている。その後は神聖ローマ皇帝カール5世やスペイン王フェリペ2世の侍医として仕えたが、晩年に地中海への航海に出た帰路、船が難破し、ギリシャの島で命を落としたと伝えられている。公開の解剖講義は学生だけでなく多くの見物人を集める人気の催しとなり、それまで書物の権威をうのみにしていた医学のあり方を、自らの目で確かめる実証的な姿勢へと大きく転換させた先駆者であった。",
    bodyHtml:"ベルギー（フランドル地方）出身のアンドレアス・ヴェサリウスは、パドヴァ大学でわずか23歳という若さで解剖学の教授となり、当時絶対的な権威とされていた古代ローマの医学者ガレノスの解剖学書に、動物の解剖に基づく誤りが数多く含まれていることに気づいた。そこで自ら人体の解剖を重ね、精密な観察に基づく成果を1543年、「ファブリカ」という書物にまとめ上げた。精巧な図版とともに人体の構造を正確に示したこの本は近代解剖学の出発点となる歴史的名著と評価されている。その後は神聖ローマ皇帝カール5世やスペイン王フェリペ2世の侍医として仕えたが、晩年に地中海への航海に出た帰路、船が難破し、ギリシャの島で命を落としたと伝えられている。公開の解剖講義は学生だけでなく多くの見物人を集める人気の催しとなり、それまで書物の権威をうのみにしていた医学のあり方を、自らの目で確かめる実証的な姿勢へと大きく転換させた先駆者であった。", source:"legacy", sourceId:"W45" },
  { id:"W46-01", personId:"W46", title:"この人の歩み", tags:["芸術"],
    body:"アメリカのサミュエル・モースは、もともと肖像画家として活動し、大学で絵画を教えるほどの腕前を持っていた人物である。旅先で妻が急死した知らせが手紙で届くのに何日もかかり、埋葬にすら間に合わなかったという悲しい経験が、遠くに一瞬で情報を伝える手段を作りたいという思いにつながったと伝えられる。彼は電信機の実用化に取り組み、助手アルフレッド・ヴェイルの協力を得て、短点と長点の組み合わせで文字を表す「モールス信号」を完成させた。1844年5月24日、ワシントンからボルティモアへ「神は何をなされたか」という聖書の一節を打電することに成功し、これが世界初の実用的な電信通信となった。この発明は瞬く間に世界中に広まり、通信技術の新時代の幕開けを告げるものとなった。画家としても、アメリカ国立デザインアカデミーを設立して初代会長を務めるなど美術界に大きく貢献しており、芸術と発明という二つの才能を併せ持った人物であった。",
    bodyHtml:"アメリカのサミュエル・モースは、もともと肖像画家として活動し、大学で絵画を教えるほどの腕前を持っていた人物である。旅先で妻が急死した知らせが手紙で届くのに何日もかかり、埋葬にすら間に合わなかったという悲しい経験が、遠くに一瞬で情報を伝える手段を作りたいという思いにつながったと伝えられる。彼は電信機の実用化に取り組み、助手アルフレッド・ヴェイルの協力を得て、短点と長点の組み合わせで文字を表す「モールス信号」を完成させた。1844年5月24日、ワシントンからボルティモアへ「神は何をなされたか」という聖書の一節を打電することに成功し、これが世界初の実用的な電信通信となった。この発明は瞬く間に世界中に広まり、通信技術の新時代の幕開けを告げるものとなった。画家としても、アメリカ国立デザインアカデミーを設立して初代会長を務めるなど美術界に大きく貢献しており、芸術と発明という二つの才能を併せ持った人物であった。", source:"legacy", sourceId:"W46" },
  { id:"W47-01", personId:"W47", title:"この人の歩み", tags:["科学"],
    body:"アメリカの物理学者スティーヴン・ワインバーグは、電磁気力と、原子核の中で働く弱い力という一見異なる二つの力が、実は一つの理論で説明できることを示し、グラショウ、サラムとともに1979年にノーベル物理学賞を受賞した。この理論はのちに実験で発見されるW粒子やZ粒子の存在を予言しており、素粒子物理学の「標準模型」と呼ばれる理論体系の中心的な柱の一つとなっている。1977年に出版した一般向けの著書「宇宙創成はじめの三分間」では、ビッグバン直後の宇宙の姿を分かりやすい言葉で描き、世界的なベストセラーとなった。その中で記した「宇宙が理解可能に見えるほど、それは無意味にも見える」という一節は、科学と人間の存在について深く考えさせる言葉として今も広く引用されている。テキサス大学オースティン校で長く教鞭を執り、専門的な研究にとどまらず科学の歴史そのものを問い直す著作も残すなど、生涯にわたり科学の面白さを社会に伝え続けた研究者であった。",

  { id:"W48-01", personId:"W48", title:"この人の歩み", tags:["科学"],

/* ============ ここから表示ロジック ============ */
var grid = document.getElementById('grid');
var detailSection = document.getElementById('detail');
var searchInput = document.getElementById('search-input');
var fieldSelect = document.getElementById('field-select');
var randomBtn = document.getElementById('random-btn');
var currentPersonId = null;

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(s){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];
  });
}

function renderAvatar(person, size){
  if (person.photo){
    return '<img src="' + escapeHtml(person.photo) + '" alt="' + escapeHtml(person.name) + 'の写真" class="avatar-img" style="width:' + size + 'px;height:' + size + 'px;">';
  }
  var color = FIELD_COLORS[person.field] || FIELD_COLORS.default;
  var initial = person.name.charAt(0);
  return '<div class="avatar-mono" style="width:' + size + 'px;height:' + size + 'px;background:' + color + ';font-size:' + Math.round(size * 0.45) + 'px;">' + escapeHtml(initial) + '</div>';
}

function renderCard(person){
  return '<button type="button" class="person-card" data-id="' + person.id + '">' +
    renderAvatar(person, 64) +
    '<div class="person-card-info">' +
      '<p class="person-card-name">' + escapeHtml(person.name) + '</p>' +
      '<p class="person-card-sub">' + escapeHtml(person.years) + '・' + escapeHtml(person.field) + '</p>' +
    '</div></button>';
}

function populateFieldSelect(){
  var fields = [];
  PEOPLE.forEach(function(p){ if (fields.indexOf(p.field) === -1) fields.push(p.field); });
  fields.sort();
  var options = ['<option value="すべて">すべての分野</option>'];
  fields.forEach(function(f){ options.push('<option value="' + escapeHtml(f) + '">' + escapeHtml(f) + '</option>'); });
  fieldSelect.innerHTML = options.join('');
}

var selectedTag = null;

function getPersonTags(personId){
  var tags = [];
  EPISODES.filter(function(e){ return e.personId === personId; }).forEach(function(e){
    e.tags.forEach(function(t){ if (tags.indexOf(t) === -1) tags.push(t); });
  });
  return tags;
}

function populateTagCards(){
  var allTags = [];
  EPISODES.forEach(function(e){
    e.tags.forEach(function(t){ if (allTags.indexOf(t) === -1) allTags.push(t); });
  });
  allTags.sort();
  var list = document.getElementById('tag-card-list');
  list.innerHTML = allTags.map(function(t){
    return '<button type="button" class="tag-card" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</button>';
  }).join('');
  list.querySelectorAll('.tag-card').forEach(function(btn){
    btn.addEventListener('click', function(){
      var tag = btn.dataset.tag;
      if (selectedTag === tag){
        selectedTag = null;
        btn.classList.remove('is-active');
      } else {
        list.querySelectorAll('.tag-card').forEach(function(b){ b.classList.remove('is-active'); });
        selectedTag = tag;
        btn.classList.add('is-active');
      }
      document.getElementById('tag-cards-current').textContent = selectedTag ? '：' + selectedTag : '';
      renderGrid();
    });
  });
}

function initTagCardsToggle(){
  var toggle = document.getElementById('tag-cards-toggle');
  var list = document.getElementById('tag-card-list');
  toggle.addEventListener('click', function(){
    var expanded = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!expanded));
    list.hidden = expanded;
  });
}

function getFilteredPeople(){
  var query = searchInput.value.trim();
  var fieldValue = fieldSelect.value;
  return PEOPLE.filter(function(p){
    var matchesQuery = !query || p.name.indexOf(query) !== -1 || p.reading.indexOf(query) !== -1 ||
      (p.legacyName && p.legacyName.indexOf(query) !== -1) ||
      (p.legacyReading && p.legacyReading.indexOf(query) !== -1);
    var matchesField = fieldValue === 'すべて' || p.field === fieldValue;
    var matchesTag = !selectedTag || getPersonTags(p.id).indexOf(selectedTag) !== -1;
    return matchesQuery && matchesField && matchesTag;
  });
}

function renderGrid(){
  var filtered = getFilteredPeople();
  grid.innerHTML = filtered.length
    ? filtered.map(renderCard).join('')
    : '<p class="empty-message">該当する人物が見つかりません。</p>';
}

function buildDetailHtml(person, episodes){
  var episodesHtml = episodes.map(function(ep){
    return '<h3 class="episode-title">' + escapeHtml(ep.title) + '</h3>' +
      '<div class="episode-body" data-episode-id="' + ep.id + '">' + ep.bodyHtml + '</div>';
  }).join('');

  var tags = episodes.length ? episodes[0].tags : [];
  var tagsHtml = tags.map(function(t){ return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('');

  var hasQuotes = person.quotes && person.quotes.length > 0;
  var quotesHtml = hasQuotes ? person.quotes.map(function(q){ return '<li>' + escapeHtml(q) + '</li>'; }).join('') : '';
  var quotesSectionHtml = hasQuotes
    ? '<h3 class="quotes-title">この人の名言</h3><ul class="quote-list">' + quotesHtml + '</ul>'
    : '';

  return (
    '<div class="detail-top"><button type="button" class="close-btn" id="close-detail-btn">✕ 閉じる</button></div>' +
    '<div class="person-meta">' +
      renderAvatar(person, 120) +
      '<h2 class="person-name">' + person.nameHtml + '</h2>' +
      '<p class="person-sub">' + escapeHtml(person.years) + '・' + escapeHtml(person.country) + '・' + escapeHtml(person.field) + '</p>' +
      '<div class="tags">' + tagsHtml + '</div>' +
    '</div>' +
    '<div class="audio-compact" role="group" aria-label="読み上げの操作">' +
      '<button type="button" id="play-btn" aria-label="再生">▶</button>' +
      '<button type="button" id="pause-btn" aria-label="一時停止">⏸</button>' +
      '<button type="button" id="stop-btn" aria-label="停止">■</button>' +
      '<input class="rate-range-compact" id="rate-range" type="range" min="0.5" max="1.5" step="0.1" value="1.0" aria-label="読み上げの速さ">' +
      '<span class="rate-value-compact"><span id="rate-value">1.0</span>倍</span>' +
    '</div>' +
    '<div class="speech-options"><label for="speech-voice">読み上げの声</label><select id="speech-voice" aria-describedby="speech-warning"></select></div>' +
    '<p id="speech-warning" class="speech-warning" hidden></p>' +
    '<p id="speech-status" class="speech-status" role="status" aria-live="polite"></p>' +
    episodesHtml +
    quotesSectionHtml +
    '<section class="controls" aria-label="表示の設定">' +
      '<div class="control-group">' +
        '<span class="control-label">文字の大きさ</span>' +
        '<div class="btn-group" role="group">' +
          '<button type="button" data-size="small">小</button>' +
          '<button type="button" data-size="medium" class="is-active">中</button>' +
          '<button type="button" data-size="large">大</button>' +
        '</div>' +
      '</div>' +
    '</section>'
  );
}

var SPEECH_EPISODE_READINGS = {};
var speechReadingCache = null;

function decodeSpeechHtml(text){
  return text.replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi, function(entity, code){
    var named = {amp:'&', lt:'<', gt:'>', quot:'"', apos:"'"};
    if (code.charAt(0) !== '#') return named[code.toLowerCase()];
    var value = code.charAt(1).toLowerCase() === 'x' ? parseInt(code.slice(2),16) : parseInt(code.slice(1),10);
    return value > 0 && value <= 0x10ffff ? String.fromCodePoint(value) : entity;
  });
}

function rubyReadings(html){
  var entries = [];
  html.replace(/<ruby\b[^>]*>([\s\S]*?)<\/ruby>/gi, function(_, content){
    var rt = content.match(/<rt\b[^>]*>([\s\S]*?)<\/rt>/i);
    if (!rt) return _;
    var base = content.replace(/<(?:rt|rp)\b[^>]*>[\s\S]*?<\/(?:rt|rp)>/gi, '').replace(/<[^>]+>/g, '');
    entries.push([decodeSpeechHtml(base), decodeSpeechHtml(rt[1].replace(/<[^>]+>/g, ''))]);
    return _;
  });
  return entries;
}

function rubySpeechText(html){
  return decodeSpeechHtml(html.replace(/<ruby\b[^>]*>([\s\S]*?)<\/ruby>/gi, function(original, content){
    var rt = content.match(/<rt\b[^>]*>([\s\S]*?)<\/rt>/i);
    return rt ? rt[1] : content;
  }).replace(/<rp\b[^>]*>[\s\S]*?<\/rp>/gi,'').replace(/<[^>]+>/g,''));
}

function buildSpeechReadings(person, episode){
  if (!speechReadingCache){
    var collected = new Map();
    EPISODES.forEach(function(ep){
      rubyReadings(ep.bodyHtml).forEach(function(pair){
        if (pair[0].length < 2 || !/[一-鿿々]/.test(pair[0])) return;
        if (collected.has(pair[0]) && collected.get(pair[0]) !== pair[1]) collected.set(pair[0], null);
        else if (!collected.has(pair[0])) collected.set(pair[0], pair[1]);
      });
    });
    PEOPLE.forEach(function(p){
      // 人名は名前全体を登録。名字の一部が他の単語に混ざる誤変換を避ける。
      var html = p.nameHtml.split('（')[0];
      var name = decodeSpeechHtml(html.replace(/<rt>[\s\S]*?<\/rt>/g,'').replace(/<[^>]+>/g,''));
      if (/[一-鿿々]/.test(name)) collected.set(name, rubySpeechText(html));
    });
    speechReadingCache = Array.from(collected).filter(function(pair){ return pair[1] && pair[0] !== pair[1]; });
  }
  var map = new Map(speechReadingCache.map(function(pair){ return [pair[0], {reading:pair[1], boundary:false}]; }));
  // 本人の名字・名前だけで登場する箇所にも対応。単漢字は自動置換しない。
  rubyReadings(person.nameHtml).forEach(function(pair){
    if (pair[0].length >= 2 && !map.has(pair[0])) map.set(pair[0], {reading:pair[1], boundary:true});
  });
  [SPEECH_READINGS, SPEECH_EPISODE_READINGS[episode.id] || {}].forEach(function(dictionary){
    Object.keys(dictionary).forEach(function(word){ map.set(word, {reading:dictionary[word], boundary:false}); });
  });
  return Array.from(map).sort(function(a,b){ return b[0].length - a[0].length; });
}

function applySpeechReadings(text, entries){
  var result = '';
  for (var i = 0; i < text.length;){
    var match = entries.find(function(entry){
      if (text.slice(i,i+entry[0].length) !== entry[0]) return false;
      return !entry[1].boundary || !/[一-鿿々]/.test((text[i-1] || '') + (text[i+entry[0].length] || ''));
    });
    if (match){ result += match[1].reading; i += match[0].length; }
    else { result += text[i]; i++; }
  }
  return result;
}

function buildSpeechChunks(person, episodes){
  var chunks = [];
  episodes.forEach(function(ep){
    var entries = buildSpeechReadings(person, ep);
    [ep.title + '。', rubySpeechText(ep.bodyHtml)].forEach(function(text){
      // 一文ずつ渡し、長い文章でも続きから再生・設定変更できるようにする。
      var sentences = text.match(/[^。！？!?\n]+[。！？!?]*[」』）)]*|[。！？!?]+/g) || [];
      sentences.forEach(function(sentence){
        var spoken = applySpeechReadings(sentence,entries).trim();
        if (spoken) chunks.push(spoken);
      });
    });
  });
  return chunks;
}

function getJapaneseSpeechVoices(){
  return window.speechSynthesis.getVoices().filter(function(voice){
    return /^ja(?:[-_]|$)/i.test(voice.lang) && voice.localService;
  }).sort(function(a,b){ return Number(b.default) - Number(a.default) || a.name.localeCompare(b.name,'ja'); });
}

var speechSupported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
var selectedSpeechVoice = '';
var disposeSpeechControls = null;

function bindDetailControls(person, episodes){
  var sizeMap = { small:{ body:'16px', title:'19px' }, medium:{ body:'18px', title:'22px' }, large:{ body:'22px', title:'26px' } };
  var sizeButtons = detailSection.querySelectorAll('[data-size]');
  sizeButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      sizeButtons.forEach(function(b){ b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      var size = sizeMap[btn.dataset.size];
      document.documentElement.style.setProperty('--fs-body', size.body);
      document.documentElement.style.setProperty('--fs-title', size.title);
    });
  });

  document.getElementById('close-detail-btn').addEventListener('click', closeDetail);

  var playBtn = document.getElementById('play-btn');
  var pauseBtn = document.getElementById('pause-btn');
  var stopBtn = document.getElementById('stop-btn');
  var rateRange = document.getElementById('rate-range');
  var rateValue = document.getElementById('rate-value');
  var warning = document.getElementById('speech-warning');
  var voiceSelect = document.getElementById('speech-voice');
  var status = document.getElementById('speech-status');

  if (!speechSupported){
    warning.textContent = 'このブラウザは音声読み上げに対応していません。';
    warning.hidden = false;
    playBtn.disabled = true; pauseBtn.disabled = true; stopBtn.disabled = true; rateRange.disabled = true; voiceSelect.disabled = true;
    return;
  }

  var synth = window.speechSynthesis;
  var chunks = buildSpeechChunks(person, episodes);
  var voices = [];
  var index = 0;
  var generation = 0;
  var active = false;
  var paused = false;
  var currentRate = 1.0;
  var currentUtterance = null;
  var disposed = false;

  function voiceKey(voice){ return voice.voiceURI || voice.name + '|' + voice.lang; }
  function updateButtons(){
    playBtn.disabled = !voices.length || !chunks.length;
    pauseBtn.disabled = !active || paused;
    stopBtn.disabled = !active && index === 0;
  }
  function cancelPlayback(){
    generation++;
    active = false;
    paused = false;
    currentUtterance = null;
    synth.cancel();
    updateButtons();
  }
  function refreshVoices(){
    if (disposed) return;
    voices = getJapaneseSpeechVoices();
    voiceSelect.innerHTML = voices.length ? voices.map(function(voice){
      return '<option value="' + escapeHtml(voiceKey(voice)) + '">' + escapeHtml(voice.name) + '</option>';
    }).join('') : '<option value="">日本語音声がありません</option>';
    var preferred = voices.find(function(voice){ return voiceKey(voice) === selectedSpeechVoice; }) || voices[0];
    if (preferred){ selectedSpeechVoice = voiceKey(preferred); voiceSelect.value = selectedSpeechVoice; }
    voiceSelect.disabled = !voices.length;
    warning.hidden = !!voices.length;
    warning.textContent = 'この端末で使える日本語音声を読み込んでいます。声が表示されない場合は、端末の設定で日本語の読み上げ音声を追加してください。';
    updateButtons();
  }
  function speakFrom(startIndex){
    cancelPlayback();
    var voice = voices.find(function(v){ return voiceKey(v) === voiceSelect.value; });
    if (!voice || !chunks.length) return;
    active = true;
    index = startIndex;
    var token = generation;
    function speakNext(){
      if (disposed || token !== generation) return;
      if (index >= chunks.length){
        active = false; currentUtterance = null; index = 0;
        status.textContent = '読み上げが終わりました。';
        updateButtons();
        return;
      }
      currentUtterance = new SpeechSynthesisUtterance(chunks[index]);
      currentUtterance.lang = voice.lang;
      currentUtterance.voice = voice;
      currentUtterance.rate = currentRate;
      currentUtterance.onend = function(){
        if (token !== generation || disposed) return;
        index++; speakNext();
      };
      currentUtterance.onerror = function(event){
        if (token !== generation || disposed) return;
        cancelPlayback();
        status.textContent = event.error === 'not-allowed' ? '再生ボタンをもう一度押してください。' : '読み上げを続けられませんでした。声を選び直して再生してください。';
      };
      status.textContent = '読み上げ中';
      updateButtons();
      synth.speak(currentUtterance);
    }
    speakNext();
  }

  rateRange.addEventListener('input', function(){
    currentRate = parseFloat(rateRange.value);
    rateValue.textContent = currentRate.toFixed(1);
    if (active && !paused) speakFrom(index);
    else if (paused){ cancelPlayback(); status.textContent = '設定を変更しました。再生すると、この文から続けます。'; }
  });

  voiceSelect.addEventListener('change', function(){
    selectedSpeechVoice = voiceSelect.value;
    if (active && !paused) speakFrom(index);
    else if (paused){ cancelPlayback(); status.textContent = '設定を変更しました。再生すると、この文から続けます。'; }
  });

  playBtn.addEventListener('click', function(){
    if (active && paused){
      synth.resume(); paused = false; status.textContent = '読み上げ中'; updateButtons();
    } else if (!active){
      speakFrom(index);
    } else {
      speakFrom(0);
    }
  });

  pauseBtn.addEventListener('click', function(){
    if (active){ synth.pause(); paused = true; status.textContent = '一時停止中'; updateButtons(); }
  });

  stopBtn.addEventListener('click', function(){
    index = 0; cancelPlayback(); status.textContent = '停止しました。';
  });
  synth.addEventListener('voiceschanged', refreshVoices);
  refreshVoices();
  disposeSpeechControls = function(){
    disposed = true;
    cancelPlayback();
    synth.removeEventListener('voiceschanged', refreshVoices);
  };
}

function openDetail(personId){
  if (disposeSpeechControls){ disposeSpeechControls(); disposeSpeechControls = null; }
  currentPersonId = personId;
  var person = PEOPLE.find(function(p){ return p.id === personId; });
  var episodes = EPISODES.filter(function(e){ return e.personId === personId; });
  detailSection.hidden = false;
  detailSection.innerHTML = buildDetailHtml(person, episodes);
  bindDetailControls(person, episodes);
  detailSection.scrollIntoView({ behavior:'smooth', block:'start' });
}

function closeDetail(){
  if (disposeSpeechControls){ disposeSpeechControls(); disposeSpeechControls = null; }
  currentPersonId = null;
  detailSection.hidden = true;
  detailSection.innerHTML = '';
}

grid.addEventListener('click', function(e){
  var btn = e.target.closest('.person-card');
  if (btn) openDetail(btn.dataset.id);
});

searchInput.addEventListener('input', renderGrid);
fieldSelect.addEventListener('change', renderGrid);

randomBtn.addEventListener('click', function(){
  var pool = getFilteredPeople();
  if (!pool.length) pool = PEOPLE;
  var pick = pool[Math.floor(Math.random() * pool.length)];
  openDetail(pick.id);
});

/* ============ 写真フォールバック：スプレッドシート(CSV)読み込み ============ */
function parseCSV(text){
  var rows = [];
  var lines = text.split(/\r\n|\n/).filter(function(l){ return l.length > 0; });
  lines.forEach(function(line){
    var cells = []; var cur = ''; var inQuotes = false;
    for (var i = 0; i < line.length; i++){
      var ch = line[i];
      if (inQuotes){
        if (ch === '"'){
          if (line[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; }
        } else { cur += ch; }
      } else {
        if (ch === '"'){ inQuotes = true; }
        else if (ch === ','){ cells.push(cur); cur = ''; }
        else { cur += ch; }
      }
    }
    cells.push(cur);
    rows.push(cells);
  });
  return rows;
}

function loadPhotosFromSheet(url){
  if (!url) return;
  fetch(url).then(function(res){
    if (!res.ok) throw new Error('fetch failed: ' + res.status);
    return res.text();
  }).then(function(text){
    var rows = parseCSV(text);
    for (var i = 1; i < rows.length; i++){ // 1行目はヘッダーなのでスキップ
      var id = (rows[i][0] || '').trim();
      var photoUrl = (rows[i][2] || '').trim();
      var person = PEOPLE.find(function(p){ return p.id === id; });
      if (person && photoUrl) person.photo = photoUrl;
    }
    renderGrid();
    if (currentPersonId) openDetail(currentPersonId);
  }).catch(function(err){
    console.warn('写真の読み込みに失敗しました。プレースホルダー表示を続けます。', err);
  });
}

function initBackToTop(){
  var btn = document.getElementById('back-to-top');
  btn.addEventListener('click', function(){
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  });
}

/* ============ 初期化 ============ */
populateFieldSelect();
populateTagCards();
initTagCardsToggle();
initBackToTop();
renderGrid();
loadPhotosFromSheet(CSV_URL);
</script>
