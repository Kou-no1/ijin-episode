  { id:"026", name:"坂本龍馬", nameHtml:"\u003cruby>坂本\u003crt>さかもと\u003c/rt>\u003c/ruby>\u003cruby>龍馬\u003crt>りょうま\u003c/rt>\u003c/ruby>", reading:"さかもとりょうま", years:"1836〜1867年", country:"日本", field:"幕末の志士", photo:null, quotes:["日本を今一度せんたくいたし申候（姉・乙女への手紙より）","世の人は我を何とも言わばいえ、我が成す事は我のみぞ知る","人の世に道は一つということはない。道は百も千も万もある。"], legacyId:"026", legacyQuotes:["日本を今一度せんたくいたし申候（姉・乙女への手紙より）","世の人は我を何とも言わばいえ、我が成す事は我のみぞ知る","人の世に道は一つということはない。道は百も千も万もある。"] },
  { id:"029", name:"福澤諭吉", nameHtml:"\u003cruby>福澤\u003crt>ふくざわ\u003c/rt>\u003c/ruby>\u003cruby>諭吉\u003crt>ゆきち\u003c/rt>\u003c/ruby>", reading:"ふくざわゆきち", years:"1835〜1901年", country:"日本", field:"教育者", photo:null, quotes:["天は人の上に人を造らず、人の下に人を造らずと言えり。","賢人と愚人との別は、学ぶと学ばざるとによって出来るものなり。","独立の気力なき者は、必ず人に依頼す。人に依頼する者は、必ず人を恐る。"], legacyId:"029", legacyQuotes:["天は人の上に人を造らず、人の下に人を造らずと言えり。","賢人と愚人との別は、学ぶと学ばざるとによって出来るものなり。","独立の気力なき者は、必ず人に依頼す。人に依頼する者は、必ず人を恐る。"] },
  { id:"030", name:"渋沢栄一", nameHtml:"\u003cruby>渋沢\u003crt>しぶさわ\u003c/rt>\u003c/ruby>\u003cruby>栄一\u003crt>えいいち\u003c/rt>\u003c/ruby>", reading:"しぶさわえいいち", years:"1840〜1931年", country:"日本", field:"実業家", photo:null, quotes:["夢なき者は理想なし、理想なき者は信念なし。（「夢七訓」より）","正しい道理の富でなければ、その富は完全に永続することができぬ。","真似をするときは、形ではなく心を真似るのがよい。"], legacyId:"030", legacyQuotes:["夢なき者は理想なし、理想なき者は信念なし。（「夢七訓」より）","正しい道理の富でなければ、その富は完全に永続することができぬ。","真似をするときは、形ではなく心を真似るのがよい。"] },
  { id:"031", name:"二宮金次郎（尊徳）", nameHtml:"\u003cruby>二宮\u003crt>にのみや\u003c/rt>\u003c/ruby>\u003cruby>金次郎\u003crt>きんじろう\u003c/rt>\u003c/ruby>（\u003cruby>尊徳\u003crt>そんとく\u003c/rt>\u003c/ruby>）", reading:"にのみやきんじろう", years:"1787〜1856年", country:"日本", field:"農政家", photo:null, quotes:["積小為大 ――小さなことを積み重ねてこそ、大きなことができる。","遠きをはかる者は富み、近くをはかる者は貧す。","貧者は昨日のために今日働き、富者は明日のために今日働く。"], legacyId:"031", legacyQuotes:["積小為大 ――小さなことを積み重ねてこそ、大きなことができる。","遠きをはかる者は富み、近くをはかる者は貧す。","貧者は昨日のために今日働き、富者は明日のために今日働く。"] },
  { id:"061", name:"ヘレン・ケラー", nameHtml:"ヘレン・ケラー", reading:"へれんけらー", years:"1880〜1968年", country:"アメリカ", field:"福祉・社会貢献", photo:null, quotes:["世界で最も素晴らしく、最も美しいものは、目で見たり手で触れたりすることはできません。それは、心で感じなければならないのです。","あきらめずにいれば、あなたが望む、どんなことだってできるものです。","何か素晴らしいことを達成するための努力というものは、決して無駄にならないことを覚えていなさい。"], legacyId:"061", legacyQuotes:["世界で最も素晴らしく、最も美しいものは、目で見たり手で触れたりすることはできません。それは、心で感じなければならないのです。","あきらめずにいれば、あなたが望む、どんなことだってできるものです。","何か素晴らしいことを達成するための努力というものは、決して無駄にならないことを覚えていなさい。"] },
  { id:"002", name:"北里柴三郎", nameHtml:"\u003cruby>北里\u003crt>きたさと\u003c/rt>\u003c/ruby>\u003cruby>柴三郎\u003crt>しばさぶろう\u003c/rt>\u003c/ruby>", reading:"きたさとしばさぶろう", years:"1853〜1931年", country:"日本", field:"医学者", photo:null, quotes:["熱と誠があれば、何事でも達成する。","細菌学者は、国民にとっての命の杖とならねばならない。","研究だけをやっていたのではダメだ。それをどうやって世の中に役立てるかを考えよ。"], legacyId:"002", legacyQuotes:["熱と誠があれば、何事でも達成する。","細菌学者は、国民にとっての命の杖とならねばならない。","研究だけをやっていたのではダメだ。それをどうやって世の中に役立てるかを考えよ。"] },
  { id:"003", name:"志賀潔", nameHtml:"\u003cruby>志賀\u003crt>しが\u003c/rt>\u003c/ruby>\u003cruby>潔\u003crt>きよし\u003c/rt>\u003c/ruby>", reading:"しがきよし", years:"1871〜1957年", country:"日本", field:"医学者", photo:null, quotes:["なにごとも、まじめに、しんぼう強く、元気よくやりとおせば、きっとりっぱな仕事をなしとげることができます。","先人の跡を師とせず、先人の心を師とすべし。","人が病気にならない研究をしよう。"], legacyId:"003", legacyQuotes:["なにごとも、まじめに、しんぼう強く、元気よくやりとおせば、きっとりっぱな仕事をなしとげることができます。","先人の跡を師とせず、先人の心を師とすべし。","人が病気にならない研究をしよう。"] },
  { id:"004", name:"高峰譲吉", nameHtml:"\u003cruby>高峰\u003crt>たかみね\u003c/rt>\u003c/ruby>\u003cruby>譲吉\u003crt>じょうきち\u003c/rt>\u003c/ruby>", reading:"たかみねじょうきち", years:"1854〜1922年", country:"日本", field:"化学者", photo:null, quotes:["困難は発明の母である。資本がなければ、智恵と工夫で乗り越えるほかはない。","日本固有の化学事業というものは、西洋人が知らないのであるから、どうしても日本人がやらなければならぬ仕事と考える。","死んでも成功させなければならぬ。"], legacyId:"004", legacyQuotes:["困難は発明の母である。資本がなければ、智恵と工夫で乗り越えるほかはない。","日本固有の化学事業というものは、西洋人が知らないのであるから、どうしても日本人がやらなければならぬ仕事と考える。","死んでも成功させなければならぬ。"] },
  { id:"005", name:"湯川秀樹", nameHtml:"\u003cruby>湯川\u003crt>ゆかわ\u003c/rt>\u003c/ruby>\u003cruby>秀樹\u003crt>ひでき\u003c/rt>\u003c/ruby>", reading:"ゆかわひでき", years:"1907〜1981年", country:"日本", field:"科学者", photo:null, quotes:["一日生きることは、一歩進むことでありたい。","取り返しのつかない大きな失敗をしたくないなら、早い段階での失敗を恐れてはならない。","真実は、いつも少数派。"], legacyId:"005", legacyField:"物理学者", legacyQuotes:["一日生きることは、一歩進むことでありたい。","取り返しのつかない大きな失敗をしたくないなら、早い段階での失敗を恐れてはならない。","真実は、いつも少数派。"] },
  { id:"008", name:"ニュートン", nameHtml:"ニュートン", reading:"にゅーとん", years:"1642〜1727年", country:"イギリス", field:"科学者", photo:null, quotes:["巨人の肩の上に立っていたからこそ、私は遠くを見渡すことができた。（ロバート・フックへの手紙より）","私は海辺で遊んでいる少年のようなものだ。真理の大海は、すべてが未発見のまま目の前に広がっているというのに。","もし私が価値ある発見をしたのであれば、それは才能ではなく、忍耐強く物事を見つめ続けたことによるものだ。"], legacyId:"008", legacyField:"物理学者", legacyQuotes:["巨人の肩の上に立っていたからこそ、私は遠くを見渡すことができた。（ロバート・フックへの手紙より）","私は海辺で遊んでいる少年のようなものだ。真理の大海は、すべてが未発見のまま目の前に広がっているというのに。","もし私が価値ある発見をしたのであれば、それは才能ではなく、忍耐強く物事を見つめ続けたことによるものだ。"] },
  { id:"009", name:"ダーウィン", nameHtml:"ダーウィン", reading:"だーうぃん", years:"1809〜1882年", country:"イギリス", field:"科学者", photo:null, quotes:["無知というのは、しばしば知識よりも確信に満ちている。","一時間の浪費をなんとも思わない人は、人生の価値をまだ発見してはいない。","愚者の実験が好きで、私は常にそれを行っている。"], legacyId:"009", legacyQuotes:["無知というのは、しばしば知識よりも確信に満ちている。","一時間の浪費をなんとも思わない人は、人生の価値をまだ発見してはいない。","愚者の実験が好きで、私は常にそれを行っている。"] },
  { id:"010", name:"ガリレオ・ガリレイ", nameHtml:"ガリレオ・ガリレイ", reading:"がりれおがりれい", years:"1564〜1642年", country:"イタリア", field:"科学者", photo:null, quotes:["それでも地球は動く。（言い伝え）","聖書は、天国への行き方を教えるものであり、天がどう動くかを教えるものではない。","あらゆる真実は、一度発見されれば理解するのはたやすい。大切なのは、その真実を見つけ出すことだ。"], legacyId:"010", legacyField:"物理学者", legacyQuotes:["それでも地球は動く。（言い伝え）","聖書は、天国への行き方を教えるものであり、天がどう動くかを教えるものではない。","あらゆる真実は、一度発見されれば理解するのはたやすい。大切なのは、その真実を見つけ出すことだ。"] },
  { id:"011", name:"パスツール", nameHtml:"パスツール", reading:"ぱすつーる", years:"1822〜1895年", country:"フランス", field:"科学者", photo:null, quotes:["幸運は、準備のできた心にのみ宿る。","科学に国境はないが、科学者には祖国がある。","偉大な人々は目標を持ち、そうでない人々は願望を持つだけである。"], legacyId:"011", legacyQuotes:["幸運は、準備のできた心にのみ宿る。","科学に国境はないが、科学者には祖国がある。","偉大な人々は目標を持ち、そうでない人々は願望を持つだけである。"] },
  { id:"069", name:"イチロー", nameHtml:"イチロー", reading:"いちろー", years:"1973年〜", country:"日本", field:"スポーツ選手", photo:null, quotes:["小さなことを積み重ねることが、とんでもないところへ行くただ一つの道。","努力せずに何かできるようになる人のことを「天才」というのなら、僕はそうじゃない。","壁というのは、できる人にしかやってこない。"], legacyId:"069", legacyQuotes:["小さなことを積み重ねることが、とんでもないところへ行くただ一つの道。","努力せずに何かできるようになる人のことを「天才」というのなら、僕はそうじゃない。","壁というのは、できる人にしかやってこない。"] },
  { id:"012", name:"フレミング", nameHtml:"アレクサンダー・フレミング", reading:"あれくさんだーふれみんぐ", years:"1881〜1955年", country:"イギリス", field:"医学者", photo:null, quotes:[], legacyId:"012", legacyQuotes:["わたしはただ、自然が用意してくれたものに気づいただけだ。","研究とは、人が見ているものを見て、誰も考えなかったことを考えることである。","失敗した実験ほど、大きな発見のきっかけになることがある。"] },
  { id:"013", name:"メンデル", nameHtml:"メンデル", reading:"めんでる", years:"1822〜1884年", country:"オーストリア", field:"科学者", photo:null, quotes:[], legacyId:"013", legacyQuotes:["わたしの時代はきっと来る。","たった一つのエンドウ豆にも、宇宙をつらぬく法則がかくれている。","何度も何度も数えて、記録すること。それが真実に近づく唯一の道だ。"] },
  { id:"015", name:"ライト兄弟", nameHtml:"ライト兄弟", reading:"らいときょうだい", years:"1867〜1912年・1871〜1948年", country:"アメリカ", field:"発明家", photo:null, quotes:[], legacyId:"015", legacyQuotes:["もし人間が空を飛ぶ運命になかったなら、神はとっくにあきらめさせていたはずだ。","飛ぶことを学ぶには、まず落ちることをおそれないことだ。","わたしたちが成功した秘訣は、ただ一つ。あきらめなかったことだ。"] },
  { id:"016", name:"グラハム・ベル", nameHtml:"グラハム・ベル", reading:"ぐらはむべる", years:"1847〜1922年", country:"イギリス／アメリカ", field:"発明家", photo:null, quotes:[], legacyId:"016", legacyQuotes:["一つの扉が閉じるとき、別の扉が開く。しかし人は、閉じた扉ばかり見つめて、開いた扉に気づかない。","偉大な発見への扉は、いつも半分だけ開いている。","集中せよ。太陽の光も、一点に集めなければ何も燃やせない。"] },
  { id:"017", name:"豊田佐吉", nameHtml:"\u003cruby>豊田\u003crt>とよだ\u003c/rt>\u003c/ruby>\u003cruby>佐吉\u003crt>さきち\u003c/rt>\u003c/ruby>", reading:"とよださきち", years:"1867〜1930年", country:"日本", field:"発明家", photo:null, quotes:[], legacyId:"017", legacyQuotes:["障子を開けてみよ。外は広いぞ。","為せば成る、為さねば成らぬ何事も。","研究は人まねをせず、自分の道を切りひらくものでなければならない。"] },
  { id:"018", name:"田中久重", nameHtml:"\u003cruby>田中\u003crt>たなか\u003c/rt>\u003c/ruby>\u003cruby>久重\u003crt>ひさしげ\u003c/rt>\u003c/ruby>", reading:"たなかひさしげ", years:"1799〜1881年", country:"日本", field:"発明家", photo:null, quotes:[], legacyId:"018", legacyQuotes:["できないと思ったところから、工夫は始まる。","からくりは、人をおどろかせ、そして人の役に立つものでなければならない。","一つの部品も手をぬかず、心をこめて作れ。"] },
  { id:"019", name:"平賀源内", nameHtml:"\u003cruby>平賀\u003crt>ひらが\u003c/rt>\u003c/ruby>\u003cruby>源内\u003crt>げんない\u003c/rt>\u003c/ruby>", reading:"ひらがげんない", years:"1728〜1780年", country:"日本", field:"発明家", photo:null, quotes:[], legacyId:"019", legacyQuotes:["人間、その気になれば、なんでもできる。","役に立たぬものなど、この世にはない。ただ使い方を知らぬだけだ。","わたしは、みんなが「できぬ」と言うことをやってみたいのだ。"] },
  { id:"020", name:"カール・ベンツ", nameHtml:"カール・ベンツ", reading:"かーるべんつ", years:"1844〜1929年", country:"ドイツ", field:"発明家", photo:null, quotes:[], legacyId:"020", legacyQuotes:["馬のいらない馬車を作ろう。それがわたしの夢だった。","一歩一歩、確実に。急いで組み立てた機械は、必ずどこかで壊れる。","新しいものを生み出す者は、いつも笑われる。それでも進み続けよ。"] },
  { id:"021", name:"ジェームズ・ワット", nameHtml:"ジェームズ・ワット", reading:"じぇーむずわっと", years:"1736〜1819年", country:"イギリス", field:"発明家", photo:null, quotes:[], legacyId:"021", legacyQuotes:["蒸気の力は、少し手を加えるだけで、何倍もの仕事をしてくれる。","小さな工夫の積み重ねが、大きな変化を生む。","自然の力をよく観察すれば、そこに答えはすでにある。"] },
  { id:"022", name:"聖徳太子", nameHtml:"\u003cruby>聖徳太子\u003crt>しょうとくたいし\u003c/rt>\u003c/ruby>", reading:"しょうとくたいし", years:"574〜622年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"022", legacyQuotes:["和をもって貴しとなす。","篤く三宝を敬え。三宝とは仏・法・僧なり。","人みな心あり、心おのおの執るところあり。彼是とすれば則ち我は非とす。"] },
  { id:"023", name:"織田信長", nameHtml:"\u003cruby>織田\u003crt>おだ\u003c/rt>\u003c/ruby>\u003cruby>信長\u003crt>のぶなが\u003c/rt>\u003c/ruby>", reading:"おだのぶなが", years:"1534〜1582年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"023", legacyQuotes:["是非に及ばず。","人間五十年、下天のうちをくらぶれば、夢幻の如くなり。","鳴かぬなら 殺してしまえ ホトトギス"] },
  { id:"024", name:"豊臣秀吉", nameHtml:"\u003cruby>豊臣\u003crt>とよとみ\u003c/rt>\u003c/ruby>\u003cruby>秀吉\u003crt>ひでよし\u003c/rt>\u003c/ruby>", reading:"とよとみひでよし", years:"1537〜1598年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"024", legacyQuotes:["鳴かぬなら 鳴かせてみせよう ホトトギス","わしが死んでも、天下は乱すな。","露と落ち 露と消えにし わが身かな 浪速のことは 夢のまた夢"] },
  { id:"025", name:"徳川家康", nameHtml:"\u003cruby>徳川\u003crt>とくがわ\u003c/rt>\u003c/ruby>\u003cruby>家康\u003crt>いえやす\u003c/rt>\u003c/ruby>", reading:"とくがわいえやす", years:"1543〜1616年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"025", legacyQuotes:["鳴かぬなら 鳴くまで待とう ホトトギス","人の一生は重荷を負うて遠き道を行くが如し。急ぐべからず。","堪忍は無事長久の基、怒りは敵と思え。"] },
  { id:"027", name:"西郷隆盛", nameHtml:"\u003cruby>西郷\u003crt>さいごう\u003c/rt>\u003c/ruby>\u003cruby>隆盛\u003crt>たかもり\u003c/rt>\u003c/ruby>", reading:"さいごうたかもり", years:"1828〜1877年", country:"日本", field:"幕末の志士", photo:null, quotes:[], legacyId:"027", legacyQuotes:["敬天愛人（天を敬い、人を愛する）","命もいらず、名もいらず、官位も金もいらぬ人は、仕末に困るものなり。","children children、児孫のために美田を買わず。"] },
  { id:"028", name:"勝海舟", nameHtml:"\u003cruby>勝\u003crt>かつ\u003c/rt>\u003c/ruby>\u003cruby>海舟\u003crt>かいしゅう\u003c/rt>\u003c/ruby>", reading:"かつかいしゅう", years:"1823〜1899年", country:"日本", field:"幕末の志士", photo:null, quotes:[], legacyId:"028", legacyQuotes:["剣を学ぶ者は、まずおのれの心を治めよ。","行いは己のもの、批判は他人のもの。知ったことではない。","なせば成る。なさねば成らぬ。人の世に、なさずして成ることはなし。"] },
  { id:"032", name:"伊能忠敬", nameHtml:"\u003cruby>伊能\u003crt>いのう\u003c/rt>\u003c/ruby>\u003cruby>忠敬\u003crt>ただたか\u003c/rt>\u003c/ruby>", reading:"いのうただたか", years:"1745〜1818年", country:"日本", field:"測量家", photo:null, quotes:[], legacyId:"032", legacyQuotes:["死ぬ日まで、あと少しでも遠くを測りたい。","歩いて、測って、初めて日本の姿がわかる。","五十歳を過ぎてから始めたことが、わたしの一生の仕事になった。"] },
  { id:"033", name:"吉田松陰", nameHtml:"\u003cruby>吉田\u003crt>よしだ\u003c/rt>\u003c/ruby>\u003cruby>松陰\u003crt>しょういん\u003c/rt>\u003c/ruby>", reading:"よしだしょういん", years:"1830〜1859年", country:"日本", field:"教育者", photo:null, quotes:[], legacyId:"033", legacyQuotes:["志を立てて、以て万事の源となす。","身はたとひ武蔵の野辺に朽ちぬとも、留め置かまし大和魂","かくすれば かくなるものと 知りながら やむにやまれぬ 大和魂"] },
  { id:"034", name:"新渡戸稲造", nameHtml:"\u003cruby>新渡戸\u003crt>にとべ\u003c/rt>\u003c/ruby>\u003cruby>稲造\u003crt>いなぞう\u003c/rt>\u003c/ruby>", reading:"にとべいなぞう", years:"1862〜1933年", country:"日本", field:"教育者", photo:null, quotes:[], legacyId:"034", legacyQuotes:["我、太平洋の橋とならん。","武士道は日本人の道徳の背骨である。","人生の第一の目的は、人格の完成にある。"] },
  { id:"035", name:"リンカーン", nameHtml:"リンカーン", reading:"りんかーん", years:"1809〜1865年", country:"アメリカ", field:"政治家・指導者", photo:null, quotes:[], legacyId:"035", legacyQuotes:["人民の、人民による、人民のための政治。","たとえ歩みが遅くとも、後退さえしなければ、それでよいのだ。","わたしの最大の関心事は、神が我々の味方かどうかではない。我々が神の側にいるかどうかだ。"] },
  { id:"036", name:"ワシントン", nameHtml:"ワシントン", reading:"わしんとん", years:"1732〜1799年", country:"アメリカ", field:"政治家・指導者", photo:null, quotes:[], legacyId:"036", legacyQuotes:["正直であることが、常に最良の策である。","私は嘘をつくことができません。木を切ったのは私です。","自由の火は、一度消えたら、二度と燃え上がらないかもしれない。"] },
  { id:"037", name:"ガンディー", nameHtml:"ガンディー", reading:"がんでぃー", years:"1869〜1948年", country:"インド", field:"政治家・指導者", photo:null, quotes:[], legacyId:"037", legacyQuotes:["あなたがこの世界で見たい変化に、あなた自身がなりなさい。","目には目をでは、世界を盲目にするだけだ。","明日死ぬかのように生きよ。永遠に生きるかのように学べ。"] },
  { id:"038", name:"キング牧師", nameHtml:"キング牧師", reading:"きんぐぼくし", years:"1929〜1968年", country:"アメリカ", field:"公民権運動家", photo:null, quotes:[], legacyId:"038", legacyQuotes:["わたしには夢がある。","暗闇を暗闇で追い払うことはできない。それができるのは光だけだ。","人の価値は、その人が試練や論争の時にどこに立っているかで決まる。"] },
  { id:"039", name:"マンデラ", nameHtml:"マンデラ", reading:"まんでら", years:"1918〜2013年", country:"南アフリカ", field:"政治家・指導者", photo:null, quotes:[], legacyId:"039", legacyQuotes:["どんなことも、やってしまうまでは不可能に思えるものだ。","わたしは自由に向かって歩いていた。しかし、もし鎖を持ったままなら、それはまだ自由ではないと気づいた。","教育は、世界を変えるために使うことのできる、最も強力な武器である。"] },
  { id:"040", name:"クレオパトラ", nameHtml:"クレオパトラ", reading:"くれおぱとら", years:"紀元前69〜紀元前30年", country:"古代エジプト", field:"政治家・指導者", photo:null, quotes:[], legacyId:"040", legacyQuotes:["わたしは自分の運命の主人でありたい。","女であることは、弱さではない。使い方を知れば、それは力になる。","王国を失うことより、誇りを失うことのほうが恐ろしい。"] },
  { id:"041", name:"ジャンヌ・ダルク", nameHtml:"ジャンヌ・ダルク", reading:"じゃんぬだるく", years:"1412〜1431年", country:"フランス", field:"英雄", photo:null, quotes:[], legacyId:"041", legacyQuotes:["わたしは神に遣わされてここに来たのです。","恐れることはありません。神とともにあるのですから。","たとえこの身が滅びても、わたしの言葉は残るでしょう。"] },
  { id:"042", name:"始皇帝", nameHtml:"\u003cruby>始皇帝\u003crt>しこうてい\u003c/rt>\u003c/ruby>", reading:"しこうてい", years:"紀元前259〜紀元前210年", country:"中国", field:"政治家・指導者", photo:null, quotes:[], legacyId:"042", legacyQuotes:["天下は一つになるべきものである。","文字も、度量衡も、車の幅も、すべて一つに定めよ。","わたしは不老不死の薬を求めたが、本当に求めるべきは、正しく国を治めることだったのかもしれない。"] },
  { id:"043", name:"レオナルド・ダ・ヴィンチ", nameHtml:"レオナルド・ダ・ヴィンチ", reading:"れおなるどだゔぃんち", years:"1452〜1519年", country:"イタリア", field:"芸術家", photo:null, quotes:[], legacyId:"043", legacyQuotes:["単純さは、究極の洗練である。","絵画をやめてしまった日、その日から絵は死んでしまう。学ぶことをやめてはいけない。","経験に勝る師はいない。"] },
  { id:"044", name:"ミケランジェロ", nameHtml:"ミケランジェロ", reading:"みけらんじぇろ", years:"1475〜1564年", country:"イタリア", field:"芸術家", photo:null, quotes:[], legacyId:"044", legacyQuotes:["わたしは大理石の中に天使を見た。そして、その天使が自由になるまで彫り続けた。","本当の芸術作品は、すべて神の影にすぎない。","もし人々が、わたしがどれほど努力して熟達を身につけたか知ったなら、少しも素晴らしいとは思わないだろう。"] },
  { id:"045", name:"ゴッホ", nameHtml:"ゴッホ", reading:"ごっほ", years:"1853〜1890年", country:"オランダ", field:"芸術家", photo:null, quotes:[], legacyId:"045", legacyQuotes:["わたしはただ、心のままに描いているだけだ。","悲しみはいつまでも続くわけではない。","偉大なことは、小さなことの積み重ねによって成し遂げられる。"] },
  { id:"046", name:"ピカソ", nameHtml:"ピカソ", reading:"ぴかそ", years:"1881〜1973年", country:"スペイン", field:"芸術家", photo:null, quotes:[], legacyId:"046", legacyQuotes:["すべての子どもは芸術家である。問題は、大人になってもそれを保てるかどうかだ。","芸術は、心にたまった日々のちりを洗い流す。","わたしは探すのではない、見つけるのだ。"] },
  { id:"047", name:"ベートーヴェン", nameHtml:"ベートーヴェン", reading:"べーとーゔぇん", years:"1770〜1827年", country:"ドイツ", field:"芸術家", photo:null, quotes:[], legacyId:"047", legacyQuotes:["苦悩を突き抜けて歓喜に至れ。","運命の喉笛をつかんでやる。運命がわたしを完全に打ちのめすことなど、決してさせない。","音楽は、あらゆる知恵、あらゆる哲学よりも高い啓示である。"] },
  { id:"048", name:"モーツァルト", nameHtml:"モーツァルト", reading:"もーつぁると", years:"1756〜1791年", country:"オーストリア", field:"芸術家", photo:null, quotes:[], legacyId:"048", legacyQuotes:["音楽は音符の中にあるのではなく、音符と音符の間の静けさの中にある。","わたしは苦しみと悲しみを、音の中に隠して生きてきた。","天才とは努力を続けることのできる才能のことである。"] },
  { id:"049", name:"バッハ", nameHtml:"バッハ", reading:"ばっは", years:"1685〜1750年", country:"ドイツ", field:"芸術家", photo:null, quotes:[], legacyId:"049", legacyQuotes:["音楽の唯一の目的は、神の栄光と人の心の安らぎのためにある。","勤勉であれば、わたしと同じくらいのことは誰にでもできる。","涙のないところに、心をゆさぶる音楽は生まれない。"] },
  { id:"050", name:"葛飾北斎", nameHtml:"\u003cruby>葛飾\u003crt>かつしか\u003c/rt>\u003c/ruby>\u003cruby>北斎\u003crt>ほくさい\u003c/rt>\u003c/ruby>", reading:"かつしかほくさい", years:"1760〜1849年", country:"日本", field:"芸術家", photo:null, quotes:[], legacyId:"050", legacyQuotes:["あと十年、いや五年生きられたら、本当の絵描きになれたものを。","わたしは六歳の頃から物の形を写す癖があった。","富士山を、あと百通り描いてみたかった。"] },
  { id:"051", name:"歌川広重", nameHtml:"\u003cruby>歌川\u003crt>うたがわ\u003c/rt>\u003c/ruby>\u003cruby>広重\u003crt>ひろしげ\u003c/rt>\u003c/ruby>", reading:"うたがわひろしげ", years:"1797〜1858年", country:"日本", field:"芸術家", photo:null, quotes:[], legacyId:"051", legacyQuotes:["風景は、その土地に生きる人の暮らしとともに描くものだ。","旅をして、この目で見たものしか描かない。","名所とは、人がそこに立って、何を思うかで決まる。"] },
  { id:"052", name:"岡本太郎", nameHtml:"\u003cruby>岡本\u003crt>おかもと\u003c/rt>\u003c/ruby>\u003cruby>太郎\u003crt>たろう\u003c/rt>\u003c/ruby>", reading:"おかもとたろう", years:"1912〜1996年", country:"日本", field:"芸術家", photo:null, quotes:[], legacyId:"052", legacyQuotes:["芸術は爆発だ。","うまくやろうとするな。ただ、思いきりやれ。","何かを作るとは、自分自身を作ることだ。"] },
  { id:"053", name:"紫式部", nameHtml:"\u003cruby>紫式部\u003crt>むらさきしきぶ\u003c/rt>\u003c/ruby>", reading:"むらさきしきぶ", years:"生没年不詳（平安時代中期）", country:"日本", field:"文学者", photo:null, quotes:[], legacyId:"053", legacyQuotes:["物語とは、この世に生きる人の心をなぐさめるためにある。","春はあけぼの、と人はいうけれど、わたしはこの世のすべての季節に美しさを見つけたい。","人の心の奥にあるものこそ、書きとめておく価値がある。"] },
  { id:"054", name:"清少納言", nameHtml:"\u003cruby>清少納言\u003crt>せいしょうなごん\u003c/rt>\u003c/ruby>", reading:"せいしょうなごん", years:"生没年不詳（平安時代中期）", country:"日本", field:"文学者", photo:null, quotes:[], legacyId:"054", legacyQuotes:["春はあけぼの。やうやう白くなりゆく山ぎは、少しあかりて。","すさまじきもの、といえば、昼ほゆる犬。","ものは尽くさで、余りあるようにするのがよい。"] },
  { id:"055", name:"松尾芭蕉", nameHtml:"\u003cruby>松尾\u003crt>まつお\u003c/rt>\u003c/ruby>\u003cruby>芭蕉\u003crt>ばしょう\u003c/rt>\u003c/ruby>", reading:"まつおばしょう", years:"1644〜1694年", country:"日本", field:"文学者", photo:null, quotes:[], legacyId:"055", legacyQuotes:["旅に病んで 夢は枯野を かけ廻る","古池や 蛙飛びこむ 水の音","月日は百代の過客にして、行きかふ年もまた旅人なり。"] },
  { id:"056", name:"夏目漱石", nameHtml:"\u003cruby>夏目\u003crt>なつめ\u003c/rt>\u003c/ruby>\u003cruby>漱石\u003crt>そうせき\u003c/rt>\u003c/ruby>", reading:"なつめそうせき", years:"1867〜1916年", country:"日本", field:"文学者", photo:null, quotes:[], legacyId:"056", legacyQuotes:["智に働けば角が立つ。情に棹させば流される。","則天去私（天に則り、私を去る）","吾輩は猫である。名前はまだ無い。"] },
  { id:"057", name:"樋口一葉", nameHtml:"\u003cruby>樋口\u003crt>ひぐち\u003c/rt>\u003c/ruby>\u003cruby>一葉\u003crt>いちよう\u003c/rt>\u003c/ruby>", reading:"ひぐちいちよう", years:"1872〜1896年", country:"日本", field:"文学者", photo:null, quotes:[], legacyId:"057", legacyQuotes:["筆一本で、この世を生きぬいてみせる。","貧しさは、人の心まで貧しくするものではない。","わたしは、ただ書くことでしか、自分を保てなかった。"] },
  { id:"058", name:"宮沢賢治", nameHtml:"\u003cruby>宮沢\u003crt>みやざわ\u003c/rt>\u003c/ruby>\u003cruby>賢治\u003crt>けんじ\u003c/rt>\u003c/ruby>", reading:"みやざわけんじ", years:"1896〜1933年", country:"日本", field:"文学者", photo:null, quotes:[], legacyId:"058", legacyQuotes:["世界がぜんたい幸福にならないうちは個人の幸福はあり得ない。","雨ニモマケズ 風ニモマケズ","デクノボーと呼ばれても、わたしはわたしのままでいい。"] },
  { id:"059", name:"シェイクスピア", nameHtml:"シェイクスピア", reading:"しぇいくすぴあ", years:"1564〜1616年", country:"イギリス", field:"文学者", photo:null, quotes:[], legacyId:"059", legacyQuotes:["すべての世界は舞台であり、すべての男女はその役者にすぎない。","名前が何だというのだ。バラと呼ぶ花を、他のどんな名で呼んでも、その香りに変わりはない。","短くとも、燃え尽きるろうそくは、長く燃えるより明るく輝く。"] },
  { id:"060", name:"アンデルセン", nameHtml:"アンデルセン", reading:"あんでるせん", years:"1805〜1875年", country:"デンマーク", field:"文学者", photo:null, quotes:[], legacyId:"060", legacyQuotes:["生きることそのものが、おとぎ話なのだ。","旅をすることは、生きることだ。","たとえ醜いアヒルの子と呼ばれても、いつか自分が白鳥だったことに気づく日が来る。"] },
  { id:"062", name:"アンネ・フランク", nameHtml:"アンネ・フランク", reading:"あんねふらんく", years:"1929〜1945年", country:"ドイツ／オランダ", field:"文学者", photo:null, quotes:[] },
  { id:"063", name:"マザー・テレサ", nameHtml:"マザー・テレサ", reading:"まざーてれさ", years:"1910〜1997年", country:"北マケドニア／インド", field:"福祉・社会貢献", photo:null, quotes:[] },
  { id:"064", name:"ナイチンゲール", nameHtml:"ナイチンゲール", reading:"ないちんげーる", years:"1820〜1910年", country:"イギリス", field:"福祉・社会貢献", photo:null, quotes:[], legacyId:"W22", legacyName:"フローレンス・ナイチンゲール", legacyNameHtml:"フローレンス・ナイチンゲール", legacyReading:"ふろーれんすないちんげーる", legacyField:"看護婦・統計学者", legacyQuotes:["わたしたちの体は、神の宮であり、その通りに扱わねばならない。","統計こそ、看護と医療をより良くする最も重要な道具である。","小さなことに、誠実であれ。それが看護の心である。"] },
  { id:"065", name:"シュヴァイツァー", nameHtml:"シュヴァイツァー", reading:"しゅゔぁいつぁー", years:"1875〜1965年", country:"ドイツ／フランス", field:"医学者", photo:null, quotes:[] },
  { id:"066", name:"杉原千畝", nameHtml:"\u003cruby>杉原\u003crt>すぎはら\u003c/rt>\u003c/ruby>\u003cruby>千畝\u003crt>ちうね\u003c/rt>\u003c/ruby>", reading:"すぎはらちうね", years:"1900〜1986年", country:"日本", field:"福祉・社会貢献", photo:null, quotes:[] },
  { id:"067", name:"中村哲", nameHtml:"\u003cruby>中村\u003crt>なかむら\u003c/rt>\u003c/ruby>\u003cruby>哲\u003crt>てつ\u003c/rt>\u003c/ruby>", reading:"なかむらてつ", years:"1946〜2019年", country:"日本", field:"福祉・社会貢献", photo:null, quotes:[] },
  { id:"068", name:"北条政子", nameHtml:"\u003cruby>北条\u003crt>ほうじょう\u003c/rt>\u003c/ruby>\u003cruby>政子\u003crt>まさこ\u003c/rt>\u003c/ruby>", reading:"ほうじょうまさこ", years:"1157〜1225年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"J16", legacyField:"政治家", legacyQuotes:["尼将軍と呼ばれようとも、この鎌倉を守り抜く。","頼朝様のご恩は、山よりも高く、海よりも深い。","女であっても、政（まつりごと）を担うことができる。"] },
  { id:"070", name:"大谷翔平", nameHtml:"\u003cruby>大谷\u003crt>おおたに\u003c/rt>\u003c/ruby>\u003cruby>翔平\u003crt>しょうへい\u003c/rt>\u003c/ruby>", reading:"おおたにしょうへい", years:"1994年〜", country:"日本", field:"スポーツ選手", photo:null, quotes:[] },
  { id:"071", name:"王貞治", nameHtml:"\u003cruby>王\u003crt>おう\u003c/rt>\u003c/ruby>\u003cruby>貞治\u003crt>さだはる\u003c/rt>\u003c/ruby>", reading:"おうさだはる", years:"1940年〜", country:"日本", field:"スポーツ選手", photo:null, quotes:[] },
  { id:"072", name:"円谷幸吉", nameHtml:"\u003cruby>円谷\u003crt>つぶらや\u003c/rt>\u003c/ruby>\u003cruby>幸吉\u003crt>こうきち\u003c/rt>\u003c/ruby>", reading:"つぶらやこうきち", years:"1940〜1968年", country:"日本", field:"スポーツ選手", photo:null, quotes:[] },
  { id:"101", name:"レイチェル・カーソン", nameHtml:"レイチェル・カーソン", reading:"れいちぇるかーそん", years:"1907〜1964年", country:"アメリカ", field:"科学者", photo:null, quotes:[], legacyId:"062", legacyQuotes:["自然は、征服するものではなく、共に生きるものである。","もし人間が、地球上のすべての虫を殺してしまったら、次に消えるのは人間自身かもしれない。","沈黙の春が訪れる前に、わたしたちは気づかなければならない。"] },
  { id:"N01", name:"朝永振一郎", nameHtml:"\u003cruby>朝永\u003crt>ともなが\u003c/rt>\u003c/ruby>\u003cruby>振一郎\u003crt>しんいちろう\u003c/rt>\u003c/ruby>", reading:"ともながしんいちろう", years:"1906〜1979年", country:"日本", field:"物理学者", photo:null, quotes:[], legacyId:"N01", legacyQuotes:["科学とは、疑うことから始まる。","私たちが自然について知っていることは、まだほんのわずかにすぎない。","不確かさを恐れるな。それこそが、量子の世界の本当の姿だ。"] },
  { id:"N02", name:"江崎玲於奈", nameHtml:"\u003cruby>江崎\u003crt>えさき\u003c/rt>\u003c/ruby>\u003cruby>玲於奈\u003crt>れおな\u003c/rt>\u003c/ruby>", reading:"えさきれおな", years:"1925〜1999年", country:"日本", field:"物理学者", photo:null, quotes:[], legacyId:"N02", legacyQuotes:["創造性とは、常識にとらわれず、失敗をおそれずに挑戦する心である。","若い人には、群れを離れて一人で歩く勇気を持ってほしい。","独創的な研究は、誰も見ていない場所にこそ生まれる。"] },
  { id:"N03", name:"白川英樹", nameHtml:"\u003cruby>白川\u003crt>しらかわ\u003c/rt>\u003c/ruby>\u003cruby>英樹\u003crt>ひでき\u003c/rt>\u003c/ruby>", reading:"しらかわひでき", years:"1936〜", country:"日本", field:"化学者", photo:null, quotes:[], legacyId:"N03", legacyQuotes:["失敗の中にこそ、次の発見の芽がある。","教科書に書いてあることがすべてではない。自分の目で確かめよ。","偶然の発見を見逃さない目を、日ごろから養っておくことが大切だ。"] },
  { id:"N04", name:"野依良治", nameHtml:"\u003cruby>野依\u003crt>のより\u003c/rt>\u003c/ruby>\u003cruby>良治\u003crt>りょうじ\u003c/rt>\u003c/ruby>", reading:"のよりりょうじ", years:"1938〜", country:"日本", field:"化学者", photo:null, quotes:[], legacyId:"N04", legacyQuotes:["模倣からは新しいものは生まれない。オリジナリティを追い求めよ。","失敗を恐れて何もしないことこそ、最大の失敗である。","自然界にないものを作り出す。それが化学者のロマンだ。"] , legacyReading:"のよりよしはる", legacyNameHtml:"\u003cruby>野依\u003crt>のより\u003c/rt>\u003c/ruby>\u003cruby>良治\u003crt>よしはる\u003c/rt>\u003c/ruby>" },
  { id:"N05", name:"小柴昌俊", nameHtml:"\u003cruby>小柴\u003crt>こしば\u003c/rt>\u003c/ruby>\u003cruby>昌俊\u003crt>まさとし\u003c/rt>\u003c/ruby>", reading:"こしばまさとし", years:"1926〜2020年", country:"日本", field:"物理学者", photo:null, quotes:[], legacyId:"N05", legacyQuotes:["科学は、誰も見たことのない景色を見るための道具だ。","地下深くの水槽で、何年もひたすら待ち続けた。それでも私は楽しかった。","失敗してもいい。あきらめずに続けることが、いちばん大事なことだ。"] },
  { id:"N06", name:"田中耕一", nameHtml:"\u003cruby>田中\u003crt>たなか\u003c/rt>\u003c/ruby>\u003cruby>耕一\u003crt>こういち\u003c/rt>\u003c/ruby>", reading:"たなかこういち", years:"1959〜", country:"日本", field:"化学者", photo:null, quotes:[], legacyId:"N06", legacyQuotes:["失敗だと思った実験が、思いがけない発見につながることがある。","会社員である私がノーベル賞をいただけたのは、たくさんの人に支えられたからだ。","わからないことをわからないと言える勇気を持ちなさい。"] },
  { id:"N07", name:"山中伸弥", nameHtml:"\u003cruby>山中\u003crt>やまなか\u003c/rt>\u003c/ruby>\u003cruby>伸弥\u003crt>しんや\u003c/rt>\u003c/ruby>", reading:"やまなかしんや", years:"1962〜", country:"日本", field:"生理学・医学者", photo:null, quotes:[], legacyId:"N07", legacyQuotes:["何かを成し遂げるには、九十九回失敗しても、あきらめないことが必要だ。","VW、Vision（ビジョン）とWork hard（一生懸命働くこと）。この二つが夢をかなえる。","人生に無駄なことは一つもない。回り道こそが、道を切りひらく。"] },
  { id:"N08", name:"鈴木章", nameHtml:"\u003cruby>鈴木\u003crt>すずき\u003c/rt>\u003c/ruby>\u003cruby>章\u003crt>あきら\u003c/rt>\u003c/ruby>", reading:"すずきあきら", years:"1930〜", country:"日本", field:"化学者", photo:null, quotes:[], legacyId:"N08", legacyQuotes:["研究とは、地道な作業の積み重ねである。","若い人には、失敗を恐れず挑戦してほしい。","一つの発見が、世界中の人の役に立つ。それが化学の面白さだ。"] },
  { id:"N09", name:"根岸英一", nameHtml:"\u003cruby>根岸\u003crt>ねぎし\u003c/rt>\u003c/ruby>\u003cruby>英一\u003crt>えいいち\u003c/rt>\u003c/ruby>", reading:"ねぎしえいいち", years:"1935〜", country:"日本", field:"化学者", photo:null, quotes:[], legacyId:"N09", legacyQuotes:["夢を持ち続けることが、何より大切だ。","七転び八起き。何度失敗しても、立ち上がればいい。","化学は、この世界に新しい価値を作り出す学問である。"] },
  { id:"N10", name:"赤崎勇", nameHtml:"\u003cruby>赤崎\u003crt>あかさき\u003c/rt>\u003c/ruby>\u003cruby>勇\u003crt>いさむ\u003c/rt>\u003c/ruby>", reading:"あかさきいさむ", years:"1930〜", country:"日本", field:"物理学者", photo:null, quotes:[], legacyId:"N10", legacyQuotes:["あきらめなければ、必ず道は開ける。","二十年間、誰もが不可能だと言い続けた。それでも私は信じていた。","若い研究者には、人と違う道を選ぶ勇気を持ってほしい。"] },
  { id:"N11", name:"天野浩", nameHtml:"\u003cruby>天野\u003crt>あまの\u003c/rt>\u003c/ruby>\u003cruby>浩\u003crt>ひろし\u003c/rt>\u003c/ruby>", reading:"あまのひろし", years:"1960〜", country:"日本", field:"物理学者", photo:null, quotes:[], legacyId:"N11", legacyQuotes:["失敗の数だけ、成功に近づいている。","青色発光ダイオードは、無数の失敗の上に生まれた。","基礎研究を、地道に、ねばり強く続けることが道を開く。"] },
  { id:"N12", name:"中村修二", nameHtml:"\u003cruby>中村\u003crt>なかむら\u003c/rt>\u003c/ruby>\u003cruby>修二\u003crt>しゅうじ\u003c/rt>\u003c/ruby>", reading:"なかむらしゅうじ", years:"1954〜", country:"日本", field:"物理学者", photo:null, quotes:[], legacyId:"N12", legacyQuotes:["常識を疑うことから、本当の発明は始まる。","会社の中で「無理だ」と言われても、自分の信じる道を進んだ。","怒りは、時に大きな原動力になる。"] },
  { id:"N13", name:"大村智", nameHtml:"\u003cruby>大村\u003crt>おおむら\u003c/rt>\u003c/ruby>\u003cruby>智\u003crt>さとし\u003c/rt>\u003c/ruby>", reading:"おおむらさとし", years:"1935〜", country:"日本", field:"生理学・医学者", photo:null, quotes:[], legacyId:"N13", legacyQuotes:["自然の中には、まだ人類が気づいていない宝物がたくさん眠っている。","微生物は小さいが、その力は計り知れない。","研究者は、自然に対して謙虚でなければならない。"] },
  { id:"N14", name:"梶田隆章", nameHtml:"\u003cruby>梶田\u003crt>かじた\u003c/rt>\u003c/ruby>\u003cruby>隆章\u003crt>たかあき\u003c/rt>\u003c/ruby>", reading:"かじたたかあき", years:"1957〜", country:"日本", field:"物理学者", photo:null, quotes:[], legacyId:"N14", legacyQuotes:["ニュートリノは、宇宙のもっとも小さな謎を解く鍵だ。","地道な観測とデータの積み重ねが、大きな発見を生む。","科学の答えは、いつも自然そのものの中にある。"] },
  { id:"N15", name:"本庶佑", nameHtml:"\u003cruby>本庶\u003crt>ほんじょ\u003c/rt>\u003c/ruby>\u003cruby>佑\u003crt>たすく\u003c/rt>\u003c/ruby>", reading:"ほんじょたすく", years:"1942〜", country:"日本", field:"生理学・医学者", photo:null, quotes:[], legacyId:"N15", legacyQuotes:["教科書に書いてあることを疑ってみることが、科学の出発点だ。","がんとの闘いは、免疫の力を信じることから始まった。","若い人には、権威を疑い、自分の頭で考えてほしい。"] },
  { id:"N16", name:"吉野彰", nameHtml:"\u003cruby>吉野\u003crt>よしの\u003c/rt>\u003c/ruby>\u003cruby>彰\u003crt>あきら\u003c/rt>\u003c/ruby>", reading:"よしのあきら", years:"1947〜", country:"日本", field:"化学者", photo:null, quotes:[], legacyId:"N16", legacyQuotes:["リチウムイオン電池は、多くの人の失敗と挑戦の上に生まれた。","好奇心を持ち続けることが、研究者にとって何より大切だ。","小さな技術が、世界を大きく変えることがある。"] },
  { id:"N17", name:"真鍋淑郎", nameHtml:"\u003cruby>真鍋\u003crt>まなべ\u003c/rt>\u003c/ruby>\u003cruby>淑郎\u003crt>しゅくろう\u003c/rt>\u003c/ruby>", reading:"まなべしゅくろう", years:"1931〜", country:"日本", field:"物理学者（気候科学）", photo:null, quotes:[], legacyId:"N17", legacyQuotes:["気候のモデルを作ることは、地球そのものを理解しようとする試みだ。","科学者は、自然が発する小さな信号を見逃してはならない。","好奇心のおもむくままに、研究を続けてきただけだ。"] , legacyReading:"まなべとしろう", legacyNameHtml:"\u003cruby>真鍋\u003crt>まなべ\u003c/rt>\u003c/ruby>\u003cruby>淑郎\u003crt>としろう\u003c/rt>\u003c/ruby>" },
  { id:"N18", name:"下村脩", nameHtml:"\u003cruby>下村\u003crt>しもむら\u003c/rt>\u003c/ruby>\u003cruby>脩\u003crt>おさむ\u003c/rt>\u003c/ruby>", reading:"しもむらおさむ", years:"1928〜2018年", country:"日本", field:"化学者", photo:null, quotes:[], legacyId:"N18", legacyQuotes:["クラゲの光る仕組みを知りたい。その一心で、ひたすら実験を続けた。","役に立つかどうかより、まず自然の不思議を解き明かしたかった。","何万匹ものクラゲを集め続けた日々が、思いがけない発見につながった。"] },
  { id:"N19", name:"田中正造", nameHtml:"\u003cruby>田中\u003crt>たなか\u003c/rt>\u003c/ruby>\u003cruby>正造\u003crt>しょうぞう\u003c/rt>\u003c/ruby>", reading:"たなかしょうぞう", years:"1841〜1913年", country:"日本", field:"環境運動家", photo:null, quotes:[], legacyId:"N19", legacyQuotes:["谷中村の人々の苦しみを、わたしは見過ごすことができなかった。","民主主義は、川や山を汚してまで発展を求めるべきではない。","真の文明は、山を荒らさず、川を汚さず、人を殺さぬものだ。"] },
  { id:"N20", name:"杉田玄白", nameHtml:"\u003cruby>杉田\u003crt>すぎた\u003c/rt>\u003c/ruby>\u003cruby>玄白\u003crt>げんぱく\u003c/rt>\u003c/ruby>", reading:"すぎたげんぱく", years:"1733〜1817年", country:"日本", field:"医学者", photo:null, quotes:[], legacyId:"N20", legacyQuotes:["ターヘル・アナトミアを、一字一句、命がけで訳した。","おどろき、かつあきれ果てたのは、これまでの医学の誤りの多さであった。","知らないことを知ろうとする心こそが、学問の入り口である。"] },
  { id:"N21", name:"本多利明", nameHtml:"\u003cruby>本多\u003crt>ほんだ\u003c/rt>\u003c/ruby>\u003cruby>利明\u003crt>としあき\u003c/rt>\u003c/ruby>", reading:"ほんだとしあき", years:"1804〜1866年", country:"日本", field:"経済学者", photo:null, quotes:[], legacyId:"N21", legacyQuotes:["国を富ませるには、まず海を開き、交易を盛んにすべきである。","地の利を生かさぬ国は、いずれ立ち行かなくなる。","学問は、机の上だけでなく、世の中の役に立ってこそ意味がある。"] },
  { id:"N22", name:"横井小楠", nameHtml:"\u003cruby>横井\u003crt>よこい\u003c/rt>\u003c/ruby>\u003cruby>小楠\u003crt>しょうなん\u003c/rt>\u003c/ruby>", reading:"よこいしょうなん", years:"1809〜1869年", country:"日本", field:"思想家・政治家", photo:null, quotes:[], legacyId:"N22", legacyQuotes:["国を治める者は、まず民の暮らしを思うべきである。","学問は、実際の政治や暮らしに役立ててこそ価値がある。","広く世界に目を向けねば、この国の行く末は見えてこない。"] },
  { id:"N23", name:"森有礼", nameHtml:"\u003cruby>森\u003crt>もり\u003c/rt>\u003c/ruby>\u003cruby>有礼\u003crt>ありのり\u003c/rt>\u003c/ruby>", reading:"もりありのり", years:"1847〜1889年", country:"日本", field:"教育者・政治家", photo:null, quotes:[], legacyId:"N23", legacyQuotes:["教育こそが、この国の未来を作る。","自ら学ぶ力を育てなければ、国は独立を保てない。","西洋に学びつつも、日本人としての誇りを忘れてはならない。"] },
  { id:"N24", name:"大塩平八郎", nameHtml:"\u003cruby>大塩\u003crt>おおしお\u003c/rt>\u003c/ruby>\u003cruby>平八郎\u003crt>へいはちろう\u003c/rt>\u003c/ruby>", reading:"おおしおへいはちろう", years:"1793〜1837年", country:"日本", field:"思想家・反乱指導者", photo:null, quotes:[], legacyId:"N24", legacyQuotes:["世の中の不正を見て見ぬふりはできぬ。","民が飢えているときに、役人が私腹を肥やすことは許されぬ。","たとえ一人であっても、正しいと信じる道を進む。"] },
  { id:"N25", name:"井原西鶴", nameHtml:"\u003cruby>井原\u003crt>いはら\u003c/rt>\u003c/ruby>\u003cruby>西鶴\u003crt>さいかく\u003c/rt>\u003c/ruby>", reading:"いはらさいかく", years:"1642〜1693年", country:"日本", field:"文学者", photo:null, quotes:[], legacyId:"N25", legacyQuotes:["世の中は、金と人情でできている。それを描かずして何を描くのか。","浮世（うきよ）は、悲しくもあり、おかしくもある。それが人の世だ。","筆一本で、この世のすべてを描いてみせよう。"] },
  { id:"N26", name:"近松門左衛門", nameHtml:"\u003cruby>近松\u003crt>ちかまつ\u003c/rt>\u003c/ruby>\u003cruby>門左衛門\u003crt>もんざえもん\u003c/rt>\u003c/ruby>", reading:"ちかまつもんざえもん", years:"1653〜1724年", country:"日本", field:"劇作家", photo:null, quotes:[], legacyId:"N26", legacyQuotes:["虚実皮膜（きょじつひまく）の間に、芸の真実がある。","人の情けを描かずして、劇は成り立たぬ。","義理と人情のはざまで、人は生きているのだ。"] },
  { id:"N27", name:"与謝蕪村", nameHtml:"\u003cruby>与謝\u003crt>よさ\u003c/rt>\u003c/ruby>\u003cruby>蕪村\u003crt>ぶそん\u003c/rt>\u003c/ruby>", reading:"よさぶそん", years:"1716〜1783年", country:"日本", field:"俳人・画家", photo:null, quotes:[], legacyId:"N27", legacyQuotes:["菜の花や 月は東に 日は西に","春の海 終日のたり のたりかな","絵を描くように俳句を詠み、俳句を詠むように絵を描く。"] , legacyReading:"よさのぶそん" },
  { id:"N28", name:"小林一茶", nameHtml:"\u003cruby>小林\u003crt>こばやし\u003c/rt>\u003c/ruby>\u003cruby>一茶\u003crt>いっさ\u003c/rt>\u003c/ruby>", reading:"こばやしいっさ", years:"1763〜1828年", country:"日本", field:"俳人", photo:null, quotes:[], legacyId:"N28", legacyQuotes:["やせ蛙 まけるな一茶 これにあり","雀の子 そこのけそこのけ お馬が通る","われと来て 遊べや親の ない雀"] },
  { id:"N29", name:"葛飾応為", nameHtml:"\u003cruby>葛飾\u003crt>かつしか\u003c/rt>\u003c/ruby>\u003cruby>応為\u003crt>おうい\u003c/rt>\u003c/ruby>", reading:"かつしかおうい", years:"生没年不詳（江戸後期）", country:"日本", field:"芸術家", photo:null, quotes:[], legacyId:"N29", legacyQuotes:["光と影を描くことこそ、絵師の腕の見せどころ。","父の背中を見て、わたしは絵師になった。","女だからと侮られても、筆の力で見返してみせる。"] },
  { id:"N30", name:"間宮林蔵", nameHtml:"\u003cruby>間宮\u003crt>まみや\u003c/rt>\u003c/ruby>\u003cruby>林蔵\u003crt>りんぞう\u003c/rt>\u003c/ruby>", reading:"まみやりんぞう", years:"1780〜1844年", country:"日本", field:"探検家・地理学者", photo:null, quotes:[], legacyId:"N30", legacyQuotes:["この目で確かめぬかぎり、地図には描けぬ。","樺太は島か、大陸の一部か。それを確かめるまで、わたしは帰らぬ。","困難な旅こそ、真実を知るための道である。"] },
  { id:"N31", name:"高杉晋作", nameHtml:"\u003cruby>高杉\u003crt>たかすぎ\u003c/rt>\u003c/ruby>\u003cruby>晋作\u003crt>しんさく\u003c/rt>\u003c/ruby>", reading:"たかすぎしんさく", years:"1839〜1867年", country:"日本", field:"幕末の志士", photo:null, quotes:[], legacyId:"N31", legacyQuotes:["おもしろき こともなき世を おもしろく","男子たるもの、一度決めた志は、命をかけて貫くべし。","今の日本を変えるには、身分の低い者にも力を貸してもらわねばならぬ。"] },
  { id:"N32", name:"木戸孝允", nameHtml:"\u003cruby>木戸\u003crt>きど\u003c/rt>\u003c/ruby>\u003cruby>孝允\u003crt>たかよし\u003c/rt>\u003c/ruby>", reading:"きどたかよし", years:"1833〜1877年", country:"日本", field:"政治家", photo:null, quotes:[], legacyId:"N32", legacyQuotes:["長州の未来は、身分にとらわれぬ人材にかかっている。","国のために、わたしはこの命を惜しまぬ。","改革には、時に痛みが伴う。それを恐れては何も変わらぬ。"] },
  { id:"N33", name:"本田宗一郎", nameHtml:"\u003cruby>本田\u003crt>ほんだ\u003c/rt>\u003c/ruby>\u003cruby>宗一郎\u003crt>そういちろう\u003c/rt>\u003c/ruby>", reading:"ほんだそういちろう", years:"1906〜1991年", country:"日本", field:"発明家・実業家", photo:null, quotes:[], legacyId:"N33", legacyQuotes:["だめだ、だめだと言う人には、だめな理由しか見えない。","失敗と成功は、紙一重である。","人まねをするな。自分の頭で考え、自分の手で作れ。"] },
  { id:"N34", name:"松下幸之助", nameHtml:"\u003cruby>松下\u003crt>まつした\u003c/rt>\u003c/ruby>\u003cruby>幸之助\u003crt>こうのすけ\u003c/rt>\u003c/ruby>", reading:"まつしたこうのすけ", years:"1894〜1989年", country:"日本", field:"実業家", photo:null, quotes:[], legacyId:"N34", legacyQuotes:["雨が降れば傘をさす。当たり前のことを、当たり前にやる。それが商売の基本だ。","経営者は、社員の幸せを本気で願わなければならない。","素直な心を持てば、世の中のすべてが師となる。"] },
  { id:"N35", name:"手塚治虫", nameHtml:"\u003cruby>手塚\u003crt>てづか\u003c/rt>\u003c/ruby>\u003cruby>治虫\u003crt>おさむ\u003c/rt>\u003c/ruby>", reading:"てづかおさむ", years:"1928〜1989年", country:"日本", field:"漫画家・医学博士", photo:null, quotes:[], legacyId:"N35", legacyQuotes:["マンガは世界共通の言語だ。","生命はすべて平等であり、尊い。","一つのコマ、一本の線にも、命を吹き込むつもりで描いてきた。"] },
  { id:"J25", name:"明智光秀", nameHtml:"\u003cruby>明智\u003crt>あけち\u003c/rt>\u003c/ruby>\u003cruby>光秀\u003crt>みつひで\u003c/rt>\u003c/ruby>", reading:"あけちみつひで", years:"1528〜1582年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J25", legacyQuotes:["敵は本能寺にあり。","三日天下と笑われようとも、わが信念に悔いはない。","時は今 あめが下しる 五月かな"] },
  { id:"J26", name:"豊臣秀頼", nameHtml:"\u003cruby>豊臣\u003crt>とよとみ\u003c/rt>\u003c/ruby>\u003cruby>秀頼\u003crt>ひでより\u003c/rt>\u003c/ruby>", reading:"とよとみひでより", years:"1593〜1615年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J26", legacyQuotes:["父の築いた天下を、この手で守り抜きたかった。","大坂城とともに、わが誇りも果てる。","たとえ滅びようとも、豊臣の名は歴史に残る。"] },
  { id:"J27", name:"真田幸村", nameHtml:"\u003cruby>真田\u003crt>さなだ\u003c/rt>\u003c/ruby>\u003cruby>幸村\u003crt>ゆきむら\u003c/rt>\u003c/ruby>", reading:"さなだゆきむら", years:"1567〜1615年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J27", legacyQuotes:["日本一の兵（ひのもといちのつわもの）と呼ばれても、驕ることなく戦う。","たとえ小勢であろうとも、知恵と勇気があれば大軍に挑める。","家康の首一つ、ここに置いていく。"] },
  { id:"J28", name:"毛利元就", nameHtml:"\u003cruby>毛利\u003crt>もうり\u003c/rt>\u003c/ruby>\u003cruby>元就\u003crt>もとなり\u003c/rt>\u003c/ruby>", reading:"もうりもとなり", years:"1497〜1571年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J28", legacyQuotes:["三本の矢は、一本ずつなら折れる。されど束ねれば、決して折れぬ。","謀多きは勝ち、謀少なきは負ける。","一族の結束こそ、乱世を生き抜く力である。"] },
  { id:"J29", name:"尼子経久", nameHtml:"\u003cruby>尼子\u003crt>あまご\u003c/rt>\u003c/ruby>\u003cruby>経久\u003crt>つねひさ\u003c/rt>\u003c/ruby>", reading:"あまごつねひさ", years:"1458〜1541年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J29", legacyQuotes:["山陰の地にも、天下を望む者がいることを示してみせる。","知略をもってすれば、大国とも渡り合える。","一代で身を起こす。それが武士の本懐である。"] },
  { id:"J30", name:"大内義隆", nameHtml:"\u003cruby>大内\u003crt>おおうち\u003c/rt>\u003c/ruby>\u003cruby>義隆\u003crt>よしたか\u003c/rt>\u003c/ruby>", reading:"おおうちよしたか", years:"1507〜1551年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J30", legacyQuotes:["文にも武にも優れてこそ、真の大名である。","西国一の文化を、この地に築いてみせる。","平和を愛するがゆえに、戦を好まぬ。"] },
  { id:"J31", name:"島津義久", nameHtml:"\u003cruby>島津\u003crt>しまづ\u003c/rt>\u003c/ruby>\u003cruby>義久\u003crt>よしひさ\u003c/rt>\u003c/ruby>", reading:"しまづよしひさ", years:"1533〜1611年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J31", legacyQuotes:["薩摩の武士は、退くことを知らぬ。","一族が心を一つにすれば、どんな敵にも屈せぬ。","九州の地に、島津の名を刻みつける。"] },
  { id:"J32", name:"島津忠恒", nameHtml:"\u003cruby>島津\u003crt>しまづ\u003c/rt>\u003c/ruby>\u003cruby>忠恒\u003crt>ただつね\u003c/rt>\u003c/ruby>", reading:"しまづただつね", years:"1569〜1638年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J32", legacyQuotes:["わが名は変われども、島津の魂は変わらぬ。","朝鮮の地でも、薩摩隼人の勇猛を示した。","徳川の世にあっても、島津の誇りは失わぬ。"] },
  { id:"J33", name:"斎藤道三", nameHtml:"\u003cruby>斎藤\u003crt>さいとう\u003c/rt>\u003c/ruby>\u003cruby>道三\u003crt>どうさん\u003c/rt>\u003c/ruby>", reading:"さいとうどうさん", years:"1494〜1556年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J33", legacyQuotes:["美濃の蝮（まむし）と呼ばれようとも、この国は必ず豊かにしてみせる。","下剋上こそ、この乱世の理（ことわり）である。","油売りから国主へ。この身一つで成り上がってみせた。"] },
  { id:"J34", name:"斎藤義龍", nameHtml:"\u003cruby>斎藤\u003crt>さいとう\u003c/rt>\u003c/ruby>\u003cruby>義龍\u003crt>よしたつ\u003c/rt>\u003c/ruby>", reading:"さいとうよしたつ", years:"1527〜1561年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J34", legacyQuotes:["親であろうと、国のためにはやむを得ぬこともある。","美濃を守るは、わが役目である。","乱世にあっては、親子の情すら試される。"] },
  { id:"J35", name:"前田利家", nameHtml:"\u003cruby>前田\u003crt>まえだ\u003c/rt>\u003c/ruby>\u003cruby>利家\u003crt>としいえ\u003c/rt>\u003c/ruby>", reading:"まえだとしいえ", years:"1537〜1599年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J35", legacyQuotes:["槍一筋で、この身を立ててきた。","義理と人情を欠いては、武士とは言えぬ。","加賀百万石の礎を、この手で築く。"] },
  { id:"J36", name:"前田慶次", nameHtml:"\u003cruby>前田\u003crt>まえだ\u003c/rt>\u003c/ruby>\u003cruby>慶次\u003crt>けいじ\u003c/rt>\u003c/ruby>", reading:"まえだけいじ", years:"1533〜1612年", country:"日本", field:"戦国武将・文化人", photo:null, quotes:[], legacyId:"J36", legacyQuotes:["傾奇者（かぶきもの）と呼ばれようが、わが生き方は変えぬ。","義に厚く、己の心のままに生きる。それがわしの流儀だ。","世間の常識になど、とらわれてたまるか。"] },
  { id:"J37", name:"上杉謙信", nameHtml:"\u003cruby>上杉\u003crt>うえすぎ\u003c/rt>\u003c/ruby>\u003cruby>謙信\u003crt>けんしん\u003c/rt>\u003c/ruby>", reading:"うえすぎけんしん", years:"1530〜1578年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J37", legacyQuotes:["わが上には天なく、わが下には地なし。","義のために戦う。それ以外に戦う理由はない。","毘（びしゃもんてん）の旗のもと、正義を貫く。"] },
  { id:"J38", name:"伊達正宗", nameHtml:"\u003cruby>伊達\u003crt>だて\u003c/rt>\u003c/ruby>\u003cruby>正宗\u003crt>まさむね\u003c/rt>\u003c/ruby>", reading:"だてまさむね", years:"1567〜1636年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J38", legacyQuotes:["独眼竜と呼ばれても、恐れることなく前を見る。","わしが十年早く生まれておれば、天下を取っていたであろう。","梅は蕾のうちから、雪の中でも香を放つ。"] },
  { id:"J39", name:"北条早雲", nameHtml:"\u003cruby>北条\u003crt>ほうじょう\u003c/rt>\u003c/ruby>\u003cruby>早雲\u003crt>そううん\u003c/rt>\u003c/ruby>", reading:"ほうじょうそううん", years:"1432〜1519年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J39", legacyQuotes:["一国の主となるは、家柄ではなく、器量による。","民を豊かにしてこそ、真の国主である。","下剋上の世を、この手で切り開く。"] },
  { id:"J40", name:"北条氏康", nameHtml:"\u003cruby>北条\u003crt>ほうじょう\u003c/rt>\u003c/ruby>\u003cruby>氏康\u003crt>うじやす\u003c/rt>\u003c/ruby>", reading:"ほうじょううじやす", years:"1515〜1571年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J40", legacyQuotes:["民のかまどの煙が立たぬなら、年貢は取らぬ。","家臣も民も、我が子のように思う。","北条の治める地には、飢える者を出さぬ。"] , legacyReading:"ほうじょうuじやす" },
  { id:"J41", name:"北条氏政", nameHtml:"\u003cruby>北条\u003crt>ほうじょう\u003c/rt>\u003c/ruby>\u003cruby>氏政\u003crt>うじまさ\u003c/rt>\u003c/ruby>", reading:"ほうじょううじまさ", years:"1538〜1591年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J41", legacyQuotes:["父祖の築いた北条の家を、わが代で終わらせるわけにはいかぬ。","小田原の城とともに、北条の意地を見せる。","たとえ天下の情勢が変わろうとも、義を通す。"] , legacyReading:"ほうじょうuじまさ" },
  { id:"J42", name:"武田信玄", nameHtml:"\u003cruby>武田\u003crt>たけだ\u003c/rt>\u003c/ruby>\u003cruby>信玄\u003crt>しんげん\u003c/rt>\u003c/ruby>", reading:"たけだしんげん", years:"1521〜1573年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J42", legacyQuotes:["風林火山――疾きこと風の如く、徐かなること林の如く、侵掠すること火の如く、動かざること山の如し。","人は城、人は石垣、人は堀。情けは味方、仇は敵なり。","戦わずして勝つ。それが兵法の極意である。"] },
  { id:"J43", name:"上杉景勝", nameHtml:"\u003cruby>上杉\u003crt>うえすぎ\u003c/rt>\u003c/ruby>\u003cruby>景勝\u003crt>かげかつ\u003c/rt>\u003c/ruby>", reading:"うえすぎかげかつ", years:"1556〜1623年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J43", legacyQuotes:["義を重んじる。それが上杉の家風である。","徳川の世にあっても、義の心は曲げぬ。","会津の地を、しかと守り抜く。"] },
  { id:"J44", name:"長宗我部元親", nameHtml:"\u003cruby>長宗我部\u003crt>ちょうそかべ\u003c/rt>\u003c/ruby>\u003cruby>元親\u003crt>もとちか\u003c/rt>\u003c/ruby>", reading:"ちょうそかべもとちか", years:"1539〜1599年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J44", legacyQuotes:["四国を、この手で一つにまとめてみせる。","土佐の武士に、恐れるものなど何もない。","一領具足の心意気こそ、わが力の源である。"] },
  { id:"J45", name:"竜造寺隆信", nameHtml:"\u003cruby>竜造寺\u003crt>りゅうぞうじ\u003c/rt>\u003c/ruby>\u003cruby>隆信\u003crt>たかのぶ\u003c/rt>\u003c/ruby>", reading:"りゅうぞうじたかのぶ", years:"1529〜1584年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J45", legacyQuotes:["肥前の地に、竜造寺の名を轟かせる。","五州二島の太守と呼ばれるまでになった。","力ある者が、この乱世を制する。"] },
  { id:"J46", name:"大友宗麟", nameHtml:"\u003cruby>大友\u003crt>おおとも\u003c/rt>\u003c/ruby>\u003cruby>宗麟\u003crt>そうりん\u003c/rt>\u003c/ruby>", reading:"おおともそうりん", years:"1530〜1587年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J46", legacyQuotes:["新しい教えにも、学ぶべきことがある。","西国一のキリシタン大名として、この地を治める。","南蛮との交易が、この国に新しい風をもたらす。"] },
  { id:"J47", name:"黒田官兵衛", nameHtml:"\u003cruby>黒田\u003crt>くろだ\u003c/rt>\u003c/ruby>\u003cruby>官兵衛\u003crt>かんべえ\u003c/rt>\u003c/ruby>", reading:"くろだかんべえ", years:"1546〜1604年", country:"日本", field:"戦国武将・参謀", photo:null, quotes:[], legacyId:"J47", legacyQuotes:["わしは、戦わずして勝つ道を探し続けてきた。","知恵は、刀よりも強い武器である。","天下を望まず、ただ主君を支えることに徹する。"] },
  { id:"J48", name:"加藤清正", nameHtml:"\u003cruby>加藤\u003crt>かとう\u003c/rt>\u003c/ruby>\u003cruby>清正\u003crt>きよまさ\u003c/rt>\u003c/ruby>", reading:"かとうきよまさ", years:"1562〜1611年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J48", legacyQuotes:["虎退治の話など、後の世の作り話にすぎぬ。実際の戦こそがわが誇りだ。","主家への忠義こそ、武士の本分である。","築城の技もまた、武将の腕の見せどころである。"] },
  { id:"J49", name:"福島正則", nameHtml:"\u003cruby>福島\u003crt>ふくしま\u003c/rt>\u003c/ruby>\u003cruby>正則\u003crt>まさのり\u003c/rt>\u003c/ruby>", reading:"ふくしままさのり", years:"1561〜1624年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J49", legacyQuotes:["戦場でこそ、わが真価は発揮される。","義理を欠いては、武士と呼べぬ。","賤ヶ岳の七本槍の名に恥じぬ働きをする。"] },
  { id:"J50", name:"石田三成", nameHtml:"\u003cruby>石田\u003crt>いしだ\u003c/rt>\u003c/ruby>\u003cruby>三成\u003crt>みつなり\u003c/rt>\u003c/ruby>", reading:"いしだみつなり", years:"1560〜1600年", country:"日本", field:"戦国武将", photo:null, quotes:[], legacyId:"J50", legacyQuotes:["三成に過ぎたるものが二つあり。島の左近に、佐和山の城。","義を貫くためなら、たとえ敗れようとも悔いはない。","知略をもって、豊臣の世を守り抜く。"] },
  { id:"J51", name:"片倉小十郎", nameHtml:"\u003cruby>片倉\u003crt>かたくら\u003c/rt>\u003c/ruby>\u003cruby>小十郎\u003crt>こじゅうろう\u003c/rt>\u003c/ruby>", reading:"かたくらこじゅうろう", years:"1557〜1615年", country:"日本", field:"戦国武将・参謀", photo:null, quotes:[], legacyId:"J51", legacyQuotes:["主君の危機には、わが身を盾にしてでも守る。","智謀をもって、伊達家を支え続ける。","片倉の名は、忠義とともにある。"] },
  { id:"J52", name:"雑賀孫市", nameHtml:"\u003cruby>雑賀\u003crt>さいか\u003c/rt>\u003c/ruby>\u003cruby>孫市\u003crt>まごいち\u003c/rt>\u003c/ruby>", reading:"さいかまごいち", years:"1532〜1603年", country:"日本", field:"戦国武将・傭兵隊長", photo:null, quotes:[], legacyId:"J52", legacyQuotes:["鉄砲の腕前なら、誰にも負けぬ。","雑賀衆の名にかけて、この地を守る。","信長といえど、恐れることはない。"] },
  { id:"J53", name:"山本勘助", nameHtml:"\u003cruby>山本\u003crt>やまもと\u003c/rt>\u003c/ruby>\u003cruby>勘助\u003crt>かんすけ\u003c/rt>\u003c/ruby>", reading:"やまもとかんすけ", years:"生没年不詳（〜1561年）", country:"日本", field:"戦国武将・軍師", photo:null, quotes:[], legacyId:"J53", legacyQuotes:["軍略とは、戦う前に勝敗を見極める知恵である。","たとえ隻眼隻足であろうとも、軍師としての務めは果たす。","武田の采配は、机上の兵法だけでは成り立たぬ。"] },
  { id:"J54", name:"歌麿", nameHtml:"\u003cruby>歌麿\u003crt>うたまろ\u003c/rt>\u003c/ruby>", reading:"うたまろ", years:"1753〜1806年", country:"日本", field:"浮世絵師", photo:null, quotes:[], legacyId:"J54", legacyQuotes:["女の美しさは、その一瞬の表情にこそ宿る。","筆一本で、江戸の粋を描き尽くす。","美人画とは、心の内を描くものである。"] },
  { id:"W01", name:"ピエール・キュリー", nameHtml:"ピエール・キュリー", reading:"ぴえーるきゅりー", years:"1859〜1906年", country:"フランス", field:"物理学者", photo:null, quotes:[], legacyId:"W01", legacyQuotes:["科学において、わたしたちは夫婦である以上に、同じ夢を追う同志だった。","結晶の中にも、目に見えない力の法則が働いている。","小さな現象を、根気強く観察し続けることが発見への道だ。"] },
  { id:"W02", name:"マックス・プランク", nameHtml:"マックス・プランク", reading:"まっくすぷらんく", years:"1858〜1947年", country:"ドイツ", field:"物理学者", photo:null, quotes:[], legacyId:"W02", legacyQuotes:["新しい科学の真理は、反対者を説得して勝利するのではなく、反対者がやがて死に絶え、その真理に慣れ親しんだ新しい世代が育つことによって勝利する。","真理を探し求める者は、謙虚でなければならない。","エネルギーは、連続的にではなく、とびとびの塊（量子）として放出される。"] },
  { id:"W03", name:"ニールス・ボーア", nameHtml:"ニールス・ボーア", reading:"にーるすぼーあ", years:"1885〜1962年", country:"デンマーク", field:"物理学者", photo:null, quotes:[], legacyId:"W03", legacyQuotes:["明確に考えることのできない問題については、明確に語ることもできない。","専門家とは、ごく狭い分野で、あらゆる失敗を経験しつくした人のことである。","予言は難しい。とくに未来についての予言は。"] },
  { id:"W04", name:"アーネスト・ラザフォード", nameHtml:"アーネスト・ラザフォード", reading:"あーねすとらざふぉーど", years:"1871〜1937年", country:"ニュージーランド／イギリス", field:"物理学者", photo:null, quotes:[], legacyId:"W04", legacyQuotes:["すべての科学は、物理学であるか、切手集めであるかのどちらかだ。","わたしより先に、原子の中をのぞいた者はいない。","もしあなたの実験を簡単な言葉で説明できないなら、その実験を本当には理解していないということだ。"] },
  { id:"W05", name:"リチャード・ファインマン", nameHtml:"リチャード・ファインマン", reading:"りちゃーどふぁいんまん", years:"1918〜1988年", country:"アメリカ", field:"物理学者", photo:null, quotes:[], legacyId:"W05", legacyQuotes:["わからないことがあっても、生きていくことはできる。わたしは大体のことについて、多かれ少なかれ確信が持てないまま生きている。","自分自身をだましてはいけない。あなたは、もっともだましやすい人物なのだから。","科学とは、専門家の無知を信じることである。"] },
  { id:"W06", name:"スティーヴン・ホーキング", nameHtml:"スティーヴン・ホーキング", reading:"すてぃーゔんほーきんぐ", years:"1942〜2018年", country:"イギリス", field:"物理学者", photo:null, quotes:[], legacyId:"W06", legacyQuotes:["どんなに人生が困難に思えても、必ずあなたにできること、成功できることがある。","下を見るのではなく、星を見上げよ。目にするものに驚きを持ち、それがなぜそこにあるのか考えよ。","知性とは、変化に適応する能力のことである。"] },
  { id:"W07", name:"マイケル・ファラデー", nameHtml:"マイケル・ファラデー", reading:"まいけるふぁらでー", years:"1791〜1867年", country:"イギリス", field:"物理学者", photo:null, quotes:[], legacyId:"W07", legacyQuotes:["何かの役に立つかどうか、わたしには分かりません。しかしいずれ、あなた方はそれに税金をかけることになるでしょう。","何事も、初めから疑ってかかるほど賢くはなく、何でも信じるほど愚かでもありたくない。","仕事において何より大切なのは、忍耐である。"] },
  { id:"W08", name:"ジェームス・クラーク・マクスウェル", nameHtml:"ジェームス・クラーク・マクスウェル", reading:"じぇーむすまくすうぇる", years:"1831〜1879年", country:"スコットランド", field:"物理学者", photo:null, quotes:[], legacyId:"W08", legacyQuotes:["ある現象について、それを説明する理論を一つしか知らない人は、理論そのものより、その理論を強く信じすぎている。","電気と磁気の力は、目に見えないが、確かに空間に存在している。","数式の裏には、必ず自然の姿が隠れている。"] },
  { id:"W13", name:"アントワーヌ・ラボアジエ", nameHtml:"アントワーヌ・ラボアジエ", reading:"あんとわぬらぼあじえ", years:"1743〜1794年", country:"フランス", field:"化学者", photo:null, quotes:[], legacyId:"W13", legacyQuotes:["何も生まれず、何も消えない。ただ形が変わるだけだ。それが化学の第一法則である。","質量を正確に量ることこそ、化学という学問の土台である。","わたしの首を斬るのは一瞬だが、同じ頭脳を生み出すには百年かかるだろう。"] },
  { id:"W14", name:"ドミートリー・メンデレーエフ", nameHtml:"ドミートリー・メンデレーエフ", reading:"どみーとりーめんでれーえふ", years:"1834〜1907年", country:"ロシア", field:"化学者", photo:null, quotes:[], legacyId:"W14", legacyQuotes:["元素にも、家族のような規則性がある。","夢の中で、元素の並び方がすべて見えた。目覚めてすぐに書き記した。","科学は、秩序を見つけ出す仕事である。"] },
  { id:"W21", name:"エドワード・ジェンナー", nameHtml:"エドワード・ジェンナー", reading:"えどわーどじぇんなー", years:"1749〜1823年", country:"イギリス", field:"医学者", photo:null, quotes:[], legacyId:"W21", legacyQuotes:["わたしの喜びは、人類の役に立つことにある。それ以上の報酬を求めない。","牛痘にかかった乳しぼりの女性は、天然痘にかからない。この観察が、すべての始まりだった。","予防に勝る治療はない。"] },
  { id:"W24", name:"アルフレッド・ラッセル・ウォレス", nameHtml:"アルフレッド・ラッセル・ウォレス", reading:"あるふれっどらっせるうぉれす", years:"1823〜1913年", country:"イギリス", field:"生物学者・探検家", photo:null, quotes:[], legacyId:"W24", legacyQuotes:["熱病にうなされる中で、進化のしくみがひらめいた。","遠い島々を旅してこそ、生き物の多様性の謎が見えてくる。","ダーウィンとわたしは、同じ結論に別々の道からたどり着いた。"] },
  { id:"W26", name:"ジェーン・グドール", nameHtml:"ジェーン・グドール", reading:"じぇーんぐどーる", years:"1934〜", country:"イギリス", field:"動物行動学者", photo:null, quotes:[], legacyId:"W26", legacyQuotes:["チンパンジーを理解するには、まず彼らの世界に入り、彼らの目で見なければならない。","一人一人の行動が、地球の未来を変える力を持っている。","動物にも、心があり、感情がある。それを知ることが、共に生きる第一歩だ。"] },
  { id:"W31", name:"エドウィン・ハッブル", nameHtml:"エドウィン・ハッブル", reading:"えどうぃんはっぶる", years:"1889〜1953年", country:"アメリカ", field:"天文学者", photo:null, quotes:[], legacyId:"W31", legacyQuotes:["宇宙は膨張している。銀河はたがいに遠ざかっている。","わたしたちの銀河系は、無数にある銀河の一つにすぎない。","望遠鏡は、過去をのぞく窓である。遠くを見ることは、昔を見ることだ。"] },
  { id:"W32", name:"カール・セーガン", nameHtml:"カール・セーガン", reading:"かーるせーがん", years:"1934〜1996年", country:"アメリカ", field:"天文学者・科学普及家", photo:null, quotes:[], legacyId:"W32", legacyQuotes:["宇宙のどこかに、わたしたち以外の知性があっても不思議ではない。","わたしたちは皆、星のかけらでできている。","科学は、単なる知識の体系ではなく、考える方法そのものだ。"] },
  { id:"W36", name:"カール・フリードリヒ・ガウス", nameHtml:"カール・フリードリヒ・ガウス", reading:"かーるふりーどりひがうす", years:"1777〜1855年", country:"ドイツ", field:"数学者", photo:null, quotes:[], legacyId:"W36", legacyQuotes:["数学は科学の女王であり、数論は数学の女王である。","わずかな観測データからも、正確な軌道を導き出すことができる。","真理を追い求めることに、年齢も地位も関係ない。"] },
  { id:"W42", name:"ニコラ・テスラ", nameHtml:"ニコラ・テスラ", reading:"にこらてすら", years:"1856〜1943年", country:"セルビア／アメリカ", field:"発明家", photo:null, quotes:[], legacyId:"W42", legacyQuotes:["未来は、わたしが思い描いたよりも、もっと速くやってくるだろう。","今日の科学は明日の技術である。","わたしは、発明した機械そのものよりも、人類の未来を発明したかった。"] },
  { id:"J01", name:"蘇我稲目", nameHtml:"\u003cruby>蘇我\u003crt>そが\u003c/rt>\u003c/ruby>\u003cruby>稲目\u003crt>いなめ\u003c/rt>\u003c/ruby>", reading:"そがいなめ", years:"540〜571年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"J01", legacyQuotes:["仏の教えは、この国を豊かにする新しい知恵である。","新しいものを恐れず、まず受け入れてみることだ。","国を治めるには、遠い先を見すえねばならぬ。"] },
  { id:"J02", name:"中大兄皇子", nameHtml:"\u003cruby>中大兄\u003crt>なかのおおえの\u003c/rt>\u003c/ruby>\u003cruby>皇子\u003crt>おうじ\u003c/rt>\u003c/ruby>", reading:"なかのおおえのおうじ", years:"626〜671年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"J02", legacyQuotes:["この国のかたちを、根本から変えねばならぬ。","蘇我の一族といえど、法の外にあってはならぬ。","天下は、私物ではなく、公のものである。"] },
  { id:"J03", name:"藤原道長", nameHtml:"\u003cruby>藤原\u003crt>ふじわら\u003c/rt>\u003c/ruby>\u003cruby>道長\u003crt>みちなが\u003c/rt>\u003c/ruby>", reading:"ふじわらみちなが", years:"966〜1028年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"J03", legacyQuotes:["この世をば わが世とぞ思ふ 望月の 欠けたることも なしと思へば","栄華は、一族の努力の積み重ねの上にある。","朝廷にあっては、まず礼と和を重んじよ。"] },
  { id:"J04", name:"空海", nameHtml:"\u003cruby>空海\u003crt>くうかい\u003c/rt>\u003c/ruby>", reading:"くうかい", years:"774〜835年", country:"日本", field:"宗教家・思想家", photo:null, quotes:[], legacyId:"J04", legacyQuotes:["虚しく往きて実ちて帰る。","善悪は人にあり、道は自ら求めるものである。","この身は仮のもの、心こそまことである。"] , legacyReading:"こうかい", legacyNameHtml:"\u003cruby>空海\u003crt>こうかい\u003c/rt>\u003c/ruby>" },
  { id:"J05", name:"最澄", nameHtml:"\u003cruby>最澄\u003crt>さいちょう\u003c/rt>\u003c/ruby>", reading:"さいちょう", years:"767〜822年", country:"日本", field:"宗教家", photo:null, quotes:[], legacyId:"J05", legacyQuotes:["一隅を照らす、これ則ち国宝なり。","忘己利他（もうこりた）――己を忘れて他を利するのが、仏の道である。","山家（さんげ）に学ぶ者は、まず心を静めよ。"] },
  { id:"J06", name:"菅原道真", nameHtml:"\u003cruby>菅原\u003crt>すがわら\u003c/rt>\u003c/ruby>\u003cruby>道真\u003crt>みちざね\u003c/rt>\u003c/ruby>", reading:"すがわらみちざね", years:"845〜903年", country:"日本", field:"政治家・学者", photo:null, quotes:[], legacyId:"J06", legacyQuotes:["東風吹かば 匂ひおこせよ 梅の花 あるじなしとて 春な忘れそ","心だにまことの道にかなひなば 祈らずとても神や守らん","学問は、身分を越えて人を高める。"] },
  { id:"J07", name:"和泉式部", nameHtml:"\u003cruby>和泉\u003crt>いずみ\u003c/rt>\u003c/ruby>\u003cruby>式部\u003crt>しきぶ\u003c/rt>\u003c/ruby>", reading:"いずみしきぶ", years:"生没年不詳（平安中期）", country:"日本", field:"文学者", photo:null, quotes:[], legacyId:"J07", legacyQuotes:["あらざらむ この世のほかの 思ひ出に 今ひとたびの 逢ふこともがな","もの思へば 沢の蛍も わが身より あくがれいづる 魂かとぞ見る","歌には、言葉にできない心を映すことができる。"] },
  { id:"J08", name:"役小角", nameHtml:"\u003cruby>役小角\u003crt>えんのおづぬ\u003c/rt>\u003c/ruby>", reading:"えんのおづぬ", years:"634〜701年", country:"日本", field:"宗教家", photo:null, quotes:[], legacyId:"J08", legacyQuotes:["山にこもり、修行を重ねてこそ、真の力が身につく。","自然そのものが、大いなる師である。","人の力の及ばぬところにこそ、大いなる真理がある。"] },
  { id:"J09", name:"平清盛", nameHtml:"\u003cruby>平\u003crt>たいら\u003c/rt>\u003c/ruby>\u003cruby>清盛\u003crt>きよもり\u003c/rt>\u003c/ruby>", reading:"たいらきよもり", years:"1118〜1181年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"J09", legacyQuotes:["平家にあらずんば人にあらず、とまで言われたが、驕りは必ず滅びを招く。","武士の世を切り開くのは、われら平家である。","海の向こうとの交易こそ、この国を富ませる道である。"] },
  { id:"J10", name:"源義朝", nameHtml:"\u003cruby>源\u003crt>みなもと\u003c/rt>\u003c/ruby>\u003cruby>義朝\u003crt>よしとも\u003c/rt>\u003c/ruby>", reading:"みなもとよしとも", years:"1056〜1160年", country:"日本", field:"武将", photo:null, quotes:[], legacyId:"J10", legacyQuotes:["武士たる者、いくさに敗れても、誇りまでは失わぬ。","一族の未来のために、この命を賭ける。","乱世にあっては、力なき者から滅びていく。"] },
  { id:"J11", name:"崇徳上皇", nameHtml:"\u003cruby>崇徳\u003crt>すとく\u003c/rt>\u003c/ruby>\u003cruby>上皇\u003crt>じょうこう\u003c/rt>\u003c/ruby>", reading:"すとくじょうこう", years:"1119〜1164年", country:"日本", field:"皇族・文学者", photo:null, quotes:[], legacyId:"J11", legacyQuotes:["この身は都を追われても、魂だけは都を離れぬ。","日本国の大魔縁となりて、この恨みを晴らさん。","わが願いのかなわぬまま、この世を去ることこそ無念である。"] },
  { id:"J12", name:"白河法皇", nameHtml:"\u003cruby>白河\u003crt>しらかわ\u003c/rt>\u003c/ruby>\u003cruby>法皇\u003crt>ほうおう\u003c/rt>\u003c/ruby>", reading:"しらかわほうおう", years:"1053〜1129年", country:"日本", field:"皇族・指導者", photo:null, quotes:[], legacyId:"J12", legacyQuotes:["賀茂川の水、双六の賽、山法師。これぞわが意のままにならぬもの。","治天の君として、朝廷の実権はこの手にある。","院政こそ、この国を治める新しいかたちである。"] },
  { id:"J13", name:"藤原良房", nameHtml:"\u003cruby>藤原\u003crt>ふじわら\u003c/rt>\u003c/ruby>\u003cruby>良房\u003crt>よしふさ\u003c/rt>\u003c/ruby>", reading:"ふじわらのよしふさ", years:"804〜872年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"J13", legacyQuotes:["皇族でなくとも、政（まつりごと）を支えることはできる。","娘を天皇の后とし、藤原の一族の力を確かなものとする。","摂政として、幼い帝をお支えすることこそ、わが務めである。"] },
  { id:"J14", name:"藤原定家", nameHtml:"\u003cruby>藤原\u003crt>ふじわら\u003c/rt>\u003c/ruby>\u003cruby>定家\u003crt>ていか\u003c/rt>\u003c/ruby>", reading:"ふじわらのていか", years:"1162〜1241年", country:"日本", field:"文学者", photo:null, quotes:[], legacyId:"J14", legacyQuotes:["歌に込められた心は、時代を越えて人の心を動かす。","百人の歌人の心を、一つの歌集にまとめ上げたい。","言葉を磨くことは、心を磨くことに等しい。"] },
  { id:"J15", name:"源義経", nameHtml:"\u003cruby>源\u003crt>みなもと\u003c/rt>\u003c/ruby>\u003cruby>義経\u003crt>よしつね\u003c/rt>\u003c/ruby>", reading:"みなもとよしつね", years:"1159〜1189年", country:"日本", field:"武将", photo:null, quotes:[], legacyId:"J15", legacyQuotes:["兄上のために、この命を捧げる覚悟であった。","戦において、機を逃すことこそ最大の過ちである。","たとえ悲運に見舞われようとも、わが武勇は語り継がれよう。"] },
  { id:"J17", name:"日蓮", nameHtml:"\u003cruby>日蓮\u003crt>にちれん\u003c/rt>\u003c/ruby>", reading:"にちれん", years:"1222〜1282年", country:"日本", field:"宗教家", photo:null, quotes:[], legacyId:"J17", legacyQuotes:["南無妙法蓮華経。この七文字にすべての救いがある。","たとえ迫害を受けようとも、正しいと信じる教えは曲げぬ。","法華経こそ、この乱世を救う唯一の教えである。"] },
  { id:"J18", name:"道元", nameHtml:"\u003cruby>道元\u003crt>どうげん\u003c/rt>\u003c/ruby>", reading:"どうげん", years:"1200〜1253年", country:"日本", field:"宗教家", photo:null, quotes:[], legacyId:"J18", legacyQuotes:["只管打坐（しかんたざ）――ただひたすら坐ることこそ、悟りである。","身心脱落。身も心も、とらわれから解き放たれよ。","仏道をならふというは、自己をならふ也。"] },
  { id:"J19", name:"一遍", nameHtml:"\u003cruby>一遍\u003crt>いっぺん\u003c/rt>\u003c/ruby>", reading:"いっぺん", years:"1239〜1289年", country:"日本", field:"宗教家", photo:null, quotes:[], legacyId:"J19", legacyQuotes:["捨ててこそ、見えてくるものがある。","南無阿弥陀仏と唱えれば、身分を問わず救われる。","旅から旅へ、この教えを、すべての人に届けたい。"] },
  { id:"J20", name:"北条時宗", nameHtml:"\u003cruby>北条\u003crt>ほうじょう\u003c/rt>\u003c/ruby>\u003cruby>時宗\u003crt>ときむね\u003c/rt>\u003c/ruby>", reading:"ほうじょうときむね", years:"1251〜1284年", country:"日本", field:"政治家・武将", photo:null, quotes:[], legacyId:"J20", legacyQuotes:["国難にあたっては、私心を捨てねばならぬ。","蒙古の大軍を前にしても、決して恐れてはならぬ。","禅の心をもって、この国難に立ち向かう。"] },
  { id:"J21", name:"足利尊氏", nameHtml:"\u003cruby>足利\u003crt>あしかが\u003c/rt>\u003c/ruby>\u003cruby>尊氏\u003crt>たかうじ\u003c/rt>\u003c/ruby>", reading:"あしかがたかうじ", years:"1305〜1358年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"J21", legacyQuotes:["武士の世を、新しいかたちに作り変える。","一度掲げた旗は、たやすく下ろせぬ。","乱世にあっては、味方も敵も、ただ一夜にして変わる。"] },
  { id:"J22", name:"足利義満", nameHtml:"\u003cruby>足利\u003crt>あしかが\u003c/rt>\u003c/ruby>\u003cruby>義満\u003crt>よしみつ\u003c/rt>\u003c/ruby>", reading:"あしかがよしみつ", years:"1358〜1408年", country:"日本", field:"政治家・指導者", photo:null, quotes:[], legacyId:"J22", legacyQuotes:["この国のまつりごとと、文化の両方を極めてみせる。","南北に分かれたこの国を、一つにまとめねばならぬ。","唐との交易こそ、この国を富ませる道である。"] },
  { id:"J23", name:"観阿弥・世阿弥", nameHtml:"\u003cruby>観阿弥\u003crt>かんあみ\u003c/rt>\u003c/ruby>・\u003cruby>世阿弥\u003crt>ぜあみ\u003c/rt>\u003c/ruby>", reading:"かんあみ・ぜあみ", years:"1333〜1384年 / 1363〜1443年", country:"日本", field:"芸術家", photo:null, quotes:[], legacyId:"J23", legacyQuotes:["秘すれば花なり。秘せずは花なるべからず。","初心忘るべからず。","物まねの上手に非ずして、能の名手とは言われぬ。"] },
  { id:"J24", name:"宗祇", nameHtml:"\u003cruby>宗祇\u003crt>そうぎ\u003c/rt>\u003c/ruby>", reading:"そうぎ", years:"1421〜1502年", country:"日本", field:"文学者・芸術家", photo:null, quotes:[], legacyId:"J24", legacyQuotes:["旅から旅へ、連歌の心を各地に伝えたい。","古き歌の心を学び、新しき言葉を紡ぐ。","一座の心が一つにならねば、良き連歌は生まれぬ。"] },
  { id:"J55", name:"大黒屋光太夫", nameHtml:"\u003cruby>大黒屋\u003crt>だいこくや\u003c/rt>\u003c/ruby>\u003cruby>光太夫\u003crt>こうだゆう\u003c/rt>\u003c/ruby>", reading:"だいこくやこうだゆう", years:"1751〜1828年", country:"日本", field:"漂流者・西洋研究者", photo:null, quotes:[], legacyId:"J55", legacyQuotes:["嵐の海を十年、それでも祖国を忘れたことはなかった。","異国の皇帝にまで謁見した日本人は、わたしが初めてであろう。","生きて帰れたことこそ、何よりの宝である。"] , legacyReading:"たいこくやこうたろう", legacyName:"大黒屋光太郎", legacyNameHtml:"\u003cruby>大黒屋\u003crt>たいこくや\u003c/rt>\u003c/ruby>\u003cruby>光太郎\u003crt>こうたろう\u003c/rt>\u003c/ruby>" },
  { id:"J56", name:"写楽", nameHtml:"\u003cruby>写楽\u003crt>しゃらく\u003c/rt>\u003c/ruby>", reading:"しゃらく", years:"生没年不詳（江戸後期）", country:"日本", field:"浮世絵師", photo:null, quotes:[], legacyId:"J56", legacyQuotes:["役者の一瞬の表情にこそ、真実がある。","わずか十ヶ月の活動であっても、悔いはない。","誰であったかは謎のままでよい。絵がすべてを語る。"] },
  { id:"J57", name:"松平定信", nameHtml:"\u003cruby>松平\u003crt>まつだいら\u003c/rt>\u003c/ruby>\u003cruby>定信\u003crt>さだのぶ\u003c/rt>\u003c/ruby>", reading:"まつだいらさだのぶ", years:"1735〜1807年", country:"日本", field:"政治家・改革者", photo:null, quotes:[], legacyId:"J57", legacyQuotes:["質素倹約こそ、この国を立て直す道である。","出る杭は打たれても、正しいと思う政（まつりごと）は貫く。","学問と武芸、両方を怠ってはならぬ。"] },
  { id:"J58", name:"高田屋嘉兵衛", nameHtml:"\u003cruby>高田屋\u003crt>たかたや\u003c/rt>\u003c/ruby>\u003cruby>嘉兵衛\u003crt>かへえ\u003c/rt>\u003c/ruby>", reading:"たかたやかへえ", years:"1769〜1827年", country:"日本", field:"商人・実業家", photo:null, quotes:[], legacyId:"J58", legacyQuotes:["商人にも、国のためにできることがある。","異国に捕らわれても、日本人としての誇りは失わぬ。","北の海を切り開くことが、わが使命である。"] },
  { id:"J59", name:"田村藍水", nameHtml:"\u003cruby>田村\u003crt>たむら\u003c/rt>\u003c/ruby>\u003cruby>藍水\u003crt>あいすい\u003c/rt>\u003c/ruby>", reading:"たむらあいすい", years:"1756〜1799年", country:"日本", field:"思想家・国学者", photo:null, quotes:[], legacyId:"J59", legacyQuotes:["薬草の知識は、この国の民を救う力になる。","西洋の学問にも、学ぶべきことは多い。","本草学は、医の道の礎である。"] },
  { id:"J60", name:"林子平", nameHtml:"\u003cruby>林\u003crt>はやし\u003c/rt>\u003c/ruby>\u003cruby>子平\u003crt>しへい\u003c/rt>\u003c/ruby>", reading:"はやししへい", years:"1738〜1793年", country:"日本", field:"地政学者・思想家", photo:null, quotes:[], legacyId:"J60", legacyQuotes:["海国兵談――海に囲まれたこの国は、海の守りを固めねばならぬ。","異国の脅威を軽んじては、いずれ国を失う。","憂うるべきことを、憂うるままに書き記した。"] },
  { id:"J61", name:"司馬江漢", nameHtml:"\u003cruby>司馬\u003crt>しば\u003c/rt>\u003c/ruby>\u003cruby>江漢\u003crt>こうかん\u003c/rt>\u003c/ruby>", reading:"しばこうかん", years:"1747〜1818年", country:"日本", field:"画家・西洋研究者", photo:null, quotes:[], legacyId:"J61", legacyQuotes:["西洋の絵の技法を、日本にもたらしたい。","この目で見たものを、そのままに描く。それが写実の心だ。","蘭学は、この国に新しい目を与えてくれる。"] },
  { id:"J62", name:"古賀精里", nameHtml:"\u003cruby>古賀\u003crt>こが\u003c/rt>\u003c/ruby>\u003cruby>精里\u003crt>せいり\u003c/rt>\u003c/ruby>", reading:"こがせいり", years:"1750〜1817年", country:"日本", field:"儒学者", photo:null, quotes:[], legacyId:"J62", legacyQuotes:["学問は、人としての正しい道を示すものである。","儒学の教えを、この時代に生かさねばならぬ。","師の教えを、次の世代へ伝えることがわが務めだ。"] },
  { id:"J63", name:"宇田川榕菴", nameHtml:"\u003cruby>宇田川\u003crt>うだがわ\u003c/rt>\u003c/ruby>\u003cruby>榕菴\u003crt>ようあん\u003c/rt>\u003c/ruby>", reading:"うだがわようあん", years:"1798〜1846年", country:"日本", field:"蘭学者", photo:null, quotes:[], legacyId:"J63", legacyQuotes:["西洋の化学の知識を、この国の言葉に置き換える。","一つ一つの言葉に、新しい意味を込めて訳した。","蘭学は、この国の未来を切り開く鍵となる。"] },
  { id:"J64", name:"最上徳内", nameHtml:"\u003cruby>最上\u003crt>もがみ\u003c/rt>\u003c/ruby>\u003cruby>徳内\u003crt>とくない\u003c/rt>\u003c/ruby>", reading:"もがみとくない", years:"1755〜1836年", country:"日本", field:"探検家・地理学者", photo:null, quotes:[], legacyId:"J64", legacyQuotes:["蝦夷地の果てまで、この目で確かめねば気がすまぬ。","見知らぬ土地にこそ、まだ知られていない知識が眠っている。","身分の低い出であっても、学び続ければ道は開ける。"] },
  { id:"J65", name:"貝原益軒", nameHtml:"\u003cruby>貝原\u003crt>かいばら\u003c/rt>\u003c/ruby>\u003cruby>益軒\u003crt>えきけん\u003c/rt>\u003c/ruby>", reading:"かいばらえきけん", years:"1630〜1714年", country:"日本", field:"学者・医学者", photo:null, quotes:[], legacyId:"J65", legacyQuotes:["身を養うには、まず心を養うべし。","医は仁術なり。人を思う心があってこその医術である。","日々の小さな養生の積み重ねが、長い命をつくる。"] },
  { id:"J66", name:"山脇東洋", nameHtml:"\u003cruby>山脇\u003crt>やまわき\u003c/rt>\u003c/ruby>\u003cruby>東洋\u003crt>とうよう\u003c/rt>\u003c/ruby>", reading:"やまわきとうよう", years:"1706〜1762年", country:"日本", field:"解剖学者・医学者", photo:null, quotes:[], legacyId:"J66", legacyQuotes:["この目で人の体を確かめねば、本当の医学は始まらぬ。","古い医学書の教えと、実際の体の姿は、こんなにも違っていた。","腑分け（ふわけ）の記録を残すことが、後の世の医学を進める。"] },
  { id:"J67", name:"近藤重蔵", nameHtml:"\u003cruby>近藤\u003crt>こんどう\u003c/rt>\u003c/ruby>\u003cruby>重蔵\u003crt>じゅうぞう\u003c/rt>\u003c/ruby>", reading:"こんどうじゅうぞう", years:"1771〜1829年", country:"日本", field:"探検家", photo:null, quotes:[], legacyId:"J67", legacyQuotes:["蝦夷地の北の果てに、日本の証を立ててきた。","国境の地を、この足でしかと確かめねばならぬ。","未知の土地への恐れより、知りたいという思いが勝った。"] },
  { id:"J68", name:"中野重右衛門", nameHtml:"\u003cruby>中野\u003crt>なかの\u003c/rt>\u003c/ruby>\u003cruby>重右衛門\u003crt>じゅうえもん\u003c/rt>\u003c/ruby>", reading:"なかのじゅうえもん", years:"1700年代", country:"日本", field:"商人・実業家", photo:null, quotes:[], legacyId:"J68", legacyQuotes:["商いは、信用がすべてである。","異国との交易にも、日本人の知恵は通用する。","誠実な商いこそ、長く続く商いである。"] },
  { id:"J69", name:"久坂玄瑞", nameHtml:"\u003cruby>久坂\u003crt>くさか\u003c/rt>\u003c/ruby>\u003cruby>玄瑞\u003crt>げんずい\u003c/rt>\u003c/ruby>", reading:"くさかげんずい", years:"1838〜1864年", country:"日本", field:"幕末の志士", photo:null, quotes:[], legacyId:"J69", legacyQuotes:["長州の未来のために、この命を捧げる。","たとえ若くして倒れようとも、志は後の者が継いでくれよう。","攘夷か開国かではなく、この国をどう守るかが肝要だ。"] , legacyReading:"ひさかげんずい", legacyNameHtml:"\u003cruby>久坂\u003crt>ひさか\u003c/rt>\u003c/ruby>\u003cruby>玄瑞\u003crt>げんずい\u003c/rt>\u003c/ruby>" },
  { id:"J70", name:"大久保利通", nameHtml:"\u003cruby>大久保\u003crt>おおくぼ\u003c/rt>\u003c/ruby>\u003cruby>利通\u003crt>としみち\u003c/rt>\u003c/ruby>", reading:"おおくぼとしみち", years:"1830〜1878年", country:"日本", field:"政治家", photo:null, quotes:[], legacyId:"J70", legacyQuotes:["富国強兵こそ、この国が生き残る道である。","改革には、時に非情の決断も必要となる。","西郷とともに歩んだ道を、わたしは忘れぬ。"] , legacyReading:"おおくねとしみち" },
  { id:"J71", name:"伊藤博文", nameHtml:"\u003cruby>伊藤\u003crt>いとう\u003c/rt>\u003c/ruby>\u003cruby>博文\u003crt>ひろぶみ\u003c/rt>\u003c/ruby>", reading:"いとうひろぶみ", years:"1841〜1909年", country:"日本", field:"政治家", photo:null, quotes:[], legacyId:"J71", legacyQuotes:["この国を、欧米に負けぬ近代国家にする。","憲法を制定し、この国に法の秩序をもたらす。","国のために、わが身を惜しまぬ。"] },
  { id:"J72", name:"山県有朋", nameHtml:"\u003cruby>山県\u003crt>やまがた\u003c/rt>\u003c/ruby>\u003cruby>有朋\u003crt>ありとも\u003c/rt>\u003c/ruby>", reading:"やまがたありとも", years:"1838〜1922年", country:"日本", field:"政治家・軍人", photo:null, quotes:[], legacyId:"J72", legacyQuotes:["軍隊の近代化なくして、この国の独立は守れぬ。","国家のためには、時に厳しい規律も必要である。","富国強兵の道を、着実に歩まねばならぬ。"] },
  { id:"J73", name:"榎本武揚", nameHtml:"\u003cruby>榎本\u003crt>えのもと\u003c/rt>\u003c/ruby>\u003cruby>武揚\u003crt>たけあき\u003c/rt>\u003c/ruby>", reading:"えのもとたけあき", years:"1836〜1908年", country:"日本", field:"幕末の志士・政治家", photo:null, quotes:[], legacyId:"J73", legacyQuotes:["たとえ賊軍と呼ばれようとも、武士としての筋を通す。","五稜郭に立てこもってでも、この信念は曲げぬ。","敗れた者にも、新しい国づくりに力を尽くす道はある。"] },
  { id:"J74", name:"後藤象二郎", nameHtml:"\u003cruby>後藤\u003crt>ごとう\u003c/rt>\u003c/ruby>\u003cruby>象二郎\u003crt>しょうじろう\u003c/rt>\u003c/ruby>", reading:"ごとうしょうじろう", years:"1838〜1897年", country:"日本", field:"政治家", photo:null, quotes:[], legacyId:"J74", legacyQuotes:["土佐の武士としての誇りを胸に、新しい時代を作る。","大政奉還こそ、この国を救う道である。","武力によらず、話し合いで世を変えたい。"] },
  { id:"J75", name:"岩倉具視", nameHtml:"\u003cruby>岩倉\u003crt>いわくら\u003c/rt>\u003c/ruby>\u003cruby>具視\u003crt>ともみ\u003c/rt>\u003c/ruby>", reading:"いわくらともみ", years:"1825〜1883年", country:"日本", field:"政治家・貴族", photo:null, quotes:[], legacyId:"J75", legacyQuotes:["朝廷の権威を取り戻すことが、この国を守る道である。","公家であっても、時代の変化を見誤ってはならぬ。","新しい世のために、旧き制度を改める勇気を持て。"] },
  { id:"J76", name:"前島密", nameHtml:"\u003cruby>前島\u003crt>まえじま\u003c/rt>\u003c/ruby>\u003cruby>密\u003crt>ひそか\u003c/rt>\u003c/ruby>", reading:"まえじまひそか", years:"1835〜1919年", country:"日本", field:"政治家・実業家", photo:null, quotes:[], legacyId:"J76", legacyQuotes:["手紙は、身分の差なく、誰もが同じ値段で届けられるべきものだ。","郵便の仕組みを、この国のすみずみまで行き渡らせたい。","一円切手の顔として、これからも国民に親しまれたい。"] },
  { id:"J77", name:"河井継之助", nameHtml:"\u003cruby>河井\u003crt>かわい\u003c/rt>\u003c/ruby>\u003cruby>継之助\u003crt>つぎのすけ\u003c/rt>\u003c/ruby>", reading:"かわいつぎのすけ", years:"1827〜1868年", country:"日本", field:"幕末の志士", photo:null, quotes:[], legacyId:"J77", legacyQuotes:["武士の意地を、最後まで貫く。","たとえ小藩であろうとも、道理を通す。","戦を避ける努力を尽くしてこそ、真の武士である。"] },
  { id:"W09", name:"オットー・フォン・ゲーリケ", nameHtml:"オットー・フォン・ゲーリケ", reading:"おっとーふぉんげーりけ", years:"1602〜1686年", country:"ドイツ", field:"物理学者・発明家", photo:null, quotes:[], legacyId:"W09", legacyQuotes:["空気にも、目に見えない力がある。それを証明するために、わたしは半球を作った。","誰も信じないことでも、実験で示せば真実になる。","真空の力は、馬十六頭をもってしても引き離せぬほど強い。"] },
  { id:"W10", name:"トーマス・ヤング", nameHtml:"トーマス・ヤング", reading:"とーますやんぐ", years:"1773〜1829年", country:"イギリス", field:"物理学者・医学者", photo:null, quotes:[], legacyId:"W10", legacyQuotes:["光は波である。二つの光が重なれば、強め合い、また打ち消し合うこともある。","医学と物理学、両方に通じてこそ、自然の全体が見えてくる。","古代の文字を解き明かす鍵も、根気強い観察の中にある。"] },
  { id:"W11", name:"ジョン・ドルトン", nameHtml:"ジョン・ドルトン", reading:"じょんどるとん", years:"1766〜1844年", country:"イギリス", field:"化学者・物理学者", photo:null, quotes:[], legacyId:"W11", legacyQuotes:["すべての物質は、それ以上分けられない小さな粒、原子でできている。","色を見分けられないことも、わたしにとっては科学の対象だった。","気体の重さを比べることで、目に見えない粒の存在を証明できる。"] },
  { id:"W12", name:"ウィリアム・クルックス", nameHtml:"ウィリアム・クルックス", reading:"うぃりあむくるっくす", years:"1832〜1919年", country:"イギリス", field:"物理学者・化学者", photo:null, quotes:[], legacyId:"W12", legacyQuotes:["真空の中でこそ、電気の本当の姿が見えてくる。","科学者は、常識を疑うところから出発しなければならない。","目に見えない光線にも、確かな性質がある。"] },
  { id:"W15", name:"ヨハン・ドーベライナー", nameHtml:"ヨハン・ドーベライナー", reading:"よはんどーべらいなー", years:"1780〜1849年", country:"ドイツ", field:"化学者", photo:null, quotes:[], legacyId:"W15", legacyQuotes:["似た性質を持つ元素は、三つ一組で並べることができる。","化学の法則は、規則正しい模様のように広がっている。","わずかな手がかりからも、大きな法則が見えてくることがある。"] },
  { id:"W16", name:"フリッツ・ハーバー", nameHtml:"フリッツ・ハーバー", reading:"ふりっつはーばー", years:"1868〜1934年", country:"ドイツ", field:"化学者", photo:null, quotes:[], legacyId:"W16", legacyQuotes:["空気からパンを作る。それが化学の力である。","科学の発見は、使う人の心によって、祝福にも呪いにもなる。","化学者は、自然の秘密を解き明かす鍵を持っている。"] },
  { id:"W17", name:"ライナス・ポーリング", nameHtml:"ライナス・ポーリング", reading:"らいなすぽーりんぐ", years:"1901〜1994年", country:"アメリカ", field:"化学者・生化学者", photo:null, quotes:[], legacyId:"W17", legacyQuotes:["最良のアイデアを得る方法は、たくさんのアイデアを持つことだ。","科学において最も大切なことは、疑問を持ち続けることである。","人生を楽しむための秘訣は、好奇心を失わないことだ。"] },
  { id:"W18", name:"アレッサンドロ・ボルタ", nameHtml:"アレッサンドロ・ボルタ", reading:"あれっさんどろぼるた", years:"1745〜1827年", country:"イタリア", field:"物理学者・化学者", photo:null, quotes:[], legacyId:"W18", legacyQuotes:["電気は、金属と金属の間の、目に見えない力から生まれる。","積み重ねることで、小さな力も大きな力になる。それが電池の原理だ。","実験こそが、自然の言葉を聞く唯一の方法である。"] },
  { id:"W19", name:"ハンフリー・デービー", nameHtml:"ハンフリー・デービー", reading:"はんふりーでーびー", years:"1778〜1829年", country:"イギリス", field:"化学者", photo:null, quotes:[], legacyId:"W19", legacyQuotes:["化学における発見は、自然という書物を一ページずつ開いていく作業である。","若い研究者には、失敗を恐れず実験を続けてほしい。","新しい元素を見つけることは、新しい大陸を発見することに似ている。"] },
  { id:"W20", name:"ジャン=バティスト・ラマルク", nameHtml:"ジャン=バティスト・ラマルク", reading:"じゃんばてぃすとらまるく", years:"1744〜1829年", country:"フランス", field:"生物学者", photo:null, quotes:[], legacyId:"W20", legacyQuotes:["生物は、環境に合わせて少しずつ姿を変えていく。","使う器官は発達し、使わない器官は衰える。","自然界のすべての生き物には、単純なものから複雑なものへと進む道筋がある。"] },
  { id:"W23", name:"ヨーゼフ・ヒルトル", nameHtml:"ヨーゼフ・ヒルトル", reading:"よーぜふひるとる", years:"1810〜1894年", country:"オーストリア", field:"解剖学者", photo:null, quotes:[], legacyId:"W23", legacyQuotes:["人体の複雑な構造を、講義を通じて多くの学生に伝えたい。","解剖学は、命の不思議さを教えてくれる学問である。","正確な観察と記録こそ、医学の発展を支える土台である。"] },
  { id:"W25", name:"フランシス・コリンズ", nameHtml:"フランシス・コリンズ", reading:"ふらんしすこりんず", years:"1950〜", country:"アメリカ", field:"遺伝学者", photo:null, quotes:[], legacyId:"W25", legacyQuotes:["ヒトゲノムの解読は、人類の設計図を読み解く旅の始まりにすぎない。","科学と信仰は、対立するものではなく、共に真実を探す道である。","遺伝子の情報は、わたしたちが誰であるかを教えてくれるが、すべてを決めるわけではない。"] },
  { id:"W27", name:"バーバラ・マクリントック", nameHtml:"バーバラ・マクリントック", reading:"ばーばらまくりんとっく", years:"1902〜1992年", country:"アメリカ", field:"遺伝学者", photo:null, quotes:[], legacyId:"W27", legacyQuotes:["遺伝子は、固定されたものではなく、動くものである。","自然をじっくり観察すれば、必ず驚きを与えてくれる。","トウモロコシの一粒一粒が、わたしに多くを語りかけてくれた。"] },
  { id:"W28", name:"ロザリンド・フランクリン", nameHtml:"ロザリンド・フランクリン", reading:"ろざりんどふらんくりん", years:"1920〜1958年", country:"イギリス", field:"生物物理学者", photo:null, quotes:[], legacyId:"W28", legacyQuotes:["データこそがすべてを語る。憶測で結論を急いではならない。","写真の中に、DNAのらせん構造がはっきりと写っていた。","科学において、女性であることは、決して障害ではない。"] },
  { id:"W29", name:"ロベルト・コッホ", nameHtml:"ロベルト・コッホ", reading:"ろべるとこっほ", years:"1843〜1910年", country:"ドイツ", field:"細菌学者", photo:null, quotes:[], legacyId:"W29", legacyQuotes:["目に見えぬ小さな生き物が、恐ろしい病を引き起こしている。","病気の原因を突き止めるには、まず病原菌を目で見なければならない。","結核菌を発見したこの日を、わたしは生涯忘れない。"] },
  { id:"W33", name:"ティコ・ブラーエ", nameHtml:"ティコ・ブラーエ", reading:"てぃこぶらーえ", years:"1546〜1601年", country:"デンマーク", field:"天文学者", photo:null, quotes:[], legacyId:"W33", legacyQuotes:["王よりも、正確な観測記録を残すことのほうが、わたしにとって価値がある。","肉眼での観測にも、これほど精密な結果が得られる。","天の動きを、毎晩、記録し続けることが天文学者の務めである。"] },
  { id:"W34", name:"ヨハネス・ケプラー", nameHtml:"ヨハネス・ケプラー", reading:"よはねすけぷらー", years:"1571〜1630年", country:"ドイツ", field:"天文学者・数学者", photo:null, quotes:[], legacyId:"W34", legacyQuotes:["わたしは神の思いを、その跡をたどって読み取ろうとしているにすぎない。","惑星は、円ではなく、楕円を描いて動いている。","宇宙には、数学で読み解ける美しい調和がある。"] },
  { id:"W35", name:"ウィリアム・ハーシェル", nameHtml:"ウィリアム・ハーシェル", reading:"うぃりあむはーしぇる", years:"1738〜1822年", country:"ドイツ／イギリス", field:"天文学者", photo:null, quotes:[], legacyId:"W35", legacyQuotes:["空を見上げるたびに、そこにまだ誰も見たことのない天体があるかもしれないと思う。","望遠鏡の性能を高めることが、宇宙の謎に近づく唯一の道だ。","星々の間にも、目には見えない秩序がある。"] },
  { id:"W37", name:"ダヴィド・ヒルベルト", nameHtml:"ダヴィド・ヒルベルト", reading:"だゔぃどひるべると", years:"1862〜1943年", country:"ドイツ", field:"数学者", photo:null, quotes:[], legacyId:"W37", legacyQuotes:["我々は知らねばならない、我々は知るであろう。","数学の問題は、解けると分かっているからこそ、挑む価値がある。","数学において、疑わしい証明は証明ではない。"] },
  { id:"W38", name:"ジョン・フォン・ノイマン", nameHtml:"フォン・ノイマン", reading:"ふぉんのいまん", years:"1903〜1957年", country:"ハンガリー／アメリカ", field:"数学者・計算機科学者", photo:null, quotes:[], legacyId:"W38", legacyQuotes:["もし人々が、数学が単純だと思っていないなら、それは人生がどれほど複雑かを理解していないからだ。","コンピュータは、いずれ人間の思考の一部を担うようになるだろう。","科学の真の危険は、道具ではなく、それを使う人間の心にある。"] },
  { id:"W39", name:"ベルトラン・ラッセル", nameHtml:"ベルトラン・ラッセル", reading:"べるとらんらっせる", years:"1872〜1970年", country:"イギリス", field:"哲学者・数学者", photo:null, quotes:[], legacyId:"W39", legacyQuotes:["三つの情熱が、わたしの人生を支配してきた。愛への渇望、知識の探求、そして人類の苦しみへの耐えがたい同情である。","戦争は、誰が正しいかを決めない。誰が生き残るかを決めるだけだ。","疑うことのできる能力こそ、知性の証である。"] },
  { id:"W40", name:"アラン・チューリング", nameHtml:"アラン・チューリング", reading:"あらんちゅーりんぐ", years:"1912〜1954年", country:"イギリス", field:"数学者・計算機科学者", photo:null, quotes:[], legacyId:"W40", legacyQuotes:["時に、誰も想像しなかった人物が、誰も想像しなかったことを成し遂げる。","機械は考えることができるか。それを問う前に、考えるとは何かを定義せねばならない。","わたしたちは、目の前の一歩しか見通せない。しかしその一歩を踏み出せば、また次の一歩が見えてくる。"] },

  { id:"W44", name:"ゴットフリード・ライプニッツ", nameHtml:"ゴットフリード・ライプニッツ", reading:"ごっとふりーどらいぷにっつ", years:"1646〜1716年", country:"ドイツ", field:"哲学者・数学者", photo:null, quotes:[], legacyId:"W44", legacyQuotes:["これはあり得るすべての世界の中で、最善の世界である。","小さな変化の積み重ねが、無限の可能性を生み出す。","論理こそが、真理へ至る唯一確かな道である。"] },
  { id:"W45", name:"アンドレアス・ヴェサリウス", nameHtml:"アンドレアス・ヴェサリウス", reading:"あんどれあすべさりうす", years:"1514〜1564年", country:"ベルギー（フランドル地方）", field:"解剖学者・医学者", photo:null, quotes:[], legacyId:"W45", legacyQuotes:["人体を実際に解剖してこそ、真実の医学が見えてくる。","千年前の医学書の誤りを、わたしはこの目で正していく。","体のしくみを正確に描くことが、医学を次の時代へ進める。"] },

  { id:"W47", name:"スティーヴン・ワインバーグ", nameHtml:"スティーヴン・ワインバーグ", reading:"すてぃーゔんわいんばーぐ", years:"1933〜2021年", country:"アメリカ", field:"物理学者", photo:null, quotes:[], legacyId:"W47", legacyQuotes:["宇宙が理解可能であればあるほど、それは無意味に思える。","科学の進歩とは、より深い謎への入り口を見つけることだ。","自然の法則は、驚くほどシンプルな数式で表される。"] },

var EPISODES = [
  { id:"001-01", personId:"001", title:"やけどを乗り越えて医師になった少年", tags:["努力","医学","国際貢献"],
    body:"野口英世は、1歳のときに囲炉裏に落ちて左手にひどいやけどを負い、指がくっつくほどの大けがをしました。家はとても貧しく、十分な治療を受けられませんでしたが、母のシカは「勉強だけはさせてやりたい」と英世を学校に通わせ続けました。友達にからかわれても、英世は負けずに勉強にはげみます。やがて担任の先生や同級生がお金を出し合い、手術を受けられることになりました。手術で左手が少しずつ動くようになったことがきっかけで、彼は医学の道を志すようになります。医師の資格を取った後はアメリカへ渡って細菌の研究に打ち込み、世界中を飛び回って黄熱病などの感染症を調べ続けました。そして研究のためおとずれたアフリカのガーナで自らも黄熱病にかかり、51歳でその生涯を閉じます。貧しさと体の不自由さという大きな壁を乗り越え、努力を積み重ねた英世の生き方は、今も多くの人に勇気を与え続けています。",
    bodyHtml:"野口英世は、1歳のときに\u003cruby>囲炉裏\u003crt>いろり\u003c/rt>\u003c/ruby>に落ちて左手にひどいやけどを負い、指がくっつくほどの大けがをしました。家はとても貧しく、十分な治療を受けられませんでしたが、母のシカは「勉強だけはさせてやりたい」と英世を学校に通わせ続けました。友達にからかわれても、英世は負けずに勉強にはげみます。やがて担任の先生や同級生がお金を出し合い、手術を受けられることになりました。手術で左手が少しずつ動くようになったことがきっかけで、彼は医学の道を\u003cruby>志\u003crt>こころざ\u003c/rt>\u003c/ruby>すようになります。医師の資格を取った後はアメリカへ渡って細菌の研究に打ち込み、世界中を飛び回って\u003cruby>黄熱病\u003crt>おうねつびょう\u003c/rt>\u003c/ruby>などの\u003cruby>感染症\u003crt>かんせんしょう\u003c/rt>\u003c/ruby>を調べ続けました。そして研究のためおとずれたアフリカのガーナで自らも\u003cruby>黄熱病\u003crt>おうねつびょう\u003c/rt>\u003c/ruby>にかかり、51歳でその生涯を閉じます。貧しさと体の不自由さという大きな壁を乗り越え、努力を積み重ねた英世の生き方は、今も多くの人に勇気を与え続けています。" },
  { id:"006-01", personId:"006", title:"苦学の末に2度のノーベル賞をとった科学者", tags:["努力","科学","女性のパイオニア"],
    body:"キュリー夫人は、ポーランドに生まれた女性です。当時、女性は大学で学ぶことが難しく、パリに渡って苦しい生活をしながら物理学と数学を学びました。夫のピエールとともにウランを含む鉱石を研究するうち、これまで知られていなかった新しい元素「ポロニウム」と「ラジウム」を発見します。放射線という目に見えないものを相手に、来る日も来る日も鉱石を煮つめて実験を続けました。この研究で、女性として初めてノーベル賞を受賞し、その後もう一度、別の分野でノーベル賞を受賞します。二度のノーベル賞受賞は、今も世界でただ一人の女性です。夫ピエールを事故で亡くしたあとも、女性として初めてパリ大学の教授となり、研究を続けました。放射線を浴び続けたことで体をこわしながらも、最後まで研究をやめなかったキュリー夫人の生き方は、多くの科学者に勇気を与えています。",
    bodyHtml:"キュリー夫人は、ポーランドに生まれた女性です。当時、女性は大学で学ぶことが難しく、パリに渡って苦しい生活をしながら物理学と数学を学びました。夫のピエールとともにウランを含む鉱石を研究するうち、これまで知られていなかった新しい\u003cruby>元素\u003crt>げんそ\u003c/rt>\u003c/ruby>「ポロニウム」と「ラジウム」を発見します。\u003cruby>放射線\u003crt>ほうしゃせん\u003c/rt>\u003c/ruby>という目に見えないものを相手に、来る日も来る日も鉱石を煮つめて実験を続けました。この研究で、女性として初めてノーベル賞を受賞し、その後もう一度、別の分野でノーベル賞を受賞します。二度のノーベル賞受賞は、今も世界でただ一人の女性です。夫ピエールを事故で亡くしたあとも、女性として初めてパリ大学の教授となり、研究を続けました。放射線を浴び続けたことで体をこわしながらも、最後まで研究をやめなかったキュリー夫人の生き方は、多くの科学者に勇気を与えています。" },
  { id:"007-01", personId:"007", title:"方位磁石への疑問から相対性理論へたどり着いた科学者", tags:["好奇心","科学","想像力"],
    body:"アインシュタインは、幼いころ言葉が遅く、学校の勉強も得意ではありませんでした。しかし5歳のとき、父からもらった方位磁石の針がいつも同じ方向を指すことに強い興味を持ち、目に見えない力のしくみを考え続けるようになります。大学を出たあとはすぐに研究者になれず、特許庁の職員として働きながら、休みの時間に自分の理論を組み立てていきました。そして26歳のとき、時間や空間についての常識をくつがえす「相対性理論」を発表し、世界中の科学者をおどろかせます。この理論は、のちにGPSなど身近な技術にも生かされることになりました。晩年は核兵器の恐ろしさを世界に訴えるなど、平和のための活動にも力を注ぎました。「想像力は知識よりも重要だ」という彼の言葉どおり、疑問を持ち続ける姿勢が数々の大発見を生み出したのです。",
    bodyHtml:"アインシュタインは、幼いころ言葉が遅く、学校の勉強も得意ではありませんでした。しかし5歳のとき、父からもらった\u003cruby>方位磁石\u003crt>ほういじしゃく\u003c/rt>\u003c/ruby>の針がいつも同じ方向を指すことに強い興味を持ち、目に見えない力のしくみを考え続けるようになります。大学を出たあとはすぐに研究者になれず、\u003cruby>特許庁\u003crt>とっきょちょう\u003c/rt>\u003c/ruby>の職員として働きながら、休みの時間に自分の理論を組み立てていきました。そして26歳のとき、時間や空間についての常識をくつがえす「\u003cruby>相対性理論\u003crt>そうたいせいりろん\u003c/rt>\u003c/ruby>」を発表し、世界中の科学者をおどろかせます。この理論は、のちにGPSなど身近な技術にも生かされることになりました。晩年は核兵器の恐ろしさを世界に訴えるなど、平和のための活動にも力を注ぎました。「想像力は知識よりも重要だ」という彼の言葉どおり、疑問を持ち続ける姿勢が数々の大発見を生み出したのです。" },
  { id:"014-01", personId:"014", title:"失敗を恐れなかった発明王", tags:["発明","努力","好奇心"],
    body:"エジソンは子どものころ、先生から質問をしすぎると怒られ、わずか3か月で学校をやめさせられました。実は幼いころの病気の影響で耳が聞こえにくく、それでも母親から教育を受け、家の地下室を実験室に変えて化学や電気の実験に夢中になります。少年時代は汽車の中で新聞やお菓子を売って稼いだお金で、実験の道具をそろえていたそうです。大人になってからは「メンロパークの魔術師」と呼ばれる研究所をつくり、蓄音機や白熱電球など、生涯で1300以上もの発明を世に送り出しました。電球のフィラメントの実験では、1万通り以上の材料を試したといわれています。失敗のたびに「これはうまくいかない方法を一つ見つけただけだ」と考え、決してあきらめませんでした。この失敗を恐れない姿勢は、今も世界中の発明家や研究者に受け継がれています。",
    bodyHtml:"エジソンは子どものころ、先生から質問をしすぎると怒られ、わずか3か月で学校をやめさせられました。実は幼いころの病気の影響で耳が聞こえにくく、それでも母親から教育を受け、家の地下室を実験室に変えて化学や電気の実験に夢中になります。少年時代は汽車の中で新聞やお菓子を売って稼いだお金で、実験の道具をそろえていたそうです。大人になってからは「メンロパークの魔術師」と呼ばれる研究所をつくり、\u003cruby>蓄音機\u003crt>ちくおんき\u003c/rt>\u003c/ruby>や\u003cruby>白熱電球\u003crt>はくねつでんきゅう\u003c/rt>\u003c/ruby>など、生涯で1300以上もの発明を世に送り出しました。電球のフィラメントの実験では、1万通り以上の材料を試したといわれています。失敗のたびに「これはうまくいかない方法を一つ見つけただけだ」と考え、決してあきらめませんでした。この失敗を恐れない姿勢は、今も世界中の発明家や研究者に受け継がれています。" },
  { id:"026-01", personId:"026", title:"薩長同盟を実現させた幕末の風雲児", tags:["行動力","幕末","志"],
    body:"坂本龍馬は、土佐藩（今の高知県）の下級武士の家に生まれました。幼いころは泣き虫で勉強も苦手だったといわれていますが、剣術の道場に通ううちにめきめきと腕をあげます。剣術道場での修行を通じて身につけた度胸と行動力が、のちの活躍の土台になったといわれています。ペリー来航をきっかけに世の中の変化を感じ取った龍馬は、土佐藩を飛び出し、敵対していた薩摩藩と長州藩を結びつける「薩長同盟」の実現に力をつくしました。また、日本で初めての株式会社ともいわれる「亀山社中」をつくり、貿易や海運の仕事にも取り組みます。新しい日本のかたちを思いえがき、幕府が政権を朝廷に返す「大政奉還」の実現にも大きな役割をはたしましたが、その直後、京都で何者かに命をうばわれ、33歳でこの世を去りました。",
    bodyHtml:"坂本龍馬は、土佐藩（今の高知県）の下級武士の家に生まれました。幼いころは泣き虫で勉強も苦手だったといわれていますが、剣術の道場に通ううちにめきめきと腕をあげます。剣術道場での修行を通じて身につけた度胸と行動力が、のちの活躍の土台になったといわれています。ペリー来航をきっかけに世の中の変化を感じ取った龍馬は、土佐藩を飛び出し、敵対していた薩摩藩と長州藩を結びつける「\u003cruby>薩長同盟\u003crt>さっちょうどうめい\u003c/rt>\u003c/ruby>」の実現に力をつくしました。また、日本で初めての株式会社ともいわれる「\u003cruby>亀山社中\u003crt>かめやましゃちゅう\u003c/rt>\u003c/ruby>」をつくり、貿易や海運の仕事にも取り組みます。新しい日本のかたちを思いえがき、幕府が政権を朝廷に返す「\u003cruby>大政奉還\u003crt>たいせいほうかん\u003c/rt>\u003c/ruby>」の実現にも大きな役割をはたしましたが、その直後、京都で何者かに命をうばわれ、33歳でこの世を去りました。" },
  { id:"029-01", personId:"029", title:"「学問のすゝめ」で平等と学びを説いた教育者", tags:["教育","平等","学問"],
    body:"福澤諭吉は、貧しい下級武士の家に生まれ、幼いころから儒学や蘭学を熱心に学びました。江戸幕府の使節としてアメリカやヨーロッパへ渡り、進んだ制度や考え方を目にしたことは、その後の人生に大きな影響をあたえます。帰国後、日本で初めての本格的な私立学校となる慶應義塾を開き、多くの若者に学問を教えました。代表作『学問のすゝめ』の中で「天は人の上に人を造らず、人の下に人を造らず」と書き、人はみな平等であるべきだという考えを示しました。また、人はみな平等だと述べる一方で「だからこそ学ばなければ差がついてしまう」とも説きました。この本は当時、日本人のおよそ10人に1人が読んだといわれるほどの大ベストセラーになりました。",
    bodyHtml:"福澤諭吉は、貧しい下級武士の家に生まれ、幼いころから\u003cruby>儒学\u003crt>じゅがく\u003c/rt>\u003c/ruby>や\u003cruby>蘭学\u003crt>らんがく\u003c/rt>\u003c/ruby>を熱心に学びました。江戸幕府の使節としてアメリカやヨーロッパへ渡り、進んだ制度や考え方を目にしたことは、その後の人生に大きな影響をあたえます。帰国後、日本で初めての本格的な私立学校となる\u003cruby>慶應義塾\u003crt>けいおうぎじゅく\u003c/rt>\u003c/ruby>を開き、多くの若者に学問を教えました。代表作『学問のすゝめ』の中で「天は人の上に人を造らず、人の下に人を造らず」と書き、人はみな平等であるべきだという考えを示しました。また、人はみな平等だと述べる一方で「だからこそ学ばなければ差がついてしまう」とも説きました。この本は当時、日本人のおよそ10人に1人が読んだといわれるほどの大ベストセラーになりました。" },
  { id:"030-01", personId:"030", title:"道徳と経済の両立を説いた「日本資本主義の父」", tags:["実業","道徳","社会貢献"],
    body:"渋沢栄一は、埼玉県の農家に生まれ、若いころは幕府をたおそうとする運動にくわわっていました。しかし考えを変え、江戸幕府の役人としてヨーロッパへ渡り、銀行や会社のしくみを学びます。帰国後、日本で初めての銀行や、株式会社という仕組みを取り入れ、生涯でおよそ500もの会社の設立や育成にかかわりました。渋沢は「お金もうけだけを考えるのではなく、道徳にかなった正しいやり方で経済を発展させることが大切だ」という考えを『論語と算盤』という本に著しました。実業家として利益を追い求めるだけでなく、社会全体を豊かにすることを常に考えていました。福祉施設や学校づくりにも力をつくし、「日本資本主義の父」と呼ばれています。2024年からは新しい一万円札の顔にもなりました。",
    bodyHtml:"渋沢栄一は、埼玉県の農家に生まれ、若いころは幕府をたおそうとする運動にくわわっていました。しかし考えを変え、江戸幕府の役人としてヨーロッパへ渡り、銀行や会社のしくみを学びます。帰国後、日本で初めての銀行や、株式会社という仕組みを取り入れ、生涯でおよそ500もの会社の設立や育成にかかわりました。渋沢は「お金もうけだけを考えるのではなく、道徳にかなった正しいやり方で経済を発展させることが大切だ」という考えを『\u003cruby>論語\u003crt>ろんご\u003c/rt>\u003c/ruby>と\u003cruby>算盤\u003crt>そろばん\u003c/rt>\u003c/ruby>』という本に著しました。実業家として利益を追い求めるだけでなく、社会全体を豊かにすることを常に考えていました。福祉施設や学校づくりにも力をつくし、「日本資本主義の父」と呼ばれています。2024年からは新しい一万円札の顔にもなりました。" },
  { id:"031-01", personId:"031", title:"薪を背負いながら学び、村を立て直した青年", tags:["努力","勤勉","農業"],
    body:"二宮金次郎は、江戸時代の農家に生まれました。子どものころに川の氾濫で田畑を失い、家族と離ればなれになって親戚の家で暮らすことになります。それでも金次郎は、山で薪を拾って売りながら、歩く道すがら本を読んで勉強を続けました。捨てられていた稲の苗を集めて育て、収穫した米を元手に少しずつ田畑を買い戻していきます。この「小さなことをこつこつ積み重ねれば、やがて大きなことを成しとげられる」という考えを「積小為大」と呼びました。大人になった金次郎は、この考えをもとに、荒れはてた600以上の農村を立て直す仕事にたずさわります。彼の教えは「報徳思想」と呼ばれ、明治から昭和にかけて多くの学校教育のお手本とされました。薪を背負いながら本を読む金次郎の像は、今も多くの小学校に立っています。",
    bodyHtml:"二宮金次郎は、江戸時代の農家に生まれました。子どものころに川の\u003cruby>氾濫\u003crt>はんらん\u003c/rt>\u003c/ruby>で田畑を失い、家族と離ればなれになって親戚の家で暮らすことになります。それでも金次郎は、山で薪を拾って売りながら、歩く道すがら本を読んで勉強を続けました。捨てられていた\u003cruby>稲\u003crt>いね\u003c/rt>\u003c/ruby>の苗を集めて育て、収穫した米を元手に少しずつ田畑を買い戻していきます。この「小さなことをこつこつ積み重ねれば、やがて大きなことを成しとげられる」という考えを「\u003cruby>積小為大\u003crt>せきしょういだい\u003c/rt>\u003c/ruby>」と呼びました。大人になった金次郎は、この考えをもとに、荒れはてた600以上の農村を立て直す仕事にたずさわります。彼の教えは「\u003cruby>報徳思想\u003crt>ほうとくしそう\u003c/rt>\u003c/ruby>」と呼ばれ、明治から昭和にかけて多くの学校教育のお手本とされました。薪を背負いながら本を読む金次郎の像は、今も多くの小学校に立っています。" },
  { id:"061-01", personId:"061", title:"「ウォーター」の一言で世界が変わった少女", tags:["努力","福祉","教育"],
    body:"ヘレン・ケラーは、生後まもない病気がもとで、目も見えず、耳も聞こえず、話すこともできなくなりました。何も伝えられないもどかしさから、幼いころは物にあたって暴れることもあったといいます。7歳のとき、家庭教師のサリバン先生と出会い、井戸水に触れながら「water(ウォーター)」という言葉と、水という感覚がつながった瞬間、ヘレンの世界は大きく変わりました。この出会いをきっかけに、ヘレンは生涯にわたってサリバン先生とともに歩み続けました。そこから指文字や点字を覚え、大学にも進学して、世界で初めて大学を卒業した盲ろう者になります。その後は世界中を旅して、体の不自由な人たちの教育や福祉のために力をつくしました。三重の障がいを乗り越えたヘレンの生き方は、今も多くの人に希望を与えています。",
