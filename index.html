    bodyHtml:"豊後国(現在の大分県)の大名・大友宗麟は、九州の有力大名でありながら、宣教師フランシスコ・ザビエルらの日本での布教をいち早く許可し、南蛮貿易にも積極的に取り組んだ開明的な人物として知られる。晩年には自らも洗礼を受けてキリシタン大名となり、有馬晴信・大村純忠とともに1582年、伊東マンショら4人の少年をローマ教皇のもとへ派遣する「天正遣欧少年使節」を実現させた。この使節はヨーロッパの人々を大いに驚かせ、帰国後の日本にも西洋の活版印刷術や絵画技法などをもたらした。晩年は1578年の耳川の戦いで島津氏に大敗して勢力を大きく失ったが、いち早く西洋文化を積極的に取り入れた先駆者として、日本の対外交流史の中で今も高く評価されており、本拠地の府内(現在の大分市)には当時の南蛮貿易のにぎわいを伝える史跡が今も残されている。", source:"legacy", sourceId:"J46" },
  { id:"J47-01", personId:"J47", title:"この人の歩み", tags:["政治"],
    body:"播磨国(現在の兵庫県)の武将・黒田官兵衛(如水)は、豊臣秀吉に仕えて中国攻めや朝鮮出兵などで数々の戦略を立案し、天下統一を陰から支えた稀代の知将である。荒木村重が信長に対して謀反を起こした際、単身説得に乗り込んだところをとらえられ、約1年もの間、有岡城の狭い土牢に幽閉されるという壮絶な苦難を味わった。この幽閉によって足を悪くし杖なしでは歩けなくなったと伝えられるが、救出後も秀吉のもとで活躍を続け、賤ヶ岳の戦いや九州平定でも功績を挙げた。あまりに優れた智謀ゆえに秀吉から警戒されたともいわれ、晩年は出家して如水と号し、関ヶ原の戦いの際には九州で独自に兵を挙げるなど、最後まで乱世を巧みに生き抜いた。子・黒田長政の代には筑前福岡藩の礎を築くこととなった。官兵衛自身は生涯を通じて大名としての広大な領地を望まず、あくまで智謀によって主家を支え続けたことでも知られている。",
    bodyHtml:"播磨国(現在の兵庫県)の武将・黒田官兵衛(如水)は、豊臣秀吉に仕えて中国攻めや朝鮮出兵などで数々の戦略を立案し、天下統一を陰から支えた稀代の知将である。荒木村重が信長に対して謀反を起こした際、単身説得に乗り込んだところをとらえられ、約1年もの間、有岡城の狭い土牢に幽閉されるという壮絶な苦難を味わった。この幽閉によって足を悪くし杖なしでは歩けなくなったと伝えられるが、救出後も秀吉のもとで活躍を続け、賤ヶ岳の戦いや九州平定でも功績を挙げた。あまりに優れた智謀ゆえに秀吉から警戒されたともいわれ、晩年は出家して如水と号し、関ヶ原の戦いの際には九州で独自に兵を挙げるなど、最後まで乱世を巧みに生き抜いた。子・黒田長政の代には筑前福岡藩の礎を築くこととなった。官兵衛自身は生涯を通じて大名としての広大な領地を望まず、あくまで智謀によって主家を支え続けたことでも知られている。", source:"legacy", sourceId:"J47" },
  { id:"J48-01", personId:"J48", title:"この人の歩み", tags:["政治"],
    body:"肥後国(現在の熊本県)の大名・加藤清正は、豊臣秀吉の子飼いの武将として1583年の賤ヶ岳の戦いで功を挙げ、朝鮮出兵の際には虎を退治したという「虎退治」の逸話でも知られる勇猛な武将である。築城の名手としても名高く、彼が心血を注いで築いた熊本城は、敵の侵入を防ぐために反り返った独特の石垣「武者返し」を備えた堅固さと、荘厳な美しさを兼ね備えた名城として今なお多くの人に親しまれ、大天守と小天守の壮大な威容は熊本のシンボルとなっている。関ヶ原の戦いでは東軍につき、戦後は肥後一国を領する大名となったが、豊臣家への恩義を忘れず、豊臣秀頼の身を案じて徳川家康との会見の場に自ら同席し、その安全を守ろうとしたとも伝えられている。治水事業にも力を注いで白川など河川の氾濫を防ぎ、熊本の発展に大きく貢献した名君でもあり、地元では今も「せいしょこさん」の愛称で親しまれている。",
    bodyHtml:"肥後国(現在の熊本県)の大名・加藤清正は、豊臣秀吉の子飼いの武将として1583年の賤ヶ岳の戦いで功を挙げ、朝鮮出兵の際には虎を退治したという「虎退治」の逸話でも知られる勇猛な武将である。築城の名手としても名高く、彼が心血を注いで築いた熊本城は、敵の侵入を防ぐために反り返った独特の石垣「武者返し」を備えた堅固さと、荘厳な美しさを兼ね備えた名城として今なお多くの人に親しまれ、大天守と小天守の壮大な威容は熊本のシンボルとなっている。関ヶ原の戦いでは東軍につき、戦後は肥後一国を領する大名となったが、豊臣家への恩義を忘れず、豊臣秀頼の身を案じて徳川家康との会見の場に自ら同席し、その安全を守ろうとしたとも伝えられている。治水事業にも力を注いで白川など河川の氾濫を防ぎ、熊本の発展に大きく貢献した名君でもあり、地元では今も「せいしょこさん」の愛称で親しまれている。", source:"legacy", sourceId:"J48" },
  { id:"J49-01", personId:"J49", title:"この人の歩み", tags:["政治"],
    body:"尾張国(現在の愛知県)出身の福島正則は、豊臣秀吉の縁者として若くから仕え、1583年の賤ヶ岳の戦いで一番槍の武功を挙げ、「賤ヶ岳の七本槍」の筆頭として名を馳せた猛将である。豊臣家に深い恩義を感じていたにもかかわらず、日頃から不仲であった石田三成への反発から関ヶ原の戦いでは徳川方の先鋒として奮戦し、戦後は安芸・備後(現在の広島県)49万石余りを与えられる大大名となった。しかし1619年、水害で損壊した居城・広島城を幕府への届け出なく無断で修築したことを咎められ、些細な法令違反を理由に信濃(現在の長野県)へ大幅に改易・減封されてしまい、その厳しすぎる処遇は、豊臣恩顧の大名を排除しようとする幕府の意図を象徴する出来事として、多くの武士に衝撃を与えた。晩年は信濃の地でわずかな知行を与えられ、静かに余生を送ったと伝えられている。",
    bodyHtml:"尾張国(現在の愛知県)出身の福島正則は、豊臣秀吉の縁者として若くから仕え、1583年の賤ヶ岳の戦いで一番槍の武功を挙げ、「賤ヶ岳の七本槍」の筆頭として名を馳せた猛将である。豊臣家に深い恩義を感じていたにもかかわらず、日頃から不仲であった石田三成への反発から関ヶ原の戦いでは徳川方の先鋒として奮戦し、戦後は安芸・備後(現在の広島県)49万石余りを与えられる大大名となった。しかし1619年、水害で損壊した居城・広島城を幕府への届け出なく無断で修築したことを咎められ、些細な法令違反を理由に信濃(現在の長野県)へ大幅に改易・減封されてしまい、その厳しすぎる処遇は、豊臣恩顧の大名を排除しようとする幕府の意図を象徴する出来事として、多くの武士に衝撃を与えた。晩年は信濃の地でわずかな知行を与えられ、静かに余生を送ったと伝えられている。", source:"legacy", sourceId:"J49" },
  { id:"J50-01", personId:"J50", title:"この人の歩み", tags:["政治"],
    body:"近江国(現在の滋賀県)出身の石田三成は、若くして豊臣秀吉に見出されて奉行を務め、検地や兵站の管理など地味ながら重要な行政手腕を発揮した文官肌の武将である。秀吉の死後、専横を強める徳川家康に反発して兵を挙げ、1600年の関ヶ原の戦いに臨んだが、味方であるはずの小早川秀秋の裏切りなどもあって西軍は総崩れとなり、三成は捕らえられて京都・六条河原で処刑された。享年41。武勇に優れた盟友・大谷吉継とともに「三成に過ぎたるものが二つあり、島の左近と佐和山の城」と評されるなど、その卓越した能力の高さは、後に天下を取ることになる家康さえも一目置くものであったと伝えられている。処刑前に喉の渇きを訴え、体に良くないという理由で差し出された干し柿を断ったという逸話も、彼の几帳面で最後まで理を重んじる人柄をよく表す話として伝わっている。",
    bodyHtml:"近江国(現在の滋賀県)出身の石田三成は、若くして豊臣秀吉に見出されて奉行を務め、検地や兵站の管理など地味ながら重要な行政手腕を発揮した文官肌の武将である。秀吉の死後、専横を強める徳川家康に反発して兵を挙げ、1600年の関ヶ原の戦いに臨んだが、味方であるはずの小早川秀秋の裏切りなどもあって西軍は総崩れとなり、三成は捕らえられて京都・六条河原で処刑された。享年41。武勇に優れた盟友・大谷吉継とともに「三成に過ぎたるものが二つあり、島の左近と佐和山の城」と評されるなど、その卓越した能力の高さは、後に天下を取ることになる家康さえも一目置くものであったと伝えられている。処刑前に喉の渇きを訴え、体に良くないという理由で差し出された干し柿を断ったという逸話も、彼の几帳面で最後まで理を重んじる人柄をよく表す話として伝わっている。", source:"legacy", sourceId:"J50" },
  { id:"J51-01", personId:"J51", title:"この人の歩み", tags:["政治"],
    body:"陸奥国(現在の宮城県)の大名・伊達政宗に幼い頃から近侍した片倉小十郎(景綱)は、政宗の教育係を務めた後、その右腕として長きにわたり仕え続けた重臣である。政宗が実母から毒殺を図られたと伝えられる事件の際にも冷静に主君を守り抜き、また豊臣秀吉のもとへ弁明に向かう政宗に対して、死を覚悟したことを示す白装束姿で臨むよう進言するなど、機知に富んだ助言によって幾度も伊達家の窮地を救った。忠義と知略を兼ね備えたその働きぶりは伊達家中で高く評価され、「伊達の左腕」とも称された。豊臣秀吉から自らへの直接の仕官を望まれたが、それを固辞して政宗のもとに残ったという逸話も伝わり、子孫はその後も仙台藩の重臣として代々白石城を治め、藩政を支え続けることとなった。戦国の乱世を生き抜いた片倉家の忠義ぶりは、伊達家の歴史を語るうえで欠かせない存在として今も語り継がれている。",
    bodyHtml:"陸奥国(現在の宮城県)の大名・伊達政宗に幼い頃から近侍した片倉小十郎(景綱)は、政宗の教育係を務めた後、その右腕として長きにわたり仕え続けた重臣である。政宗が実母から毒殺を図られたと伝えられる事件の際にも冷静に主君を守り抜き、また豊臣秀吉のもとへ弁明に向かう政宗に対して、死を覚悟したことを示す白装束姿で臨むよう進言するなど、機知に富んだ助言によって幾度も伊達家の窮地を救った。忠義と知略を兼ね備えたその働きぶりは伊達家中で高く評価され、「伊達の左腕」とも称された。豊臣秀吉から自らへの直接の仕官を望まれたが、それを固辞して政宗のもとに残ったという逸話も伝わり、子孫はその後も仙台藩の重臣として代々白石城を治め、藩政を支え続けることとなった。戦国の乱世を生き抜いた片倉家の忠義ぶりは、伊達家の歴史を語るうえで欠かせない存在として今も語り継がれている。", source:"legacy", sourceId:"J51" },
  { id:"J52-01", personId:"J52", title:"この人の歩み", tags:["政治"],
    body:"紀伊国(現在の和歌山県)雑賀荘を本拠とした鉄砲傭兵集団・雑賀衆を率いたとされる雑賀孫市は、卓越した鉄砲の腕前と統率力で名を馳せた人物である。実在の経歴には不明な点が多く、鈴木孫一(重秀)という人物を指すともいわれ、複数の当主が代々「孫市」の名を受け継いだ役職名だったとも考えられている。石山本願寺と織田信長との十年にわたる戦い(石山合戦)では本願寺方に味方して雑賀衆を率い、当時としては最新鋭であった鉄砲を巧みに用いた集団戦術によって、信長軍をたびたび苦しめたと伝えられる。その戦いぶりは、槍や弓が中心だった戦の形を鉄砲中心へと変えていく、戦国時代の大きな転換点を象徴する出来事として今に語り継がれている。後年は豊臣秀吉に接近して和睦を結んだとする説もあり、雑賀衆の一部はその後も鉄砲の技術者集団として生き延びたと伝えられている。",
    bodyHtml:"紀伊国(現在の和歌山県)雑賀荘を本拠とした鉄砲傭兵集団・雑賀衆を率いたとされる雑賀孫市は、卓越した鉄砲の腕前と統率力で名を馳せた人物である。実在の経歴には不明な点が多く、鈴木孫一(重秀)という人物を指すともいわれ、複数の当主が代々「孫市」の名を受け継いだ役職名だったとも考えられている。石山本願寺と織田信長との十年にわたる戦い(石山合戦)では本願寺方に味方して雑賀衆を率い、当時としては最新鋭であった鉄砲を巧みに用いた集団戦術によって、信長軍をたびたび苦しめたと伝えられる。その戦いぶりは、槍や弓が中心だった戦の形を鉄砲中心へと変えていく、戦国時代の大きな転換点を象徴する出来事として今に語り継がれている。後年は豊臣秀吉に接近して和睦を結んだとする説もあり、雑賀衆の一部はその後も鉄砲の技術者集団として生き延びたと伝えられている。", source:"legacy", sourceId:"J52" },
  { id:"J53-01", personId:"J53", title:"この人の歩み", tags:["政治"],
    body:"甲斐国(現在の山梨県)の大名・武田信玄に仕えたと伝えられる山本勘助は、隻眼・跛足という身体的なハンディを抱えながらも、卓越した築城術と兵法の知識によって重く用いられたとされる軍師である。1561年の第四次川中島の戦いでは、軍勢を二手に分けて上杉軍を挟み撃ちにする「啄木鳥(きつつき)戦法」を信玄に献策したものの、これを敵将・上杉謙信に見抜かれて逆に痛手をこうむり、みずからも壮絶な討ち死にを遂げたと語られている。ただし勘助の実在を裏づける同時代の史料は乏しく、江戸時代に成立した軍記物語『甲陽軍鑑』によって広く世に知られるようになった、伝説性の強い人物とされている。近年の研究では実在を示す文書も一部見つかっており、実像をめぐる議論は今も続いている。存在の真偽にかかわらず、彼にまつわる兵法や築城の逸話は、後世の武将たちの物語にも大きな影響を与えたといわれている。",
    bodyHtml:"甲斐国(現在の山梨県)の大名・武田信玄に仕えたと伝えられる山本勘助は、隻眼・跛足という身体的なハンディを抱えながらも、卓越した築城術と兵法の知識によって重く用いられたとされる軍師である。1561年の第四次川中島の戦いでは、軍勢を二手に分けて上杉軍を挟み撃ちにする「啄木鳥(きつつき)戦法」を信玄に献策したものの、これを敵将・上杉謙信に見抜かれて逆に痛手をこうむり、みずからも壮絶な討ち死にを遂げたと語られている。ただし勘助の実在を裏づける同時代の史料は乏しく、江戸時代に成立した軍記物語『甲陽軍鑑』によって広く世に知られるようになった、伝説性の強い人物とされている。近年の研究では実在を示す文書も一部見つかっており、実像をめぐる議論は今も続いている。存在の真偽にかかわらず、彼にまつわる兵法や築城の逸話は、後世の武将たちの物語にも大きな影響を与えたといわれている。", source:"legacy", sourceId:"J53" },
  { id:"J54-01", personId:"J54", title:"この人の歩み", tags:["芸術"],
    body:"江戸時代中期に活躍した浮世絵師・喜多川歌麿は、女性の美しさをしなやかな筆致で描く「美人画」で一世を風靡した絵師である。それまで全身を描くことが主流だった浮世絵において、人物の顔や上半身を大きくクローズアップして描く「大首絵」という手法を確立し、着物の模様や指先のわずかな仕草にまで気を配ることで、モデルとなった女性の内面の心情までも感じさせる繊細な表現を生み出した。代表作『婦人相学十躰』などの連作は江戸の庶民から絶大な人気を集めた一方、寛政の改革のもとで奢侈を戒める風潮が強まり、晩年には豊臣秀吉を題材にした作品が風紀を乱したとして手鎖の刑を受けるなど、幕府との摩擦にも見舞われている。彼の作品は幕末以降に海を渡り、ヨーロッパの印象派の画家たちにも大きな影響を与えて、19世紀の「ジャポニスム」と呼ばれる日本趣味の流行の一因ともなった。",
    bodyHtml:"江戸時代中期に活躍した浮世絵師・喜多川歌麿は、女性の美しさをしなやかな筆致で描く「美人画」で一世を風靡した絵師である。それまで全身を描くことが主流だった浮世絵において、人物の顔や上半身を大きくクローズアップして描く「大首絵」という手法を確立し、着物の模様や指先のわずかな仕草にまで気を配ることで、モデルとなった女性の内面の心情までも感じさせる繊細な表現を生み出した。代表作『婦人相学十躰』などの連作は江戸の庶民から絶大な人気を集めた一方、寛政の改革のもとで奢侈を戒める風潮が強まり、晩年には豊臣秀吉を題材にした作品が風紀を乱したとして手鎖の刑を受けるなど、幕府との摩擦にも見舞われている。彼の作品は幕末以降に海を渡り、ヨーロッパの印象派の画家たちにも大きな影響を与えて、19世紀の「ジャポニスム」と呼ばれる日本趣味の流行の一因ともなった。", source:"legacy", sourceId:"J54" },
  { id:"W01-01", personId:"W01", title:"この人の歩み", tags:["科学"],
    body:"フランスの物理学者ピエール・キュリーは、もともと結晶に力を加えると電気が生じる「圧電効果」を兄ジャックとともに発見していた優れた実験家であったが、妻マリーと出会うと、二人は放射性物質の研究にのめり込み、粗末な物置小屋を実験室代わりに使いながら、何トンもの鉱石ピッチブレンドを気の遠くなる作業で処理し続けた。その末に新元素ラジウムとポロニウムを発見し、放射能の研究によって1903年に夫婦そろってノーベル物理学賞を受賞した。しかしその栄光から3年後の1906年、パリの雨の降る通りで馬車にはねられ、46歳で突然この世を去ってしまう。夫を失ったマリーはその後も研究を続け、1911年に単独でノーベル化学賞を受賞し、二人が切り開いた放射線の科学は、後にがん治療などにも役立てられていくことになった。当時はまだ放射線の危険性がほとんど知られておらず、二人が残した実験ノートには今も強い放射能が残っているため、現在は鉛の箱に納められ、閲覧には防護服が必要とされている。",
    bodyHtml:"フランスの物理学者ピエール・キュリーは、もともと結晶に力を加えると電気が生じる「圧電効果」を兄ジャックとともに発見していた優れた実験家であったが、妻マリーと出会うと、二人は放射性物質の研究にのめり込み、粗末な物置小屋を実験室代わりに使いながら、何トンもの鉱石ピッチブレンドを気の遠くなる作業で処理し続けた。その末に新元素ラジウムとポロニウムを発見し、放射能の研究によって1903年に夫婦そろってノーベル物理学賞を受賞した。しかしその栄光から3年後の1906年、パリの雨の降る通りで馬車にはねられ、46歳で突然この世を去ってしまう。夫を失ったマリーはその後も研究を続け、1911年に単独でノーベル化学賞を受賞し、二人が切り開いた放射線の科学は、後にがん治療などにも役立てられていくことになった。当時はまだ放射線の危険性がほとんど知られておらず、二人が残した実験ノートには今も強い放射能が残っているため、現在は鉛の箱に納められ、閲覧には防護服が必要とされている。", source:"legacy", sourceId:"W01" },
  { id:"W02-01", personId:"W02", title:"この人の歩み", tags:["科学"],
    body:"ドイツの物理学者マックス・プランクは、熱せられた物体が放つ光の色や強さを説明しようと研究を重ねる中で、エネルギーは連続的にではなく「量子」と呼ばれるとびとびの単位でやり取りされるという画期的な仮説を1900年に発表した。この考えは、それまでの物理学の常識を根底から覆すものであり、プランク自身も長い間その意味を確信できずにいたと伝えられる。しかし後にアインシュタインが光を粒子として説明する際にこの考えを用い、さらにボーアらによって発展させられたことで、量子力学という新しい物理学の分野が誕生した。プランクは1918年にノーベル物理学賞を受賞し、現代物理学の扉を開いた人物として名を残している。私生活では二度の世界大戦で息子たちを失うなど深い悲しみを味わったが、生涯にわたって研究者としての誠実さを貫き、後進の育成にも力を尽くした。物理学の世界で最も権威ある賞のひとつには、彼の功績をたたえて「プランク賞」という名前がつけられている。",
    bodyHtml:"ドイツの物理学者マックス・プランクは、熱せられた物体が放つ光の色や強さを説明しようと研究を重ねる中で、エネルギーは連続的にではなく「量子」と呼ばれるとびとびの単位でやり取りされるという画期的な仮説を1900年に発表した。この考えは、それまでの物理学の常識を根底から覆すものであり、プランク自身も長い間その意味を確信できずにいたと伝えられる。しかし後にアインシュタインが光を粒子として説明する際にこの考えを用い、さらにボーアらによって発展させられたことで、量子力学という新しい物理学の分野が誕生した。プランクは1918年にノーベル物理学賞を受賞し、現代物理学の扉を開いた人物として名を残している。私生活では二度の世界大戦で息子たちを失うなど深い悲しみを味わったが、生涯にわたって研究者としての誠実さを貫き、後進の育成にも力を尽くした。物理学の世界で最も権威ある賞のひとつには、彼の功績をたたえて「プランク賞」という名前がつけられている。", source:"legacy", sourceId:"W02" },
  { id:"W03-01", personId:"W03", title:"この人の歩み", tags:["科学"],
    body:"デンマークの物理学者ニールス・ボーアは、原子の中で電子が決まったとびとびの軌道だけを回り、軌道を移る際に光を放出したり吸収したりするという「ボーアの原子模型」を1913年に発表し、量子力学の基礎を築いた功績で1922年にノーベル物理学賞を受賞した。第二次世界大戦中、ユダヤ系であったボーアはナチス・ドイツの手を逃れてスウェーデン経由でイギリスへ渡り、後に原子爆弾の開発計画にも協力したが、戦後は核兵器の国際管理を強く訴え、原子力の平和利用を各国に呼びかけ続けた。故郷コペンハーゲンに設立した理論物理学研究所には世界中から若い物理学者が集まり、彼の温かい人柄のもとで自由な議論を重ね、量子力学の解釈をめぐる論争の中心地として、多くの優れた研究者を育て上げた。原子力研究の父の一人として知られる一方、身近な物事を例えに使って本質を語る話し方でも親しまれ、その考え方は「コペンハーゲン解釈」として今も物理学の教科書に残されている。",
    bodyHtml:"デンマークの物理学者ニールス・ボーアは、原子の中で電子が決まったとびとびの軌道だけを回り、軌道を移る際に光を放出したり吸収したりするという「ボーアの原子模型」を1913年に発表し、量子力学の基礎を築いた功績で1922年にノーベル物理学賞を受賞した。第二次世界大戦中、ユダヤ系であったボーアはナチス・ドイツの手を逃れてスウェーデン経由でイギリスへ渡り、後に原子爆弾の開発計画にも協力したが、戦後は核兵器の国際管理を強く訴え、原子力の平和利用を各国に呼びかけ続けた。故郷コペンハーゲンに設立した理論物理学研究所には世界中から若い物理学者が集まり、彼の温かい人柄のもとで自由な議論を重ね、量子力学の解釈をめぐる論争の中心地として、多くの優れた研究者を育て上げた。原子力研究の父の一人として知られる一方、身近な物事を例えに使って本質を語る話し方でも親しまれ、その考え方は「コペンハーゲン解釈」として今も物理学の教科書に残されている。", source:"legacy", sourceId:"W03" },
  { id:"W04-01", personId:"W04", title:"この人の歩み", tags:["科学"],
    body:"ニュージーランド生まれの物理学者アーネスト・ラザフォードは、農家の息子として育ち、奨学金を得てイギリスへ渡ると、放射線をごく薄い金箔にあてる実験を行い、ほとんどの粒子はまっすぐ通り抜けるのに、ごくわずかな粒子が大きく跳ね返されることを発見した。この結果から、原子の中心にはプラスの電気を帯びた小さく重い「原子核」が存在し、その周りを電子が回っているという新しい原子像を1911年に打ち立てた。1908年には放射性元素の研究でノーベル化学賞を受賞しているが、本人は「すべての科学は物理学であるか、切手集めであるかのどちらかだ」と語るほど物理学を愛し、マンチェスター大学やケンブリッジ大学で教えた学生たちからも、後に何人ものノーベル賞受賞者を輩出し、彼にちなんで原子番号104の元素には「ラザホージウム」という名前がつけられ、その功績を今に伝えている。",
    bodyHtml:"ニュージーランド生まれの物理学者アーネスト・ラザフォードは、農家の息子として育ち、奨学金を得てイギリスへ渡ると、放射線をごく薄い金箔にあてる実験を行い、ほとんどの粒子はまっすぐ通り抜けるのに、ごくわずかな粒子が大きく跳ね返されることを発見した。この結果から、原子の中心にはプラスの電気を帯びた小さく重い「原子核」が存在し、その周りを電子が回っているという新しい原子像を1911年に打ち立てた。1908年には放射性元素の研究でノーベル化学賞を受賞しているが、本人は「すべての科学は物理学であるか、切手集めであるかのどちらかだ」と語るほど物理学を愛し、マンチェスター大学やケンブリッジ大学で教えた学生たちからも、後に何人ものノーベル賞受賞者を輩出し、彼にちなんで原子番号104の元素には「ラザホージウム」という名前がつけられ、その功績を今に伝えている。", source:"legacy", sourceId:"W04" },
  { id:"W05-01", personId:"W05", title:"この人の歩み", tags:["科学"],
    body:"アメリカの物理学者リチャード・ファインマンは、電子と光の相互作用を扱う難解な量子電磁力学の計算を、矢印と線で表す「ファインマン・ダイアグラム」という図に置き換え、直感的に理解できるようにした功績で1965年にノーベル物理学賞を受賞した。若い頃はマンハッタン計画にも参加し、原子爆弾の開発に携わっている。おもちゃの修理から金庫破り、ボンゴの演奏まで幅広い趣味を持つ自由奔放な人物としても知られ、大学での物理学の講義をまとめた「ファインマン物理学」は世界中で読み継がれる名著となった。晩年にはスペースシャトル「チャレンジャー号」の事故調査で、部品のゴム輪が低温でもろくなることを氷水を使った簡単な実験で示し、事故原因の究明に大きく貢献した。「わからないことを恥ずかしがるな」という姿勢を貫き、難しい物理をやさしい言葉で語ることにこだわり続けた科学者として、今も世界中で愛され続けている。",
    bodyHtml:"アメリカの物理学者リチャード・ファインマンは、電子と光の相互作用を扱う難解な量子電磁力学の計算を、矢印と線で表す「ファインマン・ダイアグラム」という図に置き換え、直感的に理解できるようにした功績で1965年にノーベル物理学賞を受賞した。若い頃はマンハッタン計画にも参加し、原子爆弾の開発に携わっている。おもちゃの修理から金庫破り、ボンゴの演奏まで幅広い趣味を持つ自由奔放な人物としても知られ、大学での物理学の講義をまとめた「ファインマン物理学」は世界中で読み継がれる名著となった。晩年にはスペースシャトル「チャレンジャー号」の事故調査で、部品のゴム輪が低温でもろくなることを氷水を使った簡単な実験で示し、事故原因の究明に大きく貢献した。「わからないことを恥ずかしがるな」という姿勢を貫き、難しい物理をやさしい言葉で語ることにこだわり続けた科学者として、今も世界中で愛され続けている。", source:"legacy", sourceId:"W05" },
  { id:"W06-01", personId:"W06", title:"この人の歩み", tags:["科学"],
    body:"イギリスの物理学者スティーヴン・ホーキングは、ケンブリッジ大学の学生だった21歳のときに全身の筋肉が徐々に動かなくなる難病ALSと診断され、余命数年と告げられたが、その後も車椅子と、頬の筋肉でコンピューターを操作する音声合成装置を使いながら半世紀以上にわたり研究を続けた。ブラックホールはすべてを吸い込むだけでなく、わずかに粒子を放出してゆっくりと蒸発していくという「ホーキング放射」の理論を提唱し、宇宙物理学に大きな足跡を残した。一般向けに書いた宇宙論の本「ホーキング、宇宙を語る」は世界的なベストセラーとなり、車椅子の物理学者として多くの人々に宇宙への興味と、困難に負けない生き方への勇気を同時に与え続けた。「上を見て、足元は見ないように」という言葉のとおり、体の不自由さを感じさせないほどの旺盛な好奇心で宇宙の謎に挑み続けた生涯だった。",
    bodyHtml:"イギリスの物理学者スティーヴン・ホーキングは、ケンブリッジ大学の学生だった21歳のときに全身の筋肉が徐々に動かなくなる難病ALSと診断され、余命数年と告げられたが、その後も車椅子と、頬の筋肉でコンピューターを操作する音声合成装置を使いながら半世紀以上にわたり研究を続けた。ブラックホールはすべてを吸い込むだけでなく、わずかに粒子を放出してゆっくりと蒸発していくという「ホーキング放射」の理論を提唱し、宇宙物理学に大きな足跡を残した。一般向けに書いた宇宙論の本「ホーキング、宇宙を語る」は世界的なベストセラーとなり、車椅子の物理学者として多くの人々に宇宙への興味と、困難に負けない生き方への勇気を同時に与え続けた。「上を見て、足元は見ないように」という言葉のとおり、体の不自由さを感じさせないほどの旺盛な好奇心で宇宙の謎に挑み続けた生涯だった。", source:"legacy", sourceId:"W06" },
  { id:"W07-01", personId:"W07", title:"この人の歩み", tags:["科学"],
    body:"鍛冶屋の息子として生まれたマイケル・ファラデーは、貧しさから13歳で製本屋に奉公に出され、正式な学校教育をほとんど受けられなかったが、店で扱う本を読みあさって独学で科学の知識を身につけた。やがて化学者デービーの講演に感激して助手にしてほしいと手紙を送り、その熱意が認められて研究の道に入ると、磁石を動かすことで電流を生み出せる「電磁誘導」を1831年に発見し、これが後の発電機やモーターの原理となった。実験を重視する姿勢を貫き、ロンドンの王立研究所で子ども向けの科学講演「クリスマス・レクチャー」を始めたことでも知られ、貴族に取り入ることを好まず生涯を実験にささげた、現代の電気文明の基礎を築いた科学者として今も尊敬を集めている。国王から爵位を勧められても「最後まで普通のファラデーでありたい」と辞退したという逸話も、彼の謙虚な人柄をよく表している。",
    bodyHtml:"鍛冶屋の息子として生まれたマイケル・ファラデーは、貧しさから13歳で製本屋に奉公に出され、正式な学校教育をほとんど受けられなかったが、店で扱う本を読みあさって独学で科学の知識を身につけた。やがて化学者デービーの講演に感激して助手にしてほしいと手紙を送り、その熱意が認められて研究の道に入ると、磁石を動かすことで電流を生み出せる「電磁誘導」を1831年に発見し、これが後の発電機やモーターの原理となった。実験を重視する姿勢を貫き、ロンドンの王立研究所で子ども向けの科学講演「クリスマス・レクチャー」を始めたことでも知られ、貴族に取り入ることを好まず生涯を実験にささげた、現代の電気文明の基礎を築いた科学者として今も尊敬を集めている。国王から爵位を勧められても「最後まで普通のファラデーでありたい」と辞退したという逸話も、彼の謙虚な人柄をよく表している。", source:"legacy", sourceId:"W07" },
  { id:"W08-01", personId:"W08", title:"この人の歩み", tags:["科学"],
    body:"スコットランドの物理学者ジェームス・クラーク・マクスウェルは、幼い頃から自然の仕組みに強い好奇心を示し、ファラデーらが実験によって明らかにしてきた電気と磁気の関係を、四つの数式にまとめあげる「マクスウェルの方程式」を1860年代に完成させた。この方程式は、電気と磁気の変化が波となって空間を伝わることを示すとともに、その波の速さが光の速さと一致することから、光もまた電磁波の一種であることを理論的に導き出した。また土星の輪が無数の小さな粒からできていることも数学的に示している。この成果は後の無線通信の発明の土台となったほか、光速が誰から見ても一定であるという発想を通じて、アインシュタインの相対性理論の誕生にも大きな影響を与えることになった。アインシュタインは自室の壁にニュートンやファラデーと並べてマクスウェルの写真を飾っていたと伝えられ、その敬意の深さがうかがえる。",
    bodyHtml:"スコットランドの物理学者ジェームス・クラーク・マクスウェルは、幼い頃から自然の仕組みに強い好奇心を示し、ファラデーらが実験によって明らかにしてきた電気と磁気の関係を、四つの数式にまとめあげる「マクスウェルの方程式」を1860年代に完成させた。この方程式は、電気と磁気の変化が波となって空間を伝わることを示すとともに、その波の速さが光の速さと一致することから、光もまた電磁波の一種であることを理論的に導き出した。また土星の輪が無数の小さな粒からできていることも数学的に示している。この成果は後の無線通信の発明の土台となったほか、光速が誰から見ても一定であるという発想を通じて、アインシュタインの相対性理論の誕生にも大きな影響を与えることになった。アインシュタインは自室の壁にニュートンやファラデーと並べてマクスウェルの写真を飾っていたと伝えられ、その敬意の深さがうかがえる。", source:"legacy", sourceId:"W08" },
  { id:"W13-01", personId:"W13", title:"この人の歩み", tags:["科学"],
    body:"フランスの科学者アントワーヌ・ラボアジエは、ものが燃える現象を精密な天秤を使って調べ、燃焼とは空気中の酸素と結びつく反応であることを解明し、反応の前後で物質の質量は変化しないという「質量保存の法則」を確立した。それまで信じられていた「フロギストン説」という誤った考えを退け、元素の名前や表し方を整理し直したことから「近代化学の父」と呼ばれている。妻マリー=アンヌも実験の記録係や翻訳者として研究を支えた良きパートナーだった。しかし革命前のフランスで税を集める組織に所属していたことが災いし、フランス革命の混乱の中で1794年に処刑されるという悲劇的な最期を遂げ、その死を惜しんだ数学者ラグランジュは「彼の首を切り落とすのは一瞬だが、同じ頭脳が現れるには百年かかるだろう」と嘆いたと伝えられ、後世の化学者たちも彼の正確で緻密な実験手法を手本とし続けている。",
    bodyHtml:"フランスの科学者アントワーヌ・ラボアジエは、ものが燃える現象を精密な天秤を使って調べ、燃焼とは空気中の酸素と結びつく反応であることを解明し、反応の前後で物質の質量は変化しないという「質量保存の法則」を確立した。それまで信じられていた「フロギストン説」という誤った考えを退け、元素の名前や表し方を整理し直したことから「近代化学の父」と呼ばれている。妻マリー=アンヌも実験の記録係や翻訳者として研究を支えた良きパートナーだった。しかし革命前のフランスで税を集める組織に所属していたことが災いし、フランス革命の混乱の中で1794年に処刑されるという悲劇的な最期を遂げ、その死を惜しんだ数学者ラグランジュは「彼の首を切り落とすのは一瞬だが、同じ頭脳が現れるには百年かかるだろう」と嘆いたと伝えられ、後世の化学者たちも彼の正確で緻密な実験手法を手本とし続けている。", source:"legacy", sourceId:"W13" },
  { id:"W14-01", personId:"W14", title:"この人の歩み", tags:["科学"],
    body:"ロシアの化学者ドミートリー・メンデレーエフは、シベリアの町で14人きょうだいの末っ子として生まれ、当時知られていた63種類の元素を原子の重さの順に並べ直し、性質のよく似た元素が周期的に現れる規則性を見つけ出して1869年に「周期表」を発表した。カードに元素の性質を書き並べて何日も考え続けた末、夢の中で元素が正しい順番に並ぶ光景を見てひらめいたという逸話が伝わっている。彼の周期表が優れていた点は、当時まだ発見されていなかった元素のために表の中にあえて空欄を残し、その性質まで予言したことで、後にガリウムやゲルマニウムが発見されると予言のとおりの性質を持っていたことが確かめられ、周期表の正しさが世界中の化学者に証明された。この表は今も世界中の理科室の壁に貼られ、元素の世界を読み解く地図として多くの子どもたちに大切に受け継がれ続けている。",
    bodyHtml:"ロシアの化学者ドミートリー・メンデレーエフは、シベリアの町で14人きょうだいの末っ子として生まれ、当時知られていた63種類の元素を原子の重さの順に並べ直し、性質のよく似た元素が周期的に現れる規則性を見つけ出して1869年に「周期表」を発表した。カードに元素の性質を書き並べて何日も考え続けた末、夢の中で元素が正しい順番に並ぶ光景を見てひらめいたという逸話が伝わっている。彼の周期表が優れていた点は、当時まだ発見されていなかった元素のために表の中にあえて空欄を残し、その性質まで予言したことで、後にガリウムやゲルマニウムが発見されると予言のとおりの性質を持っていたことが確かめられ、周期表の正しさが世界中の化学者に証明された。この表は今も世界中の理科室の壁に貼られ、元素の世界を読み解く地図として多くの子どもたちに大切に受け継がれ続けている。", source:"legacy", sourceId:"W14" },
  { id:"W21-01", personId:"W21", title:"この人の歩み", tags:["医学"],
    body:"イギリスの田舎町で医師をしていたエドワード・ジェンナーは、乳しぼりの女性たちの間で「牛の天然痘である牛痘にかかった人は、その後恐ろしい天然痘にかからない」という言い伝えが広まっていることに着目した。1796年、牛痘にかかった女性の膿を8歳の少年ジェームズ・フィップスに接種し、その後少年に天然痘の膿を植えつける実験を行ったところ、少年は発病しなかった。この「種痘」という方法が世界で初めてのワクチンとなり、ラテン語で牛を意味する言葉から「ワクチン」という名前も生まれた。当初は反対や誤解も多かったジェンナーの発見はその後世界中に広まり、天然痘は1980年に世界保健機関によって地球上から根絶されたと宣言される、人類初の快挙につながった。この種痘の考え方は後の免疫学の出発点ともなり、今日の様々なワクチン開発の土台を築いた功績として高く評価されている。",
    bodyHtml:"イギリスの田舎町で医師をしていたエドワード・ジェンナーは、乳しぼりの女性たちの間で「牛の天然痘である牛痘にかかった人は、その後恐ろしい天然痘にかからない」という言い伝えが広まっていることに着目した。1796年、牛痘にかかった女性の膿を8歳の少年ジェームズ・フィップスに接種し、その後少年に天然痘の膿を植えつける実験を行ったところ、少年は発病しなかった。この「種痘」という方法が世界で初めてのワクチンとなり、ラテン語で牛を意味する言葉から「ワクチン」という名前も生まれた。当初は反対や誤解も多かったジェンナーの発見はその後世界中に広まり、天然痘は1980年に世界保健機関によって地球上から根絶されたと宣言される、人類初の快挙につながった。この種痘の考え方は後の免疫学の出発点ともなり、今日の様々なワクチン開発の土台を築いた功績として高く評価されている。", source:"legacy", sourceId:"W21" },
  { id:"W24-01", personId:"W24", title:"この人の歩み", tags:["冒険"],
    body:"貧しい家に生まれ独学で博物学を学んだイギリスのアルフレッド・ラッセル・ウォレスは、東南アジアの島々を渡り歩いて標本を採集して生計を立てる厳しい旅を続ける中、マラリアの高熱にうなされながら、環境に適応した生き物が生き残り子孫を残していくという「自然選択」による進化のしくみを、ある夜突然ひらめいたと伝えられる。この考えをまとめた論文をイギリスの博物学者ダーウィンに送ったところ、実は同じ結論に何年も前からたどり着きながら発表をためらっていたダーウィンを驚かせた。1858年、二人の説はロンドンの学会で共同で発表され、翌年ダーウィンが「種の起源」を出版したことで進化論は広く世に知られるようになり、ウォレスは謙虚にダーウィンをその第一人者として立て続けた。生物の分布を研究する生物地理学の分野を切り開いた人物としても知られ、アジアの動物相を分ける境界線には今も「ウォレス線」という名がつけられている。",
    bodyHtml:"貧しい家に生まれ独学で博物学を学んだイギリスのアルフレッド・ラッセル・ウォレスは、東南アジアの島々を渡り歩いて標本を採集して生計を立てる厳しい旅を続ける中、マラリアの高熱にうなされながら、環境に適応した生き物が生き残り子孫を残していくという「自然選択」による進化のしくみを、ある夜突然ひらめいたと伝えられる。この考えをまとめた論文をイギリスの博物学者ダーウィンに送ったところ、実は同じ結論に何年も前からたどり着きながら発表をためらっていたダーウィンを驚かせた。1858年、二人の説はロンドンの学会で共同で発表され、翌年ダーウィンが「種の起源」を出版したことで進化論は広く世に知られるようになり、ウォレスは謙虚にダーウィンをその第一人者として立て続けた。生物の分布を研究する生物地理学の分野を切り開いた人物としても知られ、アジアの動物相を分ける境界線には今も「ウォレス線」という名がつけられている。", source:"legacy", sourceId:"W24" },
  { id:"W26-01", personId:"W26", title:"この人の歩み", tags:["科学"],
    body:"イギリスの動物行動学者ジェーン・グドールは、幼い頃から動物に強い関心を抱き、大学に通う代わりに秘書として働きながら費用を貯め、23歳のときアフリカへ渡って人類学者リーキーのもとで学ぶと、1960年からタンザニアのゴンベで野生のチンパンジーの観察を始めた。当初は数字ではなく名前で個体を呼び、根気強く群れに近づき続けた末、チンパンジーが木の枝の葉を取り除いて棒を作り、それをシロアリの巣に差し込んで食べる「道具を使う」姿を発見し、それまで人間だけの能力と考えられていた常識を覆した。動物にも喜びや悲しみといった豊かな感情があることを世に示し、現在も講演活動や環境保護運動を通じて、地球の未来のために世界中を飛び回りながら力を注ぎ続けている。若者が環境保護活動に参加する「ルーツ・アンド・シューツ」という団体も設立し、次の世代を育てることにも情熱を注いでいる。",
    bodyHtml:"イギリスの動物行動学者ジェーン・グドールは、幼い頃から動物に強い関心を抱き、大学に通う代わりに秘書として働きながら費用を貯め、23歳のときアフリカへ渡って人類学者リーキーのもとで学ぶと、1960年からタンザニアのゴンベで野生のチンパンジーの観察を始めた。当初は数字ではなく名前で個体を呼び、根気強く群れに近づき続けた末、チンパンジーが木の枝の葉を取り除いて棒を作り、それをシロアリの巣に差し込んで食べる「道具を使う」姿を発見し、それまで人間だけの能力と考えられていた常識を覆した。動物にも喜びや悲しみといった豊かな感情があることを世に示し、現在も講演活動や環境保護運動を通じて、地球の未来のために世界中を飛び回りながら力を注ぎ続けている。若者が環境保護活動に参加する「ルーツ・アンド・シューツ」という団体も設立し、次の世代を育てることにも情熱を注いでいる。", source:"legacy", sourceId:"W26" },
  { id:"W31-01", personId:"W31", title:"この人の歩み", tags:["文学"],
    body:"アメリカの天文学者エドウィン・ハッブルは、弁護士を目指していた時期もあったが天文学への情熱を捨てきれず、当時世界最大級だったウィルソン山天文台の望遠鏡を使い、アンドロメダ星雲までの距離を計算した結果、それが私たちの銀河系の内側にある雲ではなく、はるか遠くにある独立した別の銀河であることを1924年に明らかにし、宇宙の広さに対する人類の見方を一変させた。さらに多くの銀河を観測し、遠くにある銀河ほど速い速度で私たちから遠ざかっていることを発見し、宇宙全体が膨張し続けているという「ハッブルの法則」を導き出した。この発見は、宇宙が一点から始まったとする「ビッグバン理論」を支える重要な証拠となり、その功績をたたえて後に打ち上げられたハッブル宇宙望遠鏡にも彼の名がつけられている。宇宙が膨張する速さを示す数値には今も「ハッブル定数」という名前が使われ、宇宙の年齢や大きさを調べる手がかりとして活用され続けている。",
    bodyHtml:"アメリカの天文学者エドウィン・ハッブルは、弁護士を目指していた時期もあったが天文学への情熱を捨てきれず、当時世界最大級だったウィルソン山天文台の望遠鏡を使い、アンドロメダ星雲までの距離を計算した結果、それが私たちの銀河系の内側にある雲ではなく、はるか遠くにある独立した別の銀河であることを1924年に明らかにし、宇宙の広さに対する人類の見方を一変させた。さらに多くの銀河を観測し、遠くにある銀河ほど速い速度で私たちから遠ざかっていることを発見し、宇宙全体が膨張し続けているという「ハッブルの法則」を導き出した。この発見は、宇宙が一点から始まったとする「ビッグバン理論」を支える重要な証拠となり、その功績をたたえて後に打ち上げられたハッブル宇宙望遠鏡にも彼の名がつけられている。宇宙が膨張する速さを示す数値には今も「ハッブル定数」という名前が使われ、宇宙の年齢や大きさを調べる手がかりとして活用され続けている。", source:"legacy", sourceId:"W31" },
  { id:"W32-01", personId:"W32", title:"この人の歩み", tags:["文学"],
    body:"アメリカの天文学者カール・セーガンは、コーネル大学などで研究を続けるかたわら、専門的で難解になりがちな宇宙科学を、美しい映像とわかりやすい言葉で一般の人々に伝えることに情熱を注いだ科学の伝道師である。1980年に放送されたテレビ番組「コスモス」は世界中で大ヒットし、多くの子どもたちが宇宙に興味を持つきっかけとなった。地球外生命体を探すプロジェクトにも深く関わり、探査機ボイジャーに人類からのメッセージを記録した「ゴールデンレコード」を積み込む計画も推進し、地球を遠くから撮影した写真を「ペイル・ブルー・ドット」と呼んだ。「わたしたちは皆、星のかけらでできている」という言葉には、宇宙で生まれた元素から私たち人間の体ができているという科学的事実への深い感動が込められている。数多くの科学書も執筆し、科学的に考えることの大切さを一般の人々にわかりやすく説き続けた生涯だった。",
    bodyHtml:"アメリカの天文学者カール・セーガンは、コーネル大学などで研究を続けるかたわら、専門的で難解になりがちな宇宙科学を、美しい映像とわかりやすい言葉で一般の人々に伝えることに情熱を注いだ科学の伝道師である。1980年に放送されたテレビ番組「コスモス」は世界中で大ヒットし、多くの子どもたちが宇宙に興味を持つきっかけとなった。地球外生命体を探すプロジェクトにも深く関わり、探査機ボイジャーに人類からのメッセージを記録した「ゴールデンレコード」を積み込む計画も推進し、地球を遠くから撮影した写真を「ペイル・ブルー・ドット」と呼んだ。「わたしたちは皆、星のかけらでできている」という言葉には、宇宙で生まれた元素から私たち人間の体ができているという科学的事実への深い感動が込められている。数多くの科学書も執筆し、科学的に考えることの大切さを一般の人々にわかりやすく説き続けた生涯だった。", source:"legacy", sourceId:"W32" },
  { id:"W36-01", personId:"W36", title:"この人の歩み", tags:["科学"],
    body:"「数学の王子」と呼ばれるドイツの数学者カール・フリードリヒ・ガウスは、貧しい労働者の家に生まれながら、幼い頃から驚異的な計算の才能を見せた。7歳のとき、小学校の先生が1から100までの数をすべて足しなさいという課題を出すと、他の生徒がまだ計算している間に「1+100、2+99…という組を50組作れば答えは5050になる」と瞬時に見抜いて先生を驚かせたという逸話が伝わっている。この才能を見抜いた領主の援助で学問を続けることができ、成長してからは数論や統計学、天文学、測地学など幅広い分野で重要な業績を残し、正十七角形が定規とコンパスだけで作図できることを証明するなど、数学史上もっとも影響力のある人物の一人として今も高く評価されている。晩年まで発見を控えめにしか発表せず「量より質」を貫いた性格でも知られ、多くの重要な結果を人知れず書き残していた。",
    bodyHtml:"「数学の王子」と呼ばれるドイツの数学者カール・フリードリヒ・ガウスは、貧しい労働者の家に生まれながら、幼い頃から驚異的な計算の才能を見せた。7歳のとき、小学校の先生が1から100までの数をすべて足しなさいという課題を出すと、他の生徒がまだ計算している間に「1+100、2+99…という組を50組作れば答えは5050になる」と瞬時に見抜いて先生を驚かせたという逸話が伝わっている。この才能を見抜いた領主の援助で学問を続けることができ、成長してからは数論や統計学、天文学、測地学など幅広い分野で重要な業績を残し、正十七角形が定規とコンパスだけで作図できることを証明するなど、数学史上もっとも影響力のある人物の一人として今も高く評価されている。晩年まで発見を控えめにしか発表せず「量より質」を貫いた性格でも知られ、多くの重要な結果を人知れず書き残していた。", source:"legacy", sourceId:"W36" },
  { id:"W42-01", personId:"W42", title:"この人の歩み", tags:["発明"],
    body:"セルビア出身の発明家ニコラ・テスラは、驚異的な記憶力と想像力を持ち、アメリカに渡ってエジソンの会社で働いた後、独立して交流電流を利用した発電・送電システムを開発し、現代の電力インフラの基礎を築いた。エジソンが推す直流電流との間で繰り広げられた「電流戦争」と呼ばれる激しい対立では、実業家ウェスティングハウスと手を組み、1893年のシカゴ万博で交流方式を採用させることに成功し、最終的に交流が世界標準として広まった。無線通信や交流モーターなど数多くの先進的な発明で特許を取得し、無線での電力伝送という壮大な構想も抱いたが、事業や資金繰りには恵まれず、晩年は不遇のうちにニューヨークのホテルで生涯を終えた、時代を先取りしすぎた天才発明家である。彼の名は磁力の強さを表す単位「テスラ」にも使われ、今なお多くの発明家や研究者に影響を与え続けている。",
    bodyHtml:"セルビア出身の発明家ニコラ・テスラは、驚異的な記憶力と想像力を持ち、アメリカに渡ってエジソンの会社で働いた後、独立して交流電流を利用した発電・送電システムを開発し、現代の電力インフラの基礎を築いた。エジソンが推す直流電流との間で繰り広げられた「電流戦争」と呼ばれる激しい対立では、実業家ウェスティングハウスと手を組み、1893年のシカゴ万博で交流方式を採用させることに成功し、最終的に交流が世界標準として広まった。無線通信や交流モーターなど数多くの先進的な発明で特許を取得し、無線での電力伝送という壮大な構想も抱いたが、事業や資金繰りには恵まれず、晩年は不遇のうちにニューヨークのホテルで生涯を終えた、時代を先取りしすぎた天才発明家である。彼の名は磁力の強さを表す単位「テスラ」にも使われ、今なお多くの発明家や研究者に影響を与え続けている。", source:"legacy", sourceId:"W42" },
  { id:"J01-01", personId:"J01", title:"この人の歩み", tags:["政治"],
    body:"6世紀の大和朝廷で権勢をふるった蘇我稲目は、朝鮮半島の百済から日本に仏像や経典がもたらされた際、これをいち早く受け入れて手厚く礼拝すべきだと欽明天皇に進言した。ところが日本古来の神々を重んじる有力豪族・物部尾輿はこれに強く反対し、二つの氏族は仏教を国として受け入れるかどうかをめぐって激しく対立することとなる。この対立は稲目と尾輿それぞれの息子の代、すなわち蘇我馬子と物部守屋の代にまで持ち越され、最終的に587年、蘇我氏が武力によって物部氏を滅ぼし勝利を収めた。稲目自身が受け入れた仏教は、その後の飛鳥文化をはじめとして、日本の芸術・思想・政治のあり方に計り知れないほど大きな影響を与えることとなった。また娘たちを次々と天皇家に嫁がせて外戚の地位を固め、蘇我氏繁栄の礎も築いており、この一族の権勢は子・馬子の代にさらに強まっていくこととなる。",
    bodyHtml:"6世紀の大和朝廷で権勢をふるった蘇我稲目は、朝鮮半島の百済から日本に仏像や経典がもたらされた際、これをいち早く受け入れて手厚く礼拝すべきだと欽明天皇に進言した。ところが日本古来の神々を重んじる有力豪族・物部尾輿はこれに強く反対し、二つの氏族は仏教を国として受け入れるかどうかをめぐって激しく対立することとなる。この対立は稲目と尾輿それぞれの息子の代、すなわち蘇我馬子と物部守屋の代にまで持ち越され、最終的に587年、蘇我氏が武力によって物部氏を滅ぼし勝利を収めた。稲目自身が受け入れた仏教は、その後の飛鳥文化をはじめとして、日本の芸術・思想・政治のあり方に計り知れないほど大きな影響を与えることとなった。また娘たちを次々と天皇家に嫁がせて外戚の地位を固め、蘇我氏繁栄の礎も築いており、この一族の権勢は子・馬子の代にさらに強まっていくこととなる。", source:"legacy", sourceId:"J01" },
  { id:"J02-01", personId:"J02", title:"この人の歩み", tags:["政治"],
    body:"皇極天皇の子として生まれた中大兄皇子は、645年、朝鮮半島の諸国からの使者を迎える宮中の儀式の最中に、当時絶大な権力を握っていた蘇我入鹿を中臣鎌足らとともに討ち取る「乙巳の変」を決行した。この政変をきっかけに、それまで有力な豪族が土地や人民を私有して政治を動かしていた仕組みを改め、すべての土地と人民を国家が直接治める公地公民の原則を打ち立てる「大化の改新」を推し進めていく。皇太子として長く政治を主導した後、668年についに即位して天智天皇となり、日本で初めての本格的な戸籍とされる「庚午年籍」を作成するなど、律令国家としての日本の基礎を築いた人物として知られている。近江大津宮への遷都や、百済救援のための白村江の戦いも彼の治世を代表する出来事であり、その後の諸制度は弟の天武天皇や持統天皇へと受け継がれ、大宝律令の完成へとつながっていった。",
    bodyHtml:"皇極天皇の子として生まれた中大兄皇子は、645年、朝鮮半島の諸国からの使者を迎える宮中の儀式の最中に、当時絶大な権力を握っていた蘇我入鹿を中臣鎌足らとともに討ち取る「乙巳の変」を決行した。この政変をきっかけに、それまで有力な豪族が土地や人民を私有して政治を動かしていた仕組みを改め、すべての土地と人民を国家が直接治める公地公民の原則を打ち立てる「大化の改新」を推し進めていく。皇太子として長く政治を主導した後、668年についに即位して天智天皇となり、日本で初めての本格的な戸籍とされる「庚午年籍」を作成するなど、律令国家としての日本の基礎を築いた人物として知られている。近江大津宮への遷都や、百済救援のための白村江の戦いも彼の治世を代表する出来事であり、その後の諸制度は弟の天武天皇や持統天皇へと受け継がれ、大宝律令の完成へとつながっていった。", source:"legacy", sourceId:"J02" },
  { id:"J03-01", personId:"J03", title:"この人の歩み", tags:["政治"],
    body:"藤原道長は、娘の彰子・妍子・威子を次々と天皇の后に立てて外戚としての地位を固め、みずからは摂政・太政大臣にまで昇りつめて藤原氏の全盛期を築いた平安時代随一の政治家である。娘の彰子には紫式部を女房として仕えさせ、その豊かな文化的教養によって宮廷の権威をいっそう高めたことでも知られる。三女・威子の立后を祝う宴の席で詠んだとされる「この世をば わが世とぞ思ふ 望月の 欠けたることも なしと思へば」という和歌は、欠けるところのない満月に自らの姿を重ね合わせ、絶頂期にあった権勢と自信を表したものとして、今日まで広く語り継がれている。晩年は壮麗な法成寺を建立するなど、仏教への深い信仰を見せた人物でもあり、その日記『御堂関白記』は当時の宮廷を知る貴重な史料となっている。道長が築いた摂関政治の全盛期は、孫の代以降しだいに院政へと移り変わり、時代の大きな転換点を迎えることとなった。",
    bodyHtml:"藤原道長は、娘の彰子・妍子・威子を次々と天皇の后に立てて外戚としての地位を固め、みずからは摂政・太政大臣にまで昇りつめて藤原氏の全盛期を築いた平安時代随一の政治家である。娘の彰子には紫式部を女房として仕えさせ、その豊かな文化的教養によって宮廷の権威をいっそう高めたことでも知られる。三女・威子の立后を祝う宴の席で詠んだとされる「この世をば わが世とぞ思ふ 望月の 欠けたることも なしと思へば」という和歌は、欠けるところのない満月に自らの姿を重ね合わせ、絶頂期にあった権勢と自信を表したものとして、今日まで広く語り継がれている。晩年は壮麗な法成寺を建立するなど、仏教への深い信仰を見せた人物でもあり、その日記『御堂関白記』は当時の宮廷を知る貴重な史料となっている。道長が築いた摂関政治の全盛期は、孫の代以降しだいに院政へと移り変わり、時代の大きな転換点を迎えることとなった。", source:"legacy", sourceId:"J03" },
  { id:"J04-01", personId:"J04", title:"この人の歩み", tags:["教育"],
    body:"讃岐国(現在の香川県)に生まれた空海(弘法大師)は、若くして仏道を志し、804年、遣唐使の一員として唐(中国)に渡り、わずか2年ほどのあいだに密教の奥義を学び尽くして日本に持ち帰った。帰国後は嵯峨天皇の信任を得て高野山に金剛峯寺を開き、真言宗の開祖となる。また京都の東寺を賜り、身分を問わず学べる教育機関・綜芸種智院を開くなど教育にも尽力した。821年には、たびたび洪水を起こしていた讃岐国のため池「満濃池」の改修工事の指導にあたり、優れた土木技術と統率力を発揮してわずか数か月でこれを完成させたと伝えられ、社会事業への貢献者としても今なお敬われている。四国霊場八十八箇所巡礼のゆかりの地としても、その足跡は今も各地に色濃く残されている。故郷の讃岐国では今も「お大師様」として深く敬われ、その生涯にまつわる数々の逸話が親しみを込めて語り継がれている。",
    bodyHtml:"讃岐国(現在の香川県)に生まれた空海(弘法大師)は、若くして仏道を志し、804年、遣唐使の一員として唐(中国)に渡り、わずか2年ほどのあいだに密教の奥義を学び尽くして日本に持ち帰った。帰国後は嵯峨天皇の信任を得て高野山に金剛峯寺を開き、真言宗の開祖となる。また京都の東寺を賜り、身分を問わず学べる教育機関・綜芸種智院を開くなど教育にも尽力した。821年には、たびたび洪水を起こしていた讃岐国のため池「満濃池」の改修工事の指導にあたり、優れた土木技術と統率力を発揮してわずか数か月でこれを完成させたと伝えられ、社会事業への貢献者としても今なお敬われている。四国霊場八十八箇所巡礼のゆかりの地としても、その足跡は今も各地に色濃く残されている。故郷の讃岐国では今も「お大師様」として深く敬われ、その生涯にまつわる数々の逸話が親しみを込めて語り継がれている。", source:"legacy", sourceId:"J04" },
  { id:"J05-01", personId:"J05", title:"この人の歩み", tags:["教育"],
    body:"近江国(現在の滋賀県)に生まれた最澄は、空海と同じ804年の遣唐使として唐(中国)に渡り、わずか半年ほど天台山などで学んで天台の教えを日本に伝えた。帰国後は比叡山に延暦寺を開いて天台宗を開き、「一隅を照らす、これ則ち国宝なり」、すなわち自分の持ち場で誠実に努める人こそが国の宝であるという言葉を残し、人材の育成を何よりも重んじた。彼が育てた延暦寺は、後に浄土宗を開いた法然や、浄土真宗の親鸞、禅宗の栄西・道元、日蓮宗の日蓮など、鎌倉時代に活躍する数多くの高僧を輩出し、「日本仏教の母山」とも称される学問の中心地として大きな役割を果たすこととなった。同時代に活躍した空海とは親交と対立の両面を経験し、経典の借用をめぐって関係が疎遠になったとも伝えられているが、彼が説いた「一隅を照らす」人材育成の精神は、後の日本仏教のあり方に長く大きな影響を与え続けている。",
    bodyHtml:"近江国(現在の滋賀県)に生まれた最澄は、空海と同じ804年の遣唐使として唐(中国)に渡り、わずか半年ほど天台山などで学んで天台の教えを日本に伝えた。帰国後は比叡山に延暦寺を開いて天台宗を開き、「一隅を照らす、これ則ち国宝なり」、すなわち自分の持ち場で誠実に努める人こそが国の宝であるという言葉を残し、人材の育成を何よりも重んじた。彼が育てた延暦寺は、後に浄土宗を開いた法然や、浄土真宗の親鸞、禅宗の栄西・道元、日蓮宗の日蓮など、鎌倉時代に活躍する数多くの高僧を輩出し、「日本仏教の母山」とも称される学問の中心地として大きな役割を果たすこととなった。同時代に活躍した空海とは親交と対立の両面を経験し、経典の借用をめぐって関係が疎遠になったとも伝えられているが、彼が説いた「一隅を照らす」人材育成の精神は、後の日本仏教のあり方に長く大きな影響を与え続けている。", source:"legacy", sourceId:"J05" },
  { id:"J06-01", personId:"J06", title:"この人の歩み", tags:["政治"],
    body:"幼い頃から学問に優れていた菅原道真は、宇多天皇や醍醐天皇に重んじられて異例の出世を遂げ、遣唐使の廃止を提案するなど国政にも力を発揮し、ついには右大臣にまで昇りつめた。しかし左大臣・藤原時平の陰謀により無実の謀反の疑いをかけられ、901年、九州の大宰府へ左遷されてしまう。都に残した家族を思いながら不遇のうちにわずか2年ほどで亡くなったと伝えられる。死後、都では疫病の流行や落雷など天変地異が相次いだため、その祟りを鎮めるために北野天満宮などに神として手厚く祀られるようになり、今日では「天神様」学問の神様として全国の受験生に広く親しまれている。梅を愛したことでも知られ、「東風吹かば 匂ひおこせよ 梅の花」の和歌も、その望郷の思いを表すものとして有名である。今も全国の天満宮では、受験の合格を願う多くの学生たちが道真の霊前に手を合わせ、静かに祈りを捧げ続けている。",
    bodyHtml:"幼い頃から学問に優れていた菅原道真は、宇多天皇や醍醐天皇に重んじられて異例の出世を遂げ、遣唐使の廃止を提案するなど国政にも力を発揮し、ついには右大臣にまで昇りつめた。しかし左大臣・藤原時平の陰謀により無実の謀反の疑いをかけられ、901年、九州の大宰府へ左遷されてしまう。都に残した家族を思いながら不遇のうちにわずか2年ほどで亡くなったと伝えられる。死後、都では疫病の流行や落雷など天変地異が相次いだため、その祟りを鎮めるために北野天満宮などに神として手厚く祀られるようになり、今日では「天神様」学問の神様として全国の受験生に広く親しまれている。梅を愛したことでも知られ、「東風吹かば 匂ひおこせよ 梅の花」の和歌も、その望郷の思いを表すものとして有名である。今も全国の天満宮では、受験の合格を願う多くの学生たちが道真の霊前に手を合わせ、静かに祈りを捧げ続けている。", source:"legacy", sourceId:"J06" },
  { id:"J07-01", personId:"J07", title:"この人の歩み", tags:["文学"],
    body:"平安時代中期に活躍した和泉式部は、恋多き女性として知られ、情熱的な恋の心を大胆に詠んだ歌人である。冷泉天皇の皇子である為尊親王、その死後は弟の敦道親王と相次いで恋に落ち、周囲の非難を浴びながらも情熱を貫いたそのやり取りをまとめた『和泉式部日記』は、当時の宮廷における恋愛の機微を生き生きと伝える貴重な文学作品となっている。「あらざらむ この世のほかの 思ひ出に 今ひとたびの 逢ふこともがな」など、命の儚さと恋しさを重ね合わせた歌の数々は、時の権力者・藤原道長からも「うかれ女(め)」と評されるほど自由奔放でありながら、後世の歌人たちにも多大な影響を与えている。晩年には藤原道長の娘・彰子にも女房として仕え、宮廷文学の担い手の一人として活躍したと伝えられる。その大胆で率直な歌風は、後の時代の女性歌人たちにも大きな刺激を与え、和歌の歴史に確かな足跡を残している。",
    bodyHtml:"平安時代中期に活躍した和泉式部は、恋多き女性として知られ、情熱的な恋の心を大胆に詠んだ歌人である。冷泉天皇の皇子である為尊親王、その死後は弟の敦道親王と相次いで恋に落ち、周囲の非難を浴びながらも情熱を貫いたそのやり取りをまとめた『和泉式部日記』は、当時の宮廷における恋愛の機微を生き生きと伝える貴重な文学作品となっている。「あらざらむ この世のほかの 思ひ出に 今ひとたびの 逢ふこともがな」など、命の儚さと恋しさを重ね合わせた歌の数々は、時の権力者・藤原道長からも「うかれ女(め)」と評されるほど自由奔放でありながら、後世の歌人たちにも多大な影響を与えている。晩年には藤原道長の娘・彰子にも女房として仕え、宮廷文学の担い手の一人として活躍したと伝えられる。その大胆で率直な歌風は、後の時代の女性歌人たちにも大きな刺激を与え、和歌の歴史に確かな足跡を残している。", source:"legacy", sourceId:"J07" },
  { id:"J08-01", personId:"J08", title:"この人の歩み", tags:["教育"],
    body:"大和国(現在の奈良県)の葛城山を中心に、山に籠って厳しい修行を重ねたとされる役小角(役行者)は、山岳信仰と仏教・道教の教えが結びついた日本独自の宗教「修験道」の開祖と仰がれる人物である。伝説では、恐ろしい鬼の夫婦を法力で従えて弟子とし、彼らに山中の力仕事をさせていたとも語られ、また空を飛んで富士山や大峰山、葛城山など各地の霊山を自在に巡ったという逸話も数多く残されている。あまりの験力を人々に恐れられて讒言により伊豆へ流罪となったこともあったと伝えられるが、後に許され、各地の霊山にはその修行の跡とされる祠や行場が今も数多く残り、修験道を行う山伏たちの厚い信仰を集め続けている。実在を記す当時の史料はごくわずかで、伝説的な色彩が濃い人物であるが、山にこもって心身を鍛えるという日本人の山岳信仰の原点として、今もその名は重んじられている。",
    bodyHtml:"大和国(現在の奈良県)の葛城山を中心に、山に籠って厳しい修行を重ねたとされる役小角(役行者)は、山岳信仰と仏教・道教の教えが結びついた日本独自の宗教「修験道」の開祖と仰がれる人物である。伝説では、恐ろしい鬼の夫婦を法力で従えて弟子とし、彼らに山中の力仕事をさせていたとも語られ、また空を飛んで富士山や大峰山、葛城山など各地の霊山を自在に巡ったという逸話も数多く残されている。あまりの験力を人々に恐れられて讒言により伊豆へ流罪となったこともあったと伝えられるが、後に許され、各地の霊山にはその修行の跡とされる祠や行場が今も数多く残り、修験道を行う山伏たちの厚い信仰を集め続けている。実在を記す当時の史料はごくわずかで、伝説的な色彩が濃い人物であるが、山にこもって心身を鍛えるという日本人の山岳信仰の原点として、今もその名は重んじられている。", source:"legacy", sourceId:"J08" },
  { id:"J09-01", personId:"J09", title:"この人の歩み", tags:["政治"],
    body:"平清盛は、伊勢平氏の棟梁として保元・平治の乱を勝ち抜き、1167年、武士として初めて太政大臣という朝廷の最高官職に上りつめた。娘の徳子を高倉天皇に嫁がせ、生まれた孫を安徳天皇として即位させることで、藤原氏に代わる新しい権力の形を築いた人物である。摂津の大輪田泊(現在の神戸港の一部)を整備して日宋貿易を積極的に進め、宋からもたらされる貨幣や陶磁器、書籍によって、それまでにない経済的な豊かさを平氏にもたらした。「平家物語」には、一門で公卿や殿上人に列した者は60人以上、知行する国は30か国あまりに及んだと記されるほどの繁栄ぶりで、清盛は一時、都を福原(現在の神戸)へ移すことまで試みている。しかしこうした一族の栄華は「平家にあらずんば人にあらず」と言われるほどの驕りを生み、清盛が熱病で世を去るとまもなく、壇ノ浦で平氏は滅亡することとなった。",
    bodyHtml:"平清盛は、伊勢平氏の棟梁として保元・平治の乱を勝ち抜き、1167年、武士として初めて太政大臣という朝廷の最高官職に上りつめた。娘の徳子を高倉天皇に嫁がせ、生まれた孫を安徳天皇として即位させることで、藤原氏に代わる新しい権力の形を築いた人物である。摂津の大輪田泊(現在の神戸港の一部)を整備して日宋貿易を積極的に進め、宋からもたらされる貨幣や陶磁器、書籍によって、それまでにない経済的な豊かさを平氏にもたらした。「平家物語」には、一門で公卿や殿上人に列した者は60人以上、知行する国は30か国あまりに及んだと記されるほどの繁栄ぶりで、清盛は一時、都を福原(現在の神戸)へ移すことまで試みている。しかしこうした一族の栄華は「平家にあらずんば人にあらず」と言われるほどの驕りを生み、清盛が熱病で世を去るとまもなく、壇ノ浦で平氏は滅亡することとなった。", source:"legacy", sourceId:"J09" },
  { id:"J10-01", personId:"J10", title:"この人の歩み", tags:["政治"],
    body:"源義朝は、保元の乱で源氏の主力として戦い、勝利に貢献した平安時代末期の武将である。しかし恩賞の少なさに不満を抱き、1159年の平治の乱では藤原信頼とともに兵を挙げ、後白河上皇の御所である三条殿を襲撃していったんは実権を握った。だが京へ戻った平清盛の反撃を受けて敗走し、東国をめざして落ち延びる途中、味方だと信じていた尾張(現在の愛知県)の家臣・長田忠致に裏切られ、入浴中を襲われて非業の最期を遂げたと伝えられる。この時わずか13歳だった嫡男の頼朝は捕らえられながらも命を救われて伊豆へ流され、幼い牛若丸(義経)は鞍馬寺に預けられたが、二十数年後、この兄弟が中心となって平氏を打倒し、鎌倉幕府を開くことになる。この悲劇を描いた軍記物語「平治物語」は、後の能や歌舞伎の題材としても取り上げられ、父の無念を晴らした頼朝・義経兄弟の物語とあわせて、今も広く語り継がれている。",
    bodyHtml:"源義朝は、保元の乱で源氏の主力として戦い、勝利に貢献した平安時代末期の武将である。しかし恩賞の少なさに不満を抱き、1159年の平治の乱では藤原信頼とともに兵を挙げ、後白河上皇の御所である三条殿を襲撃していったんは実権を握った。だが京へ戻った平清盛の反撃を受けて敗走し、東国をめざして落ち延びる途中、味方だと信じていた尾張(現在の愛知県)の家臣・長田忠致に裏切られ、入浴中を襲われて非業の最期を遂げたと伝えられる。この時わずか13歳だった嫡男の頼朝は捕らえられながらも命を救われて伊豆へ流され、幼い牛若丸(義経)は鞍馬寺に預けられたが、二十数年後、この兄弟が中心となって平氏を打倒し、鎌倉幕府を開くことになる。この悲劇を描いた軍記物語「平治物語」は、後の能や歌舞伎の題材としても取り上げられ、父の無念を晴らした頼朝・義経兄弟の物語とあわせて、今も広く語り継がれている。", source:"legacy", sourceId:"J10" },
  { id:"J11-01", personId:"J11", title:"この人の歩み", tags:["文学"],
    body:"崇徳上皇は、父・鳥羽法皇との複雑な確執の末、1156年に起きた保元の乱で弟の後白河天皇方に敗れ、讃岐国(現在の香川県)へと配流された。すぐれた歌人でもあり、「瀬をはやみ 岩にせかるる 滝川の われても末に あはむとぞ思ふ」という歌は、後に小倉百人一首にも選ばれている。都への帰還を願い、写経した五部の大乗経を朝廷に納めようとしたが受け取りを拒まれ、深い絶望のうちに配流から8年余りを経て現地で生涯を終えたと伝えられる。この仕打ちに強い恨みを抱いた上皇は、舌をかみ切った血で経文に呪いの言葉を書きつけ、日本国の大魔縁になると誓ったという伝説も残る。死後、京の都では疫病や政変が相次いだため、人々はこれを崇徳上皇の祟りと恐れ、日本三大怨霊の一人として長く語り継がれている。この崇徳院をめぐる怨霊伝説は、後世に上田秋成の「雨月物語」など数々の文学作品の題材となり、日本人の怨霊観に大きな影響を与え続けている。",
    bodyHtml:"崇徳上皇は、父・鳥羽法皇との複雑な確執の末、1156年に起きた保元の乱で弟の後白河天皇方に敗れ、讃岐国(現在の香川県)へと配流された。すぐれた歌人でもあり、「瀬をはやみ 岩にせかるる 滝川の われても末に あはむとぞ思ふ」という歌は、後に小倉百人一首にも選ばれている。都への帰還を願い、写経した五部の大乗経を朝廷に納めようとしたが受け取りを拒まれ、深い絶望のうちに配流から8年余りを経て現地で生涯を終えたと伝えられる。この仕打ちに強い恨みを抱いた上皇は、舌をかみ切った血で経文に呪いの言葉を書きつけ、日本国の大魔縁になると誓ったという伝説も残る。死後、京の都では疫病や政変が相次いだため、人々はこれを崇徳上皇の祟りと恐れ、日本三大怨霊の一人として長く語り継がれている。この崇徳院をめぐる怨霊伝説は、後世に上田秋成の「雨月物語」など数々の文学作品の題材となり、日本人の怨霊観に大きな影響を与え続けている。", source:"legacy", sourceId:"J11" },
  { id:"J12-01", personId:"J12", title:"この人の歩み", tags:["政治"],
    body:"白河法皇は、1086年にわずか8歳の子・堀河天皇に位を譲ったのちも、上皇として「院政」という新しい政治のしくみを生み出し、堀河・鳥羽・崇徳と三代にわたる約43年間、実権を握り続けた。摂関家の力を抑え、荘園からの収入や北面の武士と呼ばれる武力を背景に、思うがままの政治を行う一方、法勝寺をはじめとする「六勝寺」という壮麗な寺院群を次々と建立し、絶大な富と権力を誇示した。それでも「賀茂川の水、双六の賽、山法師。これぞわが心にままならぬもの」と嘆いたと伝わり、比叡山延暦寺の僧兵による強訴だけは抑えきれなかったという。この院政という統治形態は、鳥羽法皇や後白河法皇にも受け継がれ、天皇家が実権を握り続けるための仕組みとして、後の時代にまで長く影響を及ぼすこととなった。白河法皇が最初に建立した法勝寺の跡地は、現在の京都市動物園やその周辺にあたるとされ、当時の権勢を今に伝える手がかりとなっている。",
    bodyHtml:"白河法皇は、1086年にわずか8歳の子・堀河天皇に位を譲ったのちも、上皇として「院政」という新しい政治のしくみを生み出し、堀河・鳥羽・崇徳と三代にわたる約43年間、実権を握り続けた。摂関家の力を抑え、荘園からの収入や北面の武士と呼ばれる武力を背景に、思うがままの政治を行う一方、法勝寺をはじめとする「六勝寺」という壮麗な寺院群を次々と建立し、絶大な富と権力を誇示した。それでも「賀茂川の水、双六の賽、山法師。これぞわが心にままならぬもの」と嘆いたと伝わり、比叡山延暦寺の僧兵による強訴だけは抑えきれなかったという。この院政という統治形態は、鳥羽法皇や後白河法皇にも受け継がれ、天皇家が実権を握り続けるための仕組みとして、後の時代にまで長く影響を及ぼすこととなった。白河法皇が最初に建立した法勝寺の跡地は、現在の京都市動物園やその周辺にあたるとされ、当時の権勢を今に伝える手がかりとなっている。", source:"legacy", sourceId:"J12" },
  { id:"J13-01", personId:"J13", title:"この人の歩み", tags:["政治"],
    body:"藤原良房は、娘の明子を文徳天皇の后として嫁がせ、生まれた孫がわずか9歳で即位すると、清和天皇の摂政に就任した。皇族以外の人物が摂政となるのは日本史上初めてのことであり、これにより藤原氏は天皇の外戚として朝廷を動かす足がかりを得ることになった。866年、平安京の正門である応天門が何者かに放火される事件が起こると、良房は対立していた大納言・伴善男らをその犯人として失脚させ、政敵を退けて自らの地位をより盤石なものとした。実子がなかった良房は甥の基経を養子に迎えてその地位を継がせ、この外戚政治の手法は基経からさらに子孫の道長へと受け継がれて、平安時代を通じて藤原氏が摂政・関白として政治の中心に立ち続ける摂関政治の礎となった。この応天門の変を題材にした「伴大納言絵巻」は、平安時代の宮廷政治の緊張感を今に伝える貴重な絵巻物として、国宝に指定されている。",
    bodyHtml:"藤原良房は、娘の明子を文徳天皇の后として嫁がせ、生まれた孫がわずか9歳で即位すると、清和天皇の摂政に就任した。皇族以外の人物が摂政となるのは日本史上初めてのことであり、これにより藤原氏は天皇の外戚として朝廷を動かす足がかりを得ることになった。866年、平安京の正門である応天門が何者かに放火される事件が起こると、良房は対立していた大納言・伴善男らをその犯人として失脚させ、政敵を退けて自らの地位をより盤石なものとした。実子がなかった良房は甥の基経を養子に迎えてその地位を継がせ、この外戚政治の手法は基経からさらに子孫の道長へと受け継がれて、平安時代を通じて藤原氏が摂政・関白として政治の中心に立ち続ける摂関政治の礎となった。この応天門の変を題材にした「伴大納言絵巻」は、平安時代の宮廷政治の緊張感を今に伝える貴重な絵巻物として、国宝に指定されている。", source:"legacy", sourceId:"J13" },
  { id:"J14-01", personId:"J14", title:"この人の歩み", tags:["文学"],
    body:"藤原定家は、優れた歌人だった父・藤原俊成のもとに生まれ、後鳥羽上皇の命を受けて「新古今和歌集」の編纂に加わった、鎌倉時代初期を代表する歌人である。まだ若かった源平の争乱の時代、日記「明月記」に「紅旗征戎、吾が事に非ず」(戦乱の世は自分に関わることではない)と記し、ひたすら和歌の道を追求する姿勢を貫いたという。後鳥羽上皇とは歌の理想をめぐって対立し、一時は歌会への出席を禁じられるほどだったが、上皇が承久の乱に敗れて隠岐へ流された後も、定家は歌人としての活動を続けた。晩年、京都嵯峨野の小倉山の山荘で、古今の名歌人100人の作品をひとつずつ選んだのが「小倉百人一首」であり、江戸時代以降かるた遊びとして広まって、令和の今も多くの人に親しまれ続けている。定家が晩年に書き継いだ日記「明月記」は、当時の宮廷社会や自然現象を伝える一級の史料としても、今日の歴史研究に活用されている。",
    bodyHtml:"藤原定家は、優れた歌人だった父・藤原俊成のもとに生まれ、後鳥羽上皇の命を受けて「新古今和歌集」の編纂に加わった、鎌倉時代初期を代表する歌人である。まだ若かった源平の争乱の時代、日記「明月記」に「紅旗征戎、吾が事に非ず」(戦乱の世は自分に関わることではない)と記し、ひたすら和歌の道を追求する姿勢を貫いたという。後鳥羽上皇とは歌の理想をめぐって対立し、一時は歌会への出席を禁じられるほどだったが、上皇が承久の乱に敗れて隠岐へ流された後も、定家は歌人としての活動を続けた。晩年、京都嵯峨野の小倉山の山荘で、古今の名歌人100人の作品をひとつずつ選んだのが「小倉百人一首」であり、江戸時代以降かるた遊びとして広まって、令和の今も多くの人に親しまれ続けている。定家が晩年に書き継いだ日記「明月記」は、当時の宮廷社会や自然現象を伝える一級の史料としても、今日の歴史研究に活用されている。", source:"legacy", sourceId:"J14" },
  { id:"J15-01", personId:"J15", title:"この人の歩み", tags:["政治"],
    body:"源義経は、平氏追討の戦いで数々の奇策を成功させた武将である。一ノ谷の戦いでは、馬も下りられぬような険しい崖を駆け下りる「鵯越の逆落とし」で敵の背後を突き、屋島の戦いでは荒天の海を渡って奇襲をかけ、那須与一が扇の的を射抜いた逸話でも知られるこの戦いに勝利し、壇ノ浦の戦いでもついに平氏を滅亡に追い込んだ。しかし戦の最中に頼朝の許可を得ず朝廷から官位を受けたことなどをきっかけに兄との溝は深まり、追われる身となった義経は家臣の弁慶らとともに奥州藤原氏を頼って平泉に身を寄せる。だが庇護者の藤原秀衡が亡くなると、その子泰衡は頼朝の圧力に屈して義経を襲い、義経は衣川の館で自害し、30年の生涯を閉じた。この薄幸の英雄への同情は、判官(義経の官職名)への「判官びいき」という言葉を今に残している。この悲運の物語は後に「義経記」としてまとめられ、歌舞伎や能、浄瑠璃など数々の芸能作品の題材として、今も多くの人に親しまれている。",
    bodyHtml:"源義経は、平氏追討の戦いで数々の奇策を成功させた武将である。一ノ谷の戦いでは、馬も下りられぬような険しい崖を駆け下りる「鵯越の逆落とし」で敵の背後を突き、屋島の戦いでは荒天の海を渡って奇襲をかけ、那須与一が扇の的を射抜いた逸話でも知られるこの戦いに勝利し、壇ノ浦の戦いでもついに平氏を滅亡に追い込んだ。しかし戦の最中に頼朝の許可を得ず朝廷から官位を受けたことなどをきっかけに兄との溝は深まり、追われる身となった義経は家臣の弁慶らとともに奥州藤原氏を頼って平泉に身を寄せる。だが庇護者の藤原秀衡が亡くなると、その子泰衡は頼朝の圧力に屈して義経を襲い、義経は衣川の館で自害し、30年の生涯を閉じた。この薄幸の英雄への同情は、判官(義経の官職名)への「判官びいき」という言葉を今に残している。この悲運の物語は後に「義経記」としてまとめられ、歌舞伎や能、浄瑠璃など数々の芸能作品の題材として、今も多くの人に親しまれている。", source:"legacy", sourceId:"J15" },
  { id:"068-02", personId:"068", title:"もうひとつのエピソード", tags:["政治"],
    body:"北条政子は、伊豆の豪族北条時政の娘でありながら、当時流人だった源頼朝と結ばれ、鎌倉幕府の成立を陰から支えた女性である。頼朝の死後、跡を継いだ息子の頼家は幽閉されたのち殺害され、続く実朝も甥に暗殺されるという悲劇が相次ぎ、源氏の正統な血筋が絶えるという困難のなかで、政子は父や弟の北条氏とともに幕府の実権を握り続けた。1221年に後鳥羽上皇が幕府打倒を呼びかけた承久の乱では、動揺する御家人たちを前に、頼朝から受けた恩の大きさを切々と説く演説を行い、一同を奮い立たせたと「吾妻鏡」に伝えられる。この結束によって幕府軍は勝利し、朝廷に対する武家政権の優位が確立された。出家した身でありながら政治を主導したその姿から、政子は後世「尼将軍」と呼ばれるようになった。政子は晩年、実朝暗殺後の混乱を鎮めて幕府の存続を導いたことから、後世「日本三大悪女」と評される一方で、鎌倉幕府を守り抜いた実質的な指導者として再評価されている。",
    bodyHtml:"北条政子は、伊豆の豪族北条時政の娘でありながら、当時流人だった源頼朝と結ばれ、鎌倉幕府の成立を陰から支えた女性である。頼朝の死後、跡を継いだ息子の頼家は幽閉されたのち殺害され、続く実朝も甥に暗殺されるという悲劇が相次ぎ、源氏の正統な血筋が絶えるという困難のなかで、政子は父や弟の北条氏とともに幕府の実権を握り続けた。1221年に後鳥羽上皇が幕府打倒を呼びかけた承久の乱では、動揺する御家人たちを前に、頼朝から受けた恩の大きさを切々と説く演説を行い、一同を奮い立たせたと「吾妻鏡」に伝えられる。この結束によって幕府軍は勝利し、朝廷に対する武家政権の優位が確立された。出家した身でありながら政治を主導したその姿から、政子は後世「尼将軍」と呼ばれるようになった。政子は晩年、実朝暗殺後の混乱を鎮めて幕府の存続を導いたことから、後世「日本三大悪女」と評される一方で、鎌倉幕府を守り抜いた実質的な指導者として再評価されている。", source:"legacy", sourceId:"J16" },
  { id:"J17-01", personId:"J17", title:"この人の歩み", tags:["教育"],
    body:"日蓮は、安房国(現在の千葉県)の漁師の家に生まれ、法華経こそが釈迦の真の教えであるとして「南無妙法蓮華経」の題目を唱えることを説いた、鎌倉時代の僧侶である。1260年には「立正安国論」を著し、正しい教えを信じなければ内乱や外国からの侵略が起こると幕府に警告したが、これが他宗を非難するものと受け取られ、伊豆への流罪や、暴漢に襲われて額に傷を負う法難など、たびたび迫害を受けた。1271年の竜の口の法難では、まさに斬首されようとした瞬間に不思議な光が現れて処刑が中止されたと伝えられ、その後佐渡島への流罪を命じられている。晩年は甲斐国の身延山に草庵を構えて弟子の育成に努め、厳しい迫害の中でも信念を曲げず布教を続けたその教えは、日蓮宗として今も多くの信徒に受け継がれている。日蓮が佐渡流罪中に著した「開目抄」「観心本尊抄」は法華経信仰の根本を示す重要な著作とされ、迫害の中でも思想を深め続けたその生涯は、後の日蓮宗信徒に大きな影響を与えている。",
    bodyHtml:"日蓮は、安房国(現在の千葉県)の漁師の家に生まれ、法華経こそが釈迦の真の教えであるとして「南無妙法蓮華経」の題目を唱えることを説いた、鎌倉時代の僧侶である。1260年には「立正安国論」を著し、正しい教えを信じなければ内乱や外国からの侵略が起こると幕府に警告したが、これが他宗を非難するものと受け取られ、伊豆への流罪や、暴漢に襲われて額に傷を負う法難など、たびたび迫害を受けた。1271年の竜の口の法難では、まさに斬首されようとした瞬間に不思議な光が現れて処刑が中止されたと伝えられ、その後佐渡島への流罪を命じられている。晩年は甲斐国の身延山に草庵を構えて弟子の育成に努め、厳しい迫害の中でも信念を曲げず布教を続けたその教えは、日蓮宗として今も多くの信徒に受け継がれている。日蓮が佐渡流罪中に著した「開目抄」「観心本尊抄」は法華経信仰の根本を示す重要な著作とされ、迫害の中でも思想を深め続けたその生涯は、後の日蓮宗信徒に大きな影響を与えている。", source:"legacy", sourceId:"J17" },
  { id:"J18-01", personId:"J18", title:"この人の歩み", tags:["教育"],
    body:"道元は、比叡山で学んだのち、栄西の弟子である明全とともに24歳で宋(中国)に渡り、天童山の如浄禅師のもとで厳しい修行を積んで、「身心脱落」の境地に至ったとされる日本の僧侶である。帰国後は、坐禅そのものが悟りの姿であるとする「只管打坐」を説き、経典の言葉や理屈よりも、ひたすら坐ることを重んじる曹洞宗を開いた。主著「正法眼蔵」には「仏道をならふというふは、自己をならふ也」という言葉が記され、外に答えを求めるのではなく自らを見つめることの大切さを説いている。1244年には越前(現在の福井県)の山中に永平寺を開き、権力や名声から離れた場所で厳格な修行の日々を送った。この禅の教えと道場は、800年近くたった今も曹洞宗の大本山として多くの修行僧を受け入れている。道元が記した弟子との問答集「正法眼蔵随聞記」も広く読まれており、権力と距離を置きながら只管打坐を説き続けたその姿勢は、後世の禅僧たちの模範とされている。",
    bodyHtml:"道元は、比叡山で学んだのち、栄西の弟子である明全とともに24歳で宋(中国)に渡り、天童山の如浄禅師のもとで厳しい修行を積んで、「身心脱落」の境地に至ったとされる日本の僧侶である。帰国後は、坐禅そのものが悟りの姿であるとする「只管打坐」を説き、経典の言葉や理屈よりも、ひたすら坐ることを重んじる曹洞宗を開いた。主著「正法眼蔵」には「仏道をならふというふは、自己をならふ也」という言葉が記され、外に答えを求めるのではなく自らを見つめることの大切さを説いている。1244年には越前(現在の福井県)の山中に永平寺を開き、権力や名声から離れた場所で厳格な修行の日々を送った。この禅の教えと道場は、800年近くたった今も曹洞宗の大本山として多くの修行僧を受け入れている。道元が記した弟子との問答集「正法眼蔵随聞記」も広く読まれており、権力と距離を置きながら只管打坐を説き続けたその姿勢は、後世の禅僧たちの模範とされている。", source:"legacy", sourceId:"J18" },
  { id:"J19-01", personId:"J19", title:"この人の歩み", tags:["教育"],
    body:"一遍は、伊予国(現在の愛媛県)の武家である河野氏に生まれながら家督を捨てて出家し、全財産を捨てて全国を旅した「捨聖」「遊行上人」と呼ばれる鎌倉時代の僧侶である。信心の深さや身分の上下に関わりなく、「南無阿弥陀仏」と書かれた念仏札を配り歩いたが、あるとき信心がないと札の受け取りを拒む尼に出会い、深く思い悩んだ末、熊野権現から誰もが等しく救われるとの啓示を得たと伝えられる。踊りながら念仏を唱える「踊念仏」を各地で行うと、熱狂した人々が我先にと踊りの輪に加わり、これは後の盆踊りのルーツの一つともいわれている。一つの寺を持たず、生涯を通じて日本各地を歩き続けたその布教スタイルは時宗として受け継がれ、死の直前には自らの著作の多くを焼き捨てて、51歳で兵庫の地で往生したと伝わっている。一遍のこの教えは、身分や信心の有無を問わず誰もが救われるという徹底した平等観に基づくもので、鎌倉新仏教の中でも特異な思想として評価されている。",
    bodyHtml:"一遍は、伊予国(現在の愛媛県)の武家である河野氏に生まれながら家督を捨てて出家し、全財産を捨てて全国を旅した「捨聖」「遊行上人」と呼ばれる鎌倉時代の僧侶である。信心の深さや身分の上下に関わりなく、「南無阿弥陀仏」と書かれた念仏札を配り歩いたが、あるとき信心がないと札の受け取りを拒む尼に出会い、深く思い悩んだ末、熊野権現から誰もが等しく救われるとの啓示を得たと伝えられる。踊りながら念仏を唱える「踊念仏」を各地で行うと、熱狂した人々が我先にと踊りの輪に加わり、これは後の盆踊りのルーツの一つともいわれている。一つの寺を持たず、生涯を通じて日本各地を歩き続けたその布教スタイルは時宗として受け継がれ、死の直前には自らの著作の多くを焼き捨てて、51歳で兵庫の地で往生したと伝わっている。一遍のこの教えは、身分や信心の有無を問わず誰もが救われるという徹底した平等観に基づくもので、鎌倉新仏教の中でも特異な思想として評価されている。", source:"legacy", sourceId:"J19" },
  { id:"J20-01", personId:"J20", title:"この人の歩み", tags:["政治"],
    body:"北条時宗は、18歳の若さで鎌倉幕府の執権となり、2度にわたる元(モンゴル帝国)の襲来という国難に立ち向かった人物である。服属を求める元の使者を退け、時には使者を斬るという強硬な姿勢を貫き、1274年の文永の役の後には、博多湾の海岸に石塁(防塁)を築かせて上陸に備えた。1281年の弘安の役では、この防備と暴風雨(のちに「神風」と呼ばれる)の助けもあって、大軍を擁した元軍の再度の侵攻を退けている。二度の戦いで戦死した敵味方の霊を弔うため、宋から高僧の無学祖元を招いて鎌倉に円覚寺を建立した一方で、外国との戦であったため恩賞に与える新たな領地がなく、御家人たちの不満がくすぶる結果ともなった。国難を乗り切った直後、心労が重なったためか、時宗はわずか33歳で世を去った。この国難を乗り越えた経験は、後世「元寇」として語り継がれ、時宗が拝んだと伝わる円覚寺の舎利殿は、鎌倉を代表する禅宗建築として今も大切に守られている。",
    bodyHtml:"北条時宗は、18歳の若さで鎌倉幕府の執権となり、2度にわたる元(モンゴル帝国)の襲来という国難に立ち向かった人物である。服属を求める元の使者を退け、時には使者を斬るという強硬な姿勢を貫き、1274年の文永の役の後には、博多湾の海岸に石塁(防塁)を築かせて上陸に備えた。1281年の弘安の役では、この防備と暴風雨(のちに「神風」と呼ばれる)の助けもあって、大軍を擁した元軍の再度の侵攻を退けている。二度の戦いで戦死した敵味方の霊を弔うため、宋から高僧の無学祖元を招いて鎌倉に円覚寺を建立した一方で、外国との戦であったため恩賞に与える新たな領地がなく、御家人たちの不満がくすぶる結果ともなった。国難を乗り切った直後、心労が重なったためか、時宗はわずか33歳で世を去った。この国難を乗り越えた経験は、後世「元寇」として語り継がれ、時宗が拝んだと伝わる円覚寺の舎利殿は、鎌倉を代表する禅宗建築として今も大切に守られている。", source:"legacy", sourceId:"J20" },
  { id:"J21-01", personId:"J21", title:"この人の歩み", tags:["政治"],
    body:"足利尊氏は、清和源氏の流れをくむ有力御家人として鎌倉幕府に仕えていたが、1333年、後醍醐天皇の倒幕の呼びかけに応じて幕府方から寝返り、六波羅探題を攻め落として鎌倉幕府を滅亡に追い込んだ。この功により後醍醐天皇の名前から「尊」の字を与えられ、高氏から尊氏へと名を改めている。しかし天皇中心の政治を目指す「建武の新政」は武士たちの不満を招き、尊氏はやがて天皇と対立して兵を挙げ、1336年、京都に新たに光明天皇を立てて建武式目を定め、征夷大将軍として室町幕府を開いた。後醍醐天皇は都を脱出して奈良の吉野に朝廷を構えたため、京都の北朝と吉野の南朝が並び立つ「南北朝時代」という約60年におよぶ動乱の時代が始まり、さらに晩年には実の弟・直義との内紛にも苦しめられることになった。尊氏が定めた建武式目は、その後約240年続く室町幕府の政治方針の土台となり、弟直義との対立(観応の擾乱)は、南北朝の動乱をさらに複雑なものにした。",
    bodyHtml:"足利尊氏は、清和源氏の流れをくむ有力御家人として鎌倉幕府に仕えていたが、1333年、後醍醐天皇の倒幕の呼びかけに応じて幕府方から寝返り、六波羅探題を攻め落として鎌倉幕府を滅亡に追い込んだ。この功により後醍醐天皇の名前から「尊」の字を与えられ、高氏から尊氏へと名を改めている。しかし天皇中心の政治を目指す「建武の新政」は武士たちの不満を招き、尊氏はやがて天皇と対立して兵を挙げ、1336年、京都に新たに光明天皇を立てて建武式目を定め、征夷大将軍として室町幕府を開いた。後醍醐天皇は都を脱出して奈良の吉野に朝廷を構えたため、京都の北朝と吉野の南朝が並び立つ「南北朝時代」という約60年におよぶ動乱の時代が始まり、さらに晩年には実の弟・直義との内紛にも苦しめられることになった。尊氏が定めた建武式目は、その後約240年続く室町幕府の政治方針の土台となり、弟直義との対立(観応の擾乱)は、南北朝の動乱をさらに複雑なものにした。", source:"legacy", sourceId:"J21" },
  { id:"J22-01", personId:"J22", title:"この人の歩み", tags:["政治"],
    body:"足利義満は、わずか10歳で室町幕府の3代将軍となり、有力な守護大名である山名氏や大内氏の勢力を明徳の乱・応永の乱で削ぎながら将軍権力を強化し、1392年には南北朝の合一を実現して60年近く続いた分裂の時代に終止符を打った。京都北山の別荘に建てた金閣(舎利殿)は、公家文化と武家文化、さらに禅宗の影響が融合した「北山文化」を象徴する建物として知られる。1401年からは、正式な貿易船と海賊船を区別するための合札(勘合)を用いた明(中国)との勘合貿易を開始し、その際に明の皇帝から「日本国王」という称号を受けるなど、外交面でも大きな成果を上げた。将軍職を早くに息子へ譲って太政大臣となった後も実権を握り続け、義満の時代は室町幕府の全盛期と位置づけられている。この勘合貿易によって明銭や陶磁器、書画などが盛んに輸入され、金閣に象徴される北山文化は、後の東山文化とあわせて日本の伝統文化の基礎を形づくった。",
    bodyHtml:"足利義満は、わずか10歳で室町幕府の3代将軍となり、有力な守護大名である山名氏や大内氏の勢力を明徳の乱・応永の乱で削ぎながら将軍権力を強化し、1392年には南北朝の合一を実現して60年近く続いた分裂の時代に終止符を打った。京都北山の別荘に建てた金閣(舎利殿)は、公家文化と武家文化、さらに禅宗の影響が融合した「北山文化」を象徴する建物として知られる。1401年からは、正式な貿易船と海賊船を区別するための合札(勘合)を用いた明(中国)との勘合貿易を開始し、その際に明の皇帝から「日本国王」という称号を受けるなど、外交面でも大きな成果を上げた。将軍職を早くに息子へ譲って太政大臣となった後も実権を握り続け、義満の時代は室町幕府の全盛期と位置づけられている。この勘合貿易によって明銭や陶磁器、書画などが盛んに輸入され、金閣に象徴される北山文化は、後の東山文化とあわせて日本の伝統文化の基礎を形づくった。", source:"legacy", sourceId:"J22" },
  { id:"J23-01", personId:"J23", title:"この人の歩み", tags:["芸術"],
    body:"観阿弥・世阿弥の親子は、当時庶民の芸能だった猿楽を、幽玄な美を追求する「能」という芸術に高めた人物である。1374年、京都の今熊野で行われた観阿弥一座の演能を見た将軍足利義満は、当時12歳だった世阿弥の美しさと才能に魅了され、以後手厚い庇護を与えた。観阿弥は各地を巡業する中、駿河(現在の静岡県)で客死し、跡を継いだ世阿弥は稽古の心得や芸の奥義をまとめた「風姿花伝」をはじめ「花鏡」など多くの伝書を著し、「秘すれば花なり」「初心忘るべからず」などの言葉を残している。義満の死後は幕府の庇護を失って不遇となり、晩年には将軍足利義教の怒りを買って70代で佐渡島へ流されるという過酷な運命にも見舞われたが、親子が完成させた能は、現在も国の重要無形文化財として舞台で演じ続けられている。世阿弥が確立した能の様式は、今日でも変わらぬ形で各地の能楽堂で上演され続けており、親子二代にわたる功績は日本の伝統芸能史上最も重要な遺産の一つとされている。",
    bodyHtml:"観阿弥・世阿弥の親子は、当時庶民の芸能だった猿楽を、幽玄な美を追求する「能」という芸術に高めた人物である。1374年、京都の今熊野で行われた観阿弥一座の演能を見た将軍足利義満は、当時12歳だった世阿弥の美しさと才能に魅了され、以後手厚い庇護を与えた。観阿弥は各地を巡業する中、駿河(現在の静岡県)で客死し、跡を継いだ世阿弥は稽古の心得や芸の奥義をまとめた「風姿花伝」をはじめ「花鏡」など多くの伝書を著し、「秘すれば花なり」「初心忘るべからず」などの言葉を残している。義満の死後は幕府の庇護を失って不遇となり、晩年には将軍足利義教の怒りを買って70代で佐渡島へ流されるという過酷な運命にも見舞われたが、親子が完成させた能は、現在も国の重要無形文化財として舞台で演じ続けられている。世阿弥が確立した能の様式は、今日でも変わらぬ形で各地の能楽堂で上演され続けており、親子二代にわたる功績は日本の伝統芸能史上最も重要な遺産の一つとされている。", source:"legacy", sourceId:"J23" },
  { id:"J24-01", personId:"J24", title:"この人の歩み", tags:["文学"],
    body:"宗祇は、和歌の上の句と下の句を別々の人が詠み継いでいく「連歌」を芸術の域にまで高めた、室町時代を代表する連歌師である。歌人の東常縁から「古今和歌集」の秘伝的な解釈を伝える「古今伝授」を受け継ぐなど、和歌の正統な教養も深く身につけていた。京都だけでなく、関東や九州、遠く陸奥(東北地方)まで各地の武将のもとを訪ね歩いては連歌の指導を行い、その旅の中で地方の文化にも大きな影響を与えた。1488年、弟子の肖柏・宗長とともに詠んだ「水無瀬三吟百韻」は、連歌史上屈指の名作として今に伝えられている。伝統的な和歌の美意識を受け継ぎながら新しい言葉の表現を切り開いたその生涯は、1502年、旅の途中の箱根で82年の幕を閉じた。宗祇が広めた連歌の美意識は、後の松尾芭蕉ら俳諧師たちにも大きな影響を与え、地方を巡り歩きながら文化を伝えたその生涯は、旅の文人の先駆けとしても知られている。",
    bodyHtml:"宗祇は、和歌の上の句と下の句を別々の人が詠み継いでいく「連歌」を芸術の域にまで高めた、室町時代を代表する連歌師である。歌人の東常縁から「古今和歌集」の秘伝的な解釈を伝える「古今伝授」を受け継ぐなど、和歌の正統な教養も深く身につけていた。京都だけでなく、関東や九州、遠く陸奥(東北地方)まで各地の武将のもとを訪ね歩いては連歌の指導を行い、その旅の中で地方の文化にも大きな影響を与えた。1488年、弟子の肖柏・宗長とともに詠んだ「水無瀬三吟百韻」は、連歌史上屈指の名作として今に伝えられている。伝統的な和歌の美意識を受け継ぎながら新しい言葉の表現を切り開いたその生涯は、1502年、旅の途中の箱根で82年の幕を閉じた。宗祇が広めた連歌の美意識は、後の松尾芭蕉ら俳諧師たちにも大きな影響を与え、地方を巡り歩きながら文化を伝えたその生涯は、旅の文人の先駆けとしても知られている。", source:"legacy", sourceId:"J24" },
  { id:"J55-01", personId:"J55", title:"この人の歩み", tags:["冒険"],
    body:"大黒屋光太夫は、江戸へ米などを運ぶ廻船「神昌丸」の船頭だったが、1782年、暴風雨に遭って船が漂流し、7か月余りをかけてロシア領のアリューシャン列島にたどり着いた。厳しい寒さと飢えの中で17人いた仲間の多くを失いながらも、ロシア各地を渡り歩いて帰国を訴え続け、科学者キリル・ラクスマンの助けを得て、当時の首都サンクトペテルブルクで女帝エカチェリーナ2世に直接謁見するという幸運を得る。その熱意が認められて帰国を許され、1792年、ラクスマンの息子アダムが率いる使節の船で根室に上陸したが、生きて日本の土を踏めたのはわずか2人だけだった。鎖国下にあった日本にとって、光太夫がもたらしたロシアの実情に関する情報は非常に貴重であり、その体験は蘭学者桂川甫周によって「北槎聞略」としてまとめられている。この漂流と帰国の顛末を描いた「北槎聞略」は、鎖国時代の日本人が見たロシアの姿を伝える貴重な記録として、後の歴史研究に大きく役立てられている。",
    bodyHtml:"大黒屋光太夫は、江戸へ米などを運ぶ廻船「神昌丸」の船頭だったが、1782年、暴風雨に遭って船が漂流し、7か月余りをかけてロシア領のアリューシャン列島にたどり着いた。厳しい寒さと飢えの中で17人いた仲間の多くを失いながらも、ロシア各地を渡り歩いて帰国を訴え続け、科学者キリル・ラクスマンの助けを得て、当時の首都サンクトペテルブルクで女帝エカチェリーナ2世に直接謁見するという幸運を得る。その熱意が認められて帰国を許され、1792年、ラクスマンの息子アダムが率いる使節の船で根室に上陸したが、生きて日本の土を踏めたのはわずか2人だけだった。鎖国下にあった日本にとって、光太夫がもたらしたロシアの実情に関する情報は非常に貴重であり、その体験は蘭学者桂川甫周によって「北槎聞略」としてまとめられている。この漂流と帰国の顛末を描いた「北槎聞略」は、鎖国時代の日本人が見たロシアの姿を伝える貴重な記録として、後の歴史研究に大きく役立てられている。", source:"legacy", sourceId:"J55" },
  { id:"J56-01", personId:"J56", title:"この人の歩み", tags:["芸術"],
    body:"東洲斎写楽は、版元の蔦屋重三郎の下で、1794年から翌年にかけてのわずか10か月ほどの間に、140点以上の浮世絵を残して忽然と姿を消した謎の絵師である。デビュー作となった大首絵の多くには、背景に雲母を用いた豪華な「雲母摺」が使われており、当時としては異例の力の入れようだったことがうかがえる。歌舞伎役者の顔を誇張してとらえたその画風は、それまでの美化された役者絵とは異なり、しわや癖まで大胆にデフォルメして描いたため、当初は不評だったとも伝えられる。しかし表情に宿る役者の個性を鋭くとらえたこの画風は後年高く評価されるようになり、20世紀初めにはドイツの美術研究者がレンブラントやベラスケスと並ぶ肖像画家の一人に数えたほどである。阿波藩お抱えの能役者・斎藤十郎兵衛と同一人物とする説が有力視されているが確かな証拠はなく、その正体は今も日本美術史最大の謎の一つに数えられている。",
    bodyHtml:"東洲斎写楽は、版元の蔦屋重三郎の下で、1794年から翌年にかけてのわずか10か月ほどの間に、140点以上の浮世絵を残して忽然と姿を消した謎の絵師である。デビュー作となった大首絵の多くには、背景に雲母を用いた豪華な「雲母摺」が使われており、当時としては異例の力の入れようだったことがうかがえる。歌舞伎役者の顔を誇張してとらえたその画風は、それまでの美化された役者絵とは異なり、しわや癖まで大胆にデフォルメして描いたため、当初は不評だったとも伝えられる。しかし表情に宿る役者の個性を鋭くとらえたこの画風は後年高く評価されるようになり、20世紀初めにはドイツの美術研究者がレンブラントやベラスケスと並ぶ肖像画家の一人に数えたほどである。阿波藩お抱えの能役者・斎藤十郎兵衛と同一人物とする説が有力視されているが確かな証拠はなく、その正体は今も日本美術史最大の謎の一つに数えられている。", source:"legacy", sourceId:"J56" },
  { id:"J57-01", personId:"J57", title:"この人の歩み", tags:["政治"],
    body:"松平定信は、名君と称された徳川吉宗の孫にあたる家柄に生まれ、御三卿田安家から白河藩松平家の養子となり、藩主を経て江戸幕府の老中となった人物である。藩主時代には天明の大飢饉に際して他藩に先駆けて手厚い救済を行い、一人の餓死者も出さなかったと評価されたことが、後に幕政を任されるきっかけとなった。老中に就任すると、前任の田沼意次の政治を批判する形で「寛政の改革」を断行し、倹約令を出して幕府財政を立て直そうとした。困窮した旗本・御家人の借金を帳消しにする棄捐令や、江戸に飢饉への備えを蓄えさせる七分積金の制度、朱子学以外の学問を幕府の学問所で禁じる寛政異学の禁など、統制色の強い政策を次々と打ち出している。あまりに厳しい統制は「白河の 清きに魚も 棲みかねて もとの濁りの 田沼恋しき」と皮肉られるほどだったが、その改革姿勢は幕政のあり方に大きな影響を残した。",
    bodyHtml:"松平定信は、名君と称された徳川吉宗の孫にあたる家柄に生まれ、御三卿田安家から白河藩松平家の養子となり、藩主を経て江戸幕府の老中となった人物である。藩主時代には天明の大飢饉に際して他藩に先駆けて手厚い救済を行い、一人の餓死者も出さなかったと評価されたことが、後に幕政を任されるきっかけとなった。老中に就任すると、前任の田沼意次の政治を批判する形で「寛政の改革」を断行し、倹約令を出して幕府財政を立て直そうとした。困窮した旗本・御家人の借金を帳消しにする棄捐令や、江戸に飢饉への備えを蓄えさせる七分積金の制度、朱子学以外の学問を幕府の学問所で禁じる寛政異学の禁など、統制色の強い政策を次々と打ち出している。あまりに厳しい統制は「白河の 清きに魚も 棲みかねて もとの濁りの 田沼恋しき」と皮肉られるほどだったが、その改革姿勢は幕政のあり方に大きな影響を残した。", source:"legacy", sourceId:"J57" },
  { id:"J58-01", personId:"J58", title:"この人の歩み", tags:["ビジネス"],
    body:"淡路島出身の高田屋嘉兵衛は、貧しい水主(かこ)から身を起こし、廻船問屋として蝦夷地(北海道)と択捉島を結ぶ新しい航路を切り開き、函館の町の発展にも大きく貢献した商人である。1812年、国後島沖でロシアの軍艦に捕らえられ、はるか北方のカムチャツカに連れて行かれるという事件に巻き込まれた。日本側に捕らえられていたロシア人艦長ゴローニンとの人質交換をめぐり両国の関係がこじれるなか、嘉兵衛は捕虜の身でありながら誠実な人柄と交渉力でロシア側の信頼を得て、双方の仲立ちを買って出た。その働きにより、翌1813年にゴローニンは釈放され、日本とロシアの対立(ゴローニン事件)は戦争に至ることなく平和的な解決を見た。一介の商人でありながら国家間の危機を救ったその功績は高く評価されている。嘉兵衛が切り開いた蝦夷地との航路は、後の函館港発展の礎となり、一介の商人でありながら国家間の危機を救ったその功績は、今も北方領土史を語るうえで欠かせない存在とされている。",
    bodyHtml:"淡路島出身の高田屋嘉兵衛は、貧しい水主(かこ)から身を起こし、廻船問屋として蝦夷地(北海道)と択捉島を結ぶ新しい航路を切り開き、函館の町の発展にも大きく貢献した商人である。1812年、国後島沖でロシアの軍艦に捕らえられ、はるか北方のカムチャツカに連れて行かれるという事件に巻き込まれた。日本側に捕らえられていたロシア人艦長ゴローニンとの人質交換をめぐり両国の関係がこじれるなか、嘉兵衛は捕虜の身でありながら誠実な人柄と交渉力でロシア側の信頼を得て、双方の仲立ちを買って出た。その働きにより、翌1813年にゴローニンは釈放され、日本とロシアの対立(ゴローニン事件)は戦争に至ることなく平和的な解決を見た。一介の商人でありながら国家間の危機を救ったその功績は高く評価されている。嘉兵衛が切り開いた蝦夷地との航路は、後の函館港発展の礎となり、一介の商人でありながら国家間の危機を救ったその功績は、今も北方領土史を語るうえで欠かせない存在とされている。", source:"legacy", sourceId:"J58" },
  { id:"J59-01", personId:"J59", title:"この人の歩み", tags:["教育"],
    body:"田村藍水は、薬草や鉱物などを研究する本草学に優れ、江戸幕府から命じられて、それまで輸入に頼っていた朝鮮人参(御種人参)を、江戸小石川の薬園で長年の試行錯誤の末に国内栽培することに成功した学者である。その功績によって幕府の医官に取り立てられ、実学的な研究を重んじる姿勢で多くの弟子を育てた。中でも門下から出た平賀源内は、藍水の勧めもあって、全国から薬草や珍しい産物を集めて展示する「物産会」を1757年に江戸で開催し、これが後の博覧会や物産展の先駆けとなったとされる。藍水自身も日本各地の物産を調べ上げて紹介する活動に力を注ぎ、蘭学が本格的に広まる前の時代に、実際に観察し確かめることを重んじる学問の姿勢を日本に根づかせた人物として知られている。藍水の薬園での試行錯誤は、後に息子の門下から出た平賀源内らの多才な活躍にもつながり、実際に確かめることを重んじる本草学の精神は、後の博物学の発展にも受け継がれている。",
    bodyHtml:"田村藍水は、薬草や鉱物などを研究する本草学に優れ、江戸幕府から命じられて、それまで輸入に頼っていた朝鮮人参(御種人参)を、江戸小石川の薬園で長年の試行錯誤の末に国内栽培することに成功した学者である。その功績によって幕府の医官に取り立てられ、実学的な研究を重んじる姿勢で多くの弟子を育てた。中でも門下から出た平賀源内は、藍水の勧めもあって、全国から薬草や珍しい産物を集めて展示する「物産会」を1757年に江戸で開催し、これが後の博覧会や物産展の先駆けとなったとされる。藍水自身も日本各地の物産を調べ上げて紹介する活動に力を注ぎ、蘭学が本格的に広まる前の時代に、実際に観察し確かめることを重んじる学問の姿勢を日本に根づかせた人物として知られている。藍水の薬園での試行錯誤は、後に息子の門下から出た平賀源内らの多才な活躍にもつながり、実際に確かめることを重んじる本草学の精神は、後の博物学の発展にも受け継がれている。", source:"legacy", sourceId:"J59" },
  { id:"J60-01", personId:"J60", title:"この人の歩み", tags:["教育"],
    body:"林子平は、江戸時代中期の仙台藩士で、四方を海に囲まれた日本の地理的特徴をふまえ、海からの防備の重要性を説いた「海国兵談」や、朝鮮・琉球・蝦夷地の地図をまとめた「三国通覧図説」を著した思想家である。ロシアなど外国船の接近が増えつつあった当時、大砲や軍艦を整えて沿岸を守る必要性を説いたが、幕府はこれを世情を惑わす危険な書物とみなし、1792年に版木を没収したうえで発禁処分とし、子平を郷里で蟄居に処した。すべてを奪われた晩年、自らを「親もなし 妻なし子なし 版木なし 金もなければ 死にたくもなし」と詠んだと伝えられ、その翌年、失意のうちに世を去っている。しかし黒船来航などで国防への関心が高まると、子平の先見性は再評価され、幕末には海防論の先駆者として広く読まれるようになった。子平が説いた海防論は、彼の死からおよそ60年後、実際にペリー率いる黒船が来航したことで、その先見性が改めて広く認められることとなった。",
    bodyHtml:"林子平は、江戸時代中期の仙台藩士で、四方を海に囲まれた日本の地理的特徴をふまえ、海からの防備の重要性を説いた「海国兵談」や、朝鮮・琉球・蝦夷地の地図をまとめた「三国通覧図説」を著した思想家である。ロシアなど外国船の接近が増えつつあった当時、大砲や軍艦を整えて沿岸を守る必要性を説いたが、幕府はこれを世情を惑わす危険な書物とみなし、1792年に版木を没収したうえで発禁処分とし、子平を郷里で蟄居に処した。すべてを奪われた晩年、自らを「親もなし 妻なし子なし 版木なし 金もなければ 死にたくもなし」と詠んだと伝えられ、その翌年、失意のうちに世を去っている。しかし黒船来航などで国防への関心が高まると、子平の先見性は再評価され、幕末には海防論の先駆者として広く読まれるようになった。子平が説いた海防論は、彼の死からおよそ60年後、実際にペリー率いる黒船が来航したことで、その先見性が改めて広く認められることとなった。", source:"legacy", sourceId:"J60" },
  { id:"J61-01", personId:"J61", title:"この人の歩み", tags:["芸術"],
    body:"司馬江漢は、はじめ浮世絵師の鈴木春信に学び、春信の死後にその画風を模して贋作を描いていたとも伝えられるが、後に平賀源内らと交流して蘭学に目覚め、オランダの書物を頼りに独学で銅版画(エッチング)の技法を習得した。1783年に手がけた「不忍池図」は、日本人が制作した最初の本格的な銅版画とされ、西洋の遠近法や陰影法を取り入れた写実的な風景画を数多く残した。地動説など西洋の科学知識を日本に紹介する著作も著しており、当時としては先進的な知識人だった。奇行の持ち主としても知られ、晩年には自ら死亡広告を出して世間から距離を置き、周囲を欺いたまま数年間ひそかに生き続けたという逸話も伝わる。身分制度にとらわれず新しい知識を貪欲に吸収したその姿勢は、日本の洋画発展の土台を築くものとなった。藩を持たない浪人身分でありながら西洋の技術と思想を独学で吸収し、日本の洋画発展の土台を築いたその生き方は、後の洋風画家たちにも大きな影響を与えている。",
    bodyHtml:"司馬江漢は、はじめ浮世絵師の鈴木春信に学び、春信の死後にその画風を模して贋作を描いていたとも伝えられるが、後に平賀源内らと交流して蘭学に目覚め、オランダの書物を頼りに独学で銅版画(エッチング)の技法を習得した。1783年に手がけた「不忍池図」は、日本人が制作した最初の本格的な銅版画とされ、西洋の遠近法や陰影法を取り入れた写実的な風景画を数多く残した。地動説など西洋の科学知識を日本に紹介する著作も著しており、当時としては先進的な知識人だった。奇行の持ち主としても知られ、晩年には自ら死亡広告を出して世間から距離を置き、周囲を欺いたまま数年間ひそかに生き続けたという逸話も伝わる。身分制度にとらわれず新しい知識を貪欲に吸収したその姿勢は、日本の洋画発展の土台を築くものとなった。藩を持たない浪人身分でありながら西洋の技術と思想を独学で吸収し、日本の洋画発展の土台を築いたその生き方は、後の洋風画家たちにも大きな影響を与えている。", source:"legacy", sourceId:"J61" },
  { id:"J62-01", personId:"J62", title:"この人の歩み", tags:["教育"],
    body:"古賀精里は、肥前佐賀藩の出身で、幕府が正学と定めた朱子学を厳格に講じたことで知られる江戸時代後期の儒学者である。若い頃は長崎で学び、後に大坂で私塾を開いて教えるなど各地で研鑽を積んだのち、1796年に幕府から招かれて江戸へ出た。松平定信が進めた寛政の改革の一環として、朱子学以外の学問を正式な学問所で教えることを禁じる「寛政異学の禁」が出されると、精里は柴野栗山・尾藤二洲とともに「寛政の三博士」と呼ばれ、幕府の学問所である昌平坂学問所で教授として教育にあたった。単なる知識の暗記ではなく、学んだ道理を日々の行いに生かす「実践」を重んじ、多くの門人を育てたことで、幕末に至るまでの武士の思想や倫理観の形成に大きな影響を及ぼした。精里の門下からは後に幕末の思想界に影響を与えた学者も輩出しており、実践を重んじるその教えは、昌平坂学問所を通じて幕末期の武士教育に長く受け継がれた。",
    bodyHtml:"古賀精里は、肥前佐賀藩の出身で、幕府が正学と定めた朱子学を厳格に講じたことで知られる江戸時代後期の儒学者である。若い頃は長崎で学び、後に大坂で私塾を開いて教えるなど各地で研鑽を積んだのち、1796年に幕府から招かれて江戸へ出た。松平定信が進めた寛政の改革の一環として、朱子学以外の学問を正式な学問所で教えることを禁じる「寛政異学の禁」が出されると、精里は柴野栗山・尾藤二洲とともに「寛政の三博士」と呼ばれ、幕府の学問所である昌平坂学問所で教授として教育にあたった。単なる知識の暗記ではなく、学んだ道理を日々の行いに生かす「実践」を重んじ、多くの門人を育てたことで、幕末に至るまでの武士の思想や倫理観の形成に大きな影響を及ぼした。精里の門下からは後に幕末の思想界に影響を与えた学者も輩出しており、実践を重んじるその教えは、昌平坂学問所を通じて幕末期の武士教育に長く受け継がれた。", source:"legacy", sourceId:"J62" },
  { id:"J63-01", personId:"J63", title:"この人の歩み", tags:["科学"],
    body:"宇田川榕菴は、津山藩医の家に生まれ、蘭学者の家系である宇田川家の養子となって蘭学を学んだ江戸時代後期の学者である。オランダの化学書を翻訳して「舎密開宗」を著す中で、それまで日本語になかった「酸素」「水素」「窒素」「炭素」「元素」といった専門用語を数多く考え出し、その多くは今日の理科の教科書でもそのまま使われている。この大著の完成までには10年近い歳月がかかり、榕菴自身は完結を見ることなく世を去った。植物学の分野でも「植学啓原」を著してリンネの分類法を日本に紹介するなど、幅広い西洋科学の知識を日本語として根づかせる困難な作業に取り組み続けた。オランダ語の概念を的確な日本語に置き換えたその功績は、幕末から明治にかけて花開く日本の近代科学の基礎を築いたものとして高く評価されている。榕菴が生み出した化学用語の多くは明治以降の教育制度にもそのまま採用され、日本の理科教育の土台を築いた功績として、今も高く評価され続けている。",
    bodyHtml:"宇田川榕菴は、津山藩医の家に生まれ、蘭学者の家系である宇田川家の養子となって蘭学を学んだ江戸時代後期の学者である。オランダの化学書を翻訳して「舎密開宗」を著す中で、それまで日本語になかった「酸素」「水素」「窒素」「炭素」「元素」といった専門用語を数多く考え出し、その多くは今日の理科の教科書でもそのまま使われている。この大著の完成までには10年近い歳月がかかり、榕菴自身は完結を見ることなく世を去った。植物学の分野でも「植学啓原」を著してリンネの分類法を日本に紹介するなど、幅広い西洋科学の知識を日本語として根づかせる困難な作業に取り組み続けた。オランダ語の概念を的確な日本語に置き換えたその功績は、幕末から明治にかけて花開く日本の近代科学の基礎を築いたものとして高く評価されている。榕菴が生み出した化学用語の多くは明治以降の教育制度にもそのまま採用され、日本の理科教育の土台を築いた功績として、今も高く評価され続けている。", source:"legacy", sourceId:"J63" },
  { id:"J64-01", personId:"J64", title:"この人の歩み", tags:["冒険"],
    body:"最上徳内は、出羽国(現在の山形県)の貧しい農家に生まれながら、江戸に出て本多利明の私塾で算学や天文・測量を学び、その実力を認められて幕府の蝦夷地探検隊に加わった人物である。1785年に初めて蝦夷地へ渡って以降、生涯で何度も北方へ足を運び、択捉島や得撫島など千島列島の奥深くまで踏査し、当地で活動するロシア人とも接触してその実情を報告している。極寒の地でアイヌの人々と交流しながら地理や生活の実情を丹念に調べ上げ、その記録は幕府が北方の国境を定めるうえで貴重な資料となった。身分の低い生まれでありながら、実力と探究心によって道を切り開き、後に幕臣に取り立てられたその生き方は、間宮林蔵など後進の北方探検家たちにも大きな影響を与えている。徳内が残した北方探検の記録は、後の間宮林蔵による樺太探検など、幕末に至るまでの北方領土調査の礎となり、身分を越えて活躍した人物として高く評価されている。",
    bodyHtml:"最上徳内は、出羽国(現在の山形県)の貧しい農家に生まれながら、江戸に出て本多利明の私塾で算学や天文・測量を学び、その実力を認められて幕府の蝦夷地探検隊に加わった人物である。1785年に初めて蝦夷地へ渡って以降、生涯で何度も北方へ足を運び、択捉島や得撫島など千島列島の奥深くまで踏査し、当地で活動するロシア人とも接触してその実情を報告している。極寒の地でアイヌの人々と交流しながら地理や生活の実情を丹念に調べ上げ、その記録は幕府が北方の国境を定めるうえで貴重な資料となった。身分の低い生まれでありながら、実力と探究心によって道を切り開き、後に幕臣に取り立てられたその生き方は、間宮林蔵など後進の北方探検家たちにも大きな影響を与えている。徳内が残した北方探検の記録は、後の間宮林蔵による樺太探検など、幕末に至るまでの北方領土調査の礎となり、身分を越えて活躍した人物として高く評価されている。", source:"legacy", sourceId:"J64" },
  { id:"J65-01", personId:"J65", title:"この人の歩み", tags:["医学"],
    body:"貝原益軒は、福岡藩に仕えた儒学者で、70歳を過ぎてから精力的に執筆活動を行い、多くの著作を後世に残した人物である。学問を助けた妻の東軒とともに藩内をくまなく歩いて調べ上げ、筑前国(現在の福岡県西部)の地理や歴史、産物を詳細に記録した「筑前国続風土記」を編纂するなど、地域研究の先駆けともいえる仕事も手がけた。中でも晩年の80代で著した「養生訓」は、腹八分目を心がけることや、心を穏やかに保つことの大切さなど、日々の暮らしに役立つ健康法をわかりやすくまとめたもので、現代でも通用する内容として読み継がれている。実際に見聞きしたことを重んじる実証的な姿勢を貫き、当時としては非常な長寿である84歳まで学問への情熱を失わなかったその生き方自体が、益軒の説いた養生の教えを体現するものだったといえる。益軒が説いたこの健康法は、単なる長寿の秘訣にとどまらず、心身のバランスを重んじる日本独自の養生思想として、現代の健康観にも通じるものがある。",
    bodyHtml:"貝原益軒は、福岡藩に仕えた儒学者で、70歳を過ぎてから精力的に執筆活動を行い、多くの著作を後世に残した人物である。学問を助けた妻の東軒とともに藩内をくまなく歩いて調べ上げ、筑前国(現在の福岡県西部)の地理や歴史、産物を詳細に記録した「筑前国続風土記」を編纂するなど、地域研究の先駆けともいえる仕事も手がけた。中でも晩年の80代で著した「養生訓」は、腹八分目を心がけることや、心を穏やかに保つことの大切さなど、日々の暮らしに役立つ健康法をわかりやすくまとめたもので、現代でも通用する内容として読み継がれている。実際に見聞きしたことを重んじる実証的な姿勢を貫き、当時としては非常な長寿である84歳まで学問への情熱を失わなかったその生き方自体が、益軒の説いた養生の教えを体現するものだったといえる。益軒が説いたこの健康法は、単なる長寿の秘訣にとどまらず、心身のバランスを重んじる日本独自の養生思想として、現代の健康観にも通じるものがある。", source:"legacy", sourceId:"J65" },
  { id:"J66-01", personId:"J66", title:"この人の歩み", tags:["医学"],
    body:"山脇東洋は、中国由来の医学書に記された内臓の形や配置が、実際の人体と食い違っているのではないかと疑問を抱いた京都の医者である。1754年、京都所司代の許可を得て、死刑となった罪人の遺体の解剖に立ち会い、日本の医学界で初めて公式に人体の内部を実際に観察する機会を得た。その結果、これまで信じられてきた五臓六腑の説と実際の臓器の形が大きく異なることを確認し、5年後にこの経験を「蔵志」としてまとめて発表した。実際に自分の目で確かめることを重んじたこの姿勢は大きな反響を呼び、1771年には杉田玄白らも江戸小塚原の刑場で同様の解剖に立ち会い、その正確さに驚いてオランダの解剖書の翻訳を決意したことから「解体新書」が生まれた。日本の近代医学発展の第一歩を切り開いた功績として、東洋の名は今も高く評価されている。",
    bodyHtml:"山脇東洋は、中国由来の医学書に記された内臓の形や配置が、実際の人体と食い違っているのではないかと疑問を抱いた京都の医者である。1754年、京都所司代の許可を得て、死刑となった罪人の遺体の解剖に立ち会い、日本の医学界で初めて公式に人体の内部を実際に観察する機会を得た。その結果、これまで信じられてきた五臓六腑の説と実際の臓器の形が大きく異なることを確認し、5年後にこの経験を「蔵志」としてまとめて発表した。実際に自分の目で確かめることを重んじたこの姿勢は大きな反響を呼び、1771年には杉田玄白らも江戸小塚原の刑場で同様の解剖に立ち会い、その正確さに驚いてオランダの解剖書の翻訳を決意したことから「解体新書」が生まれた。日本の近代医学発展の第一歩を切り開いた功績として、東洋の名は今も高く評価されている。", source:"legacy", sourceId:"J66" },
  { id:"J67-01", personId:"J67", title:"この人の歩み", tags:["冒険"],
    body:"近藤重蔵は、江戸幕府の役人として、最上徳内らとともに何度も蝦夷地(北海道)や択捉島の調査に赴いた人物である。1798年、ロシアの南下に備えて択捉島に渡ると、「大日本恵登呂府」と記した標柱を自ら建て、この島が日本の領土であることを内外に示した。厳しい自然環境や、いつロシア船と遭遇するかわからない緊張の中で、粘り強く地理や海域の調査を続け、国境に関する著作をまとめるなど、幕府が北方の方針を定めるための重要な資料を残している。学問にも通じ、多くの書物を集めた蔵書家としても知られたが、晩年は息子が起こした殺傷事件に連座して知行を没収され、近江へ蟄居させられるという不遇な最期を迎えた。それでも重蔵が命がけで残した北方探検の記録は、後世に高く評価されている。重蔵が択捉島に建てた標柱は、日本の北方領土に関する歴史的な根拠の一つとされ、不遇な晩年を送りながらも、その探検記録は後世に大きな価値を持ち続けている。",
    bodyHtml:"近藤重蔵は、江戸幕府の役人として、最上徳内らとともに何度も蝦夷地(北海道)や択捉島の調査に赴いた人物である。1798年、ロシアの南下に備えて択捉島に渡ると、「大日本恵登呂府」と記した標柱を自ら建て、この島が日本の領土であることを内外に示した。厳しい自然環境や、いつロシア船と遭遇するかわからない緊張の中で、粘り強く地理や海域の調査を続け、国境に関する著作をまとめるなど、幕府が北方の方針を定めるための重要な資料を残している。学問にも通じ、多くの書物を集めた蔵書家としても知られたが、晩年は息子が起こした殺傷事件に連座して知行を没収され、近江へ蟄居させられるという不遇な最期を迎えた。それでも重蔵が命がけで残した北方探検の記録は、後世に高く評価されている。重蔵が択捉島に建てた標柱は、日本の北方領土に関する歴史的な根拠の一つとされ、不遇な晩年を送りながらも、その探検記録は後世に大きな価値を持ち続けている。", source:"legacy", sourceId:"J67" },
  { id:"J68-01", personId:"J68", title:"この人の歩み", tags:["ビジネス"],
    body:"中野重右衛門は、江戸時代に活動したと伝えられる商人で、大名や豪商のように詳しい経歴が歴史書に残っているわけではなく、地域の言い伝えや家々の記録の中にその名をとどめている人物である。当時の商人にとって何よりも大切だったのは、目先の利益よりも取引相手からの信用であり、掛け売りや貸し借りが日常的だった江戸の商業社会では、約束を違えない誠実さこそが長く商売を続けるための基盤だった。中野重右衛門もそうした心構えを大切にし、地域の人々や取引先との信頼関係を築くことに力を注いだと伝えられている。近江商人の「三方よし」の精神に代表されるように、売り手と買い手だけでなく世間にとっても良い商売を目指す考え方は、江戸時代の各地の商人たちに広く共有されていた価値観であり、名も大きくは伝わらないこうした無数の商人たちの誠実な働きの積み重ねが、後の日本の商業道徳の形成を支えたとされる。",
    bodyHtml:"中野重右衛門は、江戸時代に活動したと伝えられる商人で、大名や豪商のように詳しい経歴が歴史書に残っているわけではなく、地域の言い伝えや家々の記録の中にその名をとどめている人物である。当時の商人にとって何よりも大切だったのは、目先の利益よりも取引相手からの信用であり、掛け売りや貸し借りが日常的だった江戸の商業社会では、約束を違えない誠実さこそが長く商売を続けるための基盤だった。中野重右衛門もそうした心構えを大切にし、地域の人々や取引先との信頼関係を築くことに力を注いだと伝えられている。近江商人の「三方よし」の精神に代表されるように、売り手と買い手だけでなく世間にとっても良い商売を目指す考え方は、江戸時代の各地の商人たちに広く共有されていた価値観であり、名も大きくは伝わらないこうした無数の商人たちの誠実な働きの積み重ねが、後の日本の商業道徳の形成を支えたとされる。", source:"legacy", sourceId:"J68" },
  { id:"J69-01", personId:"J69", title:"この人の歩み", tags:["政治"],
    body:"久坂玄瑞は、長州藩士として吉田松陰の松下村塾に学び、高杉晋作と並んで「松陰門下の双璧」と称されるほどの俊才だった。師である松陰の妹・文と結婚し、松陰の刑死後は塾生たちの中心となって尊王攘夷運動を主導し、1863年にイギリス公使館の建設予定地であった御殿山の建物を高杉晋作らと焼き討ちするなど、過激な行動も辞さなかった。同年、下関で外国船を砲撃するなど攘夷の実行を主張する急進派として活動したが、その強硬な姿勢は長州藩を孤立させる一因ともなった。翌1864年、勢力挽回を目指して藩兵とともに京都御所へ迫った禁門の変で、会津・薩摩を中心とする幕府側の軍勢に敗れ、深手を負った玄瑞は寺島忠三郎とともに自刃し、24歳という若さでその短い生涯を閉じた。久坂と高杉晋作の二人が松陰門下の双璧と称された逸話は、松下村塾が輩出した人材の厚みを物語るものとして、今も長州の維新史を語るうえで欠かせない存在である。",
    bodyHtml:"久坂玄瑞は、長州藩士として吉田松陰の松下村塾に学び、高杉晋作と並んで「松陰門下の双璧」と称されるほどの俊才だった。師である松陰の妹・文と結婚し、松陰の刑死後は塾生たちの中心となって尊王攘夷運動を主導し、1863年にイギリス公使館の建設予定地であった御殿山の建物を高杉晋作らと焼き討ちするなど、過激な行動も辞さなかった。同年、下関で外国船を砲撃するなど攘夷の実行を主張する急進派として活動したが、その強硬な姿勢は長州藩を孤立させる一因ともなった。翌1864年、勢力挽回を目指して藩兵とともに京都御所へ迫った禁門の変で、会津・薩摩を中心とする幕府側の軍勢に敗れ、深手を負った玄瑞は寺島忠三郎とともに自刃し、24歳という若さでその短い生涯を閉じた。久坂と高杉晋作の二人が松陰門下の双璧と称された逸話は、松下村塾が輩出した人材の厚みを物語るものとして、今も長州の維新史を語るうえで欠かせない存在である。", source:"legacy", sourceId:"J69" },
  { id:"J70-01", personId:"J70", title:"この人の歩み", tags:["政治"],
    body:"大久保利通は、薩摩藩の下級武士の家に生まれ、西郷隆盛とともに幕末の倒幕運動を主導し、明治維新を成し遂げた中心人物の一人である。1873年には自ら初代の内務卿となって中央集権的な行政機構を整え、殖産興業や富国強兵政策を強力に推し進めた。同じ年、朝鮮への強硬な外交を主張する「征韓論」をめぐっては、岩倉使節団で欧米を視察し国力の充実を優先すべきと考えていた利通が、かつての盟友であった西郷隆盛と正面から対立してこれを退け、敗れた西郷は政府を去ることとなった。1877年、西郷を担いだ士族が起こした西南戦争を鎮圧したものの、その翌年、利通自身も政府の政策に不満を抱く不平士族によって東京の紀尾井坂で暗殺され、47歳の生涯を閉じている。利通が推し進めた地租改正や殖産興業政策は、近代日本の国家財政と産業の基礎を築いたとされ、「維新の三傑」の一人として西郷隆盛、木戸孝允とともに高く評価されている。",
    bodyHtml:"大久保利通は、薩摩藩の下級武士の家に生まれ、西郷隆盛とともに幕末の倒幕運動を主導し、明治維新を成し遂げた中心人物の一人である。1873年には自ら初代の内務卿となって中央集権的な行政機構を整え、殖産興業や富国強兵政策を強力に推し進めた。同じ年、朝鮮への強硬な外交を主張する「征韓論」をめぐっては、岩倉使節団で欧米を視察し国力の充実を優先すべきと考えていた利通が、かつての盟友であった西郷隆盛と正面から対立してこれを退け、敗れた西郷は政府を去ることとなった。1877年、西郷を担いだ士族が起こした西南戦争を鎮圧したものの、その翌年、利通自身も政府の政策に不満を抱く不平士族によって東京の紀尾井坂で暗殺され、47歳の生涯を閉じている。利通が推し進めた地租改正や殖産興業政策は、近代日本の国家財政と産業の基礎を築いたとされ、「維新の三傑」の一人として西郷隆盛、木戸孝允とともに高く評価されている。", source:"legacy", sourceId:"J70" },
  { id:"J71-01", personId:"J71", title:"この人の歩み", tags:["政治"],
    body:"伊藤博文は、吉田松陰の松下村塾で学んだのち、1863年に藩の命に背いて井上馨ら仲間4人とともにひそかにイギリスへ渡り、「長州五傑」と呼ばれた留学生の一人として、ロンドンで西洋の圧倒的な国力を目の当たりにした。攘夷を続ける長州藩を思いとどまらせようと急いで帰国したが説得は間に合わず、下関で列強四か国艦隊との戦闘を招く結果となった。維新後は明治政府の中心人物として活躍し、ヨーロッパでの憲法調査をもとに、1889年発布の大日本帝国憲法の起草に中心となって取り組み、1885年に整えた内閣制度のもと日本初の内閣総理大臣に就任した。その後も含め通算4度にわたり首相を務め、議会政治や内閣制度など近代国家の骨格づくりに大きく貢献したが、1909年、満州のハルビン駅で朝鮮の独立運動家・安重根に暗殺され、68歳でその生涯を閉じている。",
    bodyHtml:"伊藤博文は、吉田松陰の松下村塾で学んだのち、1863年に藩の命に背いて井上馨ら仲間4人とともにひそかにイギリスへ渡り、「長州五傑」と呼ばれた留学生の一人として、ロンドンで西洋の圧倒的な国力を目の当たりにした。攘夷を続ける長州藩を思いとどまらせようと急いで帰国したが説得は間に合わず、下関で列強四か国艦隊との戦闘を招く結果となった。維新後は明治政府の中心人物として活躍し、ヨーロッパでの憲法調査をもとに、1889年発布の大日本帝国憲法の起草に中心となって取り組み、1885年に整えた内閣制度のもと日本初の内閣総理大臣に就任した。その後も含め通算4度にわたり首相を務め、議会政治や内閣制度など近代国家の骨格づくりに大きく貢献したが、1909年、満州のハルビン駅で朝鮮の独立運動家・安重根に暗殺され、68歳でその生涯を閉じている。", source:"legacy", sourceId:"J71" },
  { id:"J72-01", personId:"J72", title:"この人の歩み", tags:["政治"],
    body:"山県有朋は、吉田松陰の松下村塾に学んだのち、高杉晋作が組織した身分を問わず参加できる軍事組織「奇兵隊」で軍歴を積んだ長州藩士である。明治初年にヨーロッパへ渡って各国の軍制を視察し、帰国後は陸軍の創設に深く関わって、1873年には武士だけでなく国民全体から兵を集める徴兵制度の導入を主導し、「日本陸軍の父」とも呼ばれる。1882年には軍人が守るべき心得を示した軍人勅諭の制定に関わり、軍を政治から独立させる「統帥権」の考え方を重視した。内閣総理大臣を2度務めたほか、晩年には元老として長きにわたり政界に強い影響力を及ぼし続け、政党政治を重んじた伊藤博文に対し、山県は軍部や官僚を重視する立場を貫いたことでも知られている。山県が確立した軍の仕組みは、その後の日本の軍事体制に長く影響を及ぼし、政党政治を軸とする伊藤博文とは対照的な、官僚・軍部主導の国家運営を志向したことでも知られる。",
    bodyHtml:"山県有朋は、吉田松陰の松下村塾に学んだのち、高杉晋作が組織した身分を問わず参加できる軍事組織「奇兵隊」で軍歴を積んだ長州藩士である。明治初年にヨーロッパへ渡って各国の軍制を視察し、帰国後は陸軍の創設に深く関わって、1873年には武士だけでなく国民全体から兵を集める徴兵制度の導入を主導し、「日本陸軍の父」とも呼ばれる。1882年には軍人が守るべき心得を示した軍人勅諭の制定に関わり、軍を政治から独立させる「統帥権」の考え方を重視した。内閣総理大臣を2度務めたほか、晩年には元老として長きにわたり政界に強い影響力を及ぼし続け、政党政治を重んじた伊藤博文に対し、山県は軍部や官僚を重視する立場を貫いたことでも知られている。山県が確立した軍の仕組みは、その後の日本の軍事体制に長く影響を及ぼし、政党政治を軸とする伊藤博文とは対照的な、官僚・軍部主導の国家運営を志向したことでも知られる。", source:"legacy", sourceId:"J72" },
  { id:"J73-01", personId:"J73", title:"この人の歩み", tags:["政治"],
    body:"榎本武揚は、幕府がオランダに派遣した留学生として最新の航海術や国際法を学び、当時最新鋭の軍艦「開陽丸」とともに帰国して幕府海軍を率いる立場となった人物である。戊辰戦争で幕府が敗れると、榎本は艦隊を率いて北へ向かい、箱館(函館)の五稜郭に立てこもって、幹部たちの投票によって自らが総裁に選ばれた「蝦夷共和国」という政権を樹立し、新政府軍に激しく抵抗した。1869年に降伏して投獄されたが、その才能を惜しんだ黒田清隆らの働きかけによって助命され、後に新政府に登用されるという異例の道をたどる。1875年には全権公使としてロシアと交渉し、樺太を放棄する代わりに千島列島全島を日本領とする樺太・千島交換条約を締結するなど、外務大臣や逓信大臣、農商務大臣も歴任し、幕臣でありながら明治政府でも重要な役割を果たし続けた。",
    bodyHtml:"榎本武揚は、幕府がオランダに派遣した留学生として最新の航海術や国際法を学び、当時最新鋭の軍艦「開陽丸」とともに帰国して幕府海軍を率いる立場となった人物である。戊辰戦争で幕府が敗れると、榎本は艦隊を率いて北へ向かい、箱館(函館)の五稜郭に立てこもって、幹部たちの投票によって自らが総裁に選ばれた「蝦夷共和国」という政権を樹立し、新政府軍に激しく抵抗した。1869年に降伏して投獄されたが、その才能を惜しんだ黒田清隆らの働きかけによって助命され、後に新政府に登用されるという異例の道をたどる。1875年には全権公使としてロシアと交渉し、樺太を放棄する代わりに千島列島全島を日本領とする樺太・千島交換条約を締結するなど、外務大臣や逓信大臣、農商務大臣も歴任し、幕臣でありながら明治政府でも重要な役割を果たし続けた。", source:"legacy", sourceId:"J73" },
  { id:"J74-01", personId:"J74", title:"この人の歩み", tags:["政治"],
    body:"後藤象二郎は、土佐藩の上士として藩政に携わるなかで、坂本龍馬が唱えた「船中八策」の構想に共感し、政権を朝廷に返上させる「大政奉還」の実現に奔走した人物である。藩主・山内容堂を通じてこの案を将軍徳川慶喜に建白し、1867年、慶喜がついに政権返上を決断したことで、大きな内乱を経ずに江戸幕府は幕を閉じることとなった。維新後は新政府の要職を歴任したが、征韓論をめぐる政変で下野すると、1874年には板垣退助らとともに「民撰議院設立建白書」を政府に提出し、国民が選んだ議員による議会の開設を求める自由民権運動の口火を切った。その後も一時政府に戻るなど波乱に富んだ政治人生を歩んだが、武力ではなく話し合いによる変革を志向したその一貫した姿勢は、日本の近代化を比較的穏やかな形で進める一助となった。土佐藩出身の板垣退助とともに進めたこの運動は、後の帝国議会開設へとつながり、日本の議会制民主主義の出発点を築いた功績として記憶されている。",
    bodyHtml:"後藤象二郎は、土佐藩の上士として藩政に携わるなかで、坂本龍馬が唱えた「船中八策」の構想に共感し、政権を朝廷に返上させる「大政奉還」の実現に奔走した人物である。藩主・山内容堂を通じてこの案を将軍徳川慶喜に建白し、1867年、慶喜がついに政権返上を決断したことで、大きな内乱を経ずに江戸幕府は幕を閉じることとなった。維新後は新政府の要職を歴任したが、征韓論をめぐる政変で下野すると、1874年には板垣退助らとともに「民撰議院設立建白書」を政府に提出し、国民が選んだ議員による議会の開設を求める自由民権運動の口火を切った。その後も一時政府に戻るなど波乱に富んだ政治人生を歩んだが、武力ではなく話し合いによる変革を志向したその一貫した姿勢は、日本の近代化を比較的穏やかな形で進める一助となった。土佐藩出身の板垣退助とともに進めたこの運動は、後の帝国議会開設へとつながり、日本の議会制民主主義の出発点を築いた功績として記憶されている。", source:"legacy", sourceId:"J74" },
  { id:"J75-01", personId:"J75", title:"この人の歩み", tags:["政治"],
    body:"岩倉具視は、公家という身分にありながら、公武合体運動をめぐる対立から一時は洛北に蟄居させられるなど不遇の時期を過ごしたが、後には薩摩・長州と結んで倒幕への道筋をつけた人物である。1867年末、王政復古の大号令の発令に深く関わるなど、明治維新に至る重要な局面の多くに関わり、新政府では要職を占めた。1871年から1873年にかけては、不平等条約の改正交渉と欧米視察を目的とする「岩倉使節団」の全権大使として、大久保利通や伊藤博文ら政府首脳とともに1年10か月にわたりアメリカやヨーロッパ諸国を歴訪した。条約改正という当初の目的は果たせなかったものの、この視察で得た近代的な制度や技術に関する知識は、帰国後の政府首脳陣の考え方に大きな影響を与え、日本の近代化政策の方向性を決定づける重要な経験となった。1874年には反対派の襲撃を受けて負傷しながらも一命をとりとめている。",
    bodyHtml:"岩倉具視は、公家という身分にありながら、公武合体運動をめぐる対立から一時は洛北に蟄居させられるなど不遇の時期を過ごしたが、後には薩摩・長州と結んで倒幕への道筋をつけた人物である。1867年末、王政復古の大号令の発令に深く関わるなど、明治維新に至る重要な局面の多くに関わり、新政府では要職を占めた。1871年から1873年にかけては、不平等条約の改正交渉と欧米視察を目的とする「岩倉使節団」の全権大使として、大久保利通や伊藤博文ら政府首脳とともに1年10か月にわたりアメリカやヨーロッパ諸国を歴訪した。条約改正という当初の目的は果たせなかったものの、この視察で得た近代的な制度や技術に関する知識は、帰国後の政府首脳陣の考え方に大きな影響を与え、日本の近代化政策の方向性を決定づける重要な経験となった。1874年には反対派の襲撃を受けて負傷しながらも一命をとりとめている。", source:"legacy", sourceId:"J75" },
  { id:"J76-01", personId:"J76", title:"この人の歩み", tags:["ビジネス"],
    body:"前島密は、蘭学や英学を学んだ経験を生かして幕末から新政府の要職に登用され、江戸時代の飛脚に代わる近代的な郵便制度を1871年に創設した人物である。「郵便」「切手」「はがき」といった、今も使われている言葉を自ら考え出し、イギリスの郵便制度を参考に、身分や地域に関係なく誰もが同じ料金で全国どこへでも手紙を送れる均一料金制を整えた。それまで一部の飛脚問屋に頼っていた通信手段を国民全体に開かれたものへと変えたこの功績により「日本近代郵便の父」と称され、現在も1円切手の肖像として広く親しまれている。郵便貯金制度の導入にも尽力したほか、大隈重信を助けて東京専門学校(現在の早稲田大学)の設立に関わり、漢字を減らして誰もが読み書きしやすい言葉づかいを広めようとするなど、教育や言語の分野でも先進的な考えを持つ人物であった。",
    bodyHtml:"前島密は、蘭学や英学を学んだ経験を生かして幕末から新政府の要職に登用され、江戸時代の飛脚に代わる近代的な郵便制度を1871年に創設した人物である。「郵便」「切手」「はがき」といった、今も使われている言葉を自ら考え出し、イギリスの郵便制度を参考に、身分や地域に関係なく誰もが同じ料金で全国どこへでも手紙を送れる均一料金制を整えた。それまで一部の飛脚問屋に頼っていた通信手段を国民全体に開かれたものへと変えたこの功績により「日本近代郵便の父」と称され、現在も1円切手の肖像として広く親しまれている。郵便貯金制度の導入にも尽力したほか、大隈重信を助けて東京専門学校(現在の早稲田大学)の設立に関わり、漢字を減らして誰もが読み書きしやすい言葉づかいを広めようとするなど、教育や言語の分野でも先進的な考えを持つ人物であった。", source:"legacy", sourceId:"J76" },
  { id:"J77-01", personId:"J77", title:"この人の歩み", tags:["政治"],
    body:"河井継之助は、越後長岡藩(現在の新潟県)の家老として藩政改革を進め、藩の財政を立て直しながら軍備の近代化に力を注いだ人物である。戊辰戦争が迫る中、新政府軍にも旧幕府軍にも与しない「武装中立」の立場を模索し、小千谷での談判で新政府軍の軍監に和平を訴えたが、交渉は決裂してしまう。やむなく開戦に踏み切った継之助は、外国商人から当時日本国内にわずか3挺しかなかったとされるガトリング砲のうち2挺を買い入れるなど、小藩ながら最新鋭の装備で新政府軍を大いに苦しめた。しかし多勢に無勢で長岡城は二度落城し、継之助自身も足に重傷を負い、会津へ退く途中の只見(現在の福島県只見町)で42歳の生涯を閉じている。この生涯は後に司馬遼太郎の小説「峠」の題材ともなった。継之助が北越戦争で見せた徹底抗戦の姿勢は、今も長岡の地で「常在戦場」の精神として語り継がれ、司馬遼太郎の小説「峠」を通じて広く世に知られるようになった。",
    bodyHtml:"河井継之助は、越後長岡藩(現在の新潟県)の家老として藩政改革を進め、藩の財政を立て直しながら軍備の近代化に力を注いだ人物である。戊辰戦争が迫る中、新政府軍にも旧幕府軍にも与しない「武装中立」の立場を模索し、小千谷での談判で新政府軍の軍監に和平を訴えたが、交渉は決裂してしまう。やむなく開戦に踏み切った継之助は、外国商人から当時日本国内にわずか3挺しかなかったとされるガトリング砲のうち2挺を買い入れるなど、小藩ながら最新鋭の装備で新政府軍を大いに苦しめた。しかし多勢に無勢で長岡城は二度落城し、継之助自身も足に重傷を負い、会津へ退く途中の只見(現在の福島県只見町)で42歳の生涯を閉じている。この生涯は後に司馬遼太郎の小説「峠」の題材ともなった。継之助が北越戦争で見せた徹底抗戦の姿勢は、今も長岡の地で「常在戦場」の精神として語り継がれ、司馬遼太郎の小説「峠」を通じて広く世に知られるようになった。", source:"legacy", sourceId:"J77" },
  { id:"W09-01", personId:"W09", title:"この人の歩み", tags:["発明"],
    body:"ドイツの科学者オットー・フォン・ゲーリケは、三十年戦争で荒廃した故郷マクデブルクの復興に尽力し、市長を長く務めるかたわら、自ら真空ポンプを発明して「空っぽの空間である真空は本当に存在するのか」という当時の大論争に決着をつけようとした。1654年、二つの銅製の半球を組み合わせて中の空気を抜き取り、その左右にそれぞれ8頭ずつ、合計16頭の馬をつないで引っ張らせる実験を皇帝の前で公開したが、大気の圧力によって半球はびくともせず、人々を大いに驚かせた。この「マクデブルクの半球」の実験は、目に見えない空気の重さと圧力の強さを誰の目にも明らかな形で示した、科学史に残る劇的な実演として、今も理科の教科書で語り継がれている。実験に使われた本物の半球は現在もドイツの博物館に大切に保存されており、当時の人々を驚かせた熱気を今に伝える貴重な資料となっている。",
    bodyHtml:"ドイツの科学者オットー・フォン・ゲーリケは、三十年戦争で荒廃した故郷マクデブルクの復興に尽力し、市長を長く務めるかたわら、自ら真空ポンプを発明して「空っぽの空間である真空は本当に存在するのか」という当時の大論争に決着をつけようとした。1654年、二つの銅製の半球を組み合わせて中の空気を抜き取り、その左右にそれぞれ8頭ずつ、合計16頭の馬をつないで引っ張らせる実験を皇帝の前で公開したが、大気の圧力によって半球はびくともせず、人々を大いに驚かせた。この「マクデブルクの半球」の実験は、目に見えない空気の重さと圧力の強さを誰の目にも明らかな形で示した、科学史に残る劇的な実演として、今も理科の教科書で語り継がれている。実験に使われた本物の半球は現在もドイツの博物館に大切に保存されており、当時の人々を驚かせた熱気を今に伝える貴重な資料となっている。", source:"legacy", sourceId:"W09" },
  { id:"W10-01", personId:"W10", title:"この人の歩み", tags:["医学"],
    body:"イギリスの科学者トーマス・ヤングは、幼い頃から驚くべき語学の才能を見せ、2歳で文字を読み、十数の言語を操ったといわれ、医学を学んで医師として働くかたわら、光や色、視覚のしくみなど幅広い分野を研究した「最後の万能人」と呼ばれる人物である。1807年頃に行った実験では、光を二本の細いスリットに通すと、その先の壁に明暗のしま模様が現れることを示し、光が波としての性質を持つことを証明して、当時主流だった光の粒子説に一石を投じた。晩年にはナポレオンがエジプトから持ち帰ったロゼッタストーンの研究にも取り組み、古代エジプトの象形文字ヒエログリフの解読を大きく前進させるなど、物理学以外の分野でも大きな足跡を残した。弾性や材料の強さを表す「ヤング率」にも名を残し、ひとつの分野にとどまらない広い視野を持った、まさに万能人と呼ぶにふさわしい科学者だった。",
    bodyHtml:"イギリスの科学者トーマス・ヤングは、幼い頃から驚くべき語学の才能を見せ、2歳で文字を読み、十数の言語を操ったといわれ、医学を学んで医師として働くかたわら、光や色、視覚のしくみなど幅広い分野を研究した「最後の万能人」と呼ばれる人物である。1807年頃に行った実験では、光を二本の細いスリットに通すと、その先の壁に明暗のしま模様が現れることを示し、光が波としての性質を持つことを証明して、当時主流だった光の粒子説に一石を投じた。晩年にはナポレオンがエジプトから持ち帰ったロゼッタストーンの研究にも取り組み、古代エジプトの象形文字ヒエログリフの解読を大きく前進させるなど、物理学以外の分野でも大きな足跡を残した。弾性や材料の強さを表す「ヤング率」にも名を残し、ひとつの分野にとどまらない広い視野を持った、まさに万能人と呼ぶにふさわしい科学者だった。", source:"legacy", sourceId:"W10" },
  { id:"W11-01", personId:"W11", title:"この人の歩み", tags:["科学"],
    body:"イギリスの科学者ジョン・ドルトンは、貧しい織物職人の家庭に生まれ、12歳という若さで自ら学校を開いて教えるほど早熟で、質素な暮らしの中で気象観測を日課としながら独学で科学を学び続けた。空気や水などあらゆる物質は、それ以上分けることのできない「原子」という小さな粒からできており、原子の種類ごとに決まった重さを持つという「原子説」を1803年頃に提唱し、近代化学の基礎を築いた。また自分自身が色を見分けにくい体質であることに気づくと、自らの目を実験材料にしてその原因を調べる論文を発表し、この症状は今も彼の名にちなんで「ドルトニズム」と呼ばれている。生涯にわたり気象日記をつけ続けた、実直な研究者として知られる。20万件以上ともいわれる観測記録を欠かさず残し続けた粘り強さもまた、原子説という大発見を支えた確かな土台になっていたと考えられている。",
    bodyHtml:"イギリスの科学者ジョン・ドルトンは、貧しい織物職人の家庭に生まれ、12歳という若さで自ら学校を開いて教えるほど早熟で、質素な暮らしの中で気象観測を日課としながら独学で科学を学び続けた。空気や水などあらゆる物質は、それ以上分けることのできない「原子」という小さな粒からできており、原子の種類ごとに決まった重さを持つという「原子説」を1803年頃に提唱し、近代化学の基礎を築いた。また自分自身が色を見分けにくい体質であることに気づくと、自らの目を実験材料にしてその原因を調べる論文を発表し、この症状は今も彼の名にちなんで「ドルトニズム」と呼ばれている。生涯にわたり気象日記をつけ続けた、実直な研究者として知られる。20万件以上ともいわれる観測記録を欠かさず残し続けた粘り強さもまた、原子説という大発見を支えた確かな土台になっていたと考えられている。", source:"legacy", sourceId:"W11" },
  { id:"W12-01", personId:"W12", title:"この人の歩み", tags:["科学"],
    body:"イギリスの科学者ウィリアム・クルックスは、化学者として出発しながら物理学の実験にも情熱を注ぎ、ガラス管の中の空気を限界近くまで抜き取り、そこに高い電圧をかけて放電させる「クルックス管」を開発して、真空放電の研究を大きく前進させた。この装置の中では、陰極から不思議な光線が飛び出して蛍光を発する現象が観察され、これは後に電子の流れである「陰極線」であることが判明し、さらにレントゲンによるX線の発見にもつながる重要な実験道具となった。化学者としても優れた業績を残し、1861年には分光分析という手法を用いて新しい元素タリウムを発見している。晩年は心霊現象の研究にも熱心に取り組んだ、好奇心旺盛な科学者であった。長くイギリス化学会や王立協会の要職も務め、化学と物理学の垣根を越えて幅広く活躍した多才な人物として、後進の研究者からも厚く敬われた。",
    bodyHtml:"イギリスの科学者ウィリアム・クルックスは、化学者として出発しながら物理学の実験にも情熱を注ぎ、ガラス管の中の空気を限界近くまで抜き取り、そこに高い電圧をかけて放電させる「クルックス管」を開発して、真空放電の研究を大きく前進させた。この装置の中では、陰極から不思議な光線が飛び出して蛍光を発する現象が観察され、これは後に電子の流れである「陰極線」であることが判明し、さらにレントゲンによるX線の発見にもつながる重要な実験道具となった。化学者としても優れた業績を残し、1861年には分光分析という手法を用いて新しい元素タリウムを発見している。晩年は心霊現象の研究にも熱心に取り組んだ、好奇心旺盛な科学者であった。長くイギリス化学会や王立協会の要職も務め、化学と物理学の垣根を越えて幅広く活躍した多才な人物として、後進の研究者からも厚く敬われた。", source:"legacy", sourceId:"W12" },
  { id:"W15-01", personId:"W15", title:"この人の歩み", tags:["科学"],
    body:"薬剤師の見習いから化学の道に進んだドイツの化学者ヨハン・ヴォルフガング・デーベライナーは、19世紀初め、塩素・臭素・ヨウ素や、カルシウム・ストロンチウム・バリウムなど、性質のよく似た元素が三つずつの組になっていて、真ん中の元素の性質や重さが残り二つのちょうど中間になっていることに気づき、これを「三つ組元素（トリアーデ）」と名付けて1829年に発表した。当時はまだ知られている元素の数も少なく、この規則性がなぜ生まれるのかを説明することはできなかったが、元素の世界に何らかの隠れた秩序があることを示した先駆的な発見であり、後にメンデレーエフが元素の周期表を作り上げる際の重要な手がかりの一つとなった。地味な発見に見えるが、雑然と見えた元素の世界に規則性が隠れているという発想そのものが、後の化学の発展にとって、静かながらも確かな大きな一歩となったのである。",
    bodyHtml:"薬剤師の見習いから化学の道に進んだドイツの化学者ヨハン・ヴォルフガング・デーベライナーは、19世紀初め、塩素・臭素・ヨウ素や、カルシウム・ストロンチウム・バリウムなど、性質のよく似た元素が三つずつの組になっていて、真ん中の元素の性質や重さが残り二つのちょうど中間になっていることに気づき、これを「三つ組元素（トリアーデ）」と名付けて1829年に発表した。当時はまだ知られている元素の数も少なく、この規則性がなぜ生まれるのかを説明することはできなかったが、元素の世界に何らかの隠れた秩序があることを示した先駆的な発見であり、後にメンデレーエフが元素の周期表を作り上げる際の重要な手がかりの一つとなった。地味な発見に見えるが、雑然と見えた元素の世界に規則性が隠れているという発想そのものが、後の化学の発展にとって、静かながらも確かな大きな一歩となったのである。", source:"legacy", sourceId:"W15" },
  { id:"W16-01", personId:"W16", title:"この人の歩み", tags:["科学"],
    body:"ドイツの化学者フリッツ・ハーバーは、空気中に大量に存在しながらそのままでは肥料に使えない窒素と水素を高い圧力と温度のもとで反応させ、化学肥料の原料となるアンモニアを人工的に合成する方法を1909年に開発した。この技術は後にボッシュによって工業化され「ハーバー・ボッシュ法」と呼ばれ、世界中の農地で大量の化学肥料が使えるようになったことで、食料生産が飛躍的に増加し、多くの人々の命を飢えから救ったといわれ、この功績で1918年にノーベル化学賞を受賞した。しかし第一次世界大戦が始まると、自ら毒ガス兵器の開発と使用の指揮をとり、戦場で多くの命を奪う結果を招いたことから、功績と罪の両面を持つ科学者として今も評価が分かれている。彼が確立した空気からアンモニアを作る技術は、今日世界中の人々の食卓を支える化学肥料の生産に欠かせないものとなり続けている。",
    bodyHtml:"ドイツの化学者フリッツ・ハーバーは、空気中に大量に存在しながらそのままでは肥料に使えない窒素と水素を高い圧力と温度のもとで反応させ、化学肥料の原料となるアンモニアを人工的に合成する方法を1909年に開発した。この技術は後にボッシュによって工業化され「ハーバー・ボッシュ法」と呼ばれ、世界中の農地で大量の化学肥料が使えるようになったことで、食料生産が飛躍的に増加し、多くの人々の命を飢えから救ったといわれ、この功績で1918年にノーベル化学賞を受賞した。しかし第一次世界大戦が始まると、自ら毒ガス兵器の開発と使用の指揮をとり、戦場で多くの命を奪う結果を招いたことから、功績と罪の両面を持つ科学者として今も評価が分かれている。彼が確立した空気からアンモニアを作る技術は、今日世界中の人々の食卓を支える化学肥料の生産に欠かせないものとなり続けている。", source:"legacy", sourceId:"W16" },
  { id:"W17-01", personId:"W17", title:"この人の歩み", tags:["科学"],
    body:"アメリカの化学者ライナス・ポーリングは、原子や分子のふるまいを説明する量子力学の考え方を化学結合の研究に応用し、なぜ物質同士が結びつくのかを理論的に解き明かす「量子化学」という新しい分野を切り開き、たんぱく質の構造研究にも道を開いた功績で、1954年にノーベル化学賞を単独で受賞した。しかしその後、水素爆弾の実験による放射性降下物の危険性を訴え、世界中の科学者とともに核兵器の廃絶を求める署名運動の先頭に立つなど、平和運動にも情熱を注ぐようになる。この活動が評価され、1962年に二度目となるノーベル平和賞を受賞し、分野の異なる二つのノーベル賞を単独で受けた史上数少ない人物となった。晩年はビタミンCの効能を熱心に説いたことでも知られている。異なる分野を単独で受賞した二つのノーベル賞は今も「二冠」として語り継がれ、科学と平和の両方を追い求めた生き方を象徴している。",
    bodyHtml:"アメリカの化学者ライナス・ポーリングは、原子や分子のふるまいを説明する量子力学の考え方を化学結合の研究に応用し、なぜ物質同士が結びつくのかを理論的に解き明かす「量子化学」という新しい分野を切り開き、たんぱく質の構造研究にも道を開いた功績で、1954年にノーベル化学賞を単独で受賞した。しかしその後、水素爆弾の実験による放射性降下物の危険性を訴え、世界中の科学者とともに核兵器の廃絶を求める署名運動の先頭に立つなど、平和運動にも情熱を注ぐようになる。この活動が評価され、1962年に二度目となるノーベル平和賞を受賞し、分野の異なる二つのノーベル賞を単独で受けた史上数少ない人物となった。晩年はビタミンCの効能を熱心に説いたことでも知られている。異なる分野を単独で受賞した二つのノーベル賞は今も「二冠」として語り継がれ、科学と平和の両方を追い求めた生き方を象徴している。", source:"legacy", sourceId:"W17" },
  { id:"W18-01", personId:"W18", title:"この人の歩み", tags:["科学"],
    body:"イタリアの物理学者アレッサンドロ・ボルタは、友人でもあった解剖学者ガルヴァーニがカエルの脚が電気で痙攣する現象を「動物電気」と説明したことに疑問を持ち、実験を重ねた末、電気は金属同士の接触によって生まれることを突き止めた。1800年、亜鉛と銅の円盤を塩水に浸した布とともに積み重ねる「ボルタの電堆」を発明し、世界で初めて持続的な電流を人工的に作り出すことに成功した。この電堆を携えてパリに赴き、当時の最高権力者ナポレオンの前で実演を行うと、その功績をたたえられ、後に伯爵の称号を授けられたと伝えられる。この発明はその後の電気化学や電磁気学の研究を大きく前進させ、1881年には電圧の単位「ボルト」が彼の名にちなんで正式に定められた。それ以前の1776年には湖の沼地から発生する気体を採取してメタン（沼気）の性質を明らかにするなど、若い頃から気体の研究でも先駆的な業績を残しており、パヴィア大学の物理学教授として生涯にわたり実験を重ねた人物であった。",
    bodyHtml:"イタリアの物理学者アレッサンドロ・ボルタは、友人でもあった解剖学者ガルヴァーニがカエルの脚が電気で痙攣する現象を「動物電気」と説明したことに疑問を持ち、実験を重ねた末、電気は金属同士の接触によって生まれることを突き止めた。1800年、亜鉛と銅の円盤を塩水に浸した布とともに積み重ねる「ボルタの電堆」を発明し、世界で初めて持続的な電流を人工的に作り出すことに成功した。この電堆を携えてパリに赴き、当時の最高権力者ナポレオンの前で実演を行うと、その功績をたたえられ、後に伯爵の称号を授けられたと伝えられる。この発明はその後の電気化学や電磁気学の研究を大きく前進させ、1881年には電圧の単位「ボルト」が彼の名にちなんで正式に定められた。それ以前の1776年には湖の沼地から発生する気体を採取してメタン（沼気）の性質を明らかにするなど、若い頃から気体の研究でも先駆的な業績を残しており、パヴィア大学の物理学教授として生涯にわたり実験を重ねた人物であった。", source:"legacy", sourceId:"W18" },
  { id:"W19-01", personId:"W19", title:"この人の歩み", tags:["科学"],
    body:"イギリスの化学者ハンフリー・デービーは、若い頃に気体の実験を重ねる中で笑気（亜酸化窒素）に痛みを和らげる作用があることを見出し、一躍注目を集めた。1807年には強力な電池を用いた電気分解によってカリウムとナトリウムを、翌1808年にはカルシウムやマグネシウムなど次々と新元素を単離し、当時の化学界を驚かせた。1815年には、坑内に漂うメタンガスに火が引火して起こる爆発事故を防ぐため、金網で炎を包み込む安全な「デービーランプ」を発明し、多くの炭鉱労働者の命を救った。この発明の特許を取らず、広く社会に役立てたことでも知られる。また助手として雇ったマイケル・ファラデーを見出し、後の偉大な物理学者を育てたことでも名を残している。自らの体で様々な気体を試す危険な実験を繰り返した代償として、生涯にわたり体調を崩したとも言われるが、その探究心は衰えず、後にはイギリス王立協会の会長も務め、科学界全体を導く存在となった。",
    bodyHtml:"イギリスの化学者ハンフリー・デービーは、若い頃に気体の実験を重ねる中で笑気（亜酸化窒素）に痛みを和らげる作用があることを見出し、一躍注目を集めた。1807年には強力な電池を用いた電気分解によってカリウムとナトリウムを、翌1808年にはカルシウムやマグネシウムなど次々と新元素を単離し、当時の化学界を驚かせた。1815年には、坑内に漂うメタンガスに火が引火して起こる爆発事故を防ぐため、金網で炎を包み込む安全な「デービーランプ」を発明し、多くの炭鉱労働者の命を救った。この発明の特許を取らず、広く社会に役立てたことでも知られる。また助手として雇ったマイケル・ファラデーを見出し、後の偉大な物理学者を育てたことでも名を残している。自らの体で様々な気体を試す危険な実験を繰り返した代償として、生涯にわたり体調を崩したとも言われるが、その探究心は衰えず、後にはイギリス王立協会の会長も務め、科学界全体を導く存在となった。", source:"legacy", sourceId:"W19" },
  { id:"W20-01", personId:"W20", title:"この人の歩み", tags:["科学"],
    body:"フランスの博物学者ジャン=バティスト・ラマルクは、もともと軍人や銀行員として働いた後に植物学の道へ進み、後半生をパリの自然史博物館で無脊椎動物の研究に捧げた。1809年に発表した著書「動物哲学」の中で、生物はよく使う器官が発達し使わない器官は衰える「用不用説」を唱え、その変化が子孫に受け継がれることで生物が徐々に姿を変えていくと考えた。ダーウィンより半世紀も早く生物進化の考え方を示した先駆者であったが、当時は正しく評価されず、貧困のうちに視力まで失いながら、娘に口述筆記させて研究を続けたと伝えられる。生前は不遇であったものの、その業績は後の進化論研究の重要な土台の一つとなった。また植物の分類に関する著書「フランス植物誌」を若くして出版して名を上げ、後年は無脊椎動物という言葉を広めるなど、生物を体系的に分類する研究にも大きく貢献した博物学者であった。",
    bodyHtml:"フランスの博物学者ジャン=バティスト・ラマルクは、もともと軍人や銀行員として働いた後に植物学の道へ進み、後半生をパリの自然史博物館で無脊椎動物の研究に捧げた。1809年に発表した著書「動物哲学」の中で、生物はよく使う器官が発達し使わない器官は衰える「用不用説」を唱え、その変化が子孫に受け継がれることで生物が徐々に姿を変えていくと考えた。ダーウィンより半世紀も早く生物進化の考え方を示した先駆者であったが、当時は正しく評価されず、貧困のうちに視力まで失いながら、娘に口述筆記させて研究を続けたと伝えられる。生前は不遇であったものの、その業績は後の進化論研究の重要な土台の一つとなった。また植物の分類に関する著書「フランス植物誌」を若くして出版して名を上げ、後年は無脊椎動物という言葉を広めるなど、生物を体系的に分類する研究にも大きく貢献した博物学者であった。", source:"legacy", sourceId:"W20" },
  { id:"064-02", personId:"064", title:"もうひとつのエピソード", tags:["医学"],
    body:"イギリスの看護師フローレンス・ナイチンゲールは、1854年に始まったクリミア戦争に従軍し、劣悪な衛生環境に置かれた野戦病院で兵士たちの看病にあたった。夜どおしランプを手に病室を見回ったことから「クリミアの天使」「ランプを持つ貴婦人」と呼ばれ、負傷兵たちの心の支えとなった。彼女は病気の原因を数字で示すため、死因ごとの割合を花びらのような図で表す独自のグラフを考案し、衛生状態を改善することで死亡率を劇的に下げられることを説得力をもって示した。この功績によりイギリス王立統計協会の女性初の会員に選ばれている。1860年にはロンドンに看護学校を設立し、看護を経験だけに頼るものから科学的な学問へと押し上げた、近代看護の母である。1859年に著した「看護覚え書」は、清潔な環境や新鮮な空気の大切さを説く実践的な内容で、出版から160年以上たった今も世界中の看護師に読み継がれている一冊となっている。",
    bodyHtml:"イギリスの看護師フローレンス・ナイチンゲールは、1854年に始まったクリミア戦争に従軍し、劣悪な衛生環境に置かれた野戦病院で兵士たちの看病にあたった。夜どおしランプを手に病室を見回ったことから「クリミアの天使」「ランプを持つ貴婦人」と呼ばれ、負傷兵たちの心の支えとなった。彼女は病気の原因を数字で示すため、死因ごとの割合を花びらのような図で表す独自のグラフを考案し、衛生状態を改善することで死亡率を劇的に下げられることを説得力をもって示した。この功績によりイギリス王立統計協会の女性初の会員に選ばれている。1860年にはロンドンに看護学校を設立し、看護を経験だけに頼るものから科学的な学問へと押し上げた、近代看護の母である。1859年に著した「看護覚え書」は、清潔な環境や新鮮な空気の大切さを説く実践的な内容で、出版から160年以上たった今も世界中の看護師に読み継がれている一冊となっている。", source:"legacy", sourceId:"W22" },
  { id:"W23-01", personId:"W23", title:"この人の歩み", tags:["医学"],
    body:"オーストリアの解剖学者ヨーゼフ・ヒルトルは、ウィーン大学で長く教壇に立ち、精密で分かりやすい人体解剖の教科書「人体解剖学教本」を著して、19世紀のヨーロッパで最も広く読まれた医学書の一つとした。血管に薬品を注入して立体的に浮かび上がらせる標本作りの名人としても知られ、その美しく精巧な標本は各地の博物館に今も保存されている。歯に衣着せぬ機知に富んだ語り口の講義は評判を呼び、公開の解剖講義には医学生だけでなく一般の市民までもが詰めかけたという。人間の骨格や頭蓋骨を数多く収集し、比較解剖の研究にも力を注いだ。その丁寧な仕事ぶりと情熱は、後進の医学生たちに人体の精妙なしくみを伝える大きな力となった。彼の著した教科書は英語をはじめ複数の言語に翻訳されて世界各地の医学校で用いられ、84年という長い生涯を通じて、解剖学という学問の面白さを社会に広く伝え続けた教育者でもあった。",
    bodyHtml:"オーストリアの解剖学者ヨーゼフ・ヒルトルは、ウィーン大学で長く教壇に立ち、精密で分かりやすい人体解剖の教科書「人体解剖学教本」を著して、19世紀のヨーロッパで最も広く読まれた医学書の一つとした。血管に薬品を注入して立体的に浮かび上がらせる標本作りの名人としても知られ、その美しく精巧な標本は各地の博物館に今も保存されている。歯に衣着せぬ機知に富んだ語り口の講義は評判を呼び、公開の解剖講義には医学生だけでなく一般の市民までもが詰めかけたという。人間の骨格や頭蓋骨を数多く収集し、比較解剖の研究にも力を注いだ。その丁寧な仕事ぶりと情熱は、後進の医学生たちに人体の精妙なしくみを伝える大きな力となった。彼の著した教科書は英語をはじめ複数の言語に翻訳されて世界各地の医学校で用いられ、84年という長い生涯を通じて、解剖学という学問の面白さを社会に広く伝え続けた教育者でもあった。", source:"legacy", sourceId:"W23" },
  { id:"W25-01", personId:"W25", title:"この人の歩み", tags:["科学"],
    body:"アメリカの遺伝学者フランシス・コリンズは、嚢胞性線維症の原因となる遺伝子を発見するなど、病気に関わる遺伝子の特定で早くから頭角を現した研究者である。国際チームを率いた「ヒトゲノム計画」では、人間が持つ約30億対もの遺伝暗号の解読という壮大な事業に挑み、2000年に概要版、2003年に完全版を発表して世界を驚かせた。2009年から12年間にわたりアメリカ国立衛生研究所の所長を務め、新型コロナウイルスへの対応など、国の医学研究の舵取りも担った。敬虔なキリスト教徒でもあり、著書『神の言語』の中で科学と信仰は対立しないと論じるなど、遺伝子研究がもたらす倫理的な課題についても積極的に発言を続けている。研究者としての顔だけでなく、大型バイクを愛し、自らギターを弾いて歌うことを趣味とする一面も持ち合わせており、堅い研究者のイメージにとどまらない親しみやすい人柄でも知られている。",
    bodyHtml:"アメリカの遺伝学者フランシス・コリンズは、嚢胞性線維症の原因となる遺伝子を発見するなど、病気に関わる遺伝子の特定で早くから頭角を現した研究者である。国際チームを率いた「ヒトゲノム計画」では、人間が持つ約30億対もの遺伝暗号の解読という壮大な事業に挑み、2000年に概要版、2003年に完全版を発表して世界を驚かせた。2009年から12年間にわたりアメリカ国立衛生研究所の所長を務め、新型コロナウイルスへの対応など、国の医学研究の舵取りも担った。敬虔なキリスト教徒でもあり、著書『神の言語』の中で科学と信仰は対立しないと論じるなど、遺伝子研究がもたらす倫理的な課題についても積極的に発言を続けている。研究者としての顔だけでなく、大型バイクを愛し、自らギターを弾いて歌うことを趣味とする一面も持ち合わせており、堅い研究者のイメージにとどまらない親しみやすい人柄でも知られている。", source:"legacy", sourceId:"W25" },
  { id:"W27-01", personId:"W27", title:"この人の歩み", tags:["科学"],
    body:"アメリカの遺伝学者バーバラ・マクリントックは、トウモロコシの粒に現れる複雑な色の模様に着目し、長年にわたり地道な観察と交配実験を積み重ねた。その結果、遺伝子は染色体上の決まった位置にじっと留まっているものではなく、位置を変えて移動することがあるという「動く遺伝子（トランスポゾン）」の存在を1940年代から50年代にかけて突き止めた。あまりに常識を覆す発見だったため、発表当初は周囲の科学者からほとんど理解されず、長い間評価されないまま研究を続けねばならなかった。しかし分子生物学の発展とともにその重要性が次第に認められ、1983年、81歳のときに単独でノーベル生理学・医学賞を受賞し、生涯をかけた地道な観察の価値が世界に証明された。生涯結婚することなく、長年にわたりニューヨーク州コールドスプリングハーバー研究所の畑でトウモロコシと向き合い続けた、忍耐強い研究者としても知られている。",
    bodyHtml:"アメリカの遺伝学者バーバラ・マクリントックは、トウモロコシの粒に現れる複雑な色の模様に着目し、長年にわたり地道な観察と交配実験を積み重ねた。その結果、遺伝子は染色体上の決まった位置にじっと留まっているものではなく、位置を変えて移動することがあるという「動く遺伝子（トランスポゾン）」の存在を1940年代から50年代にかけて突き止めた。あまりに常識を覆す発見だったため、発表当初は周囲の科学者からほとんど理解されず、長い間評価されないまま研究を続けねばならなかった。しかし分子生物学の発展とともにその重要性が次第に認められ、1983年、81歳のときに単独でノーベル生理学・医学賞を受賞し、生涯をかけた地道な観察の価値が世界に証明された。生涯結婚することなく、長年にわたりニューヨーク州コールドスプリングハーバー研究所の畑でトウモロコシと向き合い続けた、忍耐強い研究者としても知られている。", source:"legacy", sourceId:"W27" },
  { id:"W28-01", personId:"W28", title:"この人の歩み", tags:["科学"],
    body:"イギリスの科学者ロザリンド・フランクリンは、ロンドンのキングス・カレッジでX線をDNAの繊維に当てて回折像を撮影する技術を磨き、1952年、助手のゴズリングとともに「写真51番」と呼ばれるDNAの姿を写し出す決定的な写真を撮影した。この写真は、DNAが規則正しい「らせん構造」をしていることを示す重要な手がかりであり、彼女に無断で見せられたこの写真をもとに、ワトソンとクリックが1953年にDNAの二重らせん構造のモデルを発表した。フランクリン自身はその後大学を移り、タバコモザイクウイルスなどの構造研究でも成果を上げたが、1958年に37歳の若さで卵巣がんのため亡くなり、1962年にワトソンらへ贈られたノーベル賞を受け取ることはなかった。近年になってその貢献の大きさが広く再評価されている。「写真51番」の名は、実験ノートの51枚目の写真であったことに由来しており、地道な実験の積み重ねが、生命の設計図の姿を人類に初めて示す一枚を生んだことになる。",
    bodyHtml:"イギリスの科学者ロザリンド・フランクリンは、ロンドンのキングス・カレッジでX線をDNAの繊維に当てて回折像を撮影する技術を磨き、1952年、助手のゴズリングとともに「写真51番」と呼ばれるDNAの姿を写し出す決定的な写真を撮影した。この写真は、DNAが規則正しい「らせん構造」をしていることを示す重要な手がかりであり、彼女に無断で見せられたこの写真をもとに、ワトソンとクリックが1953年にDNAの二重らせん構造のモデルを発表した。フランクリン自身はその後大学を移り、タバコモザイクウイルスなどの構造研究でも成果を上げたが、1958年に37歳の若さで卵巣がんのため亡くなり、1962年にワトソンらへ贈られたノーベル賞を受け取ることはなかった。近年になってその貢献の大きさが広く再評価されている。「写真51番」の名は、実験ノートの51枚目の写真であったことに由来しており、地道な実験の積み重ねが、生命の設計図の姿を人類に初めて示す一枚を生んだことになる。", source:"legacy", sourceId:"W28" },
  { id:"W29-01", personId:"W29", title:"この人の歩み", tags:["医学"],
    body:"ドイツの医師ロベルト・コッホは、田舎町の開業医をしながら独自に研究を続け、1876年、炭疽という家畜の病気が特定の細菌によって引き起こされることを世界で初めて実験で証明した。続いて1882年に結核菌、1883年にはコレラ菌を発見し、目に見えない微生物が病気の原因であることを次々と明らかにしたことから「近代細菌学の父」と呼ばれる。寒天を用いた培地で細菌だけを純粋に培養する技術を確立し、ある微生物が特定の病気の原因であると証明するための厳密な手順「コッホの原則」をまとめ上げた。この考え方はその後の感染症研究の土台となり、1905年には結核に関する一連の発見によりノーベル生理学・医学賞を受賞した。細菌を染色して顕微鏡で見やすくする染色法の改良にも取り組み、晩年はアフリカにも渡って眠り病などの感染症研究にも力を注いだ。彼の名を冠したロベルト・コッホ研究所は、現在もドイツの感染症対策の中心機関として活動を続けている。",
