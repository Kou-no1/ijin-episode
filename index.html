    bodyHtml:"ヘレン・ケラーは、生後まもない病気がもとで、目も見えず、耳も聞こえず、話すこともできなくなりました。何も伝えられないもどかしさから、幼いころは物にあたって暴れることもあったといいます。7歳のとき、家庭教師のサリバン先生と出会い、井戸水に触れながら「water(ウォーター)」という言葉と、水という感覚がつながった瞬間、ヘレンの世界は大きく変わりました。この出会いをきっかけに、ヘレンは生涯にわたってサリバン先生とともに歩み続けました。そこから指文字や点字を覚え、大学にも進学して、世界で初めて大学を卒業した\u003cruby>盲ろう者\u003crt>もうろうしゃ\u003c/rt>\u003c/ruby>になります。その後は世界中を旅して、体の不自由な人たちの教育や福祉のために力をつくしました。三重の障がいを乗り越えたヘレンの生き方は、今も多くの人に希望を与えています。" },
  { id:"069-01", personId:"069", title:"小さな積み重ねで世界記録を打ち立てた打者", tags:["努力","継続","スポーツ"],
    body:"イチローは、幼いころから毎日、父とキャッチボールやバッティング練習にはげみました。小学校の卒業文集には「365日のうち360日は激しい練習をしています」と書くほど、練習の虫だったといいます。プロ野球選手になったあとも、素振りやストレッチなどの基礎練習を一日も欠かさず続けました。日本での活躍のあと、アメリカのメジャーリーグに挑戦し、シーズン最多安打記録を打ち立てるなど数々の記録を作ります。日米通算では4000本近い安打を記録し、2025年にはアメリカの野球殿堂入りを果たしました。「小さなことを積み重ねることが、とんでもないところへ行くただ一つの道」と語ったように、派手な一発ではなく、地道な積み重ねを大切にする姿勢が、数え切れないほどの安打につながりました。",
    bodyHtml:"イチローは、幼いころから毎日、父とキャッチボールやバッティング練習にはげみました。小学校の卒業文集には「365日のうち360日は激しい練習をしています」と書くほど、練習の虫だったといいます。プロ野球選手になったあとも、素振りやストレッチなどの基礎練習を一日も欠かさず続けました。日本での活躍のあと、アメリカのメジャーリーグに挑戦し、シーズン最多安打記録を打ち立てるなど数々の記録を作ります。日米通算では4000本近い安打を記録し、2025年にはアメリカの野球\u003cruby>殿堂\u003crt>でんどう\u003c/rt>\u003c/ruby>入りを果たしました。「小さなことを積み重ねることが、とんでもないところへ行くただ一つの道」と語ったように、派手な一発ではなく、地道な積み重ねを大切にする姿勢が、数え切れないほどの安打につながりました。" },
  { id:"002-01", personId:"002", title:"世界初の純粋培養に成功した「日本細菌学の父」", tags:["研究","医学","師弟愛"],
    body:"北里柴三郎は、肥後国（今の熊本県）の名主の家に生まれました。医学を志してドイツに留学し、細菌学の権威コッホのもとで学ぶと、それまで誰も成功していなかった破傷風菌だけを取り出して培養する「純粋培養」に世界で初めて成功します。さらに、この技術を応用して、破傷風とジフテリアの血清療法を確立し、多くの人の命を救いました。帰国後は伝染病研究所を設立し、後進の育成にも力を注ぎます。研究所では若き日の野口英世を指導したことでも知られています。「研究は世の中の役に立ってこそ意味がある」という考えを貫き、「日本の細菌学の父」と呼ばれる北里は、2024年から新しい千円札の顔にもなりました。",
    bodyHtml:"北里柴三郎は、\u003cruby>肥後国\u003crt>ひごのくに\u003c/rt>\u003c/ruby>（今の熊本県）の名主の家に生まれました。医学を志してドイツに留学し、細菌学の権威コッホのもとで学ぶと、それまで誰も成功していなかった\u003cruby>破傷風菌\u003crt>はしょうふうきん\u003c/rt>\u003c/ruby>だけを取り出して培養する「\u003cruby>純粋培養\u003crt>じゅんすいばいよう\u003c/rt>\u003c/ruby>」に世界で初めて成功します。さらに、この技術を応用して、破傷風とジフテリアの\u003cruby>血清療法\u003crt>けっせいりょうほう\u003c/rt>\u003c/ruby>を確立し、多くの人の命を救いました。帰国後は伝染病研究所を設立し、後進の育成にも力を注ぎます。研究所では若き日の野口英世を指導したことでも知られています。「研究は世の中の役に立ってこそ意味がある」という考えを貫き、「日本の細菌学の父」と呼ばれる北里は、2024年から新しい千円札の顔にもなりました。" },
  { id:"003-01", personId:"003", title:"赤痢菌を発見した細菌学者", tags:["努力","医学","忍耐"],
    body:"志賀潔は、仙台に生まれ、帝国大学を卒業したのち、北里柴三郎が所長を務める伝染病研究所に入りました。当時、赤痢という感染症は原因がわからず、多くの人の命を奪っていました。志賀は入院患者から採取した検体を根気強く調べ続け、1897年、ついに赤痢を引き起こす細菌を発見します。この細菌は、発見者にちなんで「志賀赤痢菌」と名づけられました。この研究所では、のちに黄熱病の研究で知られる野口英世とも机を並べて学んでいます。その後ドイツに渡り、免疫学者エールリヒのもとでさらに研究を重ねました。「なにごとも、まじめに、しんぼう強く、元気よくやりとおせば、きっとりっぱな仕事をなしとげることができる」という言葉を、故郷の子どもたちに書き残しています。",
    bodyHtml:"志賀潔は、仙台に生まれ、帝国大学を卒業したのち、北里柴三郎が所長を務める伝染病研究所に入りました。当時、\u003cruby>赤痢\u003crt>せきり\u003c/rt>\u003c/ruby>という感染症は原因がわからず、多くの人の命を奪っていました。志賀は入院患者から採取した検体を根気強く調べ続け、1897年、ついに赤痢を引き起こす細菌を発見します。この細菌は、発見者にちなんで「志賀赤痢菌」と名づけられました。この研究所では、のちに黄熱病の研究で知られる野口英世とも机を並べて学んでいます。その後ドイツに渡り、\u003cruby>免疫学者\u003crt>めんえきがくしゃ\u003c/rt>\u003c/ruby>エールリヒのもとでさらに研究を重ねました。「なにごとも、まじめに、しんぼう強く、元気よくやりとおせば、きっとりっぱな仕事をなしとげることができる」という言葉を、故郷の子どもたちに書き残しています。" },
  { id:"004-01", personId:"004", title:"タカジアスターゼとアドレナリンを生んだ化学者", tags:["発明","化学","国際交流"],
    body:"高峰譲吉は、富山県高岡に生まれた化学者です。イギリスに留学して応用化学を学んだのち、アメリカに渡って研究を続けました。麹菌から消化を助ける酵素「タカジアスターゼ」を作り出すことに成功し、これは胃腸薬として世界中で使われるようになります。続けて、副腎から「アドレナリン」というホルモンを世界で初めて結晶として取り出すことにも成功しました。資金や設備が十分でない中でも、あり合わせの道具と工夫で実験を重ね、幾度もの失敗を乗り越えての成果でした。実業家としても成功した高峰は、日米の友好のために、ワシントンD.C.に日本から桜の苗木を贈ることに力を尽くし、今も春になるとポトマック河畔を彩っています。",
    bodyHtml:"高峰譲吉は、富山県高岡に生まれた化学者です。イギリスに留学して応用化学を学んだのち、アメリカに渡って研究を続けました。\u003cruby>麹菌\u003crt>こうじきん\u003c/rt>\u003c/ruby>から消化を助ける酵素「タカジアスターゼ」を作り出すことに成功し、これは胃腸薬として世界中で使われるようになります。続けて、\u003cruby>副腎\u003crt>ふくじん\u003c/rt>\u003c/ruby>から「アドレナリン」というホルモンを世界で初めて結晶として取り出すことにも成功しました。資金や設備が十分でない中でも、あり合わせの道具と工夫で実験を重ね、幾度もの失敗を乗り越えての成果でした。実業家としても成功した高峰は、日米の友好のために、ワシントンD.C.に日本から桜の苗木を贈ることに力を尽くし、今も春になるとポトマック河畔を彩っています。" },
  { id:"005-01", personId:"005", title:"中間子理論で日本人初のノーベル賞に輝いた物理学者", tags:["探究心","物理学","忍耐"],
    body:"湯川秀樹は、京都に生まれた理論物理学者です。子どものころは口数が少なく、家では祖父から漢文の素読を教わりながら育ちました。京都帝国大学で物理学を学んだ湯川は、原子核の中で陽子と中性子を結びつけている力のしくみに疑問を持ち、そこに未知の粒子が存在すると考えます。1934年、この粒子「中間子」の存在を予言する理論を発表しました。当時はすぐには認められませんでしたが、1947年に中間子が実際に観測されると、世界中の物理学者から高く評価されます。そして1949年、日本人として初めてノーベル物理学賞を受賞しました。「一日生きることは、一歩進むことでありたい」という言葉のとおり、こつこつと考え続ける姿勢が、20年越しの大発見につながったのです。",
    bodyHtml:"湯川秀樹は、京都に生まれた理論物理学者です。子どものころは口数が少なく、家では祖父から漢文の\u003cruby>素読\u003crt>そどく\u003c/rt>\u003c/ruby>を教わりながら育ちました。京都帝国大学で物理学を学んだ湯川は、原子核の中で\u003cruby>陽子\u003crt>ようし\u003c/rt>\u003c/ruby>と\u003cruby>中性子\u003crt>ちゅうせいし\u003c/rt>\u003c/ruby>を結びつけている力のしくみに疑問を持ち、そこに未知の粒子が存在すると考えます。1934年、この粒子「\u003cruby>中間子\u003crt>ちゅうかんし\u003c/rt>\u003c/ruby>」の存在を予言する理論を発表しました。当時はすぐには認められませんでしたが、1947年に中間子が実際に観測されると、世界中の物理学者から高く評価されます。そして1949年、日本人として初めてノーベル物理学賞を受賞しました。「一日生きることは、一歩進むことでありたい」という言葉のとおり、こつこつと考え続ける姿勢が、20年越しの大発見につながったのです。" },
  { id:"008-01", personId:"008", title:"ペストの休校中に大発見の種をまいた物理学者", tags:["探究心","物理学","数学"],
    body:"ニュートンは、イギリスの農家に生まれ、幼いころは体が弱く、機械のおもちゃを作るのが好きな少年でした。大学生のとき、ロンドンでペストが大流行し、学校が閉鎖されたため、故郷で過ごす1年半ほどの期間をすごします。この間に、微分積分学の基礎、光の性質、そして万有引力の法則という、のちの科学を大きく変える発見の種をいくつも生み出しました。「りんごが木から落ちるのを見て、引力を思いついた」という有名な話は、後世に広まった言い伝えとされていますが、この時期の集中した思索が万有引力の考えにつながったのは確かです。1687年に発表した著書『プリンキピア』は、物体の運動を数式で説明し、その後の物理学の土台となりました。",
    bodyHtml:"ニュートンは、イギリスの農家に生まれ、幼いころは体が弱く、機械のおもちゃを作るのが好きな少年でした。大学生のとき、ロンドンでペストが大流行し、学校が閉鎖されたため、故郷で過ごす1年半ほどの期間をすごします。この間に、\u003cruby>微分積分学\u003crt>びぶんせきぶんがく\u003c/rt>\u003c/ruby>の基礎、光の性質、そして\u003cruby>万有引力\u003crt>ばんゆういんりょく\u003c/rt>\u003c/ruby>の法則という、のちの科学を大きく変える発見の種をいくつも生み出しました。「りんごが木から落ちるのを見て、引力を思いついた」という有名な話は、後世に広まった言い伝えとされていますが、この時期の集中した思索が万有引力の考えにつながったのは確かです。1687年に発表した著書『プリンキピア』は、物体の運動を数式で説明し、その後の物理学の土台となりました。" },
  { id:"009-01", personId:"009", title:"ビーグル号での航海から進化論にたどりついた博物学者", tags:["観察力","生物学","勇気"],
    body:"ダーウィンは、イギリスの裕福な家庭に生まれましたが、若いころは勉強にあまり熱心でなく、父からは「お前は狩りと犬と鼠捕りにしか興味がない」と心配されるほどでした。22歳のとき、測量船ビーグル号に博物学者として乗り込み、南米やガラパゴス諸島などをめぐる5年間の航海に出発します。ガラパゴス諸島で島ごとに姿の異なるフィンチという鳥を観察したことがきっかけとなり、生物は長い時間をかけて変化していくという考えにたどり着きました。しかし、当時の常識と大きく異なる説だったため、20年以上も発表をためらいます。ようやく1859年に『種の起源』を出版すると、この進化論は世界中で大きな議論を巻き起こしました。",
    bodyHtml:"ダーウィンは、イギリスの裕福な家庭に生まれましたが、若いころは勉強にあまり熱心でなく、父からは「お前は狩りと犬と鼠捕りにしか興味がない」と心配されるほどでした。22歳のとき、\u003cruby>測量船\u003crt>そくりょうせん\u003c/rt>\u003c/ruby>ビーグル号に\u003cruby>博物学者\u003crt>はくぶつがくしゃ\u003c/rt>\u003c/ruby>として乗り込み、南米やガラパゴス諸島などをめぐる5年間の航海に出発します。ガラパゴス諸島で島ごとに姿の異なるフィンチという鳥を観察したことがきっかけとなり、生物は長い時間をかけて変化していくという考えにたどり着きました。しかし、当時の常識と大きく異なる説だったため、20年以上も発表をためらいます。ようやく1859年に『種の起源』を出版すると、この進化論は世界中で大きな議論を巻き起こしました。" },
  { id:"010-01", personId:"010", title:"望遠鏡で宇宙を観察し、地動説を支持した科学者", tags:["観察力","天文学","信念"],
    body:"ガリレオ・ガリレイは、イタリアに生まれ、若いころから物の動きに興味を持ち、大学では医学ではなく数学に熱中しました。自分で改良した望遠鏡を夜空に向けると、月の表面がでこぼこしていることや、木星のまわりを回る4つの衛星を発見します。これらの観測から、ガリレオは地球ではなく太陽を中心に星が動いているとする「地動説」を強く支持するようになりました。しかし当時の教会の教えに反するとして、1633年、宗教裁判にかけられ、地動説を捨てると誓わされてしまいます。それでも真実への確信を失わなかったガリレオが、法廷を去るときに「それでも地球は動く」とつぶやいたという話は、後世に語り継がれる有名な言い伝えです。",
    bodyHtml:"ガリレオ・ガリレイは、イタリアに生まれ、若いころから物の動きに興味を持ち、大学では医学ではなく数学に熱中しました。自分で改良した望遠鏡を夜空に向けると、月の表面がでこぼこしていることや、木星のまわりを回る4つの衛星を発見します。これらの観測から、ガリレオは地球ではなく太陽を中心に星が動いているとする「\u003cruby>地動説\u003crt>ちどうせつ\u003c/rt>\u003c/ruby>」を強く支持するようになりました。しかし当時の教会の教えに反するとして、1633年、\u003cruby>宗教裁判\u003crt>しゅうきょうさいばん\u003c/rt>\u003c/ruby>にかけられ、地動説を捨てると誓わされてしまいます。それでも真実への確信を失わなかったガリレオが、法廷を去るときに「それでも地球は動く」とつぶやいたという話は、後世に語り継がれる有名な言い伝えです。" },
  { id:"011-01", personId:"011", title:"狂犬病ワクチンで少年の命を救った化学者", tags:["努力","医学","発見"],
    body:"パスツールは、フランスの皮なめし職人の家に生まれた化学者です。ワインやビールが腐ってしまう原因を調べるうち、目に見えない微生物が発酵や腐敗を引き起こしていることを突き止め、加熱によって微生物を減らす「低温殺菌法」を考え出しました。この発見は、病気の多くも微生物が原因であるという考え方につながっていきます。さらにパスツールは、弱らせた病原体を体に入れることで免疫をつくる「ワクチン」の研究を進め、狂犬病のワクチンを開発しました。1885年、狂犬にかまれた9歳の少年ジョゼフ・マイスターにこのワクチンを注射し、少年の命を救ったことで、その効果が世界に証明されます。「幸運は、準備のできた心にのみ宿る」という彼の言葉どおり、地道な観察と実験の積み重ねが、人類を感染症から守る大きな一歩になりました。",
    bodyHtml:"パスツールは、フランスの皮なめし職人の家に生まれた化学者です。ワインやビールが腐ってしまう原因を調べるうち、目に見えない微生物が発酵や腐敗を引き起こしていることを突き止め、加熱によって微生物を減らす「\u003cruby>低温殺菌法\u003crt>ていおんさっきんほう\u003c/rt>\u003c/ruby>」を考え出しました。この発見は、病気の多くも微生物が原因であるという考え方につながっていきます。さらにパスツールは、弱らせた病原体を体に入れることで\u003cruby>免疫\u003crt>めんえき\u003c/rt>\u003c/ruby>をつくる「ワクチン」の研究を進め、狂犬病のワクチンを開発しました。1885年、狂犬にかまれた9歳の少年ジョゼフ・マイスターにこのワクチンを注射し、少年の命を救ったことで、その効果が世界に証明されます。「幸運は、準備のできた心にのみ宿る」という彼の言葉どおり、地道な観察と実験の積み重ねが、人類を感染症から守る大きな一歩になりました。" },
  { id:"012-01", personId:"012", title:"アオカビからペニシリンを発見した細菌学者", tags:["発見","医学","偶然"],
    body:"アレクサンダー・フレミングは、スコットランドの農家に生まれ、ロンドンで細菌学を学びました。1928年、休暇から戻ると、片づけ忘れていた培養皿にアオカビが生えており、その周りだけ細菌が育っていないことに気づきます。片づけをしなかったという「幸運な偶然」を見逃さず、フレミングはこのカビから細菌の増殖を防ぐ物質を取り出し、「ペニシリン」と名づけました。しかし当時は取り出す技術が未熟で、実用化までは進みませんでした。10年余りのち、別の研究者フローリーとチェインがペニシリンの精製に成功し、世界初の抗生物質として多くの命を救うことになります。1945年、3人はともにノーベル生理学・医学賞を受賞しました。",
    bodyHtml:"アレクサンダー・フレミングは、スコットランドの農家に生まれ、ロンドンで細菌学を学びました。1928年、休暇から戻ると、片づけ忘れていた培養皿にアオカビが生えており、その周りだけ細菌が育っていないことに気づきます。片づけをしなかったという「幸運な偶然」を見逃さず、フレミングはこのカビから細菌の増殖を防ぐ物質を取り出し、「ペニシリン」と名づけました。しかし当時は取り出す技術が未熟で、実用化までは進みませんでした。10年余りのち、別の研究者フローリーとチェインがペニシリンの精製に成功し、世界初の\u003cruby>抗生物質\u003crt>こうせいぶっしつ\u003c/rt>\u003c/ruby>として多くの命を救うことになります。1945年、3人はともにノーベル生理学・医学賞を受賞しました。" },
  { id:"013-01", personId:"013", title:"エンドウ豆の実験で遺伝の法則を見つけた修道士", tags:["観察力","遺伝学","忍耐"],
    body:"グレゴール・メンデルは、オーストリアの貧しい農家に生まれ、生活のために修道院に入った修道士です。修道院の庭で、8年間にわたってエンドウ豆を何万株も育て、丸い種と皺のある種など、性質の伝わり方を根気強く記録しました。この実験から、生物の特徴は一定の規則にしたがって親から子へ受け継がれるという「遺伝の法則」を発見します。1865年に研究発表を行いましたが、当時はその重要性がほとんど理解されず、メンデルは評価されないまま生涯を終えました。彼の死後16年たった1900年になって、複数の科学者が別々にメンデルの論文を再発見し、ようやく「遺伝学の父」として高く評価されるようになったのです。",
    bodyHtml:"グレゴール・メンデルは、オーストリアの貧しい農家に生まれ、生活のために\u003cruby>修道院\u003crt>しゅうどういん\u003c/rt>\u003c/ruby>に入った修道士です。修道院の庭で、8年間にわたってエンドウ豆を何万株も育て、丸い種と皺のある種など、性質の伝わり方を根気強く記録しました。この実験から、生物の特徴は一定の規則にしたがって親から子へ受け継がれるという「\u003cruby>遺伝\u003crt>いでん\u003c/rt>\u003c/ruby>の法則」を発見します。1865年に研究発表を行いましたが、当時はその重要性がほとんど理解されず、メンデルは評価されないまま生涯を終えました。彼の死後16年たった1900年になって、複数の科学者が別々にメンデルの論文を再発見し、ようやく「遺伝学の父」として高く評価されるようになったのです。" },
  { id:"015-01", personId:"015", title:"自転車屋から始まった人類初の動力飛行", tags:["挑戦","飛行機","協力"],
    body:"ライト兄弟、兄のウィルバーと弟のオーヴィルは、アメリカで自転車の修理・製造業を営む職人でした。空を飛ぶことに強い興味を持ち、鳥の翼の動きを観察しながら、風の力を利用する滑空実験を何度も繰り返します。自転車づくりで培った機械の知識を生かし、軽くて丈夫なエンジンとプロペラを自分たちで設計・製作しました。1903年12月17日、アメリカのキティホークで、ライトフライヤー号による人類初の動力飛行に成功します。飛行時間はわずか12秒、距離も36メートルほどでしたが、これが現在の飛行機の原点となりました。多くの科学者や実業家が失敗を重ねる中、自転車屋の兄弟が空への扉を開いたのです。",
    bodyHtml:"ライト兄弟、兄のウィルバーと弟のオーヴィルは、アメリカで自転車の修理・製造業を営む職人でした。空を飛ぶことに強い興味を持ち、鳥の翼の動きを観察しながら、風の力を利用する\u003cruby>滑空\u003crt>かっくう\u003c/rt>\u003c/ruby>実験を何度も繰り返します。自転車づくりで培った機械の知識を生かし、軽くて丈夫なエンジンとプロペラを自分たちで設計・製作しました。1903年12月17日、アメリカのキティホークで、ライトフライヤー号による人類初の\u003cruby>動力飛行\u003crt>どうりょくひこう\u003c/rt>\u003c/ruby>に成功します。飛行時間はわずか12秒、距離も36メートルほどでしたが、これが現在の飛行機の原点となりました。多くの科学者や実業家が失敗を重ねる中、自転車屋の兄弟が空への扉を開いたのです。" },
  { id:"016-01", personId:"016", title:"耳の不自由な人への思いから生まれた電話", tags:["発明","福祉","コミュニケーション"],
    body:"グラハム・ベルは、イギリスに生まれ、耳の不自由な人々に発音を教える教師として活動していました。母親と妻がどちらも耳が聞こえなかったことが、音声や聴覚のしくみへの強い関心につながります。音を電気信号に変えて伝える方法を研究するうち、1876年、世界で初めて電話の実験に成功しました。実験室で助手のワトソンに向かって「ワトソン君、こちらに来てくれたまえ」と話しかけた声が、電線を通して別の部屋に届いたのです。電話の発明はその後、世界中の人々のコミュニケーションのあり方を大きく変えました。ベルは生涯、聴覚障がい者の教育にも力を注ぎ続けました。",
    bodyHtml:"グラハム・ベルは、イギリスに生まれ、耳の不自由な人々に発音を教える教師として活動していました。母親と妻がどちらも耳が聞こえなかったことが、音声や\u003cruby>聴覚\u003crt>ちょうかく\u003c/rt>\u003c/ruby>のしくみへの強い関心につながります。音を電気信号に変えて伝える方法を研究するうち、1876年、世界で初めて電話の実験に成功しました。実験室で助手のワトソンに向かって「ワトソン君、こちらに来てくれたまえ」と話しかけた声が、電線を通して別の部屋に届いたのです。電話の発明はその後、世界中の人々のコミュニケーションのあり方を大きく変えました。ベルは生涯、聴覚障がい者の教育にも力を注ぎ続けました。" },
  { id:"017-01", personId:"017", title:"自動織機を生み出し、トヨタの原点となった発明家", tags:["発明","努力","ものづくり"],
    body:"豊田佐吉は、静岡県の貧しい農家に生まれた発明家です。母親が機織りに苦労する姿を見て育ち、もっと楽に、もっと良い織物を作れないかと考えるようになりました。独学で研究を重ね、糸が切れると自動的に止まる仕組みを備えた「自動織機」を発明します。この織機は、それまで手作業に頼っていた織物づくりの効率と品質を大きく向上させました。豊田は特許で得た資金や技術を惜しみなく次の開発に注ぎ込み、生涯で発明の改良を続けます。佐吉が育てた技術と精神は、息子の喜一郎に受け継がれ、のちに自動車を製造するトヨタ自動車の誕生へとつながっていきました。",
    bodyHtml:"豊田佐吉は、静岡県の貧しい農家に生まれた発明家です。母親が機織りに苦労する姿を見て育ち、もっと楽に、もっと良い織物を作れないかと考えるようになりました。独学で研究を重ね、糸が切れると自動的に止まる仕組みを備えた「\u003cruby>自動織機\u003crt>じどうしょっき\u003c/rt>\u003c/ruby>」を発明します。この織機は、それまで手作業に頼っていた織物づくりの効率と品質を大きく向上させました。豊田は特許で得た資金や技術を惜しみなく次の開発に注ぎ込み、生涯で発明の改良を続けます。佐吉が育てた技術と精神は、息子の喜一郎に受け継がれ、のちに自動車を製造するトヨタ自動車の誕生へとつながっていきました。" },
  { id:"018-01", personId:"018", title:"からくり人形から東芝の源流を築いた発明家", tags:["発明","職人技","ものづくり"],
    body:"田中久重は、九州の鼈甲細工職人の家に生まれ、幼いころから手先が器用で、からくり人形づくりに夢中になりました。矢を的に打ち続ける「弓曳童子」など精巧なからくり人形を次々に作り出し、「からくり儀右衛門」と呼ばれて評判になります。年齢を重ねてからは、時計や測量器具など、より実用的な機械の研究に力を注ぐようになりました。万年ぜんまいで動き続ける「万年時計」を作り上げたほか、幕末には佐賀藩に招かれ、蒸気機関や大砲などの技術開発にも取り組みます。明治になってからは東京に電信機関係の工場を設立し、この会社はのちに芝浦製作所を経て、現在の東芝へとつながっていきました。",
    bodyHtml:"田中久重は、九州の\u003cruby>鼈甲細工\u003crt>べっこうざいく\u003c/rt>\u003c/ruby>職人の家に生まれ、幼いころから手先が器用で、からくり人形づくりに夢中になりました。矢を的に打ち続ける「弓曳童子」など精巧なからくり人形を次々に作り出し、「からくり儀右衛門」と呼ばれて評判になります。年齢を重ねてからは、時計や測量器具など、より実用的な機械の研究に力を注ぐようになりました。万年ぜんまいで動き続ける「万年時計」を作り上げたほか、幕末には佐賀藩に招かれ、蒸気機関や大砲などの技術開発にも取り組みます。明治になってからは東京に電信機関係の工場を設立し、この会社はのちに芝浦製作所を経て、現在の東芝へとつながっていきました。" },
  { id:"019-01", personId:"019", title:"エレキテルを復元した江戸のマルチクリエイター", tags:["好奇心","発明","多才"],
    body:"平賀源内は、江戸時代中期、讃岐国（今の香川県）に生まれた学者です。本草学や蘭学を学び、絵や小説の執筆、鉱山開発など、驚くほど幅広い分野で才能を発揮しました。オランダから伝わった壊れた発電装置を修理・復元し、「エレキテル」として見世物にしたことでも知られています。摩擦によって静電気を起こすこの装置は、当時の人々にとってまるで魔法のように映りました。ほかにも、燃えない布とされる「火浣布」を作ったり、寒暖計を製作したりと、次々と新しいものを生み出しています。多才すぎるがゆえに一つの分野を極めきれなかったともいわれますが、江戸のマルチクリエイターとして今も親しまれています。",
    bodyHtml:"平賀源内は、江戸時代中期、\u003cruby>讃岐国\u003crt>さぬきのくに\u003c/rt>\u003c/ruby>（今の香川県）に生まれた学者です。\u003cruby>本草学\u003crt>ほんぞうがく\u003c/rt>\u003c/ruby>や蘭学を学び、絵や小説の執筆、鉱山開発など、驚くほど幅広い分野で才能を発揮しました。オランダから伝わった壊れた発電装置を修理・復元し、「エレキテル」として見世物にしたことでも知られています。摩擦によって静電気を起こすこの装置は、当時の人々にとってまるで魔法のように映りました。ほかにも、燃えない布とされる「\u003cruby>火浣布\u003crt>かかんぷ\u003c/rt>\u003c/ruby>」を作ったり、寒暖計を製作したりと、次々と新しいものを生み出しています。多才すぎるがゆえに一つの分野を極めきれなかったともいわれますが、江戸のマルチクリエイターとして今も親しまれています。" },
  { id:"020-01", personId:"020", title:"世界初のガソリン自動車を生んだ夫婦の挑戦", tags:["発明","挑戦","家族の支え"],
    body:"カール・ベンツは、ドイツの機関士の息子として生まれ、幼いころから機械いじりが大好きな少年でした。蒸気機関に代わる小型で扱いやすいエンジンの開発に情熱を注ぎ、1885年、ガソリンを燃料とするエンジンを積んだ三輪の自動車「ベンツ・パテント・モトールヴァーゲン」を完成させます。これは世界で初めて実用化されたガソリン自動車とされています。しかし当時の人々は自動車の価値をなかなか理解してくれませんでした。そこで妻のベルタは、夫に内緒で息子2人を連れて自動車に乗り込み、100キロメートル以上離れた実家まで走らせるという大胆な宣伝を行います。この長距離走行の成功が新聞で話題になり、自動車は少しずつ世の中に認められていきました。",
    bodyHtml:"カール・ベンツは、ドイツの機関士の息子として生まれ、幼いころから機械いじりが大好きな少年でした。蒸気機関に代わる小型で扱いやすいエンジンの開発に情熱を注ぎ、1885年、ガソリンを燃料とするエンジンを積んだ三輪の自動車「ベンツ・パテント・モトールヴァーゲン」を完成させます。これは世界で初めて実用化されたガソリン自動車とされています。しかし当時の人々は自動車の価値をなかなか理解してくれませんでした。そこで妻のベルタは、夫に内緒で息子2人を連れて自動車に乗り込み、100キロメートル以上離れた実家まで走らせるという大胆な宣伝を行います。この長距離走行の成功が新聞で話題になり、自動車は少しずつ世の中に認められていきました。" },
  { id:"021-01", personId:"021", title:"蒸気機関を改良し、産業革命を支えた発明家", tags:["観察力","発明","改良"],
    body:"ジェームズ・ワットは、スコットランドに生まれ、器械づくりの職人として大学で仕事をしていました。ある日、修理を頼まれた蒸気機関を調べるうち、当時の蒸気機関は燃料の多くを無駄にしていることに気づきます。ワットは、蒸気を冷やすための「復水器」を別に取り付けるという工夫によって、燃料の消費を大幅に減らすことに成功しました。「やかんの湯気を見て蒸気機関を思いついた」という話は後世に広まった言い伝えとされていますが、実際には地道な観察と技術改良の積み重ねが、この大発明を生み出したのです。ワットが改良した蒸気機関は、工場や鉄道、船など、産業革命を支える動力として広く使われるようになりました。仕事率の単位「ワット」は、彼の名前にちなんで名づけられています。",
    bodyHtml:"ジェームズ・ワットは、スコットランドに生まれ、器械づくりの職人として大学で仕事をしていました。ある日、修理を頼まれた蒸気機関を調べるうち、当時の蒸気機関は燃料の多くを無駄にしていることに気づきます。ワットは、蒸気を冷やすための「\u003cruby>復水器\u003crt>ふくすいき\u003c/rt>\u003c/ruby>」を別に取り付けるという工夫によって、燃料の消費を大幅に減らすことに成功しました。「やかんの湯気を見て蒸気機関を思いついた」という話は後世に広まった言い伝えとされていますが、実際には地道な観察と技術改良の積み重ねが、この大発明を生み出したのです。ワットが改良した蒸気機関は、工場や鉄道、船など、産業革命を支える動力として広く使われるようになりました。仕事率の単位「ワット」は、彼の名前にちなんで名づけられています。" },
  { id:"022-01", personId:"022", title:"十七条の憲法を定めた飛鳥時代の皇族", tags:["政治","仏教","外交"],
    body:"聖徳太子は、飛鳥時代の皇族で、推古天皇のもとで政治を助ける摂政という役目を任されました。仏教を厚く信仰し、日本に仏教の教えを広めるとともに、法隆寺をはじめとする多くの寺院を建てたことで知られています。604年には、役人の心構えを示した「十七条の憲法」を定め、「和を以て貴しとなす」という有名な言葉を残しました。また、家柄にとらわれず能力によって役人を取り立てる「冠位十二階」の制度も整えます。一度に大勢の人の話を同時に聞き分けたという逸話も語り継がれていますが、これは太子の優れた才知を象徴する言い伝えとされています。中国の隋にも使者を送り、対等な立場での外交を目指しました。",
    bodyHtml:"聖徳太子は、飛鳥時代の皇族で、推古天皇のもとで政治を助ける\u003cruby>摂政\u003crt>せっしょう\u003c/rt>\u003c/ruby>という役目を任されました。仏教を厚く信仰し、日本に仏教の教えを広めるとともに、法隆寺をはじめとする多くの寺院を建てたことで知られています。604年には、役人の心構えを示した「十七条の憲法」を定め、「和を以て貴しとなす」という有名な言葉を残しました。また、家柄にとらわれず能力によって役人を取り立てる「\u003cruby>冠位十二階\u003crt>かんいじゅうにかい\u003c/rt>\u003c/ruby>」の制度も整えます。一度に大勢の人の話を同時に聞き分けたという逸話も語り継がれていますが、これは太子の優れた才知を象徴する言い伝えとされています。中国の隋にも使者を送り、対等な立場での外交を目指しました。" },
  { id:"023-01", personId:"023", title:"常識を打ち破った戦国大名", tags:["改革","戦国時代","決断力"],
    body:"織田信長は、尾張国（今の愛知県）の小さな大名の家に生まれました。若いころは常識はずれの行動が多く「うつけ者」と呼ばれていましたが、桶狭間の戦いで、自分よりはるかに大軍だった今川義元をわずかな兵で打ち破り、世間を驚かせます。信長は、身分にとらわれず能力のある家臣を取り立て、鉄砲を戦に大量に取り入れるなど、それまでの常識を次々に打ち破りました。長篠の戦いでは、鉄砲隊を効果的に用いて武田軍の騎馬隊を撃退したことで知られています。楽市楽座という自由な商業政策を進め、経済の発展にも力を入れました。しかし天下統一を目前にした1582年、家臣の明智光秀に本能寺で襲われ、49歳でその生涯を閉じます。",
    bodyHtml:"織田信長は、尾張国（今の愛知県）の小さな大名の家に生まれました。若いころは常識はずれの行動が多く「うつけ者」と呼ばれていましたが、\u003cruby>桶狭間\u003crt>おけはざま\u003c/rt>\u003c/ruby>の戦いで、自分よりはるかに大軍だった今川義元をわずかな兵で打ち破り、世間を驚かせます。信長は、身分にとらわれず能力のある家臣を取り立て、鉄砲を戦に大量に取り入れるなど、それまでの常識を次々に打ち破りました。\u003cruby>長篠\u003crt>ながしの\u003c/rt>\u003c/ruby>の戦いでは、鉄砲隊を効果的に用いて武田軍の騎馬隊を撃退したことで知られています。\u003cruby>楽市楽座\u003crt>らくいちらくざ\u003c/rt>\u003c/ruby>という自由な商業政策を進め、経済の発展にも力を入れました。しかし天下統一を目前にした1582年、家臣の明智光秀に本能寺で襲われ、49歳でその生涯を閉じます。" },
  { id:"024-01", personId:"024", title:"草履取りから天下人へのぼりつめた武将", tags:["立身出世","戦国時代","統一"],
    body:"豊臣秀吉は、尾張国の農民の家に生まれ、若いころは織田信長に仕える身分の低い家来にすぎませんでした。信長の草履を懐で温めておいたという有名な話が伝わるように、気配りと機転で信長に気に入られ、少しずつ出世していきます。信長が本能寺の変で命を落とすと、秀吉はすばやく行動して明智光秀を討ち、信長の後継者としての地位を固めました。その後、各地の大名を従え、ついに日本全国を統一します。農民から武器を取り上げる「刀狩り」や、田畑の広さや収穫量を調べる「太閤検地」などの政策で、社会のしくみを大きく変えました。壮大な大坂城を築き、茶の湯や華やかな文化を愛したことでも知られています。",
    bodyHtml:"豊臣秀吉は、尾張国の農民の家に生まれ、若いころは織田信長に仕える身分の低い家来にすぎませんでした。信長の草履を懐で温めておいたという有名な話が伝わるように、気配りと機転で信長に気に入られ、少しずつ出世していきます。信長が本能寺の変で命を落とすと、秀吉はすばやく行動して明智光秀を討ち、信長の後継者としての地位を固めました。その後、各地の大名を従え、ついに日本全国を統一します。農民から武器を取り上げる「刀狩り」や、田畑の広さや収穫量を調べる「\u003cruby>太閤検地\u003crt>たいこうけんち\u003c/rt>\u003c/ruby>」などの政策で、社会のしくみを大きく変えました。壮大な大坂城を築き、茶の湯や華やかな文化を愛したことでも知られています。" },
  { id:"025-01", personId:"025", title:"忍耐の末に江戸幕府を開いた天下人", tags:["忍耐","戦国時代","統治"],
    body:"徳川家康は、三河国（今の愛知県）の小さな大名の家に生まれ、幼いころは人質として他家で過ごすなど、苦労の多い少年時代を送りました。織田信長、豊臣秀吉という二人の天下人に仕えながら力を蓄え、じっと機会を待ち続けます。「鳴かぬなら鳴くまで待とうほととぎす」という言葉に例えられるように、家康は忍耐強く行動する人物として知られています。秀吉の死後、1600年の関ヶ原の戦いに勝利すると、1603年に征夷大将軍となり、江戸に幕府を開きました。この江戸幕府は、その後およそ260年にわたって続く、長い平和な時代の土台を築きます。戦乱の世を終わらせ、安定した社会を作り上げた家康の忍耐と戦略は、今も多くの人に語り継がれています。",
    bodyHtml:"徳川家康は、三河国（今の愛知県）の小さな大名の家に生まれ、幼いころは人質として他家で過ごすなど、苦労の多い少年時代を送りました。織田信長、豊臣秀吉という二人の天下人に仕えながら力を蓄え、じっと機会を待ち続けます。「鳴かぬなら鳴くまで待とうほととぎす」という言葉に例えられるように、家康は忍耐強く行動する人物として知られています。秀吉の死後、1600年の関ヶ原の戦いに勝利すると、1603年に\u003cruby>征夷大将軍\u003crt>せいいたいしょうぐん\u003c/rt>\u003c/ruby>となり、江戸に幕府を開きました。この江戸幕府は、その後およそ260年にわたって続く、長い平和な時代の土台を築きます。戦乱の世を終わらせ、安定した社会を作り上げた家康の忍耐と戦略は、今も多くの人に語り継がれています。" },
  { id:"027-01", personId:"027", title:"江戸無血開城を実現させた幕末のリーダー", tags:["人望","幕末","決断"],
    body:"西郷隆盛は、薩摩藩（今の鹿児島県）の下級武士の家に生まれました。体格が大きく情に厚い人物で、多くの人望を集め、薩摩藩の中心人物として幕末の激動の時代を生き抜きます。長州藩と手を結ぶ「薩長同盟」の実現に力を尽くし、江戸幕府を倒す明治維新の立役者の一人となりました。江戸城を攻める直前には、幕府側の勝海舟と話し合い、戦をせずに江戸城を明け渡させる「江戸無血開城」を実現し、多くの命が失われるのを防ぎます。明治政府の中心人物として活躍したのち、政府の方針をめぐる対立から故郷の鹿児島に戻り、1877年、西南戦争で新政府軍と戦って命を落としました。上野公園の銅像は、今も多くの人に親しまれています。",
    bodyHtml:"西郷隆盛は、薩摩藩（今の鹿児島県）の下級武士の家に生まれました。体格が大きく情に厚い人物で、多くの人望を集め、薩摩藩の中心人物として幕末の激動の時代を生き抜きます。長州藩と手を結ぶ「\u003cruby>薩長同盟\u003crt>さっちょうどうめい\u003c/rt>\u003c/ruby>」の実現に力を尽くし、江戸幕府を倒す明治維新の立役者の一人となりました。江戸城を攻める直前には、幕府側の勝海舟と話し合い、戦をせずに江戸城を明け渡させる「江戸無血開城」を実現し、多くの命が失われるのを防ぎます。明治政府の中心人物として活躍したのち、政府の方針をめぐる対立から故郷の鹿児島に戻り、1877年、西南戦争で新政府軍と戦って命を落としました。上野公園の銅像は、今も多くの人に親しまれています。" },
  { id:"028-01", personId:"028", title:"太平洋を渡り、江戸を戦火から守った幕臣", tags:["航海","幕末","交渉力"],
    body:"勝海舟は、江戸に生まれた幕臣（江戸幕府に仕える武士）です。貧しい家に育ちながらも独学で蘭学や西洋の兵学を学び、幕府が長崎に開いた海軍伝習所で航海術を身につけました。1860年には、幕府の使節を乗せた咸臨丸の指揮官として、日本の乗組員だけで初めて太平洋を横断し、アメリカに渡ります。幕府の軍艦奉行として海軍の整備に力を尽くす一方、坂本龍馬など多くの若者に新しい時代の考え方を伝えました。幕末の動乱の中、新政府軍が江戸に迫ると、勝は西郷隆盛と直接話し合い、江戸の町を戦火から守るため、戦わずに江戸城を明け渡すことに合意します。この決断により、江戸は焼け野原になることをまぬがれました。",
    bodyHtml:"勝海舟は、江戸に生まれた\u003cruby>幕臣\u003crt>ばくしん\u003c/rt>\u003c/ruby>（江戸幕府に仕える武士）です。貧しい家に育ちながらも独学で蘭学や西洋の兵学を学び、幕府が長崎に開いた海軍伝習所で航海術を身につけました。1860年には、幕府の使節を乗せた\u003cruby>咸臨丸\u003crt>かんりんまる\u003c/rt>\u003c/ruby>の指揮官として、日本の乗組員だけで初めて太平洋を横断し、アメリカに渡ります。幕府の\u003cruby>軍艦奉行\u003crt>ぐんかんぶぎょう\u003c/rt>\u003c/ruby>として海軍の整備に力を尽くす一方、坂本龍馬など多くの若者に新しい時代の考え方を伝えました。幕末の動乱の中、新政府軍が江戸に迫ると、勝は西郷隆盛と直接話し合い、江戸の町を戦火から守るため、戦わずに江戸城を明け渡すことに合意します。この決断により、江戸は焼け野原になることをまぬがれました。" },
  { id:"032-01", personId:"032", title:"50歳から日本地図づくりを始めた測量家", tags:["挑戦","忍耐","測量"],
    body:"伊能忠敬は、下総国（今の千葉県）の商家の家に生まれ、婿養子として酒造業などを営む家を継ぎました。家業を立て直して財産を築いたのち、50歳で家督を息子に譲り、江戸に出て天文学や測量術を学び始めます。当時としては遅い学び直しでしたが、忠敬は熱心に勉強を重ね、正確な日本地図を作るという夢を抱くようになりました。55歳から71歳で亡くなるまでの17年間、日本全国を自分の足で歩いて測量し、その距離はおよそ4万キロメートル、地球一周分にもおよびます。忠敬の死後に完成した「大日本沿海輿地全図」は、驚くほど正確な日本地図として、後の時代に大きな影響を与えました。",
    bodyHtml:"伊能忠敬は、下総国（今の千葉県）の商家の家に生まれ、婿養子として酒造業などを営む家を継ぎました。家業を立て直して財産を築いたのち、50歳で家督を息子に譲り、江戸に出て天文学や測量術を学び始めます。当時としては遅い学び直しでしたが、忠敬は熱心に勉強を重ね、正確な日本地図を作るという夢を抱くようになりました。55歳から71歳で亡くなるまでの17年間、日本全国を自分の足で歩いて測量し、その距離はおよそ4万キロメートル、地球一周分にもおよびます。忠敬の死後に完成した「\u003cruby>大日本沿海輿地全図\u003crt>だいにほんえんかいよちぜんず\u003c/rt>\u003c/ruby>」は、驚くほど正確な日本地図として、後の時代に大きな影響を与えました。" },
  { id:"033-01", personId:"033", title:"松下村塾で多くの志士を育てた教育者", tags:["教育","志","幕末"],
    body:"吉田松陰は、長州藩（今の山口県）の武士の家に生まれ、幼いころから兵学や学問に優れた才能を見せました。ペリーが率いるアメリカの黒船が来航すると、西洋の進んだ技術や知識を学ぶ必要があると考え、密航してでも海外に渡ろうとしましたが失敗し、投獄されてしまいます。その後、故郷の小さな私塾「松下村塾」で、身分にとらわれず多くの若者に学問と志を教えました。松陰の教えを受けた門下生からは、高杉晋作や伊藤博文など、のちの明治維新や日本の近代化を担う多くの人材が育っていきます。しかし松陰自身は、幕府の政治を批判したことから「安政の大獄」で処罰され、1859年、29歳の若さで処刑されました。",
    bodyHtml:"吉田松陰は、長州藩（今の山口県）の武士の家に生まれ、幼いころから兵学や学問に優れた才能を見せました。ペリーが率いるアメリカの黒船が来航すると、西洋の進んだ技術や知識を学ぶ必要があると考え、密航してでも海外に渡ろうとしましたが失敗し、投獄されてしまいます。その後、故郷の小さな私塾「\u003cruby>松下村塾\u003crt>しょうかそんじゅく\u003c/rt>\u003c/ruby>」で、身分にとらわれず多くの若者に学問と志を教えました。松陰の教えを受けた門下生からは、高杉晋作や伊藤博文など、のちの明治維新や日本の近代化を担う多くの人材が育っていきます。しかし松陰自身は、幕府の政治を批判したことから「\u003cruby>安政の大獄\u003crt>あんせいのたいごく\u003c/rt>\u003c/ruby>」で処罰され、1859年、29歳の若さで処刑されました。" },
  { id:"034-01", personId:"034", title:"「武士道」を世界に紹介した教育者", tags:["国際交流","教育","著述"],
    body:"新渡戸稲造は、盛岡藩（今の岩手県）の武士の家に生まれ、札幌農学校で農業について学びました。その後アメリカやドイツに留学し、西洋の学問と出会う中で、日本人の道徳観や精神を世界に伝えたいと考えるようになります。病気療養中のアメリカで英語の本として書き上げたのが、代表作『武士道』です。この本は、日本人の生き方の背景にある考え方をわかりやすく紹介し、世界中で広く読まれました。帰国後は教育者として多くの学校で教えたほか、国際連盟という国際機関の事務次長として、国と国との争いを話し合いで解決する活動にも力を尽くします。「太平洋の架け橋になりたい」という言葉どおり、日本と世界をつなぐ役割を果たした人物でした。",
    bodyHtml:"新渡戸稲造は、盛岡藩（今の岩手県）の武士の家に生まれ、札幌農学校で農業について学びました。その後アメリカやドイツに留学し、西洋の学問と出会う中で、日本人の道徳観や精神を世界に伝えたいと考えるようになります。病気療養中のアメリカで英語の本として書き上げたのが、代表作『武士道』です。この本は、日本人の生き方の背景にある考え方をわかりやすく紹介し、世界中で広く読まれました。帰国後は教育者として多くの学校で教えたほか、国際連盟という国際機関の\u003cruby>事務次長\u003crt>じむじちょう\u003c/rt>\u003c/ruby>として、国と国との争いを話し合いで解決する活動にも力を尽くします。「太平洋の架け橋になりたい」という言葉どおり、日本と世界をつなぐ役割を果たした人物でした。" },
  { id:"035-01", personId:"035", title:"丸太小屋から大統領へ、奴隷解放を成し遂げた指導者", tags:["平等","民主主義","演説"],
    body:"エイブラハム・リンカーンは、アメリカ・ケンタッキー州の丸太小屋で生まれ、貧しい開拓民の家庭に育ちました。学校にはほとんど通えませんでしたが、独学で読み書きや法律を学び、弁護士から政治家へと道を切り開いていきます。1861年に大統領に就任すると、まもなくアメリカは南部と北部に分かれて争う南北戦争に突入しました。リンカーンは戦争のさなか、奴隷制度を廃止する「奴隷解放宣言」を発表し、多くの黒人を奴隷という立場から解放します。1863年、激戦地ゲティスバーグで行った演説の中で「人民の、人民による、人民のための政治」という言葉を残し、民主主義の理想を語りました。戦争終結の直後、1865年に凶弾に倒れ、56歳でその生涯を閉じました。",
    bodyHtml:"エイブラハム・リンカーンは、アメリカ・ケンタッキー州の丸太小屋で生まれ、貧しい開拓民の家庭に育ちました。学校にはほとんど通えませんでしたが、独学で読み書きや法律を学び、弁護士から政治家へと道を切り開いていきます。1861年に大統領に就任すると、まもなくアメリカは南部と北部に分かれて争う南北戦争に突入しました。リンカーンは戦争のさなか、\u003cruby>奴隷\u003crt>どれい\u003c/rt>\u003c/ruby>制度を廃止する「奴隷解放宣言」を発表し、多くの黒人を奴隷という立場から解放します。1863年、激戦地ゲティスバーグで行った演説の中で「人民の、人民による、人民のための政治」という言葉を残し、民主主義の理想を語りました。戦争終結の直後、1865年に凶弾に倒れ、56歳でその生涯を閉じました。" },
  { id:"036-01", personId:"036", title:"権力に固執しなかったアメリカ初代大統領", tags:["独立","謙虚さ","リーダーシップ"],
    body:"ジョージ・ワシントンは、イギリスの植民地だった北アメリカのバージニアに生まれました。若いころは測量士として働いたのち軍人となり、アメリカがイギリスからの独立を目指す独立戦争で、大陸軍の総司令官に選ばれます。厳しい戦況や物資の不足に苦しみながらも、粘り強く軍をまとめ上げ、ついにアメリカを独立へと導きました。戦争が終わると、多くの人が国王のような強い権力を持つことを望みましたが、ワシントンはその地位を求めず、初代大統領として2期務めたのちに自ら身を引きます。「桜の木を切ったことを正直に父に話した」という少年時代の逸話は、後世の伝記作家による創作とされていますが、権力に固執しなかった生き方は史実として高く評価されています。",
    bodyHtml:"ジョージ・ワシントンは、イギリスの植民地だった北アメリカのバージニアに生まれました。若いころは測量士として働いたのち軍人となり、アメリカがイギリスからの独立を目指す独立戦争で、大陸軍の総司令官に選ばれます。厳しい戦況や物資の不足に苦しみながらも、粘り強く軍をまとめ上げ、ついにアメリカを独立へと導きました。戦争が終わると、多くの人が国王のような強い権力を持つことを望みましたが、ワシントンはその地位を求めず、初代大統領として2期務めたのちに自ら身を引きます。「桜の木を切ったことを正直に父に話した」という少年時代の\u003cruby>逸話\u003crt>いつわ\u003c/rt>\u003c/ruby>は、後世の伝記作家による創作とされていますが、権力に固執しなかった生き方は史実として高く評価されています。" },
  { id:"037-01", personId:"037", title:"非暴力でインドを独立に導いた指導者", tags:["非暴力","独立","信念"],
    body:"マハトマ・ガンディーは、インドに生まれ、イギリスで弁護士の資格を取ったのち、南アフリカで人種差別と闘う活動を始めました。インドに戻ると、当時イギリスの植民地支配のもとにあった祖国の独立運動に身を投じます。ガンディーが掲げたのは、暴力を使わずに不正な支配に抵抗する「非暴力・不服従」という考え方でした。イギリスが塩に重い税をかけたことに抗議し、大勢の人々とともに海まで歩いて塩を作る「塩の行進」を行ったことは、世界中に大きな衝撃を与えます。何度も投獄されながらも決して暴力に訴えなかったガンディーの姿勢は、多くのインド人の心を動かし、1947年、ついにインドはイギリスからの独立を果たしました。",
    bodyHtml:"マハトマ・ガンディーは、インドに生まれ、イギリスで弁護士の資格を取ったのち、南アフリカで人種差別と闘う活動を始めました。インドに戻ると、当時イギリスの植民地支配のもとにあった祖国の独立運動に身を投じます。ガンディーが掲げたのは、暴力を使わずに不正な支配に抵抗する「\u003cruby>非暴力・不服従\u003crt>ひぼうりょく・ふふくじゅう\u003c/rt>\u003c/ruby>」という考え方でした。イギリスが塩に重い税をかけたことに抗議し、大勢の人々とともに海まで歩いて塩を作る「塩の行進」を行ったことは、世界中に大きな衝撃を与えます。何度も投獄されながらも決して暴力に訴えなかったガンディーの姿勢は、多くのインド人の心を動かし、1947年、ついにインドはイギリスからの独立を果たしました。" },
  { id:"038-01", personId:"038", title:"「私には夢がある」演説で差別に立ち向かった牧師", tags:["平等","演説","非暴力"],
    body:"マーティン・ルーサー・キング牧師は、アメリカ南部で黒人差別が根強く残る時代に生まれました。牧師として働く一方、人種によって差別されることのない社会を目指す公民権運動の指導者として活動します。バスの座席を人種によって分けることに反対したバス・ボイコット運動をはじめ、非暴力の方法で差別に抗議し続けました。1963年、ワシントンで行われた大規模な行進の際、「私には夢がある」で知られる有名な演説を行い、肌の色で人を判断しない社会を築こうと訴えます。この演説は、翌年の公民権法制定につながる大きな力となりました。1964年にはノーベル平和賞を受賞しますが、1968年、演説を行った4年後に暗殺され、39歳でその生涯を閉じました。",
    bodyHtml:"マーティン・ルーサー・キング牧師は、アメリカ南部で黒人差別が根強く残る時代に生まれました。牧師として働く一方、人種によって差別されることのない社会を目指す\u003cruby>公民権運動\u003crt>こうみんけんうんどう\u003c/rt>\u003c/ruby>の指導者として活動します。バスの座席を人種によって分けることに反対したバス・ボイコット運動をはじめ、非暴力の方法で差別に抗議し続けました。1963年、ワシントンで行われた大規模な行進の際、「私には夢がある」で知られる有名な演説を行い、肌の色で人を判断しない社会を築こうと訴えます。この演説は、翌年の公民権法制定につながる大きな力となりました。1964年にはノーベル平和賞を受賞しますが、1968年、演説を行った4年後に暗殺され、39歳でその生涯を閉じました。" },
  { id:"039-01", personId:"039", title:"27年の投獄を越えて大統領になった指導者", tags:["忍耐","和解","平等"],
    body:"ネルソン・マンデラは、南アフリカに生まれ、弁護士として活動する中で、人種によって権利が大きく制限される「アパルトヘイト」という差別政策に反対する運動に加わりました。政府への抵抗運動を続けたことで逮捕され、1962年からおよそ27年間にわたって刑務所に入れられます。長い獄中生活の中でも信念を曲げず、釈放後は南アフリカの黒人と白人の対立を乗り越えるための対話に力を尽くしました。1994年、南アフリカで初めてすべての人種が参加できる選挙が行われると、マンデラは同国初の黒人大統領に選ばれます。長年自分を苦しめた相手を憎むのではなく、許しと和解を選んだマンデラの姿勢は、世界中の人々に深い感銘を与えました。",
    bodyHtml:"ネルソン・マンデラは、南アフリカに生まれ、弁護士として活動する中で、人種によって権利が大きく制限される「アパルトヘイト」という差別政策に反対する運動に加わりました。政府への抵抗運動を続けたことで逮捕され、1962年からおよそ27年間にわたって刑務所に入れられます。長い\u003cruby>獄中生活\u003crt>ごくちゅうせいかつ\u003c/rt>\u003c/ruby>の中でも信念を曲げず、釈放後は南アフリカの黒人と白人の対立を乗り越えるための対話に力を尽くしました。1994年、南アフリカで初めてすべての人種が参加できる選挙が行われると、マンデラは同国初の黒人大統領に選ばれます。長年自分を苦しめた相手を憎むのではなく、許しと和解を選んだマンデラの姿勢は、世界中の人々に深い感銘を与えました。" },
  { id:"040-01", personId:"040", title:"巧みな外交でエジプトを守ろうとした女王", tags:["知略","外交","古代"],
    body:"クレオパトラは、古代エジプトを治めたプトレマイオス朝最後の女王です。幼いころから複数の言語を学び、優れた知性と教養を身につけていたと伝えられています。当時、地中海一帯で大きな力を持っていたローマとの関係を保ちながら、エジプトの独立を守ろうと巧みな外交を展開しました。ローマの指導者カエサルやアントニウスと手を結び、エジプトの繁栄を維持しようとしたことは、後世まで語り継がれる物語となっています。しかしローマとの戦いに敗れると、エジプトはローマの支配下に入ることになり、クレオパトラは紀元前30年、みずから命を絶ったと伝えられています。彼女の知略と存在感は、2000年以上たった今も多くの物語や芸術作品の題材になっています。",
    bodyHtml:"クレオパトラは、古代エジプトを治めた\u003cruby>プトレマイオス朝\u003crt>ぷとれまいおすちょう\u003c/rt>\u003c/ruby>最後の女王です。幼いころから複数の言語を学び、優れた知性と教養を身につけていたと伝えられています。当時、地中海一帯で大きな力を持っていたローマとの関係を保ちながら、エジプトの独立を守ろうと巧みな外交を展開しました。ローマの指導者カエサルやアントニウスと手を結び、エジプトの繁栄を維持しようとしたことは、後世まで語り継がれる物語となっています。しかしローマとの戦いに敗れると、エジプトはローマの支配下に入ることになり、クレオパトラは紀元前30年、みずから命を絶ったと伝えられています。彼女の知略と存在感は、2000年以上たった今も多くの物語や芸術作品の題材になっています。" },
  { id:"041-01", personId:"041", title:"17歳で軍を率いたフランスの少女", tags:["勇気","信念","中世"],
    body:"ジャンヌ・ダルクは、フランスの貧しい農家に生まれた少女です。当時、フランスはイギリスとの間で「百年戦争」と呼ばれる長い戦争を続け、劣勢に立たされていました。16歳のころ、ジャンヌは「フランスを救え」という神の声を聞いたと信じ、王太子のもとを訪ねて軍を率いることを願い出ます。当初は疑われましたが、その強い意志が認められ、鎧をまとって兵士たちの先頭に立つことになりました。オルレアンの戦いでフランス軍を勝利に導き、それまで劣勢だった戦況を大きく変えたことから「オルレアンの乙女」と呼ばれます。しかしその後イギリス側に捕らえられ、宗教裁判にかけられて、1431年、19歳の若さで処刑されました。彼女の勇気は、その後も長くフランスの人々の心に生き続けています。",
    bodyHtml:"ジャンヌ・ダルクは、フランスの貧しい農家に生まれた少女です。当時、フランスはイギリスとの間で「\u003cruby>百年戦争\u003crt>ひゃくねんせんそう\u003c/rt>\u003c/ruby>」と呼ばれる長い戦争を続け、劣勢に立たされていました。16歳のころ、ジャンヌは「フランスを救え」という神の声を聞いたと信じ、王太子のもとを訪ねて軍を率いることを願い出ます。当初は疑われましたが、その強い意志が認められ、鎧をまとって兵士たちの先頭に立つことになりました。オルレアンの戦いでフランス軍を勝利に導き、それまで劣勢だった戦況を大きく変えたことから「オルレアンの乙女」と呼ばれます。しかしその後イギリス側に捕らえられ、\u003cruby>宗教裁判\u003crt>しゅうきょうさいばん\u003c/rt>\u003c/ruby>にかけられて、1431年、19歳の若さで処刑されました。彼女の勇気は、その後も長くフランスの人々の心に生き続けています。" },
  { id:"042-01", personId:"042", title:"中国を初めて統一した皇帝", tags:["統一","改革","古代"],
    body:"始皇帝は、中国大陸に存在していた戦国時代の複数の国を次々と滅ぼし、紀元前221年、中国史上初めて統一国家を作り上げた人物です。「皇帝」という称号を初めて用い、みずからを始皇帝と名乗りました。国内でばらばらだった文字や貨幣、物差しの単位などを統一し、道路や運河を整備することで、広大な国を効率よく治めるしくみを作ります。北方の異民族の侵入を防ぐため、各地の城壁をつなげて「万里の長城」の建設を進めたことでも知られています。一方で、自分の考えに反する書物を焼き払ったり、反対する学者を処罰したりするなど、厳しい統治でも知られました。死後に発見された、兵士をかたどった大量の「兵馬俑」は、始皇帝の権力の大きさを今に伝えています。",
    bodyHtml:"始皇帝は、中国大陸に存在していた戦国時代の複数の国を次々と滅ぼし、紀元前221年、中国史上初めて統一国家を作り上げた人物です。「皇帝」という称号を初めて用い、みずからを始皇帝と名乗りました。国内でばらばらだった文字や貨幣、物差しの単位などを統一し、道路や運河を整備することで、広大な国を効率よく治めるしくみを作ります。北方の異民族の侵入を防ぐため、各地の城壁をつなげて「万里の長城」の建設を進めたことでも知られています。一方で、自分の考えに反する書物を焼き払ったり、反対する学者を処罰したりするなど、厳しい統治でも知られました。死後に発見された、兵士をかたどった大量の「\u003cruby>兵馬俑\u003crt>へいばよう\u003c/rt>\u003c/ruby>」は、始皇帝の権力の大きさを今に伝えています。" },
  { id:"043-01", personId:"043", title:"「モナ・リザ」に隠された謎多き天才", tags:["多才","絵画","発想力"],
    body:"レオナルド・ダ・ヴィンチは、イタリアの小さな町に生まれ、絵画だけでなく、彫刻、建築、解剖学、工学など、驚くほど幅広い分野に関心を持ち続けた人物です。代表作「モナ・リザ」は、微笑んでいるのか分からない謎めいた表情で知られ、今も世界中の人々を魅了しています。壁画「最後の晩餐」では、遠近法を巧みに使い、奥行きのある空間を平面の壁に描き出しました。ダ・ヴィンチは、人体の仕組みを知るために自ら解剖を行って詳細なスケッチを残したほか、空を飛ぶ機械や戦車のような装置の設計図も数多く描いています。実現しなかった発明も多くありましたが、その発想力の豊かさは、時代を大きく先取りしたものでした。",
    bodyHtml:"レオナルド・ダ・ヴィンチは、イタリアの小さな町に生まれ、絵画だけでなく、彫刻、建築、\u003cruby>解剖学\u003crt>かいぼうがく\u003c/rt>\u003c/ruby>、工学など、驚くほど幅広い分野に関心を持ち続けた人物です。代表作「モナ・リザ」は、微笑んでいるのか分からない謎めいた表情で知られ、今も世界中の人々を魅了しています。壁画「最後の晩餐」では、\u003cruby>遠近法\u003crt>えんきんほう\u003c/rt>\u003c/ruby>を巧みに使い、奥行きのある空間を平面の壁に描き出しました。ダ・ヴィンチは、人体の仕組みを知るために自ら解剖を行って詳細なスケッチを残したほか、空を飛ぶ機械や戦車のような装置の設計図も数多く描いています。実現しなかった発明も多くありましたが、その発想力の豊かさは、時代を大きく先取りしたものでした。" },
  { id:"044-01", personId:"044", title:"たった1人で描いたシスティーナ礼拝堂", tags:["彫刻","絵画","情熱"],
    body:"ミケランジェロは、イタリアのフィレンツェ近郊に生まれ、幼いころから彫刻家に弟子入りして修行を積みました。大理石の塊から人体の美しさを表現した彫刻「ダビデ像」は、高さ5メートルを超える傑作として今も多くの人を圧倒しています。ローマ教皇の依頼を受けたバチカンのシスティーナ礼拝堂では、天井画「天地創造」をたった一人でおよそ4年かけて描き上げました。高い足場の上で首を反らせながら描き続けた作業は非常に過酷で、体を痛めながらの制作だったと伝えられています。彫刻家として自分を強く意識していたミケランジェロですが、絵画や建築でも比類ない才能を発揮し、ルネサンス期を代表する芸術家となりました。",
    bodyHtml:"ミケランジェロは、イタリアのフィレンツェ近郊に生まれ、幼いころから彫刻家に弟子入りして修行を積みました。大理石の塊から人体の美しさを表現した彫刻「ダビデ像」は、高さ5メートルを超える傑作として今も多くの人を圧倒しています。ローマ教皇の依頼を受けたバチカンのシスティーナ\u003cruby>礼拝堂\u003crt>れいはいどう\u003c/rt>\u003c/ruby>では、天井画「天地創造」をたった一人でおよそ4年かけて描き上げました。高い足場の上で首を反らせながら描き続けた作業は非常に過酷で、体を痛めながらの制作だったと伝えられています。彫刻家として自分を強く意識していたミケランジェロですが、絵画や建築でも比類ない才能を発揮し、ルネサンス期を代表する芸術家となりました。" },
  { id:"045-01", personId:"045", title:"生前1枚しか売れなかった絵", tags:["絵画","情熱","苦悩"],
    body:"フィンセント・ファン・ゴッホは、オランダの牧師の家に生まれ、画商や伝道師など、さまざまな仕事を経験したのち、27歳になってから本格的に絵を描き始めました。力強い筆づかいと鮮やかな色彩で、「ひまわり」や「星月夜」など、今では誰もが知る名画を数多く残しています。生前は絵がほとんど売れず、貧しい生活を送りながら、弟テオからの経済的な支援に頼って制作を続けました。精神的な苦しみを抱え、自ら耳の一部を切り落とすという事件を起こしたこともあります。1890年、37歳で自ら命を絶ちましたが、その死後、作品の価値は世界中で認められるようになり、今では美術史上もっとも有名な画家の一人とされています。",
    bodyHtml:"フィンセント・ファン・ゴッホは、オランダの牧師の家に生まれ、画商や\u003cruby>伝道師\u003crt>でんどうし\u003c/rt>\u003c/ruby>など、さまざまな仕事を経験したのち、27歳になってから本格的に絵を描き始めました。力強い筆づかいと鮮やかな色彩で、「ひまわり」や「星月夜」など、今では誰もが知る名画を数多く残しています。生前は絵がほとんど売れず、貧しい生活を送りながら、弟テオからの経済的な支援に頼って制作を続けました。精神的な苦しみを抱え、自ら耳の一部を切り落とすという事件を起こしたこともあります。1890年、37歳で自ら命を絶ちましたが、その死後、作品の価値は世界中で認められるようになり、今では美術史上もっとも有名な画家の一人とされています。" },
  { id:"046-01", personId:"046", title:"天才と呼ばれた少年時代", tags:["絵画","挑戦","独創性"],
    body:"パブロ・ピカソは、スペインに生まれ、幼いころから絵の才能を発揮し、10代のうちに大人顔負けの写実的な絵を描いていました。しかし彼は伝統的な技法だけに満足せず、物の形を分解して多方向から描く「キュビスム」という新しい表現方法を仲間の画家とともに作り上げます。生涯に描いた作品はおよそ15万点にものぼるといわれ、絵画だけでなく彫刻や陶芸、舞台美術など幅広い分野で活躍しました。スペイン内戦中の悲惨な空爆を描いた大作「ゲルニカ」は、戦争の悲劇を伝える作品として世界的に知られています。90歳を過ぎても制作意欲は衰えず、生涯にわたって新しい表現に挑戦し続けたピカソは、20世紀を代表する芸術家となりました。",
    bodyHtml:"パブロ・ピカソは、スペインに生まれ、幼いころから絵の才能を発揮し、10代のうちに大人顔負けの写実的な絵を描いていました。しかし彼は伝統的な技法だけに満足せず、物の形を分解して多方向から描く「キュビスム」という新しい表現方法を仲間の画家とともに作り上げます。生涯に描いた作品はおよそ15万点にものぼるといわれ、絵画だけでなく彫刻や陶芸、舞台美術など幅広い分野で活躍しました。スペイン内戦中の悲惨な空爆を描いた大作「ゲルニカ」は、戦争の悲劇を伝える作品として世界的に知られています。90歳を過ぎても制作意欲は衰えず、生涯にわたって新しい表現に挑戦し続けたピカソは、20世紀を代表する芸術家となりました。" },
  { id:"047-01", personId:"047", title:"耳が聞こえなくなっても曲を作り続けた", tags:["音楽","苦難","情熱"],
    body:"ルートヴィヒ・ヴァン・ベートーヴェンは、ドイツに生まれ、幼いころから音楽家である父に厳しく指導され、ピアノの才能を伸ばしていきました。作曲家として活躍を始めた20代の終わりごろから、少しずつ耳が聞こえにくくなっていく病におそわれます。音楽家にとって致命的ともいえるこの困難に苦しみながらも、ベートーヴェンは作曲活動をやめませんでした。晩年、ほとんど耳が聞こえなくなった状態でも、有名な「交響曲第九番」をはじめとする数々の傑作を生み出し続けます。指揮台に立ち、観客の拍手に気づかず振り返らなかったという初演の逸話は、彼の苦悩と情熱を象徴するエピソードとして語り継がれています。",
    bodyHtml:"ルートヴィヒ・ヴァン・ベートーヴェンは、ドイツに生まれ、幼いころから音楽家である父に厳しく指導され、ピアノの才能を伸ばしていきました。作曲家として活躍を始めた20代の終わりごろから、少しずつ耳が聞こえにくくなっていく病におそわれます。音楽家にとって致命的ともいえるこの困難に苦しみながらも、ベートーヴェンは作曲活動をやめませんでした。晩年、ほとんど耳が聞こえなくなった状態でも、有名な「\u003cruby>交響曲\u003crt>こうきょうきょく\u003c/rt>\u003c/ruby>第九番」をはじめとする数々の傑作を生み出し続けます。指揮台に立ち、観客の拍手に気づかず振り返らなかったという初演の逸話は、彼の苦悩と情熱を象徴するエピソードとして語り継がれています。" },
  { id:"048-01", personId:"048", title:"5歳で作曲を始めた神童", tags:["音楽","才能","作曲"],
    body:"ヴォルフガング・アマデウス・モーツァルトは、オーストリアの音楽家の家に生まれ、5歳のころにはすでに作曲を始めていたといわれる神童でした。父に連れられてヨーロッパ各地を演奏旅行し、幼いころから王侯貴族の前で腕前を披露しています。生涯でおよそ600曲もの作品を作曲し、オペラ「フィガロの結婚」や「魔笛」、数多くの交響曲やピアノ曲など、あらゆる分野で傑作を残しました。曲を頭の中で完成させてから一気に楽譜に書き出したといわれるほど、驚異的な作曲の速さと才能を持っていたと伝えられています。しかし晩年は経済的に苦しい生活を送り、1791年、35歳という若さでこの世を去りました。",
    bodyHtml:"ヴォルフガング・アマデウス・モーツァルトは、オーストリアの音楽家の家に生まれ、5歳のころにはすでに作曲を始めていたといわれる神童でした。父に連れられてヨーロッパ各地を演奏旅行し、幼いころから王侯貴族の前で腕前を披露しています。生涯でおよそ600曲もの作品を作曲し、オペラ「フィガロの結婚」や「魔笛」、数多くの交響曲やピアノ曲など、あらゆる分野で傑作を残しました。曲を頭の中で完成させてから一気に楽譜に書き出したといわれるほど、驚異的な作曲の速さと才能を持っていたと伝えられています。しかし晩年は経済的に苦しい生活を送り、1791年、35歳という若さでこの世を去りました。" },
  { id:"049-01", personId:"049", title:"「音楽の父」と呼ばれる理由", tags:["音楽","探究心","伝統"],
    body:"ヨハン・ゼバスティアン・バッハは、ドイツの音楽一家に生まれ、幼いころから教会オルガンや作曲の技術を学びました。生涯の多くを教会の音楽家として過ごし、日曜日の礼拝のために次々と新しい曲を作曲し続けます。複数の旋律が独立しながらも美しく重なり合う「対位法」という作曲技法を極め、「フーガの技法」など、その後の音楽理論に大きな影響を与える作品を残しました。生前はオルガン奏者として高く評価されていたものの、作曲家としての名声はそれほど大きくありませんでした。しかし死後、メンデルスゾーンら後世の音楽家によって作品が再評価され、今では「音楽の父」と呼ばれるほど、西洋音楽の基礎を築いた重要な作曲家とされています。",
    bodyHtml:"ヨハン・ゼバスティアン・バッハは、ドイツの音楽一家に生まれ、幼いころから教会オルガンや作曲の技術を学びました。生涯の多くを教会の音楽家として過ごし、日曜日の礼拝のために次々と新しい曲を作曲し続けます。複数の旋律が独立しながらも美しく重なり合う「\u003cruby>対位法\u003crt>たいいほう\u003c/rt>\u003c/ruby>」という作曲技法を極め、「フーガの技法」など、その後の音楽理論に大きな影響を与える作品を残しました。生前はオルガン奏者として高く評価されていたものの、作曲家としての名声はそれほど大きくありませんでした。しかし死後、メンデルスゾーンら後世の音楽家によって作品が再評価され、今では「音楽の父」と呼ばれるほど、西洋音楽の基礎を築いた重要な作曲家とされています。" },
  { id:"050-01", personId:"050", title:"90歳まで筆を持ち続けた浮世絵師", tags:["絵画","探究心","浮世絵"],
    body:"葛飾北斎は、江戸に生まれた浮世絵師です。生涯で30回以上も名前を変えながら、90歳で亡くなるまでの長い人生を絵の探求に捧げました。代表作「富嶽三十六景」に収められた「神奈川沖浪裏」は、大きな波と富士山を描いた作品として、日本国内だけでなく海外の画家たちにも大きな影響を与えています。北斎は生涯におよそ3万点もの作品を残したといわれ、風景画のほか、動植物や人物、妖怪など、あらゆるものを題材にしました。晩年にも「あと5年生きられれば本当の絵師になれたのに」と語ったと伝えられるほど、最後まで絵の技術を追求し続けた姿勢は、今も多くの芸術家に尊敬されています。",
    bodyHtml:"葛飾北斎は、江戸に生まれた浮世絵師です。生涯で30回以上も名前を変えながら、90歳で亡くなるまでの長い人生を絵の探求に捧げました。代表作「\u003cruby>富嶽三十六景\u003crt>ふがくさんじゅうろっけい\u003c/rt>\u003c/ruby>」に収められた「\u003cruby>神奈川沖浪裏\u003crt>かながわおきなみうら\u003c/rt>\u003c/ruby>」は、大きな波と富士山を描いた作品として、日本国内だけでなく海外の画家たちにも大きな影響を与えています。北斎は生涯におよそ3万点もの作品を残したといわれ、風景画のほか、動植物や人物、妖怪など、あらゆるものを題材にしました。晩年にも「あと5年生きられれば本当の絵師になれたのに」と語ったと伝えられるほど、最後まで絵の技術を追求し続けた姿勢は、今も多くの芸術家に尊敬されています。" },
  { id:"051-01", personId:"051", title:"「東海道五十三次」を描いた旅の画家", tags:["絵画","観察力","浮世絵"],
    body:"歌川広重は、江戸の火消しの家に生まれた浮世絵師です。若いころに両親を亡くしましたが、絵師を志して修行を積み、風景画の分野で才能を開花させました。代表作「東海道五十三次」は、江戸と京都を結ぶ東海道の宿場町を、季節や天候の移り変わりとともに描いた連作で、旅の情緒あふれる作品として庶民の間で大変な人気を集めます。雨や雪、月夜といった自然の表情を繊細に描き分ける技術は、当時の他の絵師とは一線を画すものでした。広重の描いた風景画は、のちにヨーロッパの画家ゴッホやモネにも影響を与えたといわれ、日本の浮世絵が世界の美術に与えた大きな足跡の一つとなっています。",
    bodyHtml:"歌川広重は、江戸の火消しの家に生まれた浮世絵師です。若いころに両親を亡くしましたが、絵師を志して修行を積み、風景画の分野で才能を開花させました。代表作「\u003cruby>東海道五十三次\u003crt>とうかいどうごじゅうさんつぎ\u003c/rt>\u003c/ruby>」は、江戸と京都を結ぶ東海道の宿場町を、季節や天候の移り変わりとともに描いた連作で、旅の情緒あふれる作品として庶民の間で大変な人気を集めます。雨や雪、月夜といった自然の表情を繊細に描き分ける技術は、当時の他の絵師とは一線を画すものでした。広重の描いた風景画は、のちにヨーロッパの画家ゴッホやモネにも影響を与えたといわれ、日本の浮世絵が世界の美術に与えた大きな足跡の一つとなっています。" },
  { id:"052-01", personId:"052", title:"「芸術は爆発だ」の岡本太郎", tags:["芸術","情熱","独創性"],
    body:"岡本太郎は、東京に生まれ、漫画家の父と小説家の母のもとで育ちました。若いころにフランスに渡って美術と哲学を学び、伝統にとらわれない独自の芸術観を築いていきます。「芸術は爆発だ」という強烈な言葉とともに、力強く原色を使った絵画や彫刻を数多く生み出しました。代表作である1970年の大阪万博のシンボル「太陽の塔」は、高さ70メートルにおよぶ巨大なオブジェで、今も大阪に残り、多くの人に親しまれています。芸術は美しく飾るものではなく、見る人の心を強く揺さぶるものであるべきだという岡本の考え方は、日本の現代美術に大きな影響を与えました。",
    bodyHtml:"岡本太郎は、東京に生まれ、漫画家の父と小説家の母のもとで育ちました。若いころにフランスに渡って美術と哲学を学び、伝統にとらわれない独自の芸術観を築いていきます。「芸術は爆発だ」という強烈な言葉とともに、力強く原色を使った絵画や彫刻を数多く生み出しました。代表作である1970年の大阪万博のシンボル「太陽の塔」は、高さ70メートルにおよぶ巨大なオブジェで、今も大阪に残り、多くの人に親しまれています。芸術は美しく飾るものではなく、見る人の心を強く揺さぶるものであるべきだという岡本の考え方は、日本の現代美術に大きな影響を与えました。" },
  { id:"053-01", personId:"053", title:"世界最古とされる長編小説「源氏物語」", tags:["文学","観察力","古典"],
    body:"紫式部は、平安時代の貴族の娘として生まれ、幼いころから漢文学に親しみ、優れた学識を身につけました。夫を早くに亡くしたのち、一条天皇の后である彰子に仕える女房として宮中に上がります。宮中での生活を送りながら書き続けたのが、世界最古の長編小説ともいわれる『源氏物語』です。主人公・光源氏の恋愛や人生を、54帖という長い物語の中で丁寧に描き、当時の貴族社会の暮らしや人々の心の機微を生き生きと伝えています。同じ時代を生きた清少納言とはライバル関係にあったとも伝えられていますが、紫式部の残した物語は、その後1000年以上にわたって読み継がれ、今も世界中の言語に翻訳されています。",
    bodyHtml:"紫式部は、平安時代の貴族の娘として生まれ、幼いころから漢文学に親しみ、優れた学識を身につけました。夫を早くに亡くしたのち、一条天皇の后である彰子に仕える\u003cruby>女房\u003crt>にょうぼう\u003c/rt>\u003c/ruby>として宮中に上がります。宮中での生活を送りながら書き続けたのが、世界最古の長編小説ともいわれる『源氏物語』です。主人公・光源氏の恋愛や人生を、54帖という長い物語の中で丁寧に描き、当時の貴族社会の暮らしや人々の心の\u003cruby>機微\u003crt>きび\u003c/rt>\u003c/ruby>を生き生きと伝えています。同じ時代を生きた清少納言とはライバル関係にあったとも伝えられていますが、紫式部の残した物語は、その後1000年以上にわたって読み継がれ、今も世界中の言語に翻訳されています。" },
  { id:"054-01", personId:"054", title:"「枕草子」に見るセンスの良さ", tags:["文学","機知","古典"],
    body:"清少納言は、平安時代の貴族の娘に生まれ、教養豊かな家庭で育ちました。一条天皇の后である定子に仕える女房として宮中に上がり、聡明で機知に富んだ受け答えで定子に深く信頼されます。宮中での日々の出来事や、四季の美しさ、人や物事についての鋭い感想をつづったのが随筆『枕草子』です。「春はあけぼの」で始まる書き出しはあまりにも有名で、今も多くの教科書に載っています。「すさまじきもの（興ざめなもの）」など、独自の視点で物事を分類して語るセンスのよさは、平安時代から現代まで多くの読者の心をつかんでいます。紫式部の『源氏物語』とともに、日本の古典文学を代表する作品として今も愛されています。",
    bodyHtml:"清少納言は、平安時代の貴族の娘に生まれ、教養豊かな家庭で育ちました。一条天皇の后である定子に仕える女房として宮中に上がり、聡明で機知に富んだ受け答えで定子に深く信頼されます。宮中での日々の出来事や、四季の美しさ、人や物事についての鋭い感想をつづったのが\u003cruby>随筆\u003crt>ずいひつ\u003c/rt>\u003c/ruby>『枕草子』です。「春はあけぼの」で始まる書き出しはあまりにも有名で、今も多くの教科書に載っています。「すさまじきもの（興ざめなもの）」など、独自の視点で物事を分類して語るセンスのよさは、平安時代から現代まで多くの読者の心をつかんでいます。紫式部の『源氏物語』とともに、日本の古典文学を代表する作品として今も愛されています。" },
  { id:"055-01", personId:"055", title:"旅を住処とした俳人", tags:["俳句","旅","自然"],
    body:"松尾芭蕉は、伊賀国（今の三重県）の武士の家に生まれ、若いころから俳諧（俳句のもととなる文芸）に親しみました。江戸に出て俳諧師として活動する中で、それまで言葉遊びの要素が強かった俳諧に、深い趣や自然への感動を込める新しい作風を作り上げます。46歳のとき、江戸から東北・北陸地方を巡る長い旅に出て、その体験をもとに紀行文『おくのほそ道』を書き上げました。「旅を住処とする」という生き方を貫いた芭蕉は、各地の風景や人との出会いを、簡潔な言葉の中に凝縮した俳句で表現しています。「古池や蛙飛びこむ水の音」など、今も広く親しまれている句を数多く残し、俳句という文芸を芸術の域にまで高めた人物とされています。",
    bodyHtml:"松尾芭蕉は、伊賀国（今の三重県）の武士の家に生まれ、若いころから\u003cruby>俳諧\u003crt>はいかい\u003c/rt>\u003c/ruby>（俳句のもととなる文芸）に親しみました。江戸に出て俳諧師として活動する中で、それまで言葉遊びの要素が強かった俳諧に、深い趣や自然への感動を込める新しい作風を作り上げます。46歳のとき、江戸から東北・北陸地方を巡る長い旅に出て、その体験をもとに\u003cruby>紀行文\u003crt>きこうぶん\u003c/rt>\u003c/ruby>『おくのほそ道』を書き上げました。「旅を住処とする」という生き方を貫いた芭蕉は、各地の風景や人との出会いを、簡潔な言葉の中に凝縮した俳句で表現しています。「古池や蛙飛びこむ水の音」など、今も広く親しまれている句を数多く残し、俳句という文芸を芸術の域にまで高めた人物とされています。" },
  { id:"056-01", personId:"056", title:"「吾輩は猫である」誕生秘話", tags:["文学","近代","ユーモア"],
    body:"夏目漱石は、江戸（東京）に生まれ、東京帝国大学で英文学を学んだのち、教師としてイギリスに留学しました。慣れない異国での生活に強いストレスを感じ、神経をすり減らしたといわれるロンドン留学から帰国後、教師のかたわら小説を書き始めます。ネコの視点から人間社会を風刺した処女作『吾輩は猫である』は評判を呼び、以後、作家としての道を歩み始めました。友人に勧められて雑誌に発表したこの作品がきっかけとなり、その後『坊っちゃん』『こころ』など、日本の近代文学を代表する作品を次々と生み出します。人間の心の奥深さや近代化する社会への違和感を描いたその作品世界は、今も国語の教科書などを通じて多くの人に読み継がれています。",
    bodyHtml:"夏目漱石は、江戸（東京）に生まれ、東京帝国大学で英文学を学んだのち、教師としてイギリスに留学しました。慣れない異国での生活に強いストレスを感じ、神経をすり減らしたといわれるロンドン留学から帰国後、教師のかたわら小説を書き始めます。ネコの視点から人間社会を風刺した\u003cruby>処女作\u003crt>しょじょさく\u003c/rt>\u003c/ruby>『吾輩は猫である』は評判を呼び、以後、作家としての道を歩み始めました。友人に勧められて雑誌に発表したこの作品がきっかけとなり、その後『坊っちゃん』『こころ』など、日本の近代文学を代表する作品を次々と生み出します。人間の心の奥深さや近代化する社会への違和感を描いたその作品世界は、今も国語の教科書などを通じて多くの人に読み継がれています。" },
  { id:"057-01", personId:"057", title:"24歳で亡くなった天才作家", tags:["文学","努力","短い生涯"],
    body:"樋口一葉は、東京に生まれ、幼いころから和歌や古典文学に親しみましたが、家の事情で早くに学校をやめざるを得ませんでした。父と兄を相次いで亡くし、10代のうちに一家の生計を支える立場となった一葉は、生活のために小説を書き始めます。貧しい暮らしの中で執筆を続け、『たけくらべ』『にごりえ』など、庶民の暮らしや女性の心情を繊細に描いた作品を次々と発表しました。これらの作品は、発表当時から高い評価を受け、明治の文壇に大きな衝撃を与えます。しかし一葉自身は肺の病にかかり、1896年、わずか24歳の若さでこの世を去りました。短い生涯の中で残した作品は、今も日本文学史の中で高く評価され続けています。",
    bodyHtml:"樋口一葉は、東京に生まれ、幼いころから和歌や古典文学に親しみましたが、家の事情で早くに学校をやめざるを得ませんでした。父と兄を相次いで亡くし、10代のうちに一家の生計を支える立場となった一葉は、生活のために小説を書き始めます。貧しい暮らしの中で執筆を続け、『たけくらべ』『にごりえ』など、庶民の暮らしや女性の心情を繊細に描いた作品を次々と発表しました。これらの作品は、発表当時から高い評価を受け、明治の\u003cruby>文壇\u003crt>ぶんだん\u003c/rt>\u003c/ruby>に大きな衝撃を与えます。しかし一葉自身は肺の病にかかり、1896年、わずか24歳の若さでこの世を去りました。短い生涯の中で残した作品は、今も日本文学史の中で高く評価され続けています。" },
  { id:"058-01", personId:"058", title:"生前無名だった「銀河鉄道の夜」の作者", tags:["童話","自然","信念"],
    body:"宮沢賢治は、岩手県花巻に生まれ、農業や地質学を学んだのち、農学校の教師として働きながら詩や童話の創作を続けました。仏教への深い信仰と、自然や科学への強い関心を土台に、『銀河鉄道の夜』『注文の多い料理店』など、幻想的で心に残る物語を数多く書き上げます。教師をやめたあとは、農民の生活を少しでも豊かにしようと、自ら肥料の相談にのったり農業指導を行ったりと、地域のために尽力しました。しかし生前に発表された作品はわずかで、多くの原稿は無名のまま手元に残されたといいます。1933年、37歳で病のため亡くなったのち、遺された作品が次々と出版されて広く読まれるようになり、今では日本を代表する童話作家・詩人として国民的な人気を集めています。",
    bodyHtml:"宮沢賢治は、岩手県花巻に生まれ、農業や地質学を学んだのち、農学校の教師として働きながら詩や童話の創作を続けました。仏教への深い信仰と、自然や科学への強い関心を土台に、『銀河鉄道の夜』『注文の多い料理店』など、幻想的で心に残る物語を数多く書き上げます。教師をやめたあとは、農民の生活を少しでも豊かにしようと、自ら肥料の相談にのったり農業指導を行ったりと、地域のために尽力しました。しかし生前に発表された作品はわずかで、多くの原稿は無名のまま手元に残されたといいます。1933年、37歳で病のため亡くなったのち、遺された作品が次々と出版されて広く読まれるようになり、今では日本を代表する童話作家・詩人として国民的な人気を集めています。" },
  { id:"059-01", personId:"059", title:"謎に包まれた生涯と数々の名作", tags:["戯曲","人間観察","文学"],
    body:"ウィリアム・シェイクスピアは、イギリスの田舎町に生まれ、若いころにロンドンに出て劇団に加わり、俳優や劇作家として活動を始めました。生涯にわたって『ハムレット』『ロミオとジュリエット』『マクベス』など、今も世界中で上演され続ける数多くの戯曲を書き上げます。人間の欲望や嫉妬、愛情や裏切りといった感情を鋭く描き出したその作品は、時代や国を超えて多くの人の共感を呼びました。当時のロンドンには、彼の劇団が本拠地としていた「グローブ座」という劇場があり、身分の違う人々が同じ舞台を楽しんでいたと伝えられています。生涯についての詳しい記録が少なく、謎めいた部分も多い人物ですが、その作品は英語という言語そのものにも大きな影響を与えたとされています。",
    bodyHtml:"ウィリアム・シェイクスピアは、イギリスの田舎町に生まれ、若いころにロンドンに出て劇団に加わり、俳優や劇作家として活動を始めました。生涯にわたって『ハムレット』『ロミオとジュリエット』『マクベス』など、今も世界中で上演され続ける数多くの\u003cruby>戯曲\u003crt>ぎきょく\u003c/rt>\u003c/ruby>を書き上げます。人間の欲望や嫉妬、愛情や裏切りといった感情を鋭く描き出したその作品は、時代や国を超えて多くの人の共感を呼びました。当時のロンドンには、彼の劇団が本拠地としていた「グローブ座」という劇場があり、身分の違う人々が同じ舞台を楽しんでいたと伝えられています。生涯についての詳しい記録が少なく、謎めいた部分も多い人物ですが、その作品は英語という言語そのものにも大きな影響を与えたとされています。" },
  { id:"060-01", personId:"060", title:"靴屋の息子から童話作家へ", tags:["童話","挑戦","想像力"],
    body:"ハンス・クリスチャン・アンデルセンは、デンマークの貧しい靴屋の息子として生まれました。幼いころから物語や演劇に強いあこがれを抱き、14歳で単身コペンハーゲンに出て、俳優や作家を目指します。何度も挫折を味わいながらも創作を続け、『みにくいアヒルの子』『人魚姫』『裸の王様』など、今も世界中の子どもたちに愛される童話を数多く生み出しました。「みにくいアヒルの子」の物語には、周囲になじめず苦労を重ねたアンデルセン自身の少年時代が重ねられているといわれています。生涯結婚することはありませんでしたが、旅を愛し、ヨーロッパ各地を訪れながら創作のヒントを得ていました。彼の童話は160以上の言語に翻訳され、今も世界中で読み継がれています。",
    bodyHtml:"ハンス・クリスチャン・アンデルセンは、デンマークの貧しい靴屋の息子として生まれました。幼いころから物語や演劇に強いあこがれを抱き、14歳で単身コペンハーゲンに出て、俳優や作家を目指します。何度も挫折を味わいながらも創作を続け、『みにくいアヒルの子』『人魚姫』『裸の王様』など、今も世界中の子どもたちに愛される童話を数多く生み出しました。「みにくいアヒルの子」の物語には、周囲になじめず苦労を重ねたアンデルセン自身の少年時代が重ねられているといわれています。生涯結婚することはありませんでしたが、旅を愛し、ヨーロッパ各地を訪れながら創作のヒントを得ていました。彼の童話は160以上の言語に翻訳され、今も世界中で読み継がれています。" },
  { id:"062-01", personId:"062", title:"かくれ家から世界に届いた日記", tags:["勇気","平和","文学"],
    body:"アンネ・フランクはドイツで生まれ、家族とオランダに移りました。ユダヤ人を差別するナチスの支配が広がると、十三歳のとき、家族とともに建物の奥のかくれ家に入ります。外を自由に歩けない毎日でしたが、アンネは日記に、家族とのけんかや将来の夢、戦争への不安を正直に書き続けました。ラジオで戦争中の日記を集めるという話を聞き、自分の文章を本にしたいと考えて、書き直しにも取り組みます。しかし、かくれ家は見つかり、アンネは戦争が終わる前に亡くなりました。残された日記を父オットーがまとめて出版すると、世界中の人が一人の少女の声に耳をかたむけました。戦争は、ふつうの子どもの暮らしや夢までうばいます。アンネの言葉は、平和と人を大切にすることを今も読者に問いかけています。",
    bodyHtml:"アンネ・フランクはドイツで生まれ、家族とオランダに移りました。\u003cruby>ユダヤ人\u003crt>ゆだやじん\u003c/rt>\u003c/ruby>を\u003cruby>差別\u003crt>さべつ\u003c/rt>\u003c/ruby>する\u003cruby>ナチス\u003crt>なちす\u003c/rt>\u003c/ruby>の\u003cruby>支配\u003crt>しはい\u003c/rt>\u003c/ruby>が広がると、十三歳のとき、家族とともに建物の奥のかくれ家に入ります。外を自由に歩けない毎日でしたが、アンネは日記に、家族とのけんかや将来の夢、戦争への不安を正直に書き続けました。ラジオで戦争中の日記を集めるという話を聞き、自分の文章を本にしたいと考えて、書き直しにも取り組みます。しかし、かくれ家は見つかり、アンネは戦争が終わる前に亡くなりました。残された日記を父オットーがまとめて\u003cruby>出版\u003crt>しゅっぱん\u003c/rt>\u003c/ruby>すると、世界中の人が一人の少女の声に耳をかたむけました。戦争は、ふつうの子どもの暮らしや夢までうばいます。アンネの言葉は、平和と人を大切にすることを今も読者に問いかけています。" },
  { id:"063-01", personId:"063", title:"目の前の一人に手を差しのべて", tags:["福祉","行動力","平等"],
    body:"マザー・テレサは、今の北マケドニアにあたる町で生まれました。若いころに修道女となり、インドのコルカタで学校の先生をしていました。町の中で、食べ物や住む場所に困る人たちを見て、教室の外でも力になりたいと考えます。学校を出て、病気の人や身寄りのない人を助ける活動を始めました。やがて仲間と「神の愛の宣教者会」をつくり、子どもや病気の人のための施設を開きます。お金や物が十分になくても、まず目の前の一人に声をかけ、そばにいることを大切にしました。活動が世界に広がり、ノーベル平和賞を受けた後も、その姿勢は変わりませんでした。遠くの大きな問題に心を痛めるだけでなく、近くで困っている人に気づいて行動する。その一歩の大切さを、彼女の生き方は教えてくれます。",
    bodyHtml:"マザー・テレサは、今の北マケドニアにあたる町で生まれました。若いころに\u003cruby>修道女\u003crt>しゅうどうじょ\u003c/rt>\u003c/ruby>となり、インドのコルカタで学校の先生をしていました。町の中で、食べ物や住む場所に困る人たちを見て、教室の外でも力になりたいと考えます。学校を出て、病気の人や\u003cruby>身寄り\u003crt>みより\u003c/rt>\u003c/ruby>のない人を助ける活動を始めました。やがて仲間と「神の愛の\u003cruby>宣教者会\u003crt>せんきょうしゃかい\u003c/rt>\u003c/ruby>」をつくり、子どもや病気の人のための\u003cruby>施設\u003crt>しせつ\u003c/rt>\u003c/ruby>を開きます。お金や物が十分になくても、まず目の前の一人に声をかけ、そばにいることを大切にしました。活動が世界に広がり、ノーベル平和賞を受けた後も、その姿勢は変わりませんでした。遠くの大きな問題に心を痛めるだけでなく、近くで困っている人に気づいて行動する。その一歩の大切さを、彼女の生き方は教えてくれます。" },
  { id:"064-01", personId:"064", title:"数字で病院を変えた看護師", tags:["医学","観察力","行動力"],
    body:"ナイチンゲールはイギリスの豊かな家に生まれました。当時、看護の仕事は女性が専門的に学ぶ道として認められにくいものでしたが、強い思いで勉強を続けます。クリミア戦争が始まると、仲間の看護師たちと兵士の病院へ向かいました。夜も患者を見回る姿から「ランプを持つ貴婦人」と呼ばれます。けれども、彼女の仕事は手当てだけではありません。病院の水や衛生の問題に目を向け、何が原因で人が亡くなるのかを数字で調べました。戦場でのけがより病気による死が多いことを、色分けした図でわかりやすく示したのです。戦争後も病院や軍のしくみをよくするために働き、看護を学ぶ学校も開きました。思いやりに観察と数字を組み合わせれば、もっと多くの命を守れると示した人です。",
    bodyHtml:"ナイチンゲールはイギリスの豊かな家に生まれました。当時、\u003cruby>看護\u003crt>かんご\u003c/rt>\u003c/ruby>の仕事は女性が\u003cruby>専門的\u003crt>せんもんてき\u003c/rt>\u003c/ruby>に学ぶ道として認められにくいものでしたが、強い思いで勉強を続けます。クリミア戦争が始まると、仲間の看護師たちと兵士の病院へ向かいました。夜も患者を見回る姿から「ランプを持つ\u003cruby>貴婦人\u003crt>きふじん\u003c/rt>\u003c/ruby>」と呼ばれます。けれども、彼女の仕事は手当てだけではありません。病院の水や\u003cruby>衛生\u003crt>えいせい\u003c/rt>\u003c/ruby>の問題に目を向け、何が原因で人が亡くなるのかを数字で調べました。戦場でのけがより病気による死が多いことを、色分けした図でわかりやすく示したのです。戦争後も病院や軍のしくみをよくするために働き、看護を学ぶ学校も開きました。思いやりに観察と数字を組み合わせれば、もっと多くの命を守れると示した人です。" },
  { id:"065-01", personId:"065", title:"音楽家から医師へ、森の病院へ", tags:["医学","福祉","信念"],
    body:"シュヴァイツァーは、今のフランスにあたる地域で育ちました。大学で宗教を学び、オルガンの演奏家としても活躍していましたが、病気で苦しむ人の力になりたいと、三十歳になってから医学を学び始めます。医師になった後、妻とともにアフリカのガボンへ渡り、ランバレネに病院を開きました。薬も設備も十分ではなく、建物を整えたり、患者の食事を用意したりする仕事も必要でした。ヨーロッパで演奏会を開いて集めたお金を、病院の運営にも使います。彼は人だけでなく、あらゆる命を大切にする「生命への畏敬」という考えを広めました。ノーベル平和賞を受けた後も、病院で働き続けます。得意な音楽と新しく学んだ医学の両方を使い、遠くの人の命を支えた生き方は、学び直す勇気を教えてくれます。",
    bodyHtml:"シュヴァイツァーは、今のフランスにあたる地域で育ちました。大学で宗教を学び、オルガンの演奏家としても活躍していましたが、病気で苦しむ人の力になりたいと、三十歳になってから\u003cruby>医学\u003crt>いがく\u003c/rt>\u003c/ruby>を学び始めます。医師になった後、妻とともにアフリカのガボンへ渡り、ランバレネに病院を開きました。薬も\u003cruby>設備\u003crt>せつび\u003c/rt>\u003c/ruby>も十分ではなく、建物を整えたり、患者の食事を用意したりする仕事も必要でした。ヨーロッパで演奏会を開いて集めたお金を、病院の\u003cruby>運営\u003crt>うんえい\u003c/rt>\u003c/ruby>にも使います。彼は人だけでなく、あらゆる命を大切にする「\u003cruby>生命への畏敬\u003crt>せいめいへのいけい\u003c/rt>\u003c/ruby>」という考えを広めました。ノーベル平和賞を受けた後も、病院で働き続けます。得意な音楽と新しく学んだ医学の両方を使い、遠くの人の命を支えた生き方は、学び直す勇気を教えてくれます。" },
  { id:"066-01", personId:"066", title:"人々の命をつないだ通過ビザ", tags:["勇気","平和","行動力"],
    body:"杉原千畝は、外国との仕事をする日本の外交官でした。第二次世界大戦中、リトアニアの町カウナスで働いていたとき、ナチスから逃げてきたユダヤ人たちが日本領事館に集まりました。別の国へ行くために、日本を通る許可証「ビザ」が必要だったのです。杉原は本国に相談しましたが、決められた条件を満たさない人への発給は認められませんでした。それでも目の前の人々を見捨てられず、通過ビザを出し続けます。家族も手伝い、毎日たくさんの名前を紙に書きました。このビザによって逃れた人はおよそ六千人といわれています。戦争が終わって長い年月がたってから、その行動は広く知られるようになりました。大きな決まりと目の前の命の間で悩みながら、自分にできることを選んだ外交官です。",
    bodyHtml:"\u003cruby>杉原千畝\u003crt>すぎはらちうね\u003c/rt>\u003c/ruby>は、外国との仕事をする日本の\u003cruby>外交官\u003crt>がいこうかん\u003c/rt>\u003c/ruby>でした。第二次世界大戦中、リトアニアの町カウナスで働いていたとき、ナチスから逃げてきたユダヤ人たちが日本\u003cruby>領事館\u003crt>りょうじかん\u003c/rt>\u003c/ruby>に集まりました。別の国へ行くために、日本を通る\u003cruby>許可証\u003crt>きょかしょう\u003c/rt>\u003c/ruby>「ビザ」が必要だったのです。杉原は本国に相談しましたが、決められた条件を満たさない人への\u003cruby>発給\u003crt>はっきゅう\u003c/rt>\u003c/ruby>は認められませんでした。それでも目の前の人々を見捨てられず、通過ビザを出し続けます。家族も手伝い、毎日たくさんの名前を紙に書きました。このビザによって逃れた人はおよそ六千人といわれています。戦争が終わって長い年月がたってから、その行動は広く知られるようになりました。大きな決まりと目の前の命の間で悩みながら、自分にできることを選んだ外交官です。" },
  { id:"067-01", personId:"067", title:"医師が砂漠に水路を引いた理由", tags:["医学","福祉","協力"],
    body:"中村哲は、日本で医師となり、パキスタンやアフガニスタンで病気の人を診ていました。ところが、長い干ばつで飲み水も農業用の水も足りなくなると、薬だけでは人々の暮らしを守れないと気づきます。そこで現地の人たちと力を合わせ、川から田畑へ水を運ぶ用水路づくりを始めました。土や石を使い、昔から日本で使われてきた水の取り入れ方も参考にしました。医師が土木工事に取り組むことをふしぎに思う人もいましたが、中村は「水があれば、病気や飢えを防げる」と考えたのです。工事は簡単ではなく、洪水でこわれた場所を直すこともありました。それでも仲間と作業を続けると、乾いた土地に畑と緑がもどってきました。人々と一緒に考え、必要な仕事を選ぶ。その行動は今も受けつがれています。",
    bodyHtml:"\u003cruby>中村哲\u003crt>なかむらてつ\u003c/rt>\u003c/ruby>は、日本で医師となり、パキスタンやアフガニスタンで病気の人を診ていました。ところが、長い\u003cruby>干ばつ\u003crt>かんばつ\u003c/rt>\u003c/ruby>で飲み水も農業用の水も足りなくなると、薬だけでは人々の暮らしを守れないと気づきます。そこで現地の人たちと力を合わせ、川から田畑へ水を運ぶ\u003cruby>用水路\u003crt>ようすいろ\u003c/rt>\u003c/ruby>づくりを始めました。土や石を使い、昔から日本で使われてきた水の取り入れ方も参考にしました。医師が\u003cruby>土木工事\u003crt>どぼくこうじ\u003c/rt>\u003c/ruby>に取り組むことをふしぎに思う人もいましたが、中村は「水があれば、病気や飢えを防げる」と考えたのです。工事は簡単ではなく、\u003cruby>洪水\u003crt>こうずい\u003c/rt>\u003c/ruby>でこわれた場所を直すこともありました。それでも仲間と作業を続けると、乾いた土地に畑と緑がもどってきました。人々と一緒に考え、必要な仕事を選ぶ。その行動は今も受けつがれています。" },
  { id:"068-01", personId:"068", title:"鎌倉を守るために語りかけた女性", tags:["政治","勇気","行動力"],
    body:"北条政子は、平安時代の終わりに伊豆で生まれました。のちに鎌倉幕府を開く源頼朝と結婚し、その政治を支えます。頼朝が亡くなると、政子は髪を短くして尼になりましたが、政治の世界からは離れませんでした。息子たちも亡くなり、幕府の先行きが見えない中で、家族や武士たちの間をまとめようとします。やがて京都の朝廷が幕府と戦うことになった承久の乱では、動揺する武士たちに、頼朝から受けた恩を思い出すよう語りかけました。その言葉に力を得た武士たちは結束し、幕府を守ります。この演説の細かな言い回しは後に書かれた記録によって伝わるものですが、政子が大きな役割を果たしたことは確かです。「尼将軍」と呼ばれた政子は、女性が政治の表に立つことの少ない時代に、鎌倉を支え続けました。",
    bodyHtml:"\u003cruby>北条政子\u003crt>ほうじょうまさこ\u003c/rt>\u003c/ruby>は、平安時代の終わりに\u003cruby>伊豆\u003crt>いず\u003c/rt>\u003c/ruby>で生まれました。のちに\u003cruby>鎌倉幕府\u003crt>かまくらばくふ\u003c/rt>\u003c/ruby>を開く源頼朝と結婚し、その政治を支えます。頼朝が亡くなると、政子は髪を短くして\u003cruby>尼\u003crt>あま\u003c/rt>\u003c/ruby>になりましたが、政治の世界からは離れませんでした。息子たちも亡くなり、幕府の先行きが見えない中で、家族や武士たちの間をまとめようとします。やがて京都の\u003cruby>朝廷\u003crt>ちょうてい\u003c/rt>\u003c/ruby>が幕府と戦うことになった\u003cruby>承久の乱\u003crt>じょうきゅうのらん\u003c/rt>\u003c/ruby>では、\u003cruby>動揺\u003crt>どうよう\u003c/rt>\u003c/ruby>する武士たちに、頼朝から受けた恩を思い出すよう語りかけました。その言葉に力を得た武士たちは結束し、幕府を守ります。この演説の細かな言い回しは後に書かれた記録によって伝わるものですが、政子が大きな役割を果たしたことは確かです。「\u003cruby>尼将軍\u003crt>あましょうぐん\u003c/rt>\u003c/ruby>」と呼ばれた政子は、女性が政治の表に立つことの少ない時代に、鎌倉を支え続けました。" },
  { id:"070-01", personId:"070", title:"投げることも打つことも選んだ", tags:["挑戦","努力","スポーツ"],
    body:"大谷翔平は岩手県で育ち、子どものころから野球に親しみました。高校では、大きな目標を真ん中に書き、そのために必要なことを周りに並べる表を作ります。練習のほかに、体づくりや心がまえなども書きこみ、目標を毎日の行動に変えました。プロ入りを決めるとき、大谷は投手か打者のどちらか一つを選ぶよう勧められることもありました。それでも両方を続けたいという思いを伝え、日本のプロ野球で「二刀流」に挑みます。アメリカの大リーグでも、けがや手術を経験しながら、投げることと打つことの両方に取り組みました。活躍は多くの人を驚かせ、野球の可能性を広げています。将来の記録はまだ変わりますが、目標を細かく分けて続ける姿勢と、前例の少ない道へ進む勇気は、今の大谷を知る手がかりになります。",
    bodyHtml:"\u003cruby>大谷翔平\u003crt>おおたにしょうへい\u003c/rt>\u003c/ruby>は\u003cruby>岩手県\u003crt>いわてけん\u003c/rt>\u003c/ruby>で育ち、子どものころから野球に親しみました。高校では、大きな目標を真ん中に書き、そのために必要なことを周りに並べる表を作ります。練習のほかに、体づくりや心がまえなども書きこみ、目標を毎日の行動に変えました。プロ入りを決めるとき、大谷は\u003cruby>投手\u003crt>とうしゅ\u003c/rt>\u003c/ruby>か\u003cruby>打者\u003crt>だしゃ\u003c/rt>\u003c/ruby>のどちらか一つを選ぶよう勧められることもありました。それでも両方を続けたいという思いを伝え、日本のプロ野球で「\u003cruby>二刀流\u003crt>にとうりゅう\u003c/rt>\u003c/ruby>」に挑みます。アメリカの大リーグでも、けがや\u003cruby>手術\u003crt>しゅじゅつ\u003c/rt>\u003c/ruby>を経験しながら、投げることと打つことの両方に取り組みました。活躍は多くの人を驚かせ、野球の可能性を広げています。将来の記録はまだ変わりますが、目標を細かく分けて続ける姿勢と、前例の少ない道へ進む勇気は、今の大谷を知る手がかりになります。" },
  { id:"071-01", personId:"071", title:"一本足で打ち続けたホームラン", tags:["努力","忍耐","スポーツ"],
    body:"王貞治は東京で育ち、野球が大好きな少年でした。高校では投手としても活躍し、卒業後に読売ジャイアンツへ入ります。しかし、打者としては思うような結果が出ず、悩む時期が続きました。そこでコーチの荒川博と、バットの振り方や体の使い方を何度も練習します。片足を高く上げてから打つ「一本足打法」に取り組み始めると、ボールをとらえる力が少しずつ増していきました。練習では、自分の動きをくり返し確かめ、うまくいかない日も工夫をやめませんでした。やがて王は日本のプロ野球で通算八百六十八本のホームランを打ち、世界的に知られる選手になります。一つの形をまねするだけではなく、毎日考えながら練習を重ねたことが、特別な記録につながりました。引退後も野球を教え、次の世代を育てています。",
    bodyHtml:"\u003cruby>王貞治\u003crt>おうさだはる\u003c/rt>\u003c/ruby>は東京で育ち、野球が大好きな少年でした。高校では投手としても活躍し、卒業後に\u003cruby>読売\u003crt>よみうり\u003c/rt>\u003c/ruby>ジャイアンツへ入ります。しかし、打者としては思うような結果が出ず、悩む時期が続きました。そこでコーチの\u003cruby>荒川博\u003crt>あらかわひろし\u003c/rt>\u003c/ruby>と、バットの振り方や体の使い方を何度も練習します。片足を高く上げてから打つ「\u003cruby>一本足打法\u003crt>いっぽんあしだほう\u003c/rt>\u003c/ruby>」に取り組み始めると、ボールをとらえる力が少しずつ増していきました。練習では、自分の動きをくり返し確かめ、うまくいかない日も工夫をやめませんでした。やがて王は日本のプロ野球で\u003cruby>通算\u003crt>つうさん\u003c/rt>\u003c/ruby>八百六十八本のホームランを打ち、世界的に知られる選手になります。一つの形をまねするだけではなく、毎日考えながら練習を重ねたことが、特別な記録につながりました。引退後も野球を教え、次の世代を育てています。" },
  { id:"072-01", personId:"072", title:"東京の大舞台を走りぬいた選手", tags:["努力","忍耐","スポーツ"],
    body:"円谷幸吉は福島県で育ち、走ることに打ちこみました。自衛隊に入ってからも長い距離を走る練習を重ね、国内の大会で力をつけます。東京でオリンピックが開かれた一九六四年、円谷はマラソンの日本代表に選ばれました。街道にはたくさんの人が集まり、日本の選手を応援します。四十二キロをこえる道のりを走り、競技場へもどってきた円谷は、最後まであきらめずにゴールを目指しました。結果は三位で、銅メダルを手にします。同じ大会では一万メートルにも出場し、二つの長距離種目に挑戦しました。速く走るためには、毎日の地道な練習だけでなく、体の調子を整えることも欠かせません。大勢の期待の中でも、自分の力を出し切ろうとした走りは、日本のオリンピックの歴史に残っています。",
    bodyHtml:"\u003cruby>円谷幸吉\u003crt>つぶらやこうきち\u003c/rt>\u003c/ruby>は\u003cruby>福島県\u003crt>ふくしまけん\u003c/rt>\u003c/ruby>で育ち、走ることに打ちこみました。\u003cruby>自衛隊\u003crt>じえいたい\u003c/rt>\u003c/ruby>に入ってからも長い距離を走る練習を重ね、国内の大会で力をつけます。東京でオリンピックが開かれた一九六四年、円谷はマラソンの日本代表に選ばれました。\u003cruby>街道\u003crt>かいどう\u003c/rt>\u003c/ruby>にはたくさんの人が集まり、日本の選手を応援します。四十二キロをこえる道のりを走り、\u003cruby>競技場\u003crt>きょうぎじょう\u003c/rt>\u003c/ruby>へもどってきた円谷は、最後まであきらめずにゴールを目指しました。結果は三位で、\u003cruby>銅\u003crt>どう\u003c/rt>\u003c/ruby>メダルを手にします。同じ大会では一万メートルにも出場し、二つの長距離種目に挑戦しました。速く走るためには、毎日の地道な練習だけでなく、体の調子を整えることも欠かせません。大勢の期待の中でも、自分の力を出し切ろうとした走りは、日本のオリンピックの歴史に残っています。" },
  { id:"001-02", personId:"001", title:"もうひとつのエピソード", tags:["医学"],
    body:"野口英世は1歳の時に囲炉裏に落ち、左手にひどいやけどを負った。指がくっついて自由に動かせなくなった手を、周りの子どもたちは「てんぼう」とからかった。悔しさをばねに勉強に打ち込んだ英世は、少年時代に手術を受けて指を動かせるようになったことに感動し、医学の道を志す。貧しさゆえに何度も苦学を強いられながらも、アメリカへ渡って研究者としての道を切り開き、蛇毒や黄熱病など、当時の医学では手に負えなかった病の研究に生涯を捧げた。故郷の母シカが拙い文字で「はやくきてくたされ」と綴った手紙は、今も多くの人の胸を打つ逸話として知られている。最後はアフリカのガーナで自らも黄熱病に感染し、51歳で志半ばで命を落としたが、その情熱は今も多くの人を励まし続けている。帰国前は北里柴三郎の伝染病研究所でも学び、渡米後はロックフェラー医学研究所で確かな地位を築いた。功績を讃え、2004年発行の千円紙幣の肖像にも選ばれている。",
    bodyHtml:"野口英世は1歳の時に囲炉裏に落ち、左手にひどいやけどを負った。指がくっついて自由に動かせなくなった手を、周りの子どもたちは「てんぼう」とからかった。悔しさをばねに勉強に打ち込んだ英世は、少年時代に手術を受けて指を動かせるようになったことに感動し、医学の道を志す。貧しさゆえに何度も苦学を強いられながらも、アメリカへ渡って研究者としての道を切り開き、蛇毒や黄熱病など、当時の医学では手に負えなかった病の研究に生涯を捧げた。故郷の母シカが拙い文字で「はやくきてくたされ」と綴った手紙は、今も多くの人の胸を打つ逸話として知られている。最後はアフリカのガーナで自らも黄熱病に感染し、51歳で志半ばで命を落としたが、その情熱は今も多くの人を励まし続けている。帰国前は北里柴三郎の伝染病研究所でも学び、渡米後はロックフェラー医学研究所で確かな地位を築いた。功績を讃え、2004年発行の千円紙幣の肖像にも選ばれている。", source:"legacy", sourceId:"001" },
  { id:"006-02", personId:"006", title:"もうひとつのエピソード", tags:["科学"],
    body:"ポーランドの貧しい家庭に生まれたマリー・キュリーは、女性が大学で学ぶことすら難しかった時代に、パリへ渡って物理学と数学を学んだ。夫ピエールと出会い、二人でウランという鉱物から出る不思議な放射線の研究に没頭する。粗末な物置小屋を実験室代わりに、何トンものピッチブレンドという鉱石を毎日かき混ぜて煮詰め続け、1898年、ついに新元素ラジウムとポロニウムを発見した。過酷な労働と放射線への被曝で体をむしばまれながらも研究をやめず、1903年に女性として初めてノーベル賞を受賞し、1911年には分野の異なる化学賞で二度目の受賞まで果たした。第一次世界大戦中は移動式レントゲン車を考案して負傷兵の治療にも貢献し、娘イレーヌもまたノーベル賞を受賞するなど、親子二代にわたって科学史に名を残す偉大な研究者である。現在では放射線の量を表す単位「キュリー」にもその名が残されている。",
    bodyHtml:"ポーランドの貧しい家庭に生まれたマリー・キュリーは、女性が大学で学ぶことすら難しかった時代に、パリへ渡って物理学と数学を学んだ。夫ピエールと出会い、二人でウランという鉱物から出る不思議な放射線の研究に没頭する。粗末な物置小屋を実験室代わりに、何トンものピッチブレンドという鉱石を毎日かき混ぜて煮詰め続け、1898年、ついに新元素ラジウムとポロニウムを発見した。過酷な労働と放射線への被曝で体をむしばまれながらも研究をやめず、1903年に女性として初めてノーベル賞を受賞し、1911年には分野の異なる化学賞で二度目の受賞まで果たした。第一次世界大戦中は移動式レントゲン車を考案して負傷兵の治療にも貢献し、娘イレーヌもまたノーベル賞を受賞するなど、親子二代にわたって科学史に名を残す偉大な研究者である。現在では放射線の量を表す単位「キュリー」にもその名が残されている。", source:"legacy", sourceId:"006" },
  { id:"007-02", personId:"007", title:"もうひとつのエピソード", tags:["科学"],
    body:"幼い頃のアインシュタインは言葉を話すのが遅く、学校の成績も目立って優秀というわけではなかった。大学卒業後は望んだ研究職に就けず、スイスの特許庁でつつましく働きながら、余暇の時間にひたすら物理学の謎を考え続けた。誰の指導も受けず、たった一人で1905年に光量子仮説・ブラウン運動・特殊相対性理論という三つの画期的な論文を発表し、この年は後に「奇跡の年」と呼ばれるようになる。1919年の皆既日食の観測によって一般相対性理論の正しさが証明されると、世界的な名声を得た。1921年に受賞したノーベル物理学賞は、実は相対性理論ではなく光電効果の研究に対して贈られたものである。ユダヤ人であったため後にナチス政権下のドイツを追われてアメリカへ亡命し、20世紀を代表する科学者として世界中の人々に知られることとなった。スイス特許庁時代は「三級技術専門職員」という地味な肩書だったことも、後の飛躍とのギャップとしてよく語られる。",
    bodyHtml:"幼い頃のアインシュタインは言葉を話すのが遅く、学校の成績も目立って優秀というわけではなかった。大学卒業後は望んだ研究職に就けず、スイスの特許庁でつつましく働きながら、余暇の時間にひたすら物理学の謎を考え続けた。誰の指導も受けず、たった一人で1905年に光量子仮説・ブラウン運動・特殊相対性理論という三つの画期的な論文を発表し、この年は後に「奇跡の年」と呼ばれるようになる。1919年の皆既日食の観測によって一般相対性理論の正しさが証明されると、世界的な名声を得た。1921年に受賞したノーベル物理学賞は、実は相対性理論ではなく光電効果の研究に対して贈られたものである。ユダヤ人であったため後にナチス政権下のドイツを追われてアメリカへ亡命し、20世紀を代表する科学者として世界中の人々に知られることとなった。スイス特許庁時代は「三級技術専門職員」という地味な肩書だったことも、後の飛躍とのギャップとしてよく語られる。", source:"legacy", sourceId:"007" },
  { id:"014-02", personId:"014", title:"もうひとつのエピソード", tags:["発明"],
    body:"エジソンは小学校で「頭が悪い」と教師に見放され、わずか3か月で退学させられてしまう。しかし母親が家庭教師となって彼の好奇心を育て、独学で科学や技術を学ばせ続けた。少年時代から新聞売りや電信技手として働きながら発明に打ち込み、実用的な電球を作るために、フィラメントの材料としてなんと1000種類以上もの素材を試したと言われている。ニュージャージー州メンロパークに研究所を構え、「発明工場」と呼ばれる組織的な開発体制を築いたことでも知られる。「天才とは1パーセントのひらめきと99パーセントの努力である」という言葉どおり、彼は生涯に1300以上もの特許を取得し、電球・蓄音機・映写機など、現代の暮らしを支える数々の発明を世に送り出した「発明王」として知られている。白熱電球の実用化に成功したのは1879年、フィラメントに日本産の竹を炭化させたものを使ったことでも知られている。",
    bodyHtml:"エジソンは小学校で「頭が悪い」と教師に見放され、わずか3か月で退学させられてしまう。しかし母親が家庭教師となって彼の好奇心を育て、独学で科学や技術を学ばせ続けた。少年時代から新聞売りや電信技手として働きながら発明に打ち込み、実用的な電球を作るために、フィラメントの材料としてなんと1000種類以上もの素材を試したと言われている。ニュージャージー州メンロパークに研究所を構え、「発明工場」と呼ばれる組織的な開発体制を築いたことでも知られる。「天才とは1パーセントのひらめきと99パーセントの努力である」という言葉どおり、彼は生涯に1300以上もの特許を取得し、電球・蓄音機・映写機など、現代の暮らしを支える数々の発明を世に送り出した「発明王」として知られている。白熱電球の実用化に成功したのは1879年、フィラメントに日本産の竹を炭化させたものを使ったことでも知られている。", source:"legacy", sourceId:"014" },
  { id:"026-02", personId:"026", title:"もうひとつのエピソード", tags:["政治"],
    body:"土佐藩の下級武士の家に生まれた坂本龍馬は、身分にとらわれない自由な発想の持ち主だった。江戸で剣術を学んだ後、勝海舟に弟子入りして航海術を身につけ、日本初の商社ともいわれる「亀山社中（後の海援隊）」を結成する。当時、犬猿の仲だった薩摩藩と長州藩の間を取り持ち、倒幕への大きな一歩となる「薩長同盟」を成立させたことは、彼の最大の功績として知られている。さらに船の中で構想したとされる「船中八策」をもとに、徳川幕府から朝廷へ政権を返す「大政奉還」の考えを説き、議会制度を備えた新しい日本のかたちを構想した。しかしその実現を見届けることなく、1867年、京都近江屋にて何者かに暗殺され、33歳の若さで生涯を終えた。亀山社中では武器や物資の運搬に加え商社としての海運業も手がけ、日本初の株式会社ともいわれている。妻おりょうと霧島温泉を訪れたことは、日本初の新婚旅行ともいわれる。",
    bodyHtml:"土佐藩の下級武士の家に生まれた坂本龍馬は、身分にとらわれない自由な発想の持ち主だった。江戸で剣術を学んだ後、勝海舟に弟子入りして航海術を身につけ、日本初の商社ともいわれる「亀山社中（後の海援隊）」を結成する。当時、犬猿の仲だった薩摩藩と長州藩の間を取り持ち、倒幕への大きな一歩となる「薩長同盟」を成立させたことは、彼の最大の功績として知られている。さらに船の中で構想したとされる「船中八策」をもとに、徳川幕府から朝廷へ政権を返す「大政奉還」の考えを説き、議会制度を備えた新しい日本のかたちを構想した。しかしその実現を見届けることなく、1867年、京都近江屋にて何者かに暗殺され、33歳の若さで生涯を終えた。亀山社中では武器や物資の運搬に加え商社としての海運業も手がけ、日本初の株式会社ともいわれている。妻おりょうと霧島温泉を訪れたことは、日本初の新婚旅行ともいわれる。", source:"legacy", sourceId:"026" },
  { id:"029-02", personId:"029", title:"もうひとつのエピソード", tags:["教育"],
    body:"中津藩の下級武士の家に生まれた福澤諭吉は、若くして長崎や大坂の適塾で蘭学を学び、幕末には自力で英語を習得し、咸臨丸などでアメリカやヨーロッパへも渡航した。西洋の進んだ制度や考え方を目の当たりにした経験から、見聞録「西洋事情」や「学問のすゝめ」を著し、「天は人の上に人を造らず、人の下に人を造らずと言えり」の一節で、人はみな生まれながらに平等であり、学ぶことによって初めて差が生まれるのだと説いた。「一身独立して一国独立す」と唱え、一人ひとりの自立こそが国の独立の土台になると考えた。1858年に開いた蘭学塾は後の慶應義塾大学へと発展し、独立自尊の精神を重んじる教育者として、日本の近代化に大きな影響を与えた。また新聞「時事新報」を創刊して言論活動にも力を注ぎ、「独立自尊」の精神を説き続けた。晩年まで多くの著作を通じて日本の近代化を導いた思想家である。",
    bodyHtml:"中津藩の下級武士の家に生まれた福澤諭吉は、若くして長崎や大坂の適塾で蘭学を学び、幕末には自力で英語を習得し、咸臨丸などでアメリカやヨーロッパへも渡航した。西洋の進んだ制度や考え方を目の当たりにした経験から、見聞録「西洋事情」や「学問のすゝめ」を著し、「天は人の上に人を造らず、人の下に人を造らずと言えり」の一節で、人はみな生まれながらに平等であり、学ぶことによって初めて差が生まれるのだと説いた。「一身独立して一国独立す」と唱え、一人ひとりの自立こそが国の独立の土台になると考えた。1858年に開いた蘭学塾は後の慶應義塾大学へと発展し、独立自尊の精神を重んじる教育者として、日本の近代化に大きな影響を与えた。また新聞「時事新報」を創刊して言論活動にも力を注ぎ、「独立自尊」の精神を説き続けた。晩年まで多くの著作を通じて日本の近代化を導いた思想家である。", source:"legacy", sourceId:"029" },
  { id:"030-02", personId:"030", title:"もうひとつのエピソード", tags:["ビジネス"],
    body:"武蔵国の農家に生まれた渋沢栄一は、若い頃は倒幕を志す志士として活動していたが、思いがけず幕臣となり、パリ万博使節団の一員としてヨーロッパへ渡る。そこで見た近代的な銀行や株式会社のしくみに衝撃を受け、帰国後は明治政府の役人を経て実業家に転身した。第一国立銀行や東京証券取引所、東京ガスをはじめ、生涯に関わった企業は500以上、社会福祉や教育の団体も600以上にのぼるといわれ、「日本資本主義の父」と称される。著書「論語と算盤」では、単なる利益だけでなく道徳を重んじる「道徳経済合一説」を唱え、社会福祉や教育にも力を注いだその生き方は、令和の新一万円札の肖像に選ばれたことでも改めて注目を集めている。実業界を引退した後も社会事業や国際親善に情熱を注ぎ、日中友好や民間外交にも力を尽くした。2021年には大河ドラマの主人公にもなるなど、令和の時代にも改めて注目された実業家である。",
    bodyHtml:"武蔵国の農家に生まれた渋沢栄一は、若い頃は倒幕を志す志士として活動していたが、思いがけず幕臣となり、パリ万博使節団の一員としてヨーロッパへ渡る。そこで見た近代的な銀行や株式会社のしくみに衝撃を受け、帰国後は明治政府の役人を経て実業家に転身した。第一国立銀行や東京証券取引所、東京ガスをはじめ、生涯に関わった企業は500以上、社会福祉や教育の団体も600以上にのぼるといわれ、「日本資本主義の父」と称される。著書「論語と算盤」では、単なる利益だけでなく道徳を重んじる「道徳経済合一説」を唱え、社会福祉や教育にも力を注いだその生き方は、令和の新一万円札の肖像に選ばれたことでも改めて注目を集めている。実業界を引退した後も社会事業や国際親善に情熱を注ぎ、日中友好や民間外交にも力を尽くした。2021年には大河ドラマの主人公にもなるなど、令和の時代にも改めて注目された実業家である。", source:"legacy", sourceId:"030" },
  { id:"031-02", personId:"031", title:"もうひとつのエピソード", tags:["政治"],
    body:"相模国の貧しい農家に生まれた二宮金次郎（尊徳）は、幼くして水害で田畑を失い、両親も亡くして親戚の家に預けられた。働きながらも勉学をあきらめず、薪を背負って本を読み歩いた姿は、後に多くの学校に建てられた銅像として広く知られている。大人になってからは、荒れ果てた農村の立て直しを次々と任され、農民たちと共に汗を流しながら、倹約と勤労を重んじる「報徳仕法」という独自の方法で、生涯に600以上ともいわれる村や地域を豊かに立て直した。困った者どうしが助け合って資金を融通する「五常講」という仕組みも考案しており、現代の信用組合の先駆けとも評される。「積小為大」――小さなことをこつこつと積み重ねることこそ、大きな成果につながるという教えは、今も多くの人の心に残っている。晩年は幕府の命で日光や下野国の復興事業にも携わり、その報徳の教えは各地の報徳社に受け継がれている。",
    bodyHtml:"相模国の貧しい農家に生まれた二宮金次郎（尊徳）は、幼くして水害で田畑を失い、両親も亡くして親戚の家に預けられた。働きながらも勉学をあきらめず、薪を背負って本を読み歩いた姿は、後に多くの学校に建てられた銅像として広く知られている。大人になってからは、荒れ果てた農村の立て直しを次々と任され、農民たちと共に汗を流しながら、倹約と勤労を重んじる「報徳仕法」という独自の方法で、生涯に600以上ともいわれる村や地域を豊かに立て直した。困った者どうしが助け合って資金を融通する「五常講」という仕組みも考案しており、現代の信用組合の先駆けとも評される。「積小為大」――小さなことをこつこつと積み重ねることこそ、大きな成果につながるという教えは、今も多くの人の心に残っている。晩年は幕府の命で日光や下野国の復興事業にも携わり、その報徳の教えは各地の報徳社に受け継がれている。", source:"legacy", sourceId:"031" },
  { id:"061-02", personId:"061", title:"もうひとつのエピソード", tags:["福祉"],
    body:"ヘレン・ケラーは1歳半のとき、高熱を出す病気がもとで視力と聴力の両方を失ってしまう。言葉も通じず、感情のコントロールもできずに荒れていた幼い彼女に、家庭教師アニー・サリバンが根気強く向き合った。井戸の水に手を触れさせながら、もう一方の手のひらに「water」という文字を綴り続けたある日、ヘレンは「すべての物には名前がある」ということに突然気づき、そこから言葉の世界が開かれていく。その後、ラドクリフ大学まで進学して優秀な成績で卒業し、視覚・聴覚障害者として世界初の学士号取得者となった。日本にも三度来日し、贈られた秋田犬を通じてアメリカにこの犬種を広めたことでも知られる。世界各地を訪れて障害を持つ人々の権利のために生涯を捧げ、多くの人に勇気を与える存在となった。国際的な福祉団体の設立にも関わり、日本を含む世界35か国以上を訪れて講演活動を行ったことでも知られる。",
    bodyHtml:"ヘレン・ケラーは1歳半のとき、高熱を出す病気がもとで視力と聴力の両方を失ってしまう。言葉も通じず、感情のコントロールもできずに荒れていた幼い彼女に、家庭教師アニー・サリバンが根気強く向き合った。井戸の水に手を触れさせながら、もう一方の手のひらに「water」という文字を綴り続けたある日、ヘレンは「すべての物には名前がある」ということに突然気づき、そこから言葉の世界が開かれていく。その後、ラドクリフ大学まで進学して優秀な成績で卒業し、視覚・聴覚障害者として世界初の学士号取得者となった。日本にも三度来日し、贈られた秋田犬を通じてアメリカにこの犬種を広めたことでも知られる。世界各地を訪れて障害を持つ人々の権利のために生涯を捧げ、多くの人に勇気を与える存在となった。国際的な福祉団体の設立にも関わり、日本を含む世界35か国以上を訪れて講演活動を行ったことでも知られる。", source:"legacy", sourceId:"061" },
  { id:"002-02", personId:"002", title:"もうひとつのエピソード", tags:["医学"],
    body:"熊本の農家に生まれた北里柴三郎は、医学を志してドイツに留学し、細菌学の権威コッホのもとで研究に励んだ。当時、治療法がないとされていた破傷風菌の純粋培養に世界で初めて成功し、さらに毒素に対抗する抗体を使う「血清療法」という画期的な治療法を確立する。この功績は1901年の第一回ノーベル賞の有力候補ともなったが、共同研究者のベーリングのみが受賞し、彼自身は選ばれなかった。それでも研究をあきらめず、帰国後は私財を投じて伝染病研究所を設立し、志賀潔や北島多一など多くの弟子を育てて「日本の細菌学の父」と呼ばれるようになった。また福澤諭吉の支援で慶應義塾大学医学科の創設にも尽力し、その功績は2024年から発行された新千円札の肖像に選ばれたことでも改めて称えられている。北里研究所は後に北里大学として発展し、多くの医療人材を育成する教育機関となっている。",
    bodyHtml:"熊本の農家に生まれた北里柴三郎は、医学を志してドイツに留学し、細菌学の権威コッホのもとで研究に励んだ。当時、治療法がないとされていた破傷風菌の純粋培養に世界で初めて成功し、さらに毒素に対抗する抗体を使う「血清療法」という画期的な治療法を確立する。この功績は1901年の第一回ノーベル賞の有力候補ともなったが、共同研究者のベーリングのみが受賞し、彼自身は選ばれなかった。それでも研究をあきらめず、帰国後は私財を投じて伝染病研究所を設立し、志賀潔や北島多一など多くの弟子を育てて「日本の細菌学の父」と呼ばれるようになった。また福澤諭吉の支援で慶應義塾大学医学科の創設にも尽力し、その功績は2024年から発行された新千円札の肖像に選ばれたことでも改めて称えられている。北里研究所は後に北里大学として発展し、多くの医療人材を育成する教育機関となっている。", source:"legacy", sourceId:"002" },
  { id:"003-02", personId:"003", title:"もうひとつのエピソード", tags:["医学"],
    body:"仙台藩出身の志賀潔は、北里柴三郎が設立した伝染病研究所で学び、当時多くの子どもや大人の命を奪っていた赤痢という感染症の研究に打ち込んだ。患者から採取した便を丹念に調べ続けた末、1897年、赤痢の原因となる細菌をついに発見する。この功績を称え、この菌には彼の名にちなんで「Shigella（シゲラ）」という学名がつけられ、現在も世界中の医学の教科書で使われている。留学先のドイツでは北里の師でもあるコッホから直接指導を受け、さらに免疫学者エールリヒのもとで梅毒の治療薬サルバルサンの研究にも携わった。帰国後は京城帝国大学の総長を務めるなど教育者としても活躍し、感染症研究に生涯を捧げ、多くの命を救う礎を築いた研究者として知られている。赤痢はかつて日本国内だけで年間数万人もの死者を出す恐ろしい感染症であり、この発見は公衆衛生に大きく貢献した。",
    bodyHtml:"仙台藩出身の志賀潔は、北里柴三郎が設立した伝染病研究所で学び、当時多くの子どもや大人の命を奪っていた赤痢という感染症の研究に打ち込んだ。患者から採取した便を丹念に調べ続けた末、1897年、赤痢の原因となる細菌をついに発見する。この功績を称え、この菌には彼の名にちなんで「Shigella（シゲラ）」という学名がつけられ、現在も世界中の医学の教科書で使われている。留学先のドイツでは北里の師でもあるコッホから直接指導を受け、さらに免疫学者エールリヒのもとで梅毒の治療薬サルバルサンの研究にも携わった。帰国後は京城帝国大学の総長を務めるなど教育者としても活躍し、感染症研究に生涯を捧げ、多くの命を救う礎を築いた研究者として知られている。赤痢はかつて日本国内だけで年間数万人もの死者を出す恐ろしい感染症であり、この発見は公衆衛生に大きく貢献した。", source:"legacy", sourceId:"003" },
  { id:"004-02", personId:"004", title:"もうひとつのエピソード", tags:["科学"],
    body:"加賀藩の藩医の家に生まれた高峰譲吉は、化学者としてアメリカへ渡り、消化を助ける酵素「タカジアスターゼ」を麹菌から抽出することに成功した。さらに研究を重ね、1900年、副腎から分泌されるホルモン「アドレナリン」を、世界で初めて純粋な結晶として取り出すことにも成功する。この発見は医学に大きな貢献をもたらし、彼の名は国際的にも高く評価され、後に「近代バイオテクノロジーの父」とも呼ばれるようになった。また1912年、ワシントンD.C.のポトマック河畔に日本の桜の苗木3000本余りを贈る計画に私財を投じて尽力し、現在も続く日米の桜の交流のきっかけを作った人物としても知られている。科学と外交の両面で日本とアメリカの架け橋となった化学者である。帰国後は理化学研究所の設立にも関わり、日本の科学研究体制の基盤づくりにも貢献した化学者であり、渋沢栄一とも親交を結んで日米交流に尽くした人物である。",
    bodyHtml:"加賀藩の藩医の家に生まれた高峰譲吉は、化学者としてアメリカへ渡り、消化を助ける酵素「タカジアスターゼ」を麹菌から抽出することに成功した。さらに研究を重ね、1900年、副腎から分泌されるホルモン「アドレナリン」を、世界で初めて純粋な結晶として取り出すことにも成功する。この発見は医学に大きな貢献をもたらし、彼の名は国際的にも高く評価され、後に「近代バイオテクノロジーの父」とも呼ばれるようになった。また1912年、ワシントンD.C.のポトマック河畔に日本の桜の苗木3000本余りを贈る計画に私財を投じて尽力し、現在も続く日米の桜の交流のきっかけを作った人物としても知られている。科学と外交の両面で日本とアメリカの架け橋となった化学者である。帰国後は理化学研究所の設立にも関わり、日本の科学研究体制の基盤づくりにも貢献した化学者であり、渋沢栄一とも親交を結んで日米交流に尽くした人物である。", source:"legacy", sourceId:"004" },
  { id:"005-02", personId:"005", title:"もうひとつのエピソード", tags:["科学"],
    body:"京都に生まれた湯川秀樹は、原子核の中で陽子と中性子がなぜバラバラにならず結びついているのか、という謎に取り組み続けた。1935年、この力を伝える未知の粒子「中間子」の存在を理論的に予言する論文を発表するが、当時は無名の日本人科学者による理論として、世界からほとんど注目されなかった。しかし1947年、イギリスのセシル・パウエルらが宇宙線の観測から実際にパイ中間子を発見すると、この理論は一躍脚光を浴びることになる。1949年、日本人として初めてノーベル物理学賞を受賞し、戦後まもない日本の人々に大きな誇りと希望を与えた。晩年は科学者が核兵器廃絶を訴えるパグウォッシュ会議にも参加するなど、世界平和のための活動にも力を注いだ科学者である。京都大学で長く教授を務めて後進の育成にも力を注いだほか、平和運動の象徴として今も語り継がれる科学者である。",
    bodyHtml:"京都に生まれた湯川秀樹は、原子核の中で陽子と中性子がなぜバラバラにならず結びついているのか、という謎に取り組み続けた。1935年、この力を伝える未知の粒子「中間子」の存在を理論的に予言する論文を発表するが、当時は無名の日本人科学者による理論として、世界からほとんど注目されなかった。しかし1947年、イギリスのセシル・パウエルらが宇宙線の観測から実際にパイ中間子を発見すると、この理論は一躍脚光を浴びることになる。1949年、日本人として初めてノーベル物理学賞を受賞し、戦後まもない日本の人々に大きな誇りと希望を与えた。晩年は科学者が核兵器廃絶を訴えるパグウォッシュ会議にも参加するなど、世界平和のための活動にも力を注いだ科学者である。京都大学で長く教授を務めて後進の育成にも力を注いだほか、平和運動の象徴として今も語り継がれる科学者である。", source:"legacy", sourceId:"005" },
  { id:"008-02", personId:"008", title:"もうひとつのエピソード", tags:["科学"],
    body:"リンゴが木から落ちるのを見て万有引力を思いついた、という有名な逸話で知られるニュートンだが、実際にはペストの流行でケンブリッジ大学が休校となった約2年間、故郷の田舎に引きこもり、じっくりと考え続けたことが大きな発見につながったとされる。この期間に、物体の運動に関する法則や、万有引力の法則、さらには微分積分学の基礎までも生み出したことから、「創造的休暇」とも呼ばれている。著書「プリンキピア」は物理学の歴史を変えるほどの影響力を持ち、光の性質を研究するために自ら反射望遠鏡を発明するなど、近代科学の基礎を築いた。晩年は造幣局長官として偽金づくりの取り締まりにも力を注ぐなど、科学以外の分野でも手腕を発揮した、最も偉大な科学者の一人とされている。光の性質を研究する中でプリズムを使い、太陽光が虹色に分かれることを解明し、色彩理論の基礎も築いている。",
    bodyHtml:"リンゴが木から落ちるのを見て万有引力を思いついた、という有名な逸話で知られるニュートンだが、実際にはペストの流行でケンブリッジ大学が休校となった約2年間、故郷の田舎に引きこもり、じっくりと考え続けたことが大きな発見につながったとされる。この期間に、物体の運動に関する法則や、万有引力の法則、さらには微分積分学の基礎までも生み出したことから、「創造的休暇」とも呼ばれている。著書「プリンキピア」は物理学の歴史を変えるほどの影響力を持ち、光の性質を研究するために自ら反射望遠鏡を発明するなど、近代科学の基礎を築いた。晩年は造幣局長官として偽金づくりの取り締まりにも力を注ぐなど、科学以外の分野でも手腕を発揮した、最も偉大な科学者の一人とされている。光の性質を研究する中でプリズムを使い、太陽光が虹色に分かれることを解明し、色彩理論の基礎も築いている。", source:"legacy", sourceId:"008" },
  { id:"009-02", personId:"009", title:"もうひとつのエピソード", tags:["科学"],
    body:"若き日のダーウィンは、医学の道に進むことを望んだ父の期待に反し、自然観察に夢中になっていた青年だった。22歳のとき、軍艦ビーグル号に博物学者として乗り込み、南米やガラパゴス諸島を含む世界一周の航海に5年間を費やす。ガラパゴス諸島では、島ごとにくちばしの形が微妙に異なるフィンチという鳥を観察し、環境に応じて生物が姿を変えていくのではないかという疑問を抱いた。帰国後、20年以上にわたって膨大な証拠を集めていたが、同じ結論に達したウォレスからの手紙に背中を押される形で、周囲の反発をおそれながらも1859年に「種の起源」を出版し、自然選択による生物進化の理論を世に問うた。発売初日に完売したというこの本は、生物学史上最も重要な著作の一つとされている。「種の起源」ではあえて人間への言及を避けたが、後の著書「人間の由来」で人類も進化の産物であることを論じている。",
    bodyHtml:"若き日のダーウィンは、医学の道に進むことを望んだ父の期待に反し、自然観察に夢中になっていた青年だった。22歳のとき、軍艦ビーグル号に博物学者として乗り込み、南米やガラパゴス諸島を含む世界一周の航海に5年間を費やす。ガラパゴス諸島では、島ごとにくちばしの形が微妙に異なるフィンチという鳥を観察し、環境に応じて生物が姿を変えていくのではないかという疑問を抱いた。帰国後、20年以上にわたって膨大な証拠を集めていたが、同じ結論に達したウォレスからの手紙に背中を押される形で、周囲の反発をおそれながらも1859年に「種の起源」を出版し、自然選択による生物進化の理論を世に問うた。発売初日に完売したというこの本は、生物学史上最も重要な著作の一つとされている。「種の起源」ではあえて人間への言及を避けたが、後の著書「人間の由来」で人類も進化の産物であることを論じている。", source:"legacy", sourceId:"009" },
  { id:"010-02", personId:"010", title:"もうひとつのエピソード", tags:["科学"],
    body:"イタリアのガリレオは、オランダで発明された望遠鏡を独自に改良し、木星の周りを回る4つの衛星や、でこぼこした月の表面を観測して、天体はすべて完璧な球体であるという当時の常識をくつがえした。落下運動の実験にも取り組み、重さの異なる物体でも同じ速さで落ちることを、ピサの斜塔から物を落として確かめたという逸話も伝えられている。地球が太陽の周りを回っているとする「地動説」を支持し、著書でこれを主張したが、聖書の教えに反するとしてローマ教会の裁判にかけられ、地動説を撤回するよう強要される。それでも裁判の後、小声で「それでも地球は動く」とつぶやいたと伝えられており、真理を曲げなかった科学者として語り継がれている。晩年は自宅に軟禁されながらも研究を続け、近代物理学の父と呼ばれるにふさわしい業績を残した。望遠鏡による天体観測の成果をまとめた著書「星界の報告」は、当時のヨーロッパに大きな衝撃を与えた。",
    bodyHtml:"イタリアのガリレオは、オランダで発明された望遠鏡を独自に改良し、木星の周りを回る4つの衛星や、でこぼこした月の表面を観測して、天体はすべて完璧な球体であるという当時の常識をくつがえした。落下運動の実験にも取り組み、重さの異なる物体でも同じ速さで落ちることを、ピサの斜塔から物を落として確かめたという逸話も伝えられている。地球が太陽の周りを回っているとする「地動説」を支持し、著書でこれを主張したが、聖書の教えに反するとしてローマ教会の裁判にかけられ、地動説を撤回するよう強要される。それでも裁判の後、小声で「それでも地球は動く」とつぶやいたと伝えられており、真理を曲げなかった科学者として語り継がれている。晩年は自宅に軟禁されながらも研究を続け、近代物理学の父と呼ばれるにふさわしい業績を残した。望遠鏡による天体観測の成果をまとめた著書「星界の報告」は、当時のヨーロッパに大きな衝撃を与えた。", source:"legacy", sourceId:"010" },
  { id:"011-02", personId:"011", title:"もうひとつのエピソード", tags:["科学"],
    body:"フランスの科学者パスツールは、ワインが腐ってしまう原因を調べる中で、目に見えない微生物が発酵や腐敗を引き起こしていることを突き止め、微生物を加熱によって殺す「低温殺菌法（パスチャライゼーション）」を開発した。この技術は今も牛乳やワインの製造に使われている。炭疽菌のワクチン開発などを経て、さらに狂犬病の研究に取り組み、ワクチンを開発すると、1885年、狂犬に噛まれて生死の境をさまよっていた少年ジョゼフ・マイスターに接種してその命を救ったことで、世界中にその名を知られるようになった。1888年にはパリにパスツール研究所を設立し、後進の育成にも力を注いだ。「幸運は準備のできた心にのみ宿る」という言葉のとおり、地道な観察と実験を積み重ねた末に、数々の人命を救う発見をなし遂げた科学者である。狂犬病ワクチンを接種された少年マイスターは、後にパスツール研究所の門番として生涯を過ごしたと伝えられる。",
    bodyHtml:"フランスの科学者パスツールは、ワインが腐ってしまう原因を調べる中で、目に見えない微生物が発酵や腐敗を引き起こしていることを突き止め、微生物を加熱によって殺す「低温殺菌法（パスチャライゼーション）」を開発した。この技術は今も牛乳やワインの製造に使われている。炭疽菌のワクチン開発などを経て、さらに狂犬病の研究に取り組み、ワクチンを開発すると、1885年、狂犬に噛まれて生死の境をさまよっていた少年ジョゼフ・マイスターに接種してその命を救ったことで、世界中にその名を知られるようになった。1888年にはパリにパスツール研究所を設立し、後進の育成にも力を注いだ。「幸運は準備のできた心にのみ宿る」という言葉のとおり、地道な観察と実験を積み重ねた末に、数々の人命を救う発見をなし遂げた科学者である。狂犬病ワクチンを接種された少年マイスターは、後にパスツール研究所の門番として生涯を過ごしたと伝えられる。", source:"legacy", sourceId:"011" },
  { id:"069-02", personId:"069", title:"もうひとつのエピソード", tags:["スポーツ"],
    body:"イチローは高校卒業後にプロ野球選手となったが、独特の「振り子打法」は当初、多くの評論家から否定的に見られていた。それでも自分のスタイルを貫き通し、日本プロ野球で数々の記録を打ち立てた後、2001年に渡米してメジャーリーグに挑戦し、その年のうちに新人王とMVPを同時に獲得する快挙を成し遂げた。毎朝同じ時間に起き、同じ準備を欠かさず行うなど、徹底したルーティンを大切にしたことでも知られ、「小さなことを積み重ねることが、とんでもないところへ行くただ一つの道」という言葉を残している。2004年にはシーズン262安打というメジャーリーグの最多安打記録を更新し、日米通算では4000本を超える安打を放つなど、45歳で引退するまで地道な努力の積み重ねが生んだ偉大な記録を数多く残した。メジャーリーグ通算では10年連続でゴールドグラブ賞を受賞するなど、打撃だけでなく守備でも高く評価された。",
    bodyHtml:"イチローは高校卒業後にプロ野球選手となったが、独特の「振り子打法」は当初、多くの評論家から否定的に見られていた。それでも自分のスタイルを貫き通し、日本プロ野球で数々の記録を打ち立てた後、2001年に渡米してメジャーリーグに挑戦し、その年のうちに新人王とMVPを同時に獲得する快挙を成し遂げた。毎朝同じ時間に起き、同じ準備を欠かさず行うなど、徹底したルーティンを大切にしたことでも知られ、「小さなことを積み重ねることが、とんでもないところへ行くただ一つの道」という言葉を残している。2004年にはシーズン262安打というメジャーリーグの最多安打記録を更新し、日米通算では4000本を超える安打を放つなど、45歳で引退するまで地道な努力の積み重ねが生んだ偉大な記録を数多く残した。メジャーリーグ通算では10年連続でゴールドグラブ賞を受賞するなど、打撃だけでなく守備でも高く評価された。", source:"legacy", sourceId:"069" },
  { id:"012-02", personId:"012", title:"もうひとつのエピソード", tags:["医学"],
    body:"スコットランドの貧しい農家に生まれたフレミングは、細菌学者として研究を続けていたある日、休暇から戻ると、片付けが苦手で置きっぱなしにしていた培養皿の一部にアオカビが生え、その周りだけ細菌が死んでいることに気づいた。多くの研究者なら見過ごしてしまいそうなこの「たまたまの出来事」を見逃さず、アオカビが作り出す物質に細菌を殺す力があることを突き止め、これをペニシリンと名付けた。当初は実用化の技術がなく注目されなかったが、後にフローリーとチェインという二人の科学者によって大量生産の方法が開発され、第二次世界大戦下で多くの負傷兵の命を感染症から救うことになった。1945年、フレミングはこの二人と共にノーベル生理学・医学賞を受賞し、20世紀医学における最大の発見の一つとして今も称えられている。ペニシリンの発見は、清潔さよりも観察眼と柔軟な発想の大切さを物語る逸話として、今も教科書で語り継がれている。",
    bodyHtml:"スコットランドの貧しい農家に生まれたフレミングは、細菌学者として研究を続けていたある日、休暇から戻ると、片付けが苦手で置きっぱなしにしていた培養皿の一部にアオカビが生え、その周りだけ細菌が死んでいることに気づいた。多くの研究者なら見過ごしてしまいそうなこの「たまたまの出来事」を見逃さず、アオカビが作り出す物質に細菌を殺す力があることを突き止め、これをペニシリンと名付けた。当初は実用化の技術がなく注目されなかったが、後にフローリーとチェインという二人の科学者によって大量生産の方法が開発され、第二次世界大戦下で多くの負傷兵の命を感染症から救うことになった。1945年、フレミングはこの二人と共にノーベル生理学・医学賞を受賞し、20世紀医学における最大の発見の一つとして今も称えられている。ペニシリンの発見は、清潔さよりも観察眼と柔軟な発想の大切さを物語る逸話として、今も教科書で語り継がれている。", source:"legacy", sourceId:"012" },
  { id:"013-02", personId:"013", title:"もうひとつのエピソード", tags:["科学"],
    body:"オーストリアの修道院で暮らしていた修道士メンデルは、庭でエンドウ豆を育てながら、丸い豆としわのある豆をかけ合わせるとどうなるかなど、7つの形質に注目し、8年もの歳月をかけて丹念に観察し続けた。栽培した豆の総数は2万8千本にものぼるといわれ、何千という豆を一つ一つ数え、記録するという地道な作業を繰り返した末、遺伝する形質には一定の規則性があることを発見し、「メンデルの法則」としてまとめて発表した。しかし生前はほとんど評価されず、彼自身は研究者としてよりも修道院長として生涯を終えている。死後35年ほど経ってから、デ・フリースら複数の科学者が同じ結論に別々にたどり着いたことでその価値が再発見され、遺伝の規則性を示す「優性」「劣性」という用語も彼の研究に由来する。今では「遺伝学の祖」として高く評価されている。彼が発見した規則性は、後の分子生物学やDNA研究の土台にもなっている。",
    bodyHtml:"オーストリアの修道院で暮らしていた修道士メンデルは、庭でエンドウ豆を育てながら、丸い豆としわのある豆をかけ合わせるとどうなるかなど、7つの形質に注目し、8年もの歳月をかけて丹念に観察し続けた。栽培した豆の総数は2万8千本にものぼるといわれ、何千という豆を一つ一つ数え、記録するという地道な作業を繰り返した末、遺伝する形質には一定の規則性があることを発見し、「メンデルの法則」としてまとめて発表した。しかし生前はほとんど評価されず、彼自身は研究者としてよりも修道院長として生涯を終えている。死後35年ほど経ってから、デ・フリースら複数の科学者が同じ結論に別々にたどり着いたことでその価値が再発見され、遺伝の規則性を示す「優性」「劣性」という用語も彼の研究に由来する。今では「遺伝学の祖」として高く評価されている。彼が発見した規則性は、後の分子生物学やDNA研究の土台にもなっている。", source:"legacy", sourceId:"013" },
  { id:"015-02", personId:"015", title:"もうひとつのエピソード", tags:["発明"],
    body:"オハイオ州で自転車店を営んでいたウィルバーとオーヴィルのライト兄弟は、鳥がどのように空気の力を利用して飛んでいるのかを熱心に観察し、独自にグライダーの実験を繰り返した。何度も墜落や失敗を経験しながらも改良を重ね、風洞実験まで自作して翼の形を研究し尽くした。1903年12月17日、アメリカのキティホークの浜辺で、兄弟が製作した「フライヤー号」が、人類史上初めて動力を使った飛行に成功する。最初の飛行時間はわずか12秒、距離にして約36メートルという短いものだったが、同じ日の4回目の飛行では59秒、260メートル余りを飛んだ。この日を境に空を飛ぶという人類の夢は現実のものとなり、後の航空技術の発展へとつながる歴史的な一歩となった。兄弟は生涯結婚せず、互いに支え合いながら研究を続けた。姉妹のキャサリンも広報面で兄弟を支えたことで知られている。",
    bodyHtml:"オハイオ州で自転車店を営んでいたウィルバーとオーヴィルのライト兄弟は、鳥がどのように空気の力を利用して飛んでいるのかを熱心に観察し、独自にグライダーの実験を繰り返した。何度も墜落や失敗を経験しながらも改良を重ね、風洞実験まで自作して翼の形を研究し尽くした。1903年12月17日、アメリカのキティホークの浜辺で、兄弟が製作した「フライヤー号」が、人類史上初めて動力を使った飛行に成功する。最初の飛行時間はわずか12秒、距離にして約36メートルという短いものだったが、同じ日の4回目の飛行では59秒、260メートル余りを飛んだ。この日を境に空を飛ぶという人類の夢は現実のものとなり、後の航空技術の発展へとつながる歴史的な一歩となった。兄弟は生涯結婚せず、互いに支え合いながら研究を続けた。姉妹のキャサリンも広報面で兄弟を支えたことで知られている。", source:"legacy", sourceId:"015" },
  { id:"016-02", personId:"016", title:"もうひとつのエピソード", tags:["発明"],
    body:"スコットランド生まれのグラハム・ベルは、母や妻が耳の不自由な人であったこともあり、耳の不自由な生徒たちに発音を教える教師として働く中で、音の振動を電気信号に変えて遠くまで伝える方法を研究するようになった。試行錯誤の末、1876年、装置の実験中に酸をこぼしてしまい、思わず助手のワトソンに「ワトソン君、ちょっと来てくれ」と叫んだ言葉が、隣の部屋の受話器を通してはっきりと聞こえたという。これが世界初の電話による会話とされている。この発明は瞬く間に世界中に広まり、彼が設立した会社は後の巨大通信企業AT&Tの母体となった。晩年には金属探知機や水中翼船の研究にも取り組むなど、電話以外の分野でも探究心を発揮し続けた発明家として知られている。電話の発明をめぐっては、同時期に同様の装置を開発していた発明家との特許争いも起き、後年まで裁判で真の発明者が誰かが争われ続けた。",
    bodyHtml:"スコットランド生まれのグラハム・ベルは、母や妻が耳の不自由な人であったこともあり、耳の不自由な生徒たちに発音を教える教師として働く中で、音の振動を電気信号に変えて遠くまで伝える方法を研究するようになった。試行錯誤の末、1876年、装置の実験中に酸をこぼしてしまい、思わず助手のワトソンに「ワトソン君、ちょっと来てくれ」と叫んだ言葉が、隣の部屋の受話器を通してはっきりと聞こえたという。これが世界初の電話による会話とされている。この発明は瞬く間に世界中に広まり、彼が設立した会社は後の巨大通信企業AT&amp;Tの母体となった。晩年には金属探知機や水中翼船の研究にも取り組むなど、電話以外の分野でも探究心を発揮し続けた発明家として知られている。電話の発明をめぐっては、同時期に同様の装置を開発していた発明家との特許争いも起き、後年まで裁判で真の発明者が誰かが争われ続けた。", source:"legacy", sourceId:"016" },
  { id:"017-02", personId:"017", title:"もうひとつのエピソード", tags:["発明"],
    body:"静岡県に生まれた豊田佐吉は、母親が夜遅くまで手で機（はた）を織り、苦労している姿を見て育った。もっと楽に、効率よく布を織れる機械を作りたいという思いから研究を重ね、数々の改良を経て、糸が切れると自動的に止まる仕組みを備えた無停止杼換式自動織機を完成させた。1926年に豊田自動織機製作所を設立し、この自動織機の特許をイギリスのプラット社に売却して得た資金は、後に息子の豊田喜一郎が自動車事業を興す元手となった。「障子を開けてみよ、外は広いぞ」という言葉を残し、常に新しい発想を求め続けたその精神は、後に世界的な自動車メーカーへと発展していく礎となった。日本の「ものづくり」の原点として、今も多くの技術者に影響を与え続けている発明家である。「発明」よりも現場での「改善」を重視する姿勢は、後のトヨタ生産方式にも通じる考え方として受け継がれている。",
    bodyHtml:"静岡県に生まれた豊田佐吉は、母親が夜遅くまで手で機（はた）を織り、苦労している姿を見て育った。もっと楽に、効率よく布を織れる機械を作りたいという思いから研究を重ね、数々の改良を経て、糸が切れると自動的に止まる仕組みを備えた無停止杼換式自動織機を完成させた。1926年に豊田自動織機製作所を設立し、この自動織機の特許をイギリスのプラット社に売却して得た資金は、後に息子の豊田喜一郎が自動車事業を興す元手となった。「障子を開けてみよ、外は広いぞ」という言葉を残し、常に新しい発想を求め続けたその精神は、後に世界的な自動車メーカーへと発展していく礎となった。日本の「ものづくり」の原点として、今も多くの技術者に影響を与え続けている発明家である。「発明」よりも現場での「改善」を重視する姿勢は、後のトヨタ生産方式にも通じる考え方として受け継がれている。", source:"legacy", sourceId:"017" },
  { id:"018-02", personId:"018", title:"もうひとつのエピソード", tags:["発明"],
    body:"からくり人形作りの名人として知られ、「からくり儀右衛門」と呼ばれた田中久重は、幼い頃から精巧な機械仕掛けの人形を作る才能を発揮していた。矢を射る人形や、字を書く人形などを次々と制作して人々を驚かせ、後にはより実用的な発明にも力を注ぐようになる。晩年には、日・月・曜日・二十四節気・七十二候まで示す、当時としては驚異的に精巧な「万年自鳴鐘（万年時計）」を作り上げ、幕末には電信機や蒸気機関の模型製作にも携わった。80歳近くになってから東京で興した工場「田中製造所」は、後の芝浦製作所を経て、日本を代表する電機メーカー東芝へと発展していき、彼の探究心と技術者としての情熱は、現代の日本のものづくり産業にまで受け継がれている。からくり人形の技術は精密機械の基礎ともなり、佐賀藩では蒸気機関や大砲の製造にも関わるなど、幕末の技術発展にも大きく貢献した人物であった。",
    bodyHtml:"からくり人形作りの名人として知られ、「からくり儀右衛門」と呼ばれた田中久重は、幼い頃から精巧な機械仕掛けの人形を作る才能を発揮していた。矢を射る人形や、字を書く人形などを次々と制作して人々を驚かせ、後にはより実用的な発明にも力を注ぐようになる。晩年には、日・月・曜日・二十四節気・七十二候まで示す、当時としては驚異的に精巧な「万年自鳴鐘（万年時計）」を作り上げ、幕末には電信機や蒸気機関の模型製作にも携わった。80歳近くになってから東京で興した工場「田中製造所」は、後の芝浦製作所を経て、日本を代表する電機メーカー東芝へと発展していき、彼の探究心と技術者としての情熱は、現代の日本のものづくり産業にまで受け継がれている。からくり人形の技術は精密機械の基礎ともなり、佐賀藩では蒸気機関や大砲の製造にも関わるなど、幕末の技術発展にも大きく貢献した人物であった。", source:"legacy", sourceId:"018" },
  { id:"019-02", personId:"019", title:"もうひとつのエピソード", tags:["発明"],
    body:"讃岐国（現在の香川県）に生まれた平賀源内は、本草学（薬草学）を学ぶ一方、発明や創作にも並外れた才能を発揮した、江戸時代随一の多才な人物である。オランダから伝わった摩擦起電機を修理・復元して「エレキテル」として見世物にし、寒暖計や火浣布（燃えない布）なども考案した。さらに夏に売り上げが落ちるうなぎ屋に頼まれ、「本日丑の日」というキャッチコピーを考案し、土用の丑の日にうなぎを食べる習慣を広めたという逸話も伝わっている。戯作者としても筆をとり浄瑠璃の台本も手がけるなど、学問・発明・文筆・絵画とあらゆる分野で才を発揮したが、晩年はもめごとから人を傷つけてしまい、投獄された末に獄中で世を去ったと伝えられる。その自由な知の探求心は、今も江戸時代を象徴する人物として語り継がれている。多才さゆえに一つの分野に専念しなかったことから、後世「日本のダ・ヴィンチ」とも評されることがある。",
    bodyHtml:"讃岐国（現在の香川県）に生まれた平賀源内は、本草学（薬草学）を学ぶ一方、発明や創作にも並外れた才能を発揮した、江戸時代随一の多才な人物である。オランダから伝わった摩擦起電機を修理・復元して「エレキテル」として見世物にし、寒暖計や火浣布（燃えない布）なども考案した。さらに夏に売り上げが落ちるうなぎ屋に頼まれ、「本日丑の日」というキャッチコピーを考案し、土用の丑の日にうなぎを食べる習慣を広めたという逸話も伝わっている。戯作者としても筆をとり浄瑠璃の台本も手がけるなど、学問・発明・文筆・絵画とあらゆる分野で才を発揮したが、晩年はもめごとから人を傷つけてしまい、投獄された末に獄中で世を去ったと伝えられる。その自由な知の探求心は、今も江戸時代を象徴する人物として語り継がれている。多才さゆえに一つの分野に専念しなかったことから、後世「日本のダ・ヴィンチ」とも評されることがある。", source:"legacy", sourceId:"019" },
  { id:"020-02", personId:"020", title:"もうひとつのエピソード", tags:["発明"],
    body:"ドイツの技術者カール・ベンツは、幼い頃から機械いじりが好きで、独学でエンジンの構造を学び続けた。1885年、馬を使わずに走る三輪の乗り物、ガソリンエンジンを積んだ「ベンツ・パテント・モトールヴァーゲン」を完成させ、自動車の特許を取得する。しかし周囲からは「馬のいない馬車など危険で使い物にならない」と冷ややかな目で見られていた。そこで妻ベルタは、1888年、夫に内緒で息子二人とともに約106キロメートルもの長距離ドライブを敢行し、途中で燃料が尽きると薬局で燃料を買い足し、髪留めや帽子ピンで詰まりを直しながら走り抜いて自動車の実用性を世に証明してみせた。後にベンツの会社はダイムラー社と合併し、この挑戦が自動車の普及に大きく貢献したと言われている。現在、ベンツの名を冠した自動車メーカーは、世界で最も歴史ある自動車ブランドの一つとして知られている。",
    bodyHtml:"ドイツの技術者カール・ベンツは、幼い頃から機械いじりが好きで、独学でエンジンの構造を学び続けた。1885年、馬を使わずに走る三輪の乗り物、ガソリンエンジンを積んだ「ベンツ・パテント・モトールヴァーゲン」を完成させ、自動車の特許を取得する。しかし周囲からは「馬のいない馬車など危険で使い物にならない」と冷ややかな目で見られていた。そこで妻ベルタは、1888年、夫に内緒で息子二人とともに約106キロメートルもの長距離ドライブを敢行し、途中で燃料が尽きると薬局で燃料を買い足し、髪留めや帽子ピンで詰まりを直しながら走り抜いて自動車の実用性を世に証明してみせた。後にベンツの会社はダイムラー社と合併し、この挑戦が自動車の普及に大きく貢献したと言われている。現在、ベンツの名を冠した自動車メーカーは、世界で最も歴史ある自動車ブランドの一つとして知られている。", source:"legacy", sourceId:"020" },
  { id:"021-02", personId:"021", title:"もうひとつのエピソード", tags:["発明"],
    body:"スコットランドの技術者ジェームズ・ワットは、大学の実験器具を修理する仕事を通じて、当時使われていた蒸気機関の効率の悪さに気づいた。ピストンを冷やすたびに大量の蒸気が無駄になっていることを突き止め、別の場所に蒸気を送って冷やす「復水器」という仕組みを発明する。実業家マシュー・ボールトンと手を組んで会社を興し、機関の性能を馬の働きと比べて示す「馬力」という単位も考え出して製品を売り込んだ。この改良により蒸気機関の効率は劇的に向上し、工場の動力や鉄道、蒸気船など、あらゆる場面で使われるようになった。この技術革新は、人類が大きな力を自在に生み出せるようになった「産業革命」の原動力となり、彼の名は仕事率の単位「ワット」として、今も世界中で使われ続けている。蒸気機関の改良によって工場は水力に頼らず立地できるようになり、都市の発展にも大きな影響を与えた。",
    bodyHtml:"スコットランドの技術者ジェームズ・ワットは、大学の実験器具を修理する仕事を通じて、当時使われていた蒸気機関の効率の悪さに気づいた。ピストンを冷やすたびに大量の蒸気が無駄になっていることを突き止め、別の場所に蒸気を送って冷やす「復水器」という仕組みを発明する。実業家マシュー・ボールトンと手を組んで会社を興し、機関の性能を馬の働きと比べて示す「馬力」という単位も考え出して製品を売り込んだ。この改良により蒸気機関の効率は劇的に向上し、工場の動力や鉄道、蒸気船など、あらゆる場面で使われるようになった。この技術革新は、人類が大きな力を自在に生み出せるようになった「産業革命」の原動力となり、彼の名は仕事率の単位「ワット」として、今も世界中で使われ続けている。蒸気機関の改良によって工場は水力に頼らず立地できるようになり、都市の発展にも大きな影響を与えた。", source:"legacy", sourceId:"021" },
  { id:"022-02", personId:"022", title:"もうひとつのエピソード", tags:["政治"],
    body:"推古天皇の摂政となった聖徳太子（厩戸皇子）は、蘇我氏をはじめとする有力な豪族が争う中、天皇を中心とした新しい国のしくみを整えようとした。家柄によらず能力や功績によって役人を登用する「冠位十二階」を定め、役人としての心構えを示す「十七条の憲法」を制定して「和をもって貴しとなす」という理念を掲げた。また遣隋使を派遣して中国の進んだ制度や文化を学び、法隆寺をはじめとする仏教寺院の建立にも力を注いだ。伝説では一度に十人の話を聞き分けたとも言われ、その実像については研究者の間でも様々な議論があるが、戦後の日本銀行券には歴代の中で最も多く肖像として採用されるなど、飛鳥時代を代表する政治家・思想家として長く尊敬を集めている。十七条の憲法には仏教を篤く敬うことも定められており、当時の日本に仏教文化を根付かせる大きな役割も果たしたと伝えられている。",
    bodyHtml:"推古天皇の摂政となった聖徳太子（厩戸皇子）は、蘇我氏をはじめとする有力な豪族が争う中、天皇を中心とした新しい国のしくみを整えようとした。家柄によらず能力や功績によって役人を登用する「冠位十二階」を定め、役人としての心構えを示す「十七条の憲法」を制定して「和をもって貴しとなす」という理念を掲げた。また遣隋使を派遣して中国の進んだ制度や文化を学び、法隆寺をはじめとする仏教寺院の建立にも力を注いだ。伝説では一度に十人の話を聞き分けたとも言われ、その実像については研究者の間でも様々な議論があるが、戦後の日本銀行券には歴代の中で最も多く肖像として採用されるなど、飛鳥時代を代表する政治家・思想家として長く尊敬を集めている。十七条の憲法には仏教を篤く敬うことも定められており、当時の日本に仏教文化を根付かせる大きな役割も果たしたと伝えられている。", source:"legacy", sourceId:"022" },
  { id:"023-02", personId:"023", title:"もうひとつのエピソード", tags:["政治"],
    body:"尾張の小さな大名家に生まれた織田信長は、奇抜な言動から「うつけ者」と呼ばれていたが、桶狭間の戦いでわずかな兵力を率いて今川義元の大軍を破り、一躍その名を天下に知らしめた。城下町での商売を自由にする「楽市楽座」を行い、1575年の長篠の戦いでは鉄砲を大量に用いた戦術で武田軍の騎馬隊を打ち破るなど、既存の常識にとらわれない改革を次々と進めていく。南蛮文化やキリスト教にも寛容な態度を示し、宣教師を通じて世界地図や地球儀にも強い関心を抱いていたという。「鳴かぬなら 殺してしまえ ホトトギス」という言葉に象徴される厳しい気性で知られ、天下統一まであと一歩というところまで迫っていたが、1582年、家臣の明智光秀の謀反により本能寺で襲われ、49歳で自ら命を絶ってその生涯を閉じた。茶の湯を政治に取り入れ、名物茶器を家臣への褒美として用いるなど、文化面でも新しい発想を持ち込んだ人物である。",
    bodyHtml:"尾張の小さな大名家に生まれた織田信長は、奇抜な言動から「うつけ者」と呼ばれていたが、桶狭間の戦いでわずかな兵力を率いて今川義元の大軍を破り、一躍その名を天下に知らしめた。城下町での商売を自由にする「楽市楽座」を行い、1575年の長篠の戦いでは鉄砲を大量に用いた戦術で武田軍の騎馬隊を打ち破るなど、既存の常識にとらわれない改革を次々と進めていく。南蛮文化やキリスト教にも寛容な態度を示し、宣教師を通じて世界地図や地球儀にも強い関心を抱いていたという。「鳴かぬなら 殺してしまえ ホトトギス」という言葉に象徴される厳しい気性で知られ、天下統一まであと一歩というところまで迫っていたが、1582年、家臣の明智光秀の謀反により本能寺で襲われ、49歳で自ら命を絶ってその生涯を閉じた。茶の湯を政治に取り入れ、名物茶器を家臣への褒美として用いるなど、文化面でも新しい発想を持ち込んだ人物である。", source:"legacy", sourceId:"023" },
  { id:"024-02", personId:"024", title:"もうひとつのエピソード", tags:["政治"],
    body:"農民の子として生まれた豊臣秀吉は、織田信長に仕えるうちに草履取りから武将へと異例の出世を遂げ、「人たらし」と呼ばれるほどの人心掌握術で頭角を現した。本能寺の変で信長が倒れると、いち早く明智光秀を討ってその後継者争いを制し、ついに天下統一を成し遂げる。「鳴かぬなら 鳴かせてみせよう ホトトギス」の句に表されるように、粘り強く周囲を動かす手腕に長けていた。大坂城や伏見城を築き、京都で大規模な北野大茶湯を催す一方、全国の田畑を調査する太閤検地や、農民から武器を取り上げる刀狩りを実施して社会の仕組みを整えた。しかし1592年からの二度にわたる朝鮮出兵は多くの犠牲を生み、1598年、伏見城でその生涯を終えるとともに豊臣家の衰退が始まった。また各地の大名に大坂城で謁見させることで自らの権威を示し、朝廷から関白・太政大臣にも任じられ、公家社会の頂点にも立った。",
    bodyHtml:"農民の子として生まれた豊臣秀吉は、織田信長に仕えるうちに草履取りから武将へと異例の出世を遂げ、「人たらし」と呼ばれるほどの人心掌握術で頭角を現した。本能寺の変で信長が倒れると、いち早く明智光秀を討ってその後継者争いを制し、ついに天下統一を成し遂げる。「鳴かぬなら 鳴かせてみせよう ホトトギス」の句に表されるように、粘り強く周囲を動かす手腕に長けていた。大坂城や伏見城を築き、京都で大規模な北野大茶湯を催す一方、全国の田畑を調査する太閤検地や、農民から武器を取り上げる刀狩りを実施して社会の仕組みを整えた。しかし1592年からの二度にわたる朝鮮出兵は多くの犠牲を生み、1598年、伏見城でその生涯を終えるとともに豊臣家の衰退が始まった。また各地の大名に大坂城で謁見させることで自らの権威を示し、朝廷から関白・太政大臣にも任じられ、公家社会の頂点にも立った。", source:"legacy", sourceId:"024" },
  { id:"025-02", personId:"025", title:"もうひとつのエピソード", tags:["政治"],
    body:"三河の小さな大名の子として生まれた徳川家康は、幼い頃から今川家・織田家の人質として過ごすなど、辛酸をなめる少年時代を送った。「鳴かぬなら 鳴くまで待とう ホトトギス」の句が示すように、忍耐強く機を待つことに長けており、豊臣秀吉の死後、関ヶ原の戦いで石田三成らを打ち破って天下の実権を握る。1603年に江戸幕府を開き、大坂の陣で豊臣家を滅ぼして、名実ともに全国統一を完成させた。参勤交代など幕府の支配のしくみを整え、死後は「東照大権現」として日光東照宮に祀られている。「人の一生は重荷を負うて遠き道を行くが如し。急ぐべからず」という言葉を残し、狸のようにしたたかとも評されながら、その後260年以上にわたって続く、戦のない太平の世の基礎を築き上げた人物である。征夷大将軍に任じられたのちわずか2年で子の秀忠に将軍職を譲り、実権を握り続けた「大御所政治」を敷いたことでも知られる。",
    bodyHtml:"三河の小さな大名の子として生まれた徳川家康は、幼い頃から今川家・織田家の人質として過ごすなど、辛酸をなめる少年時代を送った。「鳴かぬなら 鳴くまで待とう ホトトギス」の句が示すように、忍耐強く機を待つことに長けており、豊臣秀吉の死後、関ヶ原の戦いで石田三成らを打ち破って天下の実権を握る。1603年に江戸幕府を開き、大坂の陣で豊臣家を滅ぼして、名実ともに全国統一を完成させた。参勤交代など幕府の支配のしくみを整え、死後は「東照大権現」として日光東照宮に祀られている。「人の一生は重荷を負うて遠き道を行くが如し。急ぐべからず」という言葉を残し、狸のようにしたたかとも評されながら、その後260年以上にわたって続く、戦のない太平の世の基礎を築き上げた人物である。征夷大将軍に任じられたのちわずか2年で子の秀忠に将軍職を譲り、実権を握り続けた「大御所政治」を敷いたことでも知られる。", source:"legacy", sourceId:"025" },
  { id:"027-02", personId:"027", title:"もうひとつのエピソード", tags:["政治"],
